g about Jimmy: he's been right often enough that his paranoia has become indistinguishable from instinct, and the GM should reward players who take him seriously."}, {"id": "a38", "t": "p", "x": "What Jimmy holds: a holotransmission from Corin Bast. A dead man's unfinished sentence. A name — Rinn Achara — and the sound of a blaster shot. He has been sitting on it, too frightened to act, waiting without admitting it for someone he trusts. He's been waiting for Derek."}, {"id": "a39", "t": "p", "x": "His role in the arc: Jimmy is the engine. He gives Derek the transmission, the name, and the first lead. He is also the human cost of Praji's paranoia made flesh — the answer to the question of what happens to the ones who survive."}, {"id": "a40", "t": "callout", "x": "Jimmy's paranoia should produce at least one moment during the arc where he is completely, verifiably right. This rewards players for treating him as an asset rather than a liability, and deepens his character beyond comic relief."}, {"id": "a41", "t": "h2", "x": "Corin Bast — DECEASED"}, {"id": "a42", "t": "p", "x": "Bail Organa's Senate aide. Sharp, careful, politically astute. He was the first person — outside of Senne Olarr — to notice the pattern of deaths and start pulling threads. He followed the red flags his contacts were raising, pieced together that someone powerful was hunting the Alderaan 12, and connected it to a half-remembered name from a brandy-soaked evening: Ardyth Canvi, spoken quietly across a room between Rinn and Senne."}, {"id": "a43", "t": "p", "x": "He reached out to Jimmy — the only contact he had outside the political world — with a half-formed theory and a single instruction: find Rinn Achara. She has a memory like a droid. Give her what I'm about to send you."}, {"id": "a44", "t": "p", "x": "He was shot mid-sentence. The transmission cuts to silence."}, {"id": "a45", "t": "p", "x": "He never sent whatever he was going to send. Jimmy has only the name, the instruction, and the sound of a blaster."}, {"id": "a46", "t": "p", "x": "\"Jim, I know it's unusual for me to reach out via holo but... listen, something's off. I want you to look into something for me. I've been digging around some dirt — dirt that apparently has some weight, because every contact I have has been waving a red flag. I want you to see if you can find Rinn Achara. She's a shipping magnate rep, does some political schmoozing. But back in the day, she was running with Bail and the Alderaan 12. She's got a keen sense of things, and if you just give her the information I'm going to send to you—\""}, {"id": "a47", "t": "p", "x": "A knock at the door. Footsteps. \"Yes? Can I help you?\" A beat. A blaster shot. The holoprojector falls. Silence."}, {"id": "a48", "t": "h2", "x": "Rinn Achara"}, {"id": "a49", "t": "p", "x": "A Corellian shipping magnate's representative. Sharp, politically savvy, and possessed of a photographic memory so reliable it borders on unsettling. She remembers every face, every name, every detail of the night the delegation gathered — including Bail handing Senne a drive, a quiet conversation about a ghost that could change everything, and a COMPNOR man watching the door all evening with a note he never delivered."}, {"id": "a50", "t": "p", "x": "After Alderaan, she ran — but not far, and not forever. She rebuilt a life on Formos. Legitimate freight brokerage, good reputation, real credits. She was careful. She was quiet. She was fine."}, {"id": "a51", "t": "p", "x": "Then Dobah took control of Formos. He wanted a cut. She resisted. He took more. She pushed back. He imprisoned her. She has been in his cell ever since, which is why Jimmy's tentative inquiries hit a dead end — she was unreachable, and nobody who might know where she was had any reason to talk."}, {"id": "a52", "t": "p", "x": "Her role in the arc: Rinn is the directory. She gives Derek the full picture of the delegation — who's dead, who's missing, what happened that night. She is the bridge between Corin's fragment and Senne's secret. She also, almost as an afterthought, remembers a COMPNOR man in the corner with a crumpled note addressed to a princess."}, {"id": "a53", "t": "p", "x": "On Formos: Rinn is being held in Dobah's compound. Rescuing her requires going through Dobah's operation — which intersects naturally with Zid's search for the Mad Mynock. Both objectives are in the same building. Neither player knew that when they set out."}, {"id": "a54", "t": "p", "x": "Her state when rescued: Not broken. Furious. The relief of being found is secondary to two months of accumulated rage. She doesn't need convincing — she needs five minutes to compose herself, and then she will tell Derek everything she knows."}, {"id": "a55", "t": "h2", "x": "Maret Dunwall"}, {"id": "a56", "t": "p", "x": "A COMPNOR cultural liaison. He was on the delegation that evening — the only Imperial loyalist in the room, there to observe and report. He spent most of the evening watching the door, waiting for someone who never arrived. He stepped on a crumpled note on his way out. A note addressed to Princess Leia Organa of Alderaan."}, {"id": "a57", "t": "p", "x": "He has been investigating Praji's financial irregularities for months, following the money trail with the meticulous dedication of a man who believes the Empire works when corrupt individuals don't abuse it. He and Derek are moving toward the same answer from opposite directions."}, {"id": "a58", "t": "p", "x": "The mirror: Maret's tragedy is that he is heading down the same road as Praji without realising it — a man so committed to the institution that he will compromise everything he actually believes in to protect it. The deeper he digs, the harder that premise is to maintain. Praji isn't an aberration. He's what the Empire produces."}, {"id": "a59", "t": "p", "x": "The note: Rinn remembers it. She will mention it offhandedly — a COMPNOR man, watching the door, a note he stepped on. Something about a princess. Derek will have to connect the dots himself. In COMPNOR's world, emotional entanglement with a known Rebel leader — even undeclared, even one-sided, even predating her identification as a traitor — ends careers. At minimum."}, {"id": "a60", "t": "p", "x": "The collision: Maret arrives on Formos just as Derek's crew is leaving with Rinn. He thinks she's being taken for quiet execution. He fires a warning shot. Derek steps into the light. A long pause. Out from the shadows steps Maret. \"Wait... Derek? What the hell are you doing here?\""}, {"id": "a61", "t": "p", "x": "What happens next: Derek's call. The GM should have Maret's motivations clear and let the player drive the outcome."}, {"id": "a62", "t": "p", "x": "If Derek turns him: A COMPNOR insider who has had a genuine crisis of conscience is an extraordinary asset. He can move through Imperial institutional space unsuspected, manage Praji's official record, and make the Alliance's operations look clean from the inside."}, {"id": "a63", "t": "p", "x": "If Derek doesn't: Maret becomes the arc's most dangerous antagonist. Not violent — institutional. He files reports. He opens formal investigations. He brings COMPNOR's full bureaucratic machinery to bear, and it is patient and thorough and very hard to outrun."}, {"id": "a64", "t": "h2", "x": "Krief Barrota — DECEASED"}, {"id": "a65", "t": "p", "x": "Died in a shuttle explosion over Delaya, ruled an accident. He had been hiding among the Alderaanian refugee diaspora on Alderaan's sister planet — thinking there was safety in numbers, in grief, in anonymity."}, {"id": "a66", "t": "p", "x": "He was wrong about the safety. But he was brave at the end. He knew Praji's people were closing in on Senne. He staged a clumsy decoy — carried a blank datapad, made himself visible, tried to draw the hunters away from her. He thought he was buying her time. He didn't know they'd already marked his shuttle. It was detonated before he cleared the atmosphere."}, {"id": "a67", "t": "p", "x": "He died thinking he was being clever. He died because Praji is more desperate and more capable than any of them fully appreciated."}, {"id": "a68", "t": "p", "x": "His role in the arc: Barrota is the clock ticking in the background. His death, reported in two lines of local news, tells Derek how close the hunters are and how ruthlessly they operate. For Senne, his death is the wound that galvanised everything. The assault on Delaya is his eulogy."}, {"id": "a69", "t": "h2", "x": "Senne Olarr"}, {"id": "a70", "t": "p", "x": "Bail Organa's most trusted diplomat. The woman who has been carrying the drive for a year. She never got to rebuild — from the moment that drive went into her pocket she was living a different life, and she knew it. She ran to Delaya, Alderaan's sister planet, and disappeared into the refugee diaspora under her mother's maiden name."}, {"id": "a71", "t": "p", "x": "She didn't hide for long. She found people who needed leading and she led them."}, {"id": "a72", "t": "p", "x": "By the time Derek finds her she is running an underground resistance on Delaya, preparing a significant assault on the Imperial garrison, and she is galvanised by grief and fury in equal measure. She is not precious about her own survival. She has one thing to do and she is going to do it."}, {"id": "a73", "t": "p", "x": "Finding her: Delaya is the answer. Of course it is. Alderaan is gone — Delaya is the closest thing left. The hiding-in-plain-sight logic is elegant: Praji's hunters are looking for a senior diplomat. On Delaya, every other person used to be something important. Nobody stands out."}, {"id": "a74", "t": "p", "x": "Her condition: She is not a frightened woman in hiding. She has been waiting. Not patiently — but with the quiet fury of someone who has already decided what she is willing to sacrifice. When Derek and Rinn walk through the door, she is ready."}, {"id": "a75", "t": "p", "x": "Her ask: Before she hands over anything, she wants Derek beside her on Delaya. Help her take out the Imperial garrison. Free the Alderaanian refugees. Stand with her for Barrota. Then she will have his full attention and respect — and he will have the drive."}, {"id": "a76", "t": "callout", "x": "for the GM: Senne's survival during the Delaya assault is something Derek should actively consider. She is not suicidal, but she is not cautious either. If Derek wants her to reach the confrontation with Praji, he may need to stay close to her throughout."}, {"id": "a77", "t": "p", "x": "The drive handoff: Senne never gave the real drive to Barrota. She let him believe she had, because she could not bear to put it in anyone else's hands after everything that had happened. She trusted him with his life but not with that. She will carry that guilt quietly."}, {"id": "a78", "t": "h2", "x": "Moff Praji"}, {"id": "a79", "t": "p", "x": "Overseer of the Alderaan sector. A man of considerable political and military reach, operating from his command ship, the Star Destroyer Retributor. He was once at odds with Grand Moff Tarkin, who destroyed a core world under Praji's authority and humiliated him politically. He got the last laugh when the Death Star was destroyed. But his past was always the real enemy."}, {"id": "a80", "t": "p", "x": "He did not earn the Retributor or his position through merit. He bought it with a favour from a man he didn't know was building a Rebellion — and Luthen Rael took the chair of Praji's predecessor as payment. Praji has been sitting in a dead man's seat for years and never let himself think about it too carefully."}, {"id": "a81", "t": "p", "x": "He has spent a year becoming a monster. Every kill order, every payment to bounty hunters, every midnight transmission to Hulo Nord — all of it routed through the Retributor. It is his command centre, his sanctuary, and the place he feels safest."}, {"id": "a82", "t": "p", "x": "Derek is going to take it from him."}, {"id": "a83", "t": "p", "x": "His state in the finale: Dangerous. Cornered. Willing to take everything down with him rather than face Imperial justice. He still believes the drive is catastrophic. He still thinks he has something to protect. His self-destruct fob is not melodrama — it is the logical endpoint of a man who stopped trusting the institution he serves and started buying loyalty directly."}, {"id": "a84", "t": "p", "x": "The line: Praji is seated at the same desk his predecessor occupied. He took this ship, this chair, this life through Luthen's intervention. Derek can point that out — quietly, almost conversationally. How poetic that he will end in the exact place his predecessor did. On his orders."}, {"id": "a85", "t": "p", "x": "The cell scene: If Praji survives the Retributor, the real confrontation happens after — in a small room, no audience, just Derek and Praji and a drive that neither of them expected to look like this. Praji reads it. Reads it again. The silence that follows is the scene."}, {"id": "a86", "t": "h2", "x": "Hulo Nord"}, {"id": "a87", "t": "p", "x": "Praji's elite tracker. Quiet, professional, extraordinarily good at his job. He is not hired until Derek hits 50 Obligation — Praji has been done with the street-level approach for a while, but Nord is expensive and Praji needed to be sure he was necessary. He is now sure."}, {"id": "a88", "t": "p", "x": "Nord is not a villain who monologues. He is a pressure system. He is felt before he is seen — a contact going quiet, a name whispered through the remnants of Jimmy's network, a lead that goes cold with suspicious precision. By the time Derek meets him directly, the investigation has already been compromised."}, {"id": "a89", "t": "p", "x": "His target: Rinn Achara. If Derek reaches 100 Obligation before rescuing Rinn, Nord extracts her from Dobah's cell and delivers her to Praji. The chain is broken at its most important link."}, {"id": "a90", "t": "h2", "x": "Gand Quir and Shaw'ty"}, {"id": "a91", "t": "p", "x": "The street-level hunters. A human mercenary and a Trandoshan bounty hunter. Loud, persistent, dangerous, and entirely ignorant of why they are hunting Derek or who is paying them. They are the first face of Praji's operation — the Doubles trigger that introduces the threat and, if handled right, provides the first thread leading back to Praji himself."}, {"id": "a92", "t": "p", "x": "Killing them reduces Obligation by 20. Questioning them first gives Derek the name Praji — the first time it surfaces in the investigation. Letting them go gives 5 Light Side points and reduces Obligation by 30. Two hunters who owe Derek their lives may prove more valuable than two bodies in an alley."}, {"id": "a93", "t": "h1", "x": "THE INVESTIGATION — THE CHAIN"}, {"id": "a94", "t": "p", "x": "The investigation moves through five links. Each link only points to the next. Nobody can shortcut to the end, and nobody is withholding information deliberately except Senne — who has been hiding for a year and trusts absolutely nobody."}, {"id": "a95", "t": "p", "x": "Jimmy holds Corin's transmission — a dead man's unfinished sentence, a name (Rinn Achara), and the sound of a blaster shot. He has been sitting on it alone, too frightened to act, waiting for Derek."}, {"id": "a96", "t": "p", "x": "Rinn holds the directory — every face, every name, every detail of that evening. She saw the drive change hands. She heard Senne mention Ardyth Canvi. She remembers a COMPNOR man stepping on a crumpled note addressed to a princess."}, {"id": "a97", "t": "p", "x": "Cracken holds the key — the identity behind the alias Ardyth Canvi. He says it without drama when Derek says the name in front of him: Luthen Rael. Then he goes back to running a war."}, {"id": "a98", "t": "p", "x": "Senne holds the drive — and a year of grief and fury and the underground resistance that grew from both. She will not hand it over until Derek earns it."}, {"id": "a99", "t": "p", "x": "Praji holds the ending — and Derek holds the three ways it can go."}, {"id": "a100", "t": "h1", "x": "THE SHAPE OF THE ARC"}, {"id": "a101", "t": "h2", "x": "Phase One — The Transmission"}, {"id": "a102", "t": "p", "x": "Jimmy finally plays Derek the recording. Corin Bast, mid-sentence, a name, a blaster shot, silence. The investigation begins."}, {"id": "a103", "t": "p", "x": "This phase establishes the stakes and Jimmy's fragile state. Derek understands what he is walking into — not a clean intelligence operation but a two-year-old murder spree with a dwindling list of survivors. The name Rinn Achara is the only lead. Formos is where it leads."}, {"id": "a104", "t": "p", "x": "The GM should make clear, without overplaying it, that Jimmy has been sitting on this alone for a long time. The moment he plays the transmission is the most significant thing he has done since Alderaan. It should feel that way."}, {"id": "a105", "t": "h2", "x": "Phase Two — Formos"}, {"id": "a106", "t": "p", "x": "Derek's crew arrives on Formos to find Rinn. She is already in a cell. Rescuing her means going through Dobah's operation, which intersects with Zid's search for the Mad Mynock. Both objectives are in the same building. Use the official Formos adventure from the Edge of the Empire rulebook as the structural base."}, {"id": "a107", "t": "p", "x": "As the crew leaves with Rinn — through dark alleys, dim lampposts, evening fog — a warning shot rings out. Maret Dunwall steps from the shadows. What happens next is Derek's call entirely."}, {"id": "a108", "t": "p", "x": "Once Rinn is safe, she opens her memory like a filing cabinet. The full roster of the living and the dead. The drive changing hands. The name Ardyth Canvi spoken quietly across a room. And, almost as an afterthought: a COMPNOR man watching the door all evening, a note in his hand, stepping on it on the way out. Something about a princess."}, {"id": "a109", "t": "p", "x": "Derek will have to connect those dots himself. The GM should not underline them."}, {"id": "a110", "t": "h2", "x": "Phase Three — Delaya"}, {"id": "a111", "t": "p", "x": "The trail leads to Delaya. Of course it does. Alderaan's sister planet, full of survivors. The last place anyone serious would look carefully. Senne is there — not hiding, but leading."}, {"id": "a112", "t": "p", "x": "The underground resistance is preparing its assault on the Imperial garrison. Senne wants Derek beside her before she gives him anything. What they build during the assault — the trust, the shared grief, the understanding of what Barrota died for — is what makes the drive handover feel earned rather than transactional."}, {"id": "a113", "t": "p", "x": "Somewhere during this phase — in a debrief, a quiet moment, a passing conversation — Derek says the name Ardyth Canvi in front of Cracken. Cracken goes still. Then: Luthen Rael. The last blank is filled in."}, {"id": "a114", "t": "p", "x": "The GM should decide in advance whether Senne survives the assault without Derek's direct intervention. She is not trying to die — but she is not being careful either. If the player doesn't stay close to her, there should be a real cost to that."}, {"id": "a115", "t": "h2", "x": "Phase Four — The Retributor"}, {"id": "a116", "t": "p", "x": "Derek has everything. The drive, the context, the name, the chain of dead and surviving witnesses. He knows what Praji did, why he did it, and what it cost. He knows what is on the drive and what it is worth."}, {"id": "a117", "t": "p", "x": "With Senne's help — Delaya now liberated and handed to the Rebellion — and Cracken's sanction, Derek sets the trap. The Alliance lays in wait. Praji is goaded into committing fully, believing he is finally cornering Derek. Ion cannons take out the Retributor. Boarding teams infiltrate the disabled ship. X-wings and TIE fighters clash around the hull. Derek pushes through toward the captain's quarters."}, {"id": "a118", "t": "p", "x": "Praji has retreated there with Death Troopers — personal, off-books, the last resource of a man who stopped trusting the institution he serves. Once the team deals with them, Praji is exposed. A rat in a corner."}, {"id": "a119", "t": "p", "x": "He has a self-destruct fob. He is willing to use it. He still believes the drive is catastrophic."}, {"id": "a120", "t": "p", "x": "This is a negotiation at gunpoint. Derek's diplomatic instincts matter here more than any combat roll."}, {"id": "a121", "t": "h2", "x": "The Cell — The Real Confrontation"}, {"id": "a122", "t": "p", "x": "If Praji is taken alive, the real confrontation happens after the assault, after the ship is secured, after the noise has cleared. A small room. No audience. Just Derek and Praji and a drive that neither of them expected to look like this."}, {"id": "a123", "t": "p", "x": "Derek slides it across the table. Praji opens it. Reads it. Reads it again."}, {"id": "a124", "t": "p", "x": "The silence that follows is the scene."}, {"id": "a125", "t": "p", "x": "Praji is a smart man. He understands immediately. He spent a year becoming a monster to bury a document that would have inconvenienced him at worst. He had people killed for this."}, {"id": "a126", "t": "p", "x": "If Derek wants answers — missing threads, names, anything Praji discovered during his own investigation — this is the moment to ask. Praji in that cell, in that silence, is the most honest he has ever been in his life. He has nothing left to protect. He might answer simply because being asked is the only human interaction left to him."}, {"id": "a127", "t": "h1", "x": "THE THREE ENDINGS"}, {"id": "a128", "t": "h2", "x": "Kill Him"}, {"id": "a129", "t": "p", "x": "Justice for the Alderaan 12. Clean, final, irreversible. Praji doesn't get to live with the knowledge of what he's done. It's a mercy of a kind — a dark mercy, but mercy nonetheless."}, {"id": "a130", "t": "p", "x": "Derek has to live with the choice. Praji in that moment might have been redeemable. A Moff-level asset dies with him. The surviving members of the Alderaan 12 get an ending, but not answers."}, {"id": "a131", "t": "h2", "x": "Leave Him"}, {"id": "a132", "t": "p", "x": "Derek walks out without another word. Leaves Praji with the drive, the silence, and the knowledge. The Rebellion decides what to do with him. He rots with what he knows — which may be worse than anything Derek could do directly."}, {"id": "a133", "t": "p", "x": "This is arguably the cruellest option. Praji got away with it. It will never feel like getting away with it."}, {"id": "a134", "t": "h2", "x": "Turn Him"}, {"id": "a135", "t": "p", "x": "Derek makes the offer. Not generously, not warmly. Practically. The Rebellion needs assets. Praji needs protection. The Empire will kill him the moment they find out what he has done — and they will find out, because Derek will make sure they do, unless Praji makes himself useful."}, {"id": "a136", "t": "p", "x": "It is not redemption. It is a transaction. Praji understands that language better than any other."}, {"id": "a137", "t": "p", "x": "If Derek has turned Maret as well, the shape of the ending becomes remarkable. Rinn manages Praji — political instincts, shipping network, personal reasons to keep him on a very short leash. Maret handles the Imperial paperwork that makes Praji's continued existence in his position look completely legitimate. And the ouroboros completes its loop: Bail wanted to make Praji an asset. Luthen's ghost made it possible. A Rebel diplomat and a reformed COMPNOR agent finished the job."}, {"id": "a138", "t": "h1", "x": "OBLIGATION MECHANICS"}, {"id": "a139", "t": "h2", "x": "What the Obligation Represents"}, {"id": "a140", "t": "p", "x": "The weight of being hunted. Not just by bounty hunters, but by the slow tightening of Praji's net. Every public appearance is a potential sighting. Every loose thread is a potential lead that feeds back to Hulo Nord. The Obligation tracks how close Praji is to finding Derek specifically, and how much pressure that puts on the investigation."}, {"id": "a141", "t": "h2", "x": "Increases"}, {"id": "a142", "t": "p", "x": "Any non-stealthy public appearance increases Derek's Obligation by 5."}, {"id": "a143", "t": "p", "x": "Making inquiries about the Alderaan 12 without adequate cover increases Obligation by 5."}, {"id": "a144", "t": "p", "x": "Leaving witnesses after encounters with Gand Quir, Shaw'ty, or any of Praji's hired muscle increases Obligation by 5."}, {"id": "a145", "t": "h2", "x": "Decreases"}, {"id": "a146", "t": "p", "x": "Finding a living member of the Alderaan 12 decreases Obligation by 10."}, {"id": "a147", "t": "p", "x": "Eliminating or flipping one of Praji's hunters decreases Obligation by 10."}, {"id": "a148", "t": "p", "x": "Securing Rinn from Formos decreases Obligation by 15."}, {"id": "a149", "t": "h2", "x": "Triggers"}, {"id": "a150", "t": "p", "x": "Derek sees his face on a wanted poster or holopuck. The profile varies with Obligation level — low Obligation, a generic notice with a middling reward; high Obligation, a detailed profile with a significant reward, clearly compiled by someone patient and resourceful. Not acting on it increases Obligation by 5."}, {"id": "a151", "t": "p", "x": "A member of the Alderaan 12 is found dead before Derek reaches them. Increases Obligation by 10."}, {"id": "a152", "t": "p", "x": "Jimmy's paranoia turns out to be correct. He spots something real — surveillance, a tail, a genuine threat. This should happen at least once. It rewards the players for taking him seriously."}, {"id": "a153", "t": "h2", "x": "Doubles — Gand Quir and Shaw'ty"}, {"id": "a154", "t": "p", "x": "They find Derek wherever he is. Not subtle. Not sophisticated. But persistent and dangerous."}, {"id": "a155", "t": "p", "x": "Killing them reduces Obligation by 20."}, {"id": "a156", "t": "p", "x": "Questioning them first gives Derek the name Praji — the first time it surfaces in the investigation."}, {"id": "a157", "t": "p", "x": "Letting them go gives 5 Light Side points and reduces Obligation by 30. Two hunters who owe Derek their lives may prove more valuable than two bodies in an alley."}, {"id": "a158", "t": "h2", "x": "50 Obligation — Hulo Nord Surfaces"}, {"id": "a159", "t": "p", "x": "Nord does not appear directly. The signs are there: a contact goes quiet unexpectedly, a lead dries up with suspicious precision, Jimmy picks up a name through what remains of his network. Hulo Nord. Tracker. Very good. Very expensive. Praji is done with the street-level approach."}, {"id": "a160", "t": "p", "x": "The GM should run a cold open at the start of the next session:"}, {"id": "a161", "t": "p", "x": "A dark interior — the captain's quarters of the Star Destroyer Retributor. Moff Praji stands with his hands clasped behind his back, staring out the viewports into the darkness of space. The doors open. In steps a gruff figure who keeps to the shadows."}, {"id": "a162", "t": "quote", "x": "Hulo Nord, I presume,\" Praji says without turning. \"I've heard great things."}, {"id": "a163", "t": "p", "x": "A grunt. \"Who's your target.\""}, {"id": "a164", "t": "p", "x": "Praji turns. There is a wry grin on his face."}, {"id": "a165", "t": "quote", "x": "Rinn Achara."}, {"id": "a166", "t": "p", "x": "The GM should now quietly ask: how close is Derek to Formos?"}, {"id": "a167", "t": "h3", "x": "100 Obligation — Nord Delivers Rinn"}, {"id": "a168", "t": "p", "x": "Hulo Nord extracts Rinn Achara from Dobah's cell on Formos and delivers her to Praji. She was isolated and vulnerable, and Nord is exactly the kind of operator who knows how to move someone without drawing attention."}, {"id": "a169", "t": "p", "x": "Praji questions her. Rinn has a photographic memory and a year of carefully observed details. What she gives up under interrogation — willingly or not — accelerates the hunt for every remaining member of the Alderaan 12 dramatically."}, {"id": "a170", "t": "p", "x": "Derek loses the chain. He has Jimmy's fragment — the name, the transmission — but Rinn was the one who could fill in everything between that name and Senne Olarr. Without her, the path to Senne goes dark. The margin for error is gone."}, {"id": "a171", "t": "p", "x": "Rinn does not know about the drive or what it contains. Praji gets closer — but not everything. Senne is still out there. The drive is still out there. But Derek is now in a race he may not win."}, {"id": "a172", "t": "h1", "x": "THE ALDERAAN 12 — FULL ROSTER"}, {"id": "a173", "t": "table", "x": "", "r": [["#", "Name", "Status", "Note"], ["1", "Derek Caabesk", "PC", "The youngest of the delegation. Green, starstruck, nursing Alderaanian brandy in the corner."], ["2", "Senne Olarr", "Alive", "Bail's most trusted. Carries the drive. Leads the underground resistance on Delaya under her mother's maiden name."], ["3", "Maret Dunwall", "Alive", "COMPNOR cultural liaison, the only Imperial loyalist in the room. Now independently investigating Praji's financial irregularities."], ["4", "Rinn Achara", "Captive", "Photographic memory. Rebuilt her life on Formos until Dobah imprisoned her. In a cell — or rescued, if Derek moves fast enough."], ["5", "Pell Voss", "DECEASED", "Young Alderaanian economist. Killed in the first wave. Jimmy knew him; doesn't know if his family survived."], ["6", "Krief Barrota", "DECEASED", "Died in a shuttle explosion over Delaya, ruled an accident. Was protecting Senne when Praji's people caught up to him."], ["7", "Corin Bast", "DECEASED", "Bail's Senate aide. Shot mid-transmission trying to reach Jimmy. His unfinished sentence is the engine of the whole investigation."], ["8", "Dasha Mirrel", "Alive", "Pantoran cultural ambassador. Figured out early she was being hunted and went to ground aggressively. Alive, angry, working alone — and stuck."], ["9", "Torvald Ese", "Alive", "Archivist, on the delegation almost by accident. Knows nothing. Survives by being unremarkable — until he doesn't."], ["10", "The Naboo second son", "Alive", "A young Alderaanian noble's second son, hiding on Naboo. Knows nothing useful — but Praji is aware of him. A loose thread, possibly a trap."], ["11", "Retired Military Officer", "DECEASED", "Died in the first wave – closest to Praji, easiest to target."], ["12", "Kleya Marki", "Alive", "Posed as an arts representative; was actually Bail's intelligence asset, and the one who sourced the evidence in the first place — though she never knew the name behind the alias inside it. Now 2IC of Alliance Intelligence Operations, having stepped up after Draven's death at Mako-Ta. Praji has no idea she exists."]]}, {"id": "a174", "t": "callout", "x": "Bail Organa is deliberately not numbered in this table — see Section 1. If you'd prefer him listed for reference, he can be added as an unnumbered header row above #1, marked DECEASED — Alderaan."}, {"id": "a175", "t": "h1", "x": "SIDE INVESTIGATION PATHS"}, {"id": "a176", "t": "p", "x": "Derek does not have to reach Senne through the Jimmy → Rinn → Corin chain alone. He was in the room — he can start to remember, and nothing stops him from tracking down any of the other surviving members before, instead of, or alongside Rinn. Each one offers a different piece, and a different cost."}, {"id": "a177", "t": "h3", "x": "Maret Dunwall — the paper trail"}, {"id": "a178", "t": "p", "x": "Gives Derek the financial shape of Praji's corruption: embezzlement, misappropriation, the mechanics of it. He knows nothing of the drive, the murders, or the politics behind them — only the numbers. He is still a loyal COMPNOR officer investigating his own superior, which makes him simultaneously an asset and a live wire: he could become a source, or he could report Derek on principle before trust is earned."}, {"id": "a179", "t": "h3", "x": "Dasha Mirrel — the survivor"}, {"id": "a180", "t": "p", "x": "She worked it out before Derek did, and has been running alone ever since. She confirms the hunt is real and accelerating, teaches Derek the tradecraft of staying hidden, and may hold fragments about the other dead or missing members. She's hit a wall and is suspicious — trust is earned, not given, and reaching her doesn't mean she cooperates immediately."}, {"id": "a181", "t": "h3", "x": "Torvald Ese — the moral trap"}, {"id": "a182", "t": "p", "x": "Torvald knows nothing and is in no danger — yet. Finding him isn't an intelligence beat, it's a dilemma: warning him exposes him and likely accelerates the 100 Obligation death that's already coming. Leaving him ignorant lets him keep surviving by being unremarkable. There is no clean option here, only the one Derek can live with."}, {"id": "a183", "t": "h3", "x": "The Naboo second son — the test"}, {"id": "a184", "t": "p", "x": "Praji is watching him, which makes contact risky. He offers nothing useful directly, but reaching him safely (or getting him out first) removes a loose end Praji could use as bait or leverage — and tells Derek whether he's learned enough tradecraft yet to approach a watched target without getting both of them caught."}, {"id": "a185", "t": "h3", "x": "Kleya Marki — the endgame"}, {"id": "a186", "t": "p", "x": "Hardest to reach early — she's embedded inside Alliance Intelligence, not hiding in the underworld. But she is the one who put the evidence in Bail's hands, which means she knows what it was meant to do even if she never learned the name hidden inside it, and she is the only one who can mobilise real Alliance resources against Praji. She is naturally a late-arc contact: the moment Derek's investigation stops being personal and starts being something the Rebellion can act on."}, {"id": "a187", "t": "h1", "x": "GM NOTES"}, {"id": "a188", "t": "h3", "x": "The Pacing of Revelation"}, {"id": "a189", "t": "p", "x": "The arc is built on fragments. Nobody has the full picture until Senne hands over the drive, and even then the full emotional weight only lands when Praji reads it. Resist the temptation to accelerate the revelations. Each link in the chain should feel earned."}, {"id": "a190", "t": "p", "x": "The name Ardyth Canvi is the pivot point of the entire investigation. The first time Derek hears it — probably from Rinn — it should land with weight. He knows someone is hunting the Alderaan 12. He doesn't yet know why. Ardyth Canvi is the moment the investigation shifts from who to what."}, {"id": "a191", "t": "h3", "x": "Jimmy as an Asset"}, {"id": "a192", "t": "p", "x": "Jimmy's paranoia should produce at least one genuine result during the arc. If the players start treating him as comic relief or a liability, give him a moment of undeniable accuracy — he spots something real, warns them of something concrete, and is right. This is the arc's quiet thesis: the people who seem most broken by what the Empire does are often the ones paying the most attention."}, {"id": "a193", "t": "h3", "x": "Maret's Loyalty Knot"}, {"id": "a194", "t": "p", "x": "The GM should not telegraph Maret's potential as an ally. He should feel genuinely dangerous when he steps out of the shadows on Formos. The question of whether he can be turned should arise organically from the conversation, not from the GM nudging the player toward the right answer."}, {"id": "a195", "t": "p", "x": "If Derek tries to turn him, the hooks are: showing him the human cost (Jimmy, Rinn, Barrota's death); surfacing whatever Praji has on Maret himself; and holding up the mirror — you're investigating Praji because he put the institution above the people it was supposed to serve. When did you last ask yourself the same question?"}, {"id": "a196", "t": "p", "x": "The note is the key. Derek won't have it when they first meet on Formos — Rinn tells him about it afterwards, almost as an afterthought. What Derek does with that information is entirely his own decision."}, {"id": "a197", "t": "h3", "x": "The Drive"}, {"id": "a198", "t": "p", "x": "The GM should know what is on the drive from the beginning. The players should not. The emotional payoff of the finale depends entirely on the audience — including the player — not knowing until Praji reads it and his face changes."}, {"id": "a199", "t": "p", "x": "Do not let any earlier scene accidentally reveal the mundanity of the evidence. Every character who references it does so with appropriate gravity, because to them it is still unknown and therefore still threatening."}, {"id": "a200", "t": "h3", "x": "The Three Endings"}, {"id": "a201", "t": "p", "x": "All three are valid. All three have consequences. The GM should not steer the player toward any particular outcome. The arc has been constructed so that each ending is earned by the choices Derek has made along the way."}, {"id": "a202", "t": "p", "x": "The turning of Praji is the most complex and opens the most future story — but it requires Derek to have done the groundwork. If he has burned bridges, made enemies, or failed to secure Maret, the third option may not be available or may not be sustainable."}, {"id": "a203", "t": "callout", "x": "PACING THESE ENCOUNTERS\nEarly game (Dasha, Torvald): emotional stakes — the hunt is real, and not everyone can be saved.\nMid game (Maret): a second route to ruining Praji that doesn't depend on the drive at all.\nLate game (Kleya): the moment the investigation graduates from Derek's personal obsession to an Alliance operation.\nAny time (Naboo son): a tradecraft check — succeed and remove a loose end, fail and get flagged."}], "body": "Obligation Arc: Derek Caabesk\n\nTHE ALDERAAN 12\n\nA Reference Document for the Game Master\n\nBACKGROUND\n\nFor the Game Master's eyes only.\n\nIn the final months of the Galactic Senate, Bail Organa was building a case against Moff Praji, overseer of the Alderaan sector — a man who had quietly advanced his career through an underhanded deal with a well-connected fixer known as Ardyth Canvi. The deal itself was almost trivially mundane: Praji paid Canvi to remove a political obstacle, Canvi delivered, and Praji got his sector. What Praji didn't know — or chose not to investigate — was that Ardyth Canvi was an alias of Luthen Rael, one of the founding architects of the Rebel Alliance.\n\nBail documented everything. Not to destroy Praji outright, but to own him — to have a pressure point that could bring a powerful Imperial official quietly into line, or at worst, neutralise him politically. He entrusted the evidence — a single hard drive containing authenticated communications, annotated in Bail's own hand — to Senne Olarr, the senior diplomat on a delegation of twelve travelling to meet him on Alderaan. He told her only that it was insurance. That she would know when to use it.\n\nThe following week, Alderaan was destroyed.\n\nPraji panicked. He assumed Bail had everything — a full dossier, damning evidence, material that would see him executed or imprisoned. He assumed the delegation knew everything. He began quietly, methodically eliminating them. Five were dead within months. A sixth — Krief Barrota — died in a staged shuttle explosion over Delaya just weeks before the campaign begins, attempting to protect the woman Praji has been hunting most carefully of all.\n\nWhat Praji doesn't know — what nobody knows yet — is that the evidence is almost nothing. A meeting log. A name. An annotation by a dead man. In the right political climate it could be made to look damning, but it wouldn't survive serious scrutiny. Praji has been killing people to bury a footnote.\n\nDerek Caabesk was the youngest, greenest member of that delegation. He was there that night — nervous, starstruck, nursing Alderaanian brandy in the corner, too overwhelmed to properly speak to anyone. He didn't know about the drive. He didn't know about Bail's plans for Praji. He was just happy to be in the room.\n\nA year later, he is a Rebel operative with a bounty on his head, a dead planet behind him, and an old friend falling apart on a ship called the Hope. The investigation is about to begin.\n\nORIGIN OF “THE ALDERAAN 12”\n\nThe name did not come from Praji, from the Empire, or from any official record. It came from Bail Organa himself, the night the delegation was formed — a toast, half in jest, half in earnest, to the twelve people he believed could “shake the foundations of the Empire so hard they'd hear it all the way to Coruscant.” He never got to see whether he was right.\n\nThat same evening, before he left, Bail met privately with Senne Olarr and passed her the drive — something too dangerous to send through any other channel, so it had to be him, in person, one last act before walking out of his own party. No one else in the room knew it happened.\n\nBail was recalled that night: the Senate had just been disbanded, and with it, his seat. He returned to Alderaan with nothing left to go back to politically. The delegation, reassigned in the same stroke, was sent to rejoin him there — which is the origin of the phrase Rinn and others use: they were “going to meet him.” Alderaan was destroyed while they were still in transit. They survived him by days, maybe hours.\n\nBail Organa is not counted among the Alderaan 12 — he is the reason they have that name. His death is not part of Praji's hunt; it is the detonation that made the hunt necessary. Derek does not need to “discover” that Bail is dead — the galaxy knows Alderaan is gone. What Derek can discover is that the toast happened, that it was recorded or witnessed, and that Bail handed something to Senne just hours before he died. That discovery is the gut-punch: the danger wasn't rhetorical. Bail knew, that night, that it was already in motion.\n\nTHE TRUTH ABOUT THE EVIDENCE\n\nThe hard drive contains one thing: a meeting log. Timestamped, authenticated, utterly mundane. Praji sat down with a man he knew as Ardyth Canvi — an antiquities broker with impeccable Imperial connections — to discuss the reassignment of a political rival. Completely above board. Routed through the right channels. Nothing that couldn't be explained away.\n\nBail Organa's annotation on the file reads simply: \"Ardyth Canvi — confirmed alias, Luthen Rael. See attached.\"\n\nThe attachment is Luthen's Imperial intelligence file. That is the entirety of the evidence.\n\nPraji had one meeting with a man he didn't know was Luthen Rael. He didn't fund the Rebellion. He didn't smuggle weapons. He asked a well-connected fixer to help him remove a bureaucratic obstacle — the same thing a hundred other Imperial officials did without a second thought. The deal was utterly transactional and almost certainly forgotten by Luthen within a week.\n\nBut Bail saw an opportunity. He flagged it, annotated it, filed it — not because it was devastating, but because it could be made to look devastating in the right political climate. It was insurance. A pressure point. Nothing more.\n\nPraji has been murdering people for a year to bury a document that would have inconvenienced him at worst. He built a career on a deal he barely remembers. He became a monster protecting himself from consequences that were never as catastrophic as he imagined.\n\nThe revelation of the drive's contents is the emotional climax of the entire arc. When Praji finally reads it — in a Rebel cell, with nothing left — the silence that follows is the scene. Everything he has done, balanced against a meeting log and a dead man's annotation. The mathematics of it don't balance. They don't come close.\n\nTHE LUTHEN CONNECTION\n\nLuthen Rael is dead, killed in 1 BBY. His network has dried up. By 0 ABY, even his best agents — including Cassian Andor — had moved on to work under General Draven. The operational security concern is moot.\n\nHowever, Luthen's true identity and his role in building the Rebellion is becoming increasingly known to Imperial Intelligence. Any document linking a sitting Moff to that man, authenticated by Bail Organa, is still enough to invite serious Imperial scrutiny — interrogation, disgrace, and likely execution or a maximum security gulag.\n\nOnly one person alive knows the name behind the alias Ardyth Canvi: General Airen Cracken.\n\nCracken was Draven's mentor. He dealt with Luthen's agents, inherited his networks, and made it his business to know every name the man ever used. If Derek says the name Ardyth Canvi in front of him — in a debrief, in a briefing room, anywhere — Cracken will go still. Then he will say two words: Luthen Rael.\n\nHe will say it without drama. Without agenda. He will fill in what he knows, answer questions plainly, and then go back to running a war. Luthen is a chapter that's already closed. But Derek will walk away from a routine conversation with the key that unlocks everything.\n\nTHE CAST\n\nJimmy \"2-Fingers\" \"the Shoe\"\n\nDerek's oldest friend. They grew up together on Alderaan — Derek from a prestigious family with education and opportunities, Jimmy from a poor family who made his way through other means. Jimmy became an infochant: a man with fingers in every pie, trading information for credits, making himself useful to anyone who needed to know things. He was good at it. For years, he was very good at it.\n\nThen Praji's purge began. Contacts went quiet. Pies dried up. The network that had protected Jimmy — the web of mutual interest that made him valuable and therefore safe — dissolved one thread at a time. By the time he found his way to the Hope, he had nothing left to sell, nowhere left to run, and no idea how to exist without the safety net that had defined his entire adult life.\n\nHe is manic, paranoid, and jumpy — seeing Imperial agents in every shadow. Some of those shadows are real. That's the thing about Jimmy: he's been right often enough that his paranoia has become indistinguishable from instinct, and the GM should reward players who take him seriously.\n\nWhat Jimmy holds: a holotransmission from Corin Bast. A dead man's unfinished sentence. A name — Rinn Achara — and the sound of a blaster shot. He has been sitting on it, too frightened to act, waiting without admitting it for someone he trusts. He's been waiting for Derek.\n\nHis role in the arc: Jimmy is the engine. He gives Derek the transmission, the name, and the first lead. He is also the human cost of Praji's paranoia made flesh — the answer to the question of what happens to the ones who survive.\n\nJimmy's paranoia should produce at least one moment during the arc where he is completely, verifiably right. This rewards players for treating him as an asset rather than a liability, and deepens his character beyond comic relief.\n\nCorin Bast — DECEASED\n\nBail Organa's Senate aide. Sharp, careful, politically astute. He was the first person — outside of Senne Olarr — to notice the pattern of deaths and start pulling threads. He followed the red flags his contacts were raising, pieced together that someone powerful was hunting the Alderaan 12, and connected it to a half-remembered name from a brandy-soaked evening: Ardyth Canvi, spoken quietly across a room between Rinn and Senne.\n\nHe reached out to Jimmy — the only contact he had outside the political world — with a half-formed theory and a single instruction: find Rinn Achara. She has a memory like a droid. Give her what I'm about to send you.\n\nHe was shot mid-sentence. The transmission cuts to silence.\n\nHe never sent whatever he was going to send. Jimmy has only the name, the instruction, and the sound of a blaster.\n\n\"Jim, I know it's unusual for me to reach out via holo but... listen, something's off. I want you to look into something for me. I've been digging around some dirt — dirt that apparently has some weight, because every contact I have has been waving a red flag. I want you to see if you can find Rinn Achara. She's a shipping magnate rep, does some political schmoozing. But back in the day, she was running with Bail and the Alderaan 12. She's got a keen sense of things, and if you just give her the information I'm going to send to you—\"\n\nA knock at the door. Footsteps. \"Yes? Can I help you?\" A beat. A blaster shot. The holoprojector falls. Silence.\n\nRinn Achara\n\nA Corellian shipping magnate's representative. Sharp, politically savvy, and possessed of a photographic memory so reliable it borders on unsettling. She remembers every face, every name, every detail of the night the delegation gathered — including Bail handing Senne a drive, a quiet conversation about a ghost that could change everything, and a COMPNOR man watching the door all evening with a note he never delivered.\n\nAfter Alderaan, she ran — but not far, and not forever. She rebuilt a life on Formos. Legitimate freight brokerage, good reputation, real credits. She was careful. She was quiet. She was fine.\n\nThen Dobah took control of Formos. He wanted a cut. She resisted. He took more. She pushed back. He imprisoned her. She has been in his cell ever since, which is why Jimmy's tentative inquiries hit a dead end — she was unreachable, and nobody who might know where she was had any reason to talk.\n\nHer role in the arc: Rinn is the directory. She gives Derek the full picture of the delegation — who's dead, who's missing, what happened that night. She is the bridge between Corin's fragment and Senne's secret. She also, almost as an afterthought, remembers a COMPNOR man in the corner with a crumpled note addressed to a princess.\n\nOn Formos: Rinn is being held in Dobah's compound. Rescuing her requires going through Dobah's operation — which intersects naturally with Zid's search for the Mad Mynock. Both objectives are in the same building. Neither player knew that when they set out.\n\nHer state when rescued: Not broken. Furious. The relief of being found is secondary to two months of accumulated rage. She doesn't need convincing — she needs five minutes to compose herself, and then she will tell Derek everything she knows.\n\nMaret Dunwall\n\nA COMPNOR cultural liaison. He was on the delegation that evening — the only Imperial loyalist in the room, there to observe and report. He spent most of the evening watching the door, waiting for someone who never arrived. He stepped on a crumpled note on his way out. A note addressed to Princess Leia Organa of Alderaan.\n\nHe has been investigating Praji's financial irregularities for months, following the money trail with the meticulous dedication of a man who believes the Empire works when corrupt individuals don't abuse it. He and Derek are moving toward the same answer from opposite directions.\n\nThe mirror: Maret's tragedy is that he is heading down the same road as Praji without realising it — a man so committed to the institution that he will compromise everything he actually believes in to protect it. The deeper he digs, the harder that premise is to maintain. Praji isn't an aberration. He's what the Empire produces.\n\nThe note: Rinn remembers it. She will mention it offhandedly — a COMPNOR man, watching the door, a note he stepped on. Something about a princess. Derek will have to connect the dots himself. In COMPNOR's world, emotional entanglement with a known Rebel leader — even undeclared, even one-sided, even predating her identification as a traitor — ends careers. At minimum.\n\nThe collision: Maret arrives on Formos just as Derek's crew is leaving with Rinn. He thinks she's being taken for quiet execution. He fires a warning shot. Derek steps into the light. A long pause. Out from the shadows steps Maret. \"Wait... Derek? What the hell are you doing here?\"\n\nWhat happens next: Derek's call. The GM should have Maret's motivations clear and let the player drive the outcome.\n\nIf Derek turns him: A COMPNOR insider who has had a genuine crisis of conscience is an extraordinary asset. He can move through Imperial institutional space unsuspected, manage Praji's official record, and make the Alliance's operations look clean from the inside.\n\nIf Derek doesn't: Maret becomes the arc's most dangerous antagonist. Not violent — institutional. He files reports. He opens formal investigations. He brings COMPNOR's full bureaucratic machinery to bear, and it is patient and thorough and very hard to outrun.\n\nKrief Barrota — DECEASED\n\nDied in a shuttle explosion over Delaya, ruled an accident. He had been hiding among the Alderaanian refugee diaspora on Alderaan's sister planet — thinking there was safety in numbers, in grief, in anonymity.\n\nHe was wrong about the safety. But he was brave at the end. He knew Praji's people were closing in on Senne. He staged a clumsy decoy — carried a blank datapad, made himself visible, tried to draw the hunters away from her. He thought he was buying her time. He didn't know they'd already marked his shuttle. It was detonated before he cleared the atmosphere.\n\nHe died thinking he was being clever. He died because Praji is more desperate and more capable than any of them fully appreciated.\n\nHis role in the arc: Barrota is the clock ticking in the background. His death, reported in two lines of local news, tells Derek how close the hunters are and how ruthlessly they operate. For Senne, his death is the wound that galvanised everything. The assault on Delaya is his eulogy.\n\nSenne Olarr\n\nBail Organa's most trusted diplomat. The woman who has been carrying the drive for a year. She never got to rebuild — from the moment that drive went into her pocket she was living a different life, and she knew it. She ran to Delaya, Alderaan's sister planet, and disappeared into the refugee diaspora under her mother's maiden name.\n\nShe didn't hide for long. She found people who needed leading and she led them.\n\nBy the time Derek finds her she is running an underground resistance on Delaya, preparing a significant assault on the Imperial garrison, and she is galvanised by grief and fury in equal measure. She is not precious about her own survival. She has one thing to do and she is going to do it.\n\nFinding her: Delaya is the answer. Of course it is. Alderaan is gone — Delaya is the closest thing left. The hiding-in-plain-sight logic is elegant: Praji's hunters are looking for a senior diplomat. On Delaya, every other person used to be something important. Nobody stands out.\n\nHer condition: She is not a frightened woman in hiding. She has been waiting. Not patiently — but with the quiet fury of someone who has already decided what she is willing to sacrifice. When Derek and Rinn walk through the door, she is ready.\n\nHer ask: Before she hands over anything, she wants Derek beside her on Delaya. Help her take out the Imperial garrison. Free the Alderaanian refugees. Stand with her for Barrota. Then she will have his full attention and respect — and he will have the drive.\n\nfor the GM: Senne's survival during the Delaya assault is something Derek should actively consider. She is not suicidal, but she is not cautious either. If Derek wants her to reach the confrontation with Praji, he may need to stay close to her throughout.\n\nThe drive handoff: Senne never gave the real drive to Barrota. She let him believe she had, because she could not bear to put it in anyone else's hands after everything that had happened. She trusted him with his life but not with that. She will carry that guilt quietly.\n\nMoff Praji\n\nOverseer of the Alderaan sector. A man of considerable political and military reach, operating from his command ship, the Star Destroyer Retributor. He was once at odds with Grand Moff Tarkin, who destroyed a core world under Praji's authority and humiliated him politically. He got the last laugh when the Death Star was destroyed. But his past was always the real enemy.\n\nHe did not earn the Retributor or his position through merit. He bought it with a favour from a man he didn't know was building a Rebellion — and Luthen Rael took the chair of Praji's predecessor as payment. Praji has been sitting in a dead man's seat for years and never let himself think about it too carefully.\n\nHe has spent a year becoming a monster. Every kill order, every payment to bounty hunters, every midnight transmission to Hulo Nord — all of it routed through the Retributor. It is his command centre, his sanctuary, and the place he feels safest.\n\nDerek is going to take it from him.\n\nHis state in the finale: Dangerous. Cornered. Willing to take everything down with him rather than face Imperial justice. He still believes the drive is catastrophic. He still thinks he has something to protect. His self-destruct fob is not melodrama — it is the logical endpoint of a man who stopped trusting the institution he serves and started buying loyalty directly.\n\nThe line: Praji is seated at the same desk his predecessor occupied. He took this ship, this chair, this life through Luthen's intervention. Derek can point that out — quietly, almost conversationally. How poetic that he will end in the exact place his predecessor did. On his orders.\n\nThe cell scene: If Praji survives the Retributor, the real confrontation happens after — in a small room, no audience, just Derek and Praji and a drive that neither of them expected to look like this. Praji reads it. Reads it again. The silence that follows is the scene.\n\nHulo Nord\n\nPraji's elite tracker. Quiet, professional, extraordinarily good at his job. He is not hired until Derek hits 50 Obligation — Praji has been done with the street-level approach for a while, but Nord is expensive and Praji needed to be sure he was necessary. He is now sure.\n\nNord is not a villain who monologues. He is a pressure system. He is felt before he is seen — a contact going quiet, a name whispered through the remnants of Jimmy's network, a lead that goes cold with suspicious precision. By the time Derek meets him directly, the investigation has already been compromised.\n\nHis target: Rinn Achara. If Derek reaches 100 Obligation before rescuing Rinn, Nord extracts her from Dobah's cell and delivers her to Praji. The chain is broken at its most important link.\n\nGand Quir and Shaw'ty\n\nThe street-level hunters. A human mercenary and a Trandoshan bounty hunter. Loud, persistent, dangerous, and entirely ignorant of why they are hunting Derek or who is paying them. They are the first face of Praji's operation — the Doubles trigger that introduces the threat and, if handled right, provides the first thread leading back to Praji himself.\n\nKilling them reduces Obligation by 20. Questioning them first gives Derek the name Praji — the first time it surfaces in the investigation. Letting them go gives 5 Light Side points and reduces Obligation by 30. Two hunters who owe Derek their lives may prove more valuable than two bodies in an alley.\n\nTHE INVESTIGATION — THE CHAIN\n\nThe investigation moves through five links. Each link only points to the next. Nobody can shortcut to the end, and nobody is withholding information deliberately except Senne — who has been hiding for a year and trusts absolutely nobody.\n\nJimmy holds Corin's transmission — a dead man's unfinished sentence, a name (Rinn Achara), and the sound of a blaster shot. He has been sitting on it alone, too frightened to act, waiting for Derek.\n\nRinn holds the directory — every face, every name, every detail of that evening. She saw the drive change hands. She heard Senne mention Ardyth Canvi. She remembers a COMPNOR man stepping on a crumpled note addressed to a princess.\n\nCracken holds the key — the identity behind the alias Ardyth Canvi. He says it without drama when Derek says the name in front of him: Luthen Rael. Then he goes back to running a war.\n\nSenne holds the drive — and a year of grief and fury and the underground resistance that grew from both. She will not hand it over until Derek earns it.\n\nPraji holds the ending — and Derek holds the three ways it can go.\n\nTHE SHAPE OF THE ARC\n\nPhase One — The Transmission\n\nJimmy finally plays Derek the recording. Corin Bast, mid-sentence, a name, a blaster shot, silence. The investigation begins.\n\nThis phase establishes the stakes and Jimmy's fragile state. Derek understands what he is walking into — not a clean intelligence operation but a two-year-old murder spree with a dwindling list of survivors. The name Rinn Achara is the only lead. Formos is where it leads.\n\nThe GM should make clear, without overplaying it, that Jimmy has been sitting on this alone for a long time. The moment he plays the transmission is the most significant thing he has done since Alderaan. It should feel that way.\n\nPhase Two — Formos\n\nDerek's crew arrives on Formos to find Rinn. She is already in a cell. Rescuing her means going through Dobah's operation, which intersects with Zid's search for the Mad Mynock. Both objectives are in the same building. Use the official Formos adventure from the Edge of the Empire rulebook as the structural base.\n\nAs the crew leaves with Rinn — through dark alleys, dim lampposts, evening fog — a warning shot rings out. Maret Dunwall steps from the shadows. What happens next is Derek's call entirely.\n\nOnce Rinn is safe, she opens her memory like a filing cabinet. The full roster of the living and the dead. The drive changing hands. The name Ardyth Canvi spoken quietly across a room. And, almost as an afterthought: a COMPNOR man watching the door all evening, a note in his hand, stepping on it on the way out. Something about a princess.\n\nDerek will have to connect those dots himself. The GM should not underline them.\n\nPhase Three — Delaya\n\nThe trail leads to Delaya. Of course it does. Alderaan's sister planet, full of survivors. The last place anyone serious would look carefully. Senne is there — not hiding, but leading.\n\nThe underground resistance is preparing its assault on the Imperial garrison. Senne wants Derek beside her before she gives him anything. What they build during the assault — the trust, the shared grief, the understanding of what Barrota died for — is what makes the drive handover feel earned rather than transactional.\n\nSomewhere during this phase — in a debrief, a quiet moment, a passing conversation — Derek says the name Ardyth Canvi in front of Cracken. Cracken goes still. Then: Luthen Rael. The last blank is filled in.\n\nThe GM should decide in advance whether Senne survives the assault without Derek's direct intervention. She is not trying to die — but she is not being careful either. If the player doesn't stay close to her, there should be a real cost to that.\n\nPhase Four — The Retributor\n\nDerek has everything. The drive, the context, the name, the chain of dead and surviving witnesses. He knows what Praji did, why he did it, and what it cost. He knows what is on the drive and what it is worth.\n\nWith Senne's help — Delaya now liberated and handed to the Rebellion — and Cracken's sanction, Derek sets the trap. The Alliance lays in wait. Praji is goaded into committing fully, believing he is finally cornering Derek. Ion cannons take out the Retributor. Boarding teams infiltrate the disabled ship. X-wings and TIE fighters clash around the hull. Derek pushes through toward the captain's quarters.\n\nPraji has retreated there with Death Troopers — personal, off-books, the last resource of a man who stopped trusting the institution he serves. Once the team deals with them, Praji is exposed. A rat in a corner.\n\nHe has a self-destruct fob. He is willing to use it. He still believes the drive is catastrophic.\n\nThis is a negotiation at gunpoint. Derek's diplomatic instincts matter here more than any combat roll.\n\nThe Cell — The Real Confrontation\n\nIf Praji is taken alive, the real confrontation happens after the assault, after the ship is secured, after the noise has cleared. A small room. No audience. Just Derek and Praji and a drive that neither of them expected to look like this.\n\nDerek slides it across the table. Praji opens it. Reads it. Reads it again.\n\nThe silence that follows is the scene.\n\nPraji is a smart man. He understands immediately. He spent a year becoming a monster to bury a document that would have inconvenienced him at worst. He had people killed for this.\n\nIf Derek wants answers — missing threads, names, anything Praji discovered during his own investigation — this is the moment to ask. Praji in that cell, in that silence, is the most honest he has ever been in his life. He has nothing left to protect. He might answer simply because being asked is the only human interaction left to him.\n\nTHE THREE ENDINGS\n\nKill Him\n\nJustice for the Alderaan 12. Clean, final, irreversible. Praji doesn't get to live with the knowledge of what he's done. It's a mercy of a kind — a dark mercy, but mercy nonetheless.\n\nDerek has to live with the choice. Praji in that moment might have been redeemable. A Moff-level asset dies with him. The surviving members of the Alderaan 12 get an ending, but not answers.\n\nLeave Him\n\nDerek walks out without another word. Leaves Praji with the drive, the silence, and the knowledge. The Rebellion decides what to do with him. He rots with what he knows — which may be worse than anything Derek could do directly.\n\nThis is arguably the cruellest option. Praji got away with it. It will never feel like getting away with it.\n\nTurn Him\n\nDerek makes the offer. Not generously, not warmly. Practically. The Rebellion needs assets. Praji needs protection. The Empire will kill him the moment they find out what he has done — and they will find out, because Derek will make sure they do, unless Praji makes himself useful.\n\nIt is not redemption. It is a transaction. Praji understands that language better than any other.\n\nIf Derek has turned Maret as well, the shape of the ending becomes remarkable. Rinn manages Praji — political instincts, shipping network, personal reasons to keep him on a very short leash. Maret handles the Imperial paperwork that makes Praji's continued existence in his position look completely legitimate. And the ouroboros completes its loop: Bail wanted to make Praji an asset. Luthen's ghost made it possible. A Rebel diplomat and a reformed COMPNOR agent finished the job.\n\nOBLIGATION MECHANICS\n\nWhat the Obligation Represents\n\nThe weight of being hunted. Not just by bounty hunters, but by the slow tightening of Praji's net. Every public appearance is a potential sighting. Every loose thread is a potential lead that feeds back to Hulo Nord. The Obligation tracks how close Praji is to finding Derek specifically, and how much pressure that puts on the investigation.\n\nIncreases\n\nAny non-stealthy public appearance increases Derek's Obligation by 5.\n\nMaking inquiries about the Alderaan 12 without adequate cover increases Obligation by 5.\n\nLeaving witnesses after encounters with Gand Quir, Shaw'ty, or any of Praji's hired muscle increases Obligation by 5.\n\nDecreases\n\nFinding a living member of the Alderaan 12 decreases Obligation by 10.\n\nEliminating or flipping one of Praji's hunters decreases Obligation by 10.\n\nSecuring Rinn from Formos decreases Obligation by 15.\n\nTriggers\n\nDerek sees his face on a wanted poster or holopuck. The profile varies with Obligation level — low Obligation, a generic notice with a middling reward; high Obligation, a detailed profile with a significant reward, clearly compiled by someone patient and resourceful. Not acting on it increases Obligation by 5.\n\nA member of the Alderaan 12 is found dead before Derek reaches them. Increases Obligation by 10.\n\nJimmy's paranoia turns out to be correct. He spots something real — surveillance, a tail, a genuine threat. This should happen at least once. It rewards the players for taking him seriously.\n\nDoubles — Gand Quir and Shaw'ty\n\nThey find Derek wherever he is. Not subtle. Not sophisticated. But persistent and dangerous.\n\nKilling them reduces Obligation by 20.\n\nQuestioning them first gives Derek the name Praji — the first time it surfaces in the investigation.\n\nLetting them go gives 5 Light Side points and reduces Obligation by 30. Two hunters who owe Derek their lives may prove more valuable than two bodies in an alley.\n\n50 Obligation — Hulo Nord Surfaces\n\nNord does not appear directly. The signs are there: a contact goes quiet unexpectedly, a lead dries up with suspicious precision, Jimmy picks up a name through what remains of his network. Hulo Nord. Tracker. Very good. Very expensive. Praji is done with the street-level approach.\n\nThe GM should run a cold open at the start of the next session:\n\nA dark interior — the captain's quarters of the Star Destroyer Retributor. Moff Praji stands with his hands clasped behind his back, staring out the viewports into the darkness of space. The doors open. In steps a gruff figure who keeps to the shadows.\n\nHulo Nord, I presume,\" Praji says without turning. \"I've heard great things.\n\nA grunt. \"Who's your target.\"\n\nPraji turns. There is a wry grin on his face.\n\nRinn Achara.\n\nThe GM should now quietly ask: how close is Derek to Formos?\n\n100 Obligation — Nord Delivers Rinn\n\nHulo Nord extracts Rinn Achara from Dobah's cell on Formos and delivers her to Praji. She was isolated and vulnerable, and Nord is exactly the kind of operator who knows how to move someone without drawing attention.\n\nPraji questions her. Rinn has a photographic memory and a year of carefully observed details. What she gives up under interrogation — willingly or not — accelerates the hunt for every remaining member of the Alderaan 12 dramatically.\n\nDerek loses the chain. He has Jimmy's fragment — the name, the transmission — but Rinn was the one who could fill in everything between that name and Senne Olarr. Without her, the path to Senne goes dark. The margin for error is gone.\n\nRinn does not know about the drive or what it contains. Praji gets closer — but not everything. Senne is still out there. The drive is still out there. But Derek is now in a race he may not win.\n\nTHE ALDERAAN 12 — FULL ROSTER\n\nBail Organa is deliberately not numbered in this table — see Section 1. If you'd prefer him listed for reference, he can be added as an unnumbered header row above #1, marked DECEASED — Alderaan.\n\nSIDE INVESTIGATION PATHS\n\nDerek does not have to reach Senne through the Jimmy → Rinn → Corin chain alone. He was in the room — he can start to remember, and nothing stops him from tracking down any of the other surviving members before, instead of, or alongside Rinn. Each one offers a different piece, and a different cost.\n\nMaret Dunwall — the paper trail\n\nGives Derek the financial shape of Praji's corruption: embezzlement, misappropriation, the mechanics of it. He knows nothing of the drive, the murders, or the politics behind them — only the numbers. He is still a loyal COMPNOR officer investigating his own superior, which makes him simultaneously an asset and a live wire: he could become a source, or he could report Derek on principle before trust is earned.\n\nDasha Mirrel — the survivor\n\nShe worked it out before Derek did, and has been running alone ever since. She confirms the hunt is real and accelerating, teaches Derek the tradecraft of staying hidden, and may hold fragments about the other dead or missing members. She's hit a wall and is suspicious — trust is earned, not given, and reaching her doesn't mean she cooperates immediately.\n\nTorvald Ese — the moral trap\n\nTorvald knows nothing and is in no danger — yet. Finding him isn't an intelligence beat, it's a dilemma: warning him exposes him and likely accelerates the 100 Obligation death that's already coming. Leaving him ignorant lets him keep surviving by being unremarkable. There is no clean option here, only the one Derek can live with.\n\nThe Naboo second son — the test\n\nPraji is watching him, which makes contact risky. He offers nothing useful directly, but reaching him safely (or getting him out first) removes a loose end Praji could use as bait or leverage — and tells Derek whether he's learned enough tradecraft yet to approach a watched target without getting both of them caught.\n\nKleya Marki — the endgame\n\nHardest to reach early — she's embedded inside Alliance Intelligence, not hiding in the underworld. But she is the one who put the evidence in Bail's hands, which means she knows what it was meant to do even if she never learned the name hidden inside it, and she is the only one who can mobilise real Alliance resources against Praji. She is naturally a late-arc contact: the moment Derek's investigation stops being personal and starts being something the Rebellion can act on.\n\nGM NOTES\n\nThe Pacing of Revelation\n\nThe arc is built on fragments. Nobody has the full picture until Senne hands over the drive, and even then the full emotional weight only lands when Praji reads it. Resist the temptation to accelerate the revelations. Each link in the chain should feel earned.\n\nThe name Ardyth Canvi is the pivot point of the entire investigation. The first time Derek hears it — probably from Rinn — it should land with weight. He knows someone is hunting the Alderaan 12. He doesn't yet know why. Ardyth Canvi is the moment the investigation shifts from who to what.\n\nJimmy as an Asset\n\nJimmy's paranoia should produce at least one genuine result during the arc. If the players start treating him as comic relief or a liability, give him a moment of undeniable accuracy — he spots something real, warns them of something concrete, and is right. This is the arc's quiet thesis: the people who seem most broken by what the Empire does are often the ones paying the most attention.\n\nMaret's Loyalty Knot\n\nThe GM should not telegraph Maret's potential as an ally. He should feel genuinely dangerous when he steps out of the shadows on Formos. The question of whether he can be turned should arise organically from the conversation, not from the GM nudging the player toward the right answer.\n\nIf Derek tries to turn him, the hooks are: showing him the human cost (Jimmy, Rinn, Barrota's death); surfacing whatever Praji has on Maret himself; and holding up the mirror — you're investigating Praji because he put the institution above the people it was supposed to serve. When did you last ask yourself the same question?\n\nThe note is the key. Derek won't have it when they first meet on Formos — Rinn tells him about it afterwards, almost as an afterthought. What Derek does with that information is entirely his own decision.\n\nThe Drive\n\nThe GM should know what is on the drive from the beginning. The players should not. The emotional payoff of the finale depends entirely on the audience — including the player — not knowing until Praji reads it and his face changes.\n\nDo not let any earlier scene accidentally reveal the mundanity of the evidence. Every character who references it does so with appropriate gravity, because to them it is still unknown and therefore still threatening.\n\nThe Three Endings\n\nAll three are valid. All three have consequences. The GM should not steer the player toward any particular outcome. The arc has been constructed so that each ending is earned by the choices Derek has made along the way.\n\nThe turning of Praji is the most complex and opens the most future story — but it requires Derek to have done the groundwork. If he has burned bridges, made enemies, or failed to secure Maret, the third option may not be available or may not be sustainable.\n\nPACING THESE ENCOUNTERS\nEarly game (Dasha, Torvald): emotional stakes — the hunt is real, and not everyone can be saved.\nMid game (Maret): a second route to ruining Praji that doesn't depend on the drive at all.\nLate game (Kleya): the moment the investigation graduates from Derek's personal obsession to an Alliance operation.\nAny time (Naboo son): a tradecraft check — succeed and remove a loose end, fail and get flagged."}, "d-grevi": {"id": "d-grevi", "v": 2, "title": "Grevi Unduli — Legacy of the Unduli", "folder": "Obligation Arcs", "updated": "", "blocks": [{"id": "a2", "t": "h1", "x": "LEGACY OF THE UNDULI"}, {"id": "a3", "t": "p", "x": "Grevi Unduli — Obligation Arc · Working Draft"}, {"id": "a4", "t": "h1", "x": "The Arc in Brief"}, {"id": "a5", "t": "p", "x": "Luminara Unduli was taken from the Unduli family when she was very young — young enough that she left almost nothing behind. Only a legend. The family honoured that legend quietly, speaking in hushed tones of the one who became a great Jedi, until Order 66 made silence the only safe option."}, {"id": "a6", "t": "p", "x": "For Grevi, the silence never made sense. If she was so great, why erase her? He went searching for truth, and found a discarded holocron on Mirial — thrown away by someone who didn't want it. He touched it. He saw Luminara's face. He felt, for the first time in his life, that something was pointing at him specifically."}, {"id": "a7", "t": "p", "x": "He has been trying to open it ever since."}, {"id": "a8", "t": "h2", "x": "The Emotional Core"}, {"id": "a9", "t": "p", "x": "Grevi is a loner. He has always done things alone — not from preference, but from habit, and from a quiet belief that the galaxy is too large and too dangerous to trust anyone else with the things that matter most."}, {"id": "a10", "t": "p", "x": "The holocron disagrees. It opens corner by corner, not in response to skill or knowledge, but in response to growth — the growth of someone who has always done things alone learning that he cannot. That asking for help is not weakness. That staying when things are hard is not surrender. That giving something freely, without counting the cost, is the most powerful thing a person can do."}, {"id": "a11", "t": "p", "x": "Luminara made a holocron that can only be fully opened by someone who has learned to be present for the people around them. She made it for Barriss. The Force put it in Grevi's hands instead."}, {"id": "a12", "t": "h2", "x": "The Explorer's Journey — A Note on Structure"}, {"id": "a13", "t": "p", "x": "Grevi is an Explorer by career. This arc is built to honour that. Rather than a fixed sequence of planets, the holocron opens into a constellation of destinations that Grevi can pursue in whatever order suits the campaign and the player. Spintir is the fixed entry point. Stygeon Prime is the fixed emotional midpoint. Tython is the fixed endpoint. Between Spintir and Stygeon Prime sit three constellation worlds — Yavin, Jedha, and Korriban — each visitable in any order, each teaching Grevi something different about the seeing stones Luminara devoted her life to studying."}, {"id": "a14", "t": "p", "x": "This is a deliberate agency fix. Grevi does not follow a trail someone else laid. He chooses which part of Luminara's legacy to pursue next, and the story accommodates him arriving at each world with a different amount of prior knowledge."}, {"id": "a15", "t": "h2", "x": "The Destination"}, {"id": "a16", "t": "p", "x": "At the end of this arc, Grevi finds Tython — the ancient birthplace of the Jedi Order, lost to the galaxy for generations. He builds a seeing stone there himself, using knowledge earned across every prior world, not knowledge handed to him. He builds it to call someone. He does not know who, at first. When the stone activates and Luke Skywalker appears across the years inside the Force, Grevi understands what he was always building it for."}, {"id": "a17", "t": "p", "x": "The Rebellion finds a base. The galaxy finds a thread of hope. Grevi finds Luminara — and beside her, in the Force, Barriss and Lyn."}, {"id": "a18", "t": "h1", "x": "Key Characters"}, {"id": "a19", "t": "h2", "x": "Allies"}, {"id": "a20", "t": "callout", "x": "Barriss Offee\nTHE TORCH-BEARER · SPINTIR\nLuminara's former padawan. Ex-Jedi, ex-Inquisitor, redeemed — though she would never use that word. She was carried off a snow-covered battlefield by Lyn Rakish, the woman who had just stabbed her through the heart, and somehow they both survived. She cannot walk unaided. She lives quietly on Spintir with Lyn and has been bracing for this knock on the door for years.\nBarriss recognises Luminara's holocron the moment she
