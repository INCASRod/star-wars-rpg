went quiet months ago. Nobody will say more than that in the open."], ["The Dauntless Capitalism", "Docked here. Owner is Kalifa Frey, a pirate out of Maldra IV. Reactions carry respect and nerves in equal measure."], ["Caroth Blaine", "Silence, and then a change of subject. He comes and goes. He deals with Dobah. Nobody wants to be the person who talked about him."], ["Bandin Dobah", "Paranoia. \"Shhh! Are you crazy?\" Nobody discusses the Big Man in the open."]]}, {"id": "f57", "t": "h2", "x": "Snoo, Information Broker"}, {"id": "f58", "t": "p", "x": "A Devaronian who will take one non-droid character aside for 50 credits, bargainable to 20 on an Average Charm, Coercion or Deception check. He sells the shape of the operation, as published, with one addition: the gang the party will shortly meet has a name, and calling them a gang undersells them."}, {"id": "f59", "t": "list", "x": "Formos rewards those who know contraband and bounty work, but strangers get nothing until they earn standing\nThe Formos Few operate on a franchise model — cells of four to ten, each relying on the others, with Dobah's own cell at the top taking a cut of everything\nDroidnapping is entirely within Dobah's character, though Snoo has heard nothing specific\nThe Empire's 10,000 is not the only bounty; Thakba Besadii Diori has offered 5,000 for Dobah alive\nA Rodian bounty hunter came through some weeks back on Dobah's trail and has not been heard from since"}, {"id": "f60", "t": "callout", "x": "GM NOTE — THE RODIAN\nThat last line is Godon. Snoo assumes he is dead. He is not, and the party will meet him on the asteroid in Dobah's crew.\n\nIf the party has already met Zukata when Snoo mentions this, they may connect it. If they have not, the line should pass as ordinary background — one more person who went after Dobah and disappeared."}, {"id": "f61", "t": "h2", "x": "Zukata"}, {"id": "f62", "t": "p", "x": "An elegant Rodian woman enters the bar, orders food and drink, and draws appreciative glances. She wears green satin with brass accessories and carries a purse shaped to conceal a holdout blaster. Moments later three of Dobah's people saunter in — Daro Blunt, Spir Fraxis, and the Weequay Gut-Guro — and a hush falls over the room."}, {"id": "f63", "t": "p", "x": "Spir takes an immediate and unpleasant interest in her. She rejects him politely in Rodian, which he does not speak and would ignore if he did. She is uncomfortable, lacks the confidence to make a scene, and begins looking around the bar for a reason to excuse herself."}, {"id": "f64", "t": "p", "x": "The confrontation resolves exactly as published — the party can stay out of it, talk Spir down, trade insults, or start a fight. Daro leaves before it gets serious either way, and the GM should ensure he escapes with minor injuries and that Zukata is unharmed."}, {"id": "f65", "t": "callout", "x": "GM NOTE — THIS IS THE MOST IMPORTANT SCENE IN ACT TWO\nIn the published adventure, helping Zukata earns the party a grateful stranger with 2,000 credits to spend on droid data and a missing brother she is coy about.\n\nIn this version she is Rinn Achara's partner and the co-founder of the brokerage Dobah destroyed. She is the reason the party can survive the Kessel Run, and she is sitting on the other half of Derek's investigation.\n\nShe will not volunteer any of it. She has been looking for Rinn for months on a world owned by the man who took her, and the last person she trusted with a plan was Rinn herself, who made a deal with Dobah against her advice and vanished. Trust has to be earned here, and the party has to actually give her a reason."}, {"id": "f66", "t": "h3", "x": "What Zukata Gives, and When"}, {"id": "f67", "t": "table", "x": "", "r": [["Trust level", "What she offers"], ["Cordial — the party helped with Spir", "The atlas cover story. Backwater route verification for a Rodian publisher. She is bored and frustrated and mentions she has heard of a droid with comprehensive Kessel Run data, and would pay 2,000 credits for accurate information."], ["Warmer — the party is straight with her about why they are asking", "Her brother Godon came here months ago and did not come back. She believes he is dead. She says this flatly, having had a long time to get used to it."], ["Earned — the party gives her something real, or she works out they are after the same person", "Rinn Achara. The brokerage. Dobah's harassment. The deal Rinn made against her advice. The day she did not come home. And the survey charts — genuine, current Kessel Run navigational data that she has been assembling for months for exactly one purpose."]]}, {"id": "f68", "t": "callout", "x": "GM NOTE — LETTING THE CONVERGENCE HIDE\nIt is entirely possible — and genuinely better — for the party not to realise that Derek's witness and Zukata's missing partner are the same woman until late.\n\nDerek is looking for a name. Zukata is grieving a person. Nobody uses both halves of the information in the same sentence unless the party puts them together. If they do not, Godon's intervention on the asteroid will look like providence, and Zukata's reunion with Rinn will land as a genuine surprise rather than a scheduled payoff. Do not help the players make this connection. Let them earn it or be blindsided by it."}, {"id": "f69", "t": "h3", "x": "Zukata Wants To Come"}, {"id": "f70", "t": "p", "x": "Once she knows the party is going into the Kessel Run, she will insist on coming, and she will not be casual about it. She has spent months on a hostile world trying to reach the one place she cannot reach, and a crew of armed strangers has just walked in with a ship and a reason to go."}, {"id": "f71", "t": "p", "x": "She is also a negotiator and an atlas surveyor, not a combatant, and the asteroid is a fortress inside a nebula. Talking her into staying is a genuine social scene — Charm, Negotiation or Deception, opposed by a woman who has every reason to be there and knows it. Promising to bring Rinn back is what wins it, and the party should feel the weight of having promised it."}, {"id": "f72", "t": "h2", "x": "Zalg and Daro's Gang"}, {"id": "f73", "t": "p", "x": "Zalg the Toydarian eavesdrops on the party's conversation with Zukata and, if not stopped, sells everything he heard to Daro Blunt for twenty credits. The party can spot him on an Average Perception check and shadow him on Average Stealth, exactly as published — either to the smugglers' warehouse or to Daro directly."}, {"id": "f74", "t": "p", "x": "If they take no action, Daro musters the Few and comes looking for them roughly half an hour after Zalg leaves the cantina."}, {"id": "f75", "t": "pb", "x": ""}, {"id": "f76", "t": "h1", "x": "Act Two, Continued — The Formos Few"}, {"id": "f77", "t": "p", "x": "The published adventure calls this a safe house. It is considerably more than that now."}, {"id": "f78", "t": "h2", "x": "The Complex"}, {"id": "f79", "t": "p", "x": "A warehouse compound on the edge of the spaceport, refurbished properly rather than briskly. Living quarters for a dozen. A secured cargo floor. Two droid guards on the interior, and more available if the alarm goes up."}, {"id": "f80", "t": "p", "x": "The party can take the complex the hard way, or with significant advantage if they arrive before Daro has mustered — in which case the gang is unequipped and out of position, as published."}, {"id": "f81", "t": "h3", "x": "What Is On The Cargo Floor"}, {"id": "f82", "t": "list", "x": "Shipping crates of glitterstim, rigged to destroy their contents if opened incorrectly — Easy Perception to notice the rigging, Average Mechanics to disarm\nA reinforced cabinet holding tools, 235 credits, and the gang's spare weapons\nSpent IFF transponder cartridges, discarded in a bin at the back of the floor — identifiable on a Piloting (Space) or Knowledge (Education) check as transponder modules, stripped and burned out"}, {"id": "f83", "t": "callout", "x": "GM NOTE — THE CARTRIDGES ARE ZID'S FIRST PHYSICAL PROOF\nZob Anoor gave Zid a name and a description. This is the first time Zid puts his hands on the actual product.\n\nA character who makes the check knows what these are: identity modules pulled out of real ships and run until they burned. There are dozens of them. Whatever this operation is, it is not small, and it is not new."}, {"id": "f84", "t": "h3", "x": "R4-W9"}, {"id": "f85", "t": "p", "x": "The astromech stands inactive in a corner, a heavy iron restraining bolt fitted to his chassis, panels removed, wired to a portable computer whose screen reads \"Configuration complete — coordinates compatible.\""}, {"id": "f86", "t": "p", "x": "The bolt can be removed with the tool from Daro's backpack, or on an Average Mechanics check, or forced off with a lever at the cost of three wounds to the droid. Freed, he communicates in bleeping machine language with a holographic projector for illustration, and his first concern is J9-B8."}, {"id": "f87", "t": "p", "x": "He has been uploaded with coordinates to a large asteroid inside the Kessel Run, and he will offer to come along."}, {"id": "f88", "t": "h3", "x": "The Terminal"}, {"id": "f89", "t": "p", "x": "The portable computer R4-W9 is wired into is the single most valuable object in Act Two. An Average Computers check opens it. Three Advantage or better opens the additional file named \"Pass\" — a short-wave broadcast pattern, and the sentry droid passcode."}, {"id": "f90", "t": "p", "x": "What else is on it:"}, {"id": "f91", "t": "table", "x": "", "r": [["Record", "What it tells the party"], ["Shipping manifests", "Routes running Ryloth, Mirial and Xxorn, all terminating at Geonosis. Hulls in, identities out. This is the stripping operation, documented."], ["Beneficiary ledger", "The name Caroth Blaine, repeatedly, as the party receiving payment on the transponder side of every transaction."], ["Glitterstim accounts", "Bales transported and sold. Ordinary Kessel Run business, and confirmation that this cell handles volume."], ["The \"Pass\" file", "The sentry droid passcode for Dobah's asteroid."], ["A datafile on Rinn Achara", "See below."]]}, {"id": "f92", "t": "callout", "x": "GM NOTE — THE RINN DATAFILE\nThis is where Derek's investigation and Zid's collide, in writing, in one document, and neither player will have expected it.\n\nThe file is Dobah's own record of the arrangement: Rinn Achara, freight broker, approached the organisation after sustained losses to skimming. Terms agreed — she brokers new beneficiaries into the transponder trade using her contacts, the Few stop hitting her shipments. Her brokerage is credited with introducing the Caroth Blaine account.\n\nSubsequent entries are terse and revealing. Her margin is queried. Her margin is reduced. Her margin is discontinued. There is a note about her becoming difficult, and then a note about relocation to the asteroid facility, and then nothing further except her ongoing assignment to the operation's accounts.\n\nDerek came here looking for a witness to a party on Alderaan. He has found a woman who built the thing Zid is trying to destroy, and who is being held for having objected to how she was treated for it. Let both players read it."}, {"id": "f93", "t": "h2", "x": "The Hangar Standoff"}, {"id": "f94", "t": "p", "x": "Guy's thread, and it can fire at any point once the party has been asking about the Dauntless Capitalism."}, {"id": "f95", "t": "p", "x": "Leyo Prim arrives at the hangar with Crimson Dawn muscle — one rung beneath Qi'ra, hunting Dobah's bounty, and delighted to find Guy Rando standing in the same place he is."}, {"id": "f96", "t": "quote", "x": "Well colour me a gundark and call me Jabba — if it ain't Guy Rando himself. Right here, searchin' what I'm searchin'. Anyone else think that's a great little coinky-dink?"}, {"id": "f97", "t": "p", "x": "A second door opens. Cul Gorrak enters with Desilijic kajidic muscle, hunting the same bounty, equally delighted."}, {"id": "f98", "t": "quote", "x": "Leyo Prim, as I live and breathe. Oh, and Guy Rando! Well whaddaya know — it must be my birthday or somethin'."}, {"id": "f99", "t": "p", "x": "Neither of them is here for Guy. Both of them will take him if he is convenient. They are here because Bandin Dobah is worth 15,000 credits between two bounties and neither syndicate intends to let the other collect."}, {"id": "f100", "t": "table", "x": "", "r": [["Party choice", "Result"], ["Attempt to board the Dauntless", "The ship locks down and an alarm sounds — it was always rigged for this. Both crews open fire in the confusion."], ["Leave quietly", "The firefight begins as the party reaches the exit. The door closes behind them and the fighting stays out of view."], ["Intervene", "Do not punish it heavily, but both crews get a clean look at the party. Kalifa Frey will know exactly who Guy is before he ever reaches Maldra IV."]]}, {"id": "f101", "t": "p", "x": "Prim and Gorrak both run the moment it turns serious, leaving their enforcers to die for a bounty neither man was willing to bleed for. Play it as comic and slightly pathetic — two men who talk like they own the underworld, sprinting for the door."}, {"id": "f102", "t": "callout", "x": "GM NOTE — THE STANDOFF IS ALSO INTELLIGENCE\nThe syndicates already know Dobah's Formos presence is a front. They are here because they cannot find him either.\n\nA party paying attention learns something useful from watching two professional outfits fail at the same problem: whatever is on Formos is not where Dobah lives."}, {"id": "f103", "t": "pb", "x": ""}, {"id": "f104", "t": "h1", "x": "Act Three — Caroth Blaine Comes to Formos"}, {"id": "f105", "t": "p", "x": "Zid's thread. This scene can be triggered at the GM's discretion at any point in Act Two, and it works from any angle the party happens to be approaching from."}, {"id": "f106", "t": "h2", "x": "The Man Who Doesn't Need Dobah"}, {"id": "f107", "t": "p", "x": "Caroth Blaine does not work for Bandin Dobah and does not need him. Dobah runs Formos; everyone doing business here pays his cut and answers to him. Except Caroth, who is the supply, and who could at any point decide Formos is not worth the trip."}, {"id": "f108", "t": "p", "x": "Dobah knows it. That is the entire relationship."}, {"id": "f109", "t": "p", "x": "So when Caroth's ship sets down — not for tribute, just to deliver — Dobah receives him personally, and it is the only version of Bandin Dobah the party will ever see that is not performing menace. It is the opposite. It is a man being careful."}, {"id": "f110", "t": "callout", "x": "GM NOTE — WHY THIS MATTERS\nDobah is the most feared man on this planet. The most valuable thing the party can walk away with from this scene is not a lead. It is having watched Dobah be afraid of somebody else.\n\nThey do not need to know why yet. They just need to have seen it happen."}, {"id": "f111", "t": "h3", "x": "However The Party Comes In"}, {"id": "f112", "t": "p", "x": "Loud: Caroth's people are already moving cargo up the ramp with the calm of men who have done this under worse conditions. Dobah is nowhere near the fighting — he is at the foot of that ramp trying to finish a conversation before his supplier leaves annoyed."}, {"id": "f113", "t": "p", "x": "Posing as buyers or negotiators: Dobah, wanting to look consequential, mentions he has a supplier to deal with today and asks the party to wait. They are seated close enough to watch him get smaller in real time."}, {"id": "f114", "t": "p", "x": "Quiet infiltration: Moving through the complex — looking for a terminal, a manifest, anything that says where people are being held — the party can end up with eyes on something not meant for them. A mid-level smuggler has been re-forging registries on Caroth's transponders and skimming the difference. Dobah caught him, and wants Caroth to watch him handle it personally. There is no trial."}, {"id": "f115", "t": "quote", "x": "There. Satisfied?"}, {"id": "f116", "t": "p", "x": "Caroth says nothing. He looks at Dobah the way a man looks at something he stepped in. Then he turns toward his ship."}, {"id": "f117", "t": "h3", "x": "The Ramp"}, {"id": "f118", "t": "p", "x": "However the party gets eyes on this, it ends the same way: Dobah at the foot of the boarding ramp, trying to renegotiate a delivery timeline he has no leverage to change."}, {"id": "f119", "t": "quote", "x": "So... we'll get the next shipment from Geonosis in a week?"}, {"id": "f120", "t": "p", "x": "Caroth does not turn around, but stops his ascent."}, {"id": "f121", "t": "quote", "x": "In a month."}, {"id": "f122", "t": "quote", "x": "A month? That would leave a giant gap in our product, how are we supposed to balance the books without that income, I—"}, {"id": "f123", "t": "p", "x": "Caroth turns his head to look back at the grovelling man."}, {"id": "f124", "t": "quote", "x": "That is not my concern."}, {"id": "f125", "t": "quote", "x": "But you're altering our deal!"}, {"id": "f126", "t": "quote", "x": "Pray I do not alter it further."}, {"id": "f127", "t": "p", "x": "He points a finger at Dobah, then turns and boards as the ramp begins to close. Geonosis is named plainly, from his own mouth. The party does not need to piece the operation's source together from fragments — that ambiguity is not the point of this scene. The point is watching him and not being able to touch him."}, {"id": "f128", "t": "h3", "x": "If Rinn Has Come Up"}, {"id": "f129", "t": "p", "x": "If the party has already found the Rinn datafile, or otherwise raised her name where Dobah can hear it, add the following exchange before Caroth boards. It costs nothing and it recontextualises everything the party thinks they know about the woman they are going to rescue."}, {"id": "f130", "t": "quote", "x": "When we negotiated this deal, your diplomat had a higher pedigree. Now I'm forced to deal with you. It begs the question: why am I forced to contend with your lack of professionalism, when the professional you had was the one I truly wanted to work with?"}, {"id": "f131", "t": "callout", "x": "GM NOTE — WHAT THAT LINE DOES\nFour things, in one breath.\n\nIt confirms Rinn's competence from the mouth of the most feared figure in the arc — she was not a victim who got in over her head, she was the professional Caroth actually wanted at the table. It diminishes Dobah again, in front of witnesses. It plants leverage the party can use later, on the asteroid or long after. And it is cold in precisely the right register: he is not defending her, he is complaining about the inconvenience of her absence.\n\nHe is capable of noticing someone's worth. He is incapable of doing anything about it without breaking cover. That is Boliphar Zentron, and nobody in the scene knows it."}, {"id": "f132", "t": "callout", "x": "THE ONE RULE\nThe party does not get a conversation with Caroth Blaine on this visit. If they try to force one — approach him directly, call out, put themselves between him and the door — he is already gone, or surrounded by enough of Dobah's people and his own quiet competence that closing the distance costs them something real.\n\nHe came to check on an arrangement, not to be found. He does not linger to be reached.\n\nBoliphar has spent twenty years building distance between himself and anyone who might recognise him. He does not know Zid is on Formos. If he did, and the mask stayed on anyway, that changes who he is. The party must leave this planet having felt Caroth Blaine as a presence, a reputation and a name attached to a location — never as a person they spoke to."}, {"id": "f133", "t": "pb", "x": ""}, {"id": "f134", "t": "h1", "x": "Act Four — The Kessel Run"}, {"id": "f135", "t": "p", "x": "The published adventure describes the journey to the asteroid as a short hyperspace trip, routine and uneventful. It is not, and the difference is the whole reason Dobah's fortress works."}, {"id": "f136", "t": "h2", "x": "Why The Asteroid Is Safe"}, {"id": "f137", "t": "p", "x": "The asteroid is not near the Kessel Run. It is inside it — deep in the asteroid-filled nebula the smugglers call the Pit, where the Run terminates before pilots break for Formos and the wider lanes. Gravitational shear, ion storms, black hole clusters, and no reliable charts."}, {"id": "f138", "t": "p", "x": "Dobah keeps the security light because the security is the nebula. Nobody is insane enough to come in here uninvited, and the handful who have tried are still in there somewhere. He is genuinely, comfortably secure in his little fortress, and that complacency is the only real weakness the party has to work with."}, {"id": "f139", "t": "h2", "x": "Getting There"}, {"id": "f140", "t": "p", "x": "The approach is a sequence of checks, not a cutscene. Scale to the party's assets."}, {"id": "f141", "t": "table", "x": "", "r": [["Asset", "Effect on the approach"], ["R4-W9 aboard", "Remove one difficulty upgrade. He is the most comprehensive Kessel Run analysis in the sector and he wants Dobah to suffer."], ["Zukata's survey charts", "Add one Boost die. Months of genuine current data, assembled for exactly this purpose."], ["Hondo Ohnaka aboard", "Remove one difficulty upgrade. He has run this corridor twice to lose pursuers and knows which channel skirts the point of no return."], ["Neither droid nor charts", "Daunting Astrogation. The party is guessing, in a nebula, in a stolen ship."]]}, {"id": "f142", "t": "p", "x": "Required checks, in order: a Hard Astrogation check to plot the jump, then a Hard Piloting (Space) check to hold the approach through the gravitational field."}, {"id": "f143", "t": "callout", "x": "GM NOTE — THE DESPAIR RESULT\nA Despair on either check drops the party out of hyperspace inside an active ion storm.\n\nThis is not a failed check with a consequence attached. It is a scene. The ship is coming apart around them — system strain accumulating each round, hull trauma on failures, instruments useless, and a pilot flying on nothing but nerve while somebody else fights the power couplings. Run it as a full sequence with the ship as the thing at risk rather than the crew.\n\nThey get out. The ship remembers it. If they are flying the Belligerent, it is armed and built for this and will survive better than anything they brought themselves. If they are flying their own ship, they will feel every point of it.\n\nThis is also, incidentally, exactly what happened to Godon Netakka. The party is experiencing the thing that put him in Dobah's debt."}, {"id": "f144", "t": "h2", "x": "The Asteroid, Seen From Outside"}, {"id": "f145", "t": "p", "x": "An Easy Computers check on the sensor array reveals the shape of the place:"}, {"id": "f146", "t": "list", "x": "Life forms in two of the caverns\nLarge metallic objects giving energy readouts in two caverns — likely spacecraft\nA sentry droid in orbit around the rock\nA heat signature on the surface: a pressure-shed, and starfighters on standby"}, {"id": "f147", "t": "p", "x": "The tunnels themselves were gnawed out by long-departed space slugs, and the walls are still slick with stringy ichor and lumps of black excreta. A pilot threading the tunnels makes a Hard Piloting (Space) check to avoid daubing the gunk over the hull — it is mildly corrosive and causes two points of hull trauma if not cleaned within a few days."}, {"id": "f148", "t": "callout", "x": "GM NOTE — SIX Z-TIEs, NOT ONE\nThe published adventure gives Dobah a single scavenged Z-TIE with one bored smuggler in it. This version gives him six, and the party can see them on the scan before committing to anything.\n\nThis is a deliberate risk-read. A party that scans and then chooses to go in loud has made an informed decision. A party that does not scan finds out the hard way. Either is fine — but the information is available, and the correct conclusion is that going in loud without the Belligerent's guns is a very bad idea.\n\nAlger Sodoth still commands the flight and is still overconfident. He now has five friends."}, {"id": "f149", "t": "pb", "x": ""}, {"id": "f150", "t": "h1", "x": "Act Five — Dobah's Asteroid"}, {"id": "f151", "t": "p", "x": "How the party handles the sentry droid determines how they meet Bandin Dobah. The published options survive intact; what changes is that each one now opens a different scene rather than the same fight with different lighting."}, {"id": "f152", "t": "h2", "x": "The Sentry Droid"}, {"id": "f153", "t": "table", "x": "", "r": [["Approach", "Method"], ["Broadcast the Pass", "The file from Daro's terminal. The droid stands down and signals Dobah that Daro Blunt has arrived."], ["Sneak past", "Wait for the droid to reach the far side, then run the tunnels fast. Hard Piloting (Space)."], ["Jam its comlink", "Average Computers, one action. It cannot call for help but will fight."], ["Destroy it", "Inside a single round it sends no warning. Longer than that and Dobah and Alger both know."]]}, {"id": "f154", "t": "h2", "x": "The Four Ways To Meet Dobah"}, {"id": "f155", "t": "h3", "x": "With the Pass — The Negotiation"}, {"id": "f156", "t": "p", "x": "The party docks unhindered as Daro Blunt's people, expected and unchallenged. Three of Dobah's human crew walk to the cargo bay to meet a delivery that is not coming."}, {"id": "f157", "t": "p", "x": "Selling it requires a Deception check, and the fiction writes itself: Daro sent them, there is a deal to discuss, the Few have an opportunity. Dobah is a businessman above all. He will listen to a deal."}, {"id": "f158", "t": "p", "x": "This is the approach that gets the party furthest into the asteroid before anyone reaches for a weapon, and it is the one with the most room for the party to find Rinn quietly while somebody keeps Dobah talking."}, {"id": "f159", "t": "h3", "x": "Sneaking — The Infiltration"}, {"id": "f160", "t": "p", "x": "The party comes in through the tunnels unannounced. There is no cellblock to find, because Dobah does not use one. What there is instead is a crew manifest — on a terminal, in an office, on the Vagrant itself — and the manifest has Rinn Achara's name and quarters assignment on it."}, {"id": "f161", "t": "p", "x": "Find the manifest, find the quarters, find her. Godon Netakka's name is on that manifest too."}, {"id": "f162", "t": "h3", "x": "Loud — Caroth Is Here"}, {"id": "f163", "t": "p", "x": "If the party comes in shooting, they arrive to find a second ship already docked and a masked figure in gold-metal armour finishing a transaction and visibly wanting to be elsewhere. Caroth Blaine does not want to be in a firefight on Bandin Dobah's asteroid. He wants his delivery signed off and his ship in the black."}, {"id": "f164", "t": "callout", "x": "GM NOTE — THE SECOND NEAR-MISS\nThis is the closest Zid will get to his father before Duro, and the rule from Act Three still holds: no conversation, no unmasking, no recognition.\n\nCaroth's priority is departure. He will not engage the party unless they make leaving impossible, and if they do, they are fighting a competent armoured professional who is trying to get to a ramp — not a man who wants to kill them. He leaves. He does not look back. He never learns who was in the room.\n\nIf the party tries to follow his ship, the nebula makes that decision for them."}, {"id": "f165", "t": "h3", "x": "With Hondo — The Broker"}, {"id": "f166", "t": "p", "x": "If Hondo Ohnaka is aboard, he will offer to handle Dobah personally, and he means it. He has dealt with worse than an Aqualish pirate and he genuinely enjoys this part."}, {"id": "f167", "t": "p", "x": "Hondo negotiating on the party's behalf gets them in the door, buys them time inside, and costs them exactly what Hondo always costs: a favour, a cut, or a future consideration to be named later. It is the smoothest available route and the party pays for it in obligations rather than blood."}, {"id": "f168", "t": "callout", "x": "GM NOTE — HONDO'S RECRUITMENT PAYS OFF HERE\nIf the party traded for the Belligerent and brought Hondo along, they now have: a ship built to survive the nebula, a pilot who has run this corridor before, and a negotiator Dobah has no history with.\n\nThat is a substantial mechanical reward for a scene that looked like a comic detour, and it should feel like one."}, {"id": "f169", "t": "h2", "x": "Bandin Dobah"}, {"id": "f170", "t": "p", "x": "Reckless, crude and aggressive, and now backed by real money. His belligerence earned him respect on Ando and a natural gang followed; his force of will compensated for a complete absence of charm. Age has mellowed him slightly and he no longer plies the lanes himself, but he has turned his resources into effective management of a network spanning the Kessel Run, conducted almost entirely through intermediaries like Daro Blunt."}, {"id": "f171", "t": "p", "x": "He rules by intimidation rather than loyalty. His crew obey him out of fear, and while the glitterstim and transponder profits keep flowing, that is sufficient. Once he is killed or disabled, they negotiate for their own lives immediately."}, {"id": "f172", "t": "p", "x": "His ship, the YV-666 Vagrant, is also his residence. Its main hyperdrive is broken and he has been lax about repairing it, because his agents come to him. Power cables run from the cargo bay to the cavern's pressure curtain generator and arc-light array, which means he cannot secure the ship and lift off without severing them."}, {"id": "f173", "t": "callout", "x": "GM NOTE — THE COMPLACENCY IS THE POINT\nA broken hyperdrive, a light patrol, a sentry droid, and a ship he cannot take off in without cutting his own power. On any other world this would be negligence.\n\nHere it is a man who has correctly assessed that the nebula does his security for him, and has stopped thinking about it. The party is the first crew crazy enough to arrive uninvited, and he has no contingency for that whatsoever."}, {"id": "f174", "t": "h2", "x": "Rinn Achara"}, {"id": "f175", "t": "p", "x": "The party will be expecting a cell. There isn't one."}, {"id": "f176", "t": "p", "x": "Rinn has quarters. She has food. She has a workstation and a set of accounts that need keeping, and Dobah's books have never been in better order. She is not shackled, not guarded, and not going anywhere, because she is a negotiator rather than a pilot and the asteroid sits inside a nebula that eats ships flown by people who know what they are doing."}, {"id": "f177", "t": "p", "x": "Dobah does not need a cell. The Kessel Run is the cell."}, {"id": "f178", "t": "read", "x": "She is at a desk when you find her, working. There is a cup beside her that has been cold for some time. The room is small and clean and has clearly been hers for a long while — there is nothing in it that suggests anyone expects her to leave.\n\nShe looks up. She does not look frightened. She takes in the weapons, the state of you, the fact that you are not anyone she has seen before on this rock, and something crosses her face that is not relief.\n\nHer hand moves, without hurry, and slides a datapad face-down under a stack of flimsi."}, {"id": "f179", "t": "callout", "x": "GM NOTE — THE DATAPAD\nIt reads Space Flight 101.\n\nGodon has been smuggling her flight manuals for months. Neither of them can leave alone — he cannot navigate the Run, and she cannot fly at all — so their entire plan is her learning enough to get a stolen ship out through the nebula. She is perhaps halfway there. Not close. Progressing.\n\nDobah has no idea. Nobody on this asteroid does. The party is the only other party who has ever seen that datapad, and whether they mention it, tease her about it, or quietly let her keep the secret is a real character moment for whoever is in the room.\n\nThe party's arrival is a chance to skip the rest of the manual entirely. She will understand that faster than they will."}, {"id": "f180", "t": "p", "x": "She is furious. Not broken, not grateful, not in need of convincing — she has had months to build this up and it has nowhere to go. Give her five minutes to compose herself and she will tell Derek everything she knows about the night on Alderaan, the drive changing hands, the name Ardyth Canvi, and a COMPNOR man in the corner with a note he stepped on."}, {"id": "f181", "t": "h3", "x": "What Rinn Knows About Caroth Blaine"}, {"id": "f182", "t": "p", "x": "If the party asks — and they may well not think to — Rinn negotiated directly with Caroth Blaine. More than once. She brokered the arrangement that made the Formos operation what it is."}, {"id": "f183", "t": "p", "x": "She liked him."}, {"id": "f184", "t": "p", "x": "Courteous, precise, straight-dealing. He kept his word, said what he meant, and never once tried to intimidate her or shave her margin. In a business full of men like Bandin Dobah, he was the only party to the whole arrangement who conducted himself like a professional. Her assessment is entirely genuine and entirely accurate."}, {"id": "f185", "t": "callout", "x": "GM NOTE — THE THING NOBODY CAN RECONCILE\nWhen the party tells her what Caroth Blaine is involved in — the ship-stripping, the Duros houses, the bodies — she will not be able to make it fit. And she will not be wrong to struggle, because she is the only person in this campaign who has met Boliphar Zentron and formed an accurate impression of him.\n\nEveryone else sees the mask managing Dobah. She sat across a table from the man.\n\nThere is no version of this conversation where anyone comes away satisfied. She cannot defend him without sounding naive; the party cannot convince her without her feeling like a fool for having liked him. Nobody in the room has the missing piece, and they will not get it until Duro.\n\nDo not resolve it. Let both sides be right and let it sit. If Zid ever tells her the truth — and he can, long after Duro — she is the one person in the galaxy owed that closure."}, {"id": "f186", "t": "h2", "x": "Godon Netakka"}, {"id": "f187", "t": "p", "x": "A young Rodian in battered bounty hunter armour, carrying a disruptor pistol, standing among Dobah's crew and not quite belonging there. Any character observing him can tell with a cursory glance that he is not at ease."}, {"id": "f188", "t": "p", "x": "The published adventure offers three ways to appeal to him — threats, shaming, or a better offer. All three still work mechanically, and all three are now beside the point."}, {"id": "f189", "t": "callout", "x": "GM NOTE — GODON IS ALREADY TURNED\nHe has been waiting years for enough leverage to move on Bandin Dobah, and one bounty hunter against the Formos Few was never going to be enough. He plays the part of a young hunter who lost his nerve because that performance is the only thing keeping Rinn Achara safe.\n\nSix armed strangers who just flew the Kessel Run uninvited and are clearly here for Rinn is a different equation entirely.\n\nHe will strike at the opportune moment — the point at which the party most needs it and least expects it. If they have connected him to Zukata, they can coordinate with him and plan around it. If they have not, his intervention lands as providence.\n\nMentioning his sister is still the lever. It is no longer a Charm check to change his mind; it is the confirmation he has been waiting for that these people are the real thing."}, {"id": "f190", "t": "p", "x": "If the party never speaks to him at all, he acts anyway. The difference is only whether they got to plan for it."}, {"id": "f191", "t": "h2", "x": "Inside the Vagrant"}, {"id": "f192", "t": "p", "x": "Runs as published. The cavern is a flat expanse of exposed rock with the pressure curtain generator tucked to one side and arc-lights on either flank. A pair of binary load lifters shuffle cargo and ignore the party completely."}, {"id": "f193", "t": "list", "x": "Three cargo pods, each holding two containers of glitterstim, rigged to destroy their contents if opened incorrectly — sloppily done, Easy Perception to spot, Average Mechanics to disarm\nFive cabins; the first mate's, Dobah's own with 530 credits in the desk, and three others holding nothing but personal effects\nA common room with a badly flickering dejarik table\nBoarding ramps and machine shop serving as the armoury — three blaster carbines, spare parts, shock gloves, an iron bludgeon\nCargo bay with a hidden floor compartment on a Hard Perception check: a container of glitterstim, 100 doses, 5,000 credits on the black market\nEscape pods, one of which Godon Netakka has been using as a cabin"}, {"id": "f194", "t": "p", "x": "Default crew positions, unless roused: the first mate in the cockpit, Dobah in his cabin, three human crew in the common room over caf, and Godon in the starboard escape pod."}, {"id": "f195", "t": "pb", "x": ""}, {"id": "f196", "t": "h1", "x": "Act Six — Getting Out"}, {"id": "f197", "t": "p", "x": "The party has what it came for, and now has to leave a fortress inside a nebula with whatever it has picked up along the way."}, {"id": "f198", "t": "h2", "x": "What Leaves With Them"}, {"id": "f199", "t": "table", "x": "", "r": [["Asset", "Consequence"], ["Rinn Achara", "Derek's chain continues. The full delegation roster, the drive changing hands, the name Ardyth Canvi, and a COMPNOR man with a crumpled note."], ["Godon Netakka", "Zukata gets her brother back. He is not staying on that rock a day longer than he has to."], ["Bandin Dobah, alive", "Two bounties, and a decision. Thakba Besadii Diori on Sleheyron pays 5,000 for him alive; Moruth Doole's office on Kessel owes 10,000 and will pay 2,300 of it. Both routes are available and neither is required."], ["Bandin Dobah, dead", "Thakba offers a compensatory 3,000 and will not negotiate. Doole's people dispute the corpse is even the right Aqualish."], ["Glitterstim", "Recoverable and saleable. Thakba buys with no questions at half rate, improvable on an Average Negotiation check."], ["The Formos Few, leaderless", "Whoever fills the vacuum on Formos is a GM decision, and the transponder trade does not stop because Dobah did."]]}, {"id": "f200", "t": "callout", "x": "GM NOTE — DO NOT REQUIRE THE BOUNTY RUN\nSleheyron and Kessel are both fully described in the published adventure and both are entirely optional here. This party has an Onderon convergence on a clock and no need for 10,000 credits from a Rybet administrator who intends to pay it in instalments over a Coruscant year.\n\nIf they want to go, the material is there. If they do not, nothing breaks. The cylinder Doole's officials hand over does contain an Imperial tracking beacon, discoverable on a Daunting Computers check, and a party that takes it without checking has made a mistake they will not notice for some time."}, {"id": "f201", "t": "h2", "x": "The Return to Formos"}, {"id": "f202", "t": "p", "x": "They have to come back — for their ship, for resupply, or because Zukata is waiting and they promised her."}, {"id": "f203", "t": "p", "x": "The reunion happens here. Rinn and Zukata, and Godon with his sister, in a spaceport neither of them ever expected to see the other in again. Play it quietly. Nobody in that scene needs dialogue written for them."}, {"id": "f204", "t": "callout", "x": "GM NOTE — DEREK'S AMBUSH\nAnd as the party moves through the dark alleys with Rinn in tow — dim lampposts, evening fog — a warning shot rings out.\n\nMaret Dunwall steps from the shadows. He has been investigating Praji's financial irregularities for months and he thinks he is watching a Rebel cell take a witness away for quiet execution.\n\n\"Wait... Derek? What the hell are you doing here?\"\n\nWhat happens next is entirely Derek's call. See the Derek Caabesk arc document — this is the collision that scene was written for, and it belongs at the very end of Formos, not in the middle of it."}, {"id": "f205", "t": "pb", "x": ""}, {"id": "f206", "t": "h1", "x": "Appendix — Threads Left Open"}, {"id": "f207", "t": "table", "x": "", "r": [["Thread", "Where it goes"], ["Geonosis", "Named aloud by Caroth Blaine. The stripping station in the ring system is the next beat of Zid's arc, and Verelin makes a personal inspection while the party is inside it."], ["Caroth Blaine", "Two near-misses on Formos and no conversation. The mask comes off on Duro, and not before."], ["Rinn on Caroth", "Unreconciled, deliberately. Available to Zid as a character profile of a man he does not yet know is his father."], ["Rinn's memory", "Derek's directory. She delivers the delegation roster and points, indirectly, at both Cracken and Maret Dunwall."], ["The Dauntless Capitalism", "Guy now knows Kalifa Frey owns it and operates out of Maldra IV. The Jewel of Yavin follows."], ["The Obfuscating Belligerent", "Hondo, the Mad Mynock's stolen transponder, and the Zentron connection buried underneath it."], ["The Formos Few", "A criminal organisation with a hole where its leadership was, and a transponder supply chain still running."], ["Godon and Zukata", "Two people who owe the party something they will never be able to repay, and a freight brokerage that could be rebuilt."]]}, {"id": "f208", "t": "div", "x": ""}, {"id": "f209", "t": "p", "x": "Nobody who came to this planet found what they were looking for. All of them found something that mattered more."}], "body": "Trouble Brewing\n\nPirates? Smugglers? We don't have any of them on Formos.\n— Lieutenant Pavan, Formos Garrison\n\nFormos is a backwater world in the Outer Rim, unremarkable except for where it sits: the junction of the Pabol Sleheyron and the Triellus Trade Route, and the near end of the Kessel Run. That accident of geography has made it a haven for smugglers, spacers and scum, and it is the reason four separate threads in this campaign all terminate here without any of the people pulling them knowing about the others.\n\nThis adventure adapts the introductory scenario from the Edge of the Empire Core Rulebook. The spine is intact — the dying droid, the cantina, the smuggling gang, the asteroid — but Bandin Dobah has been scaled up considerably, his operation has been given a paymaster, and the people the party finds at the far end of the Kessel Run are no longer strangers.\n\nWHAT THIS DOCUMENT IS\nA side-mission beat of the main story, run at the party's discretion during the downtime before the Onderon convergence. It is not on the critical path. Nothing in the main story requires it.\n\nWhat it does contain is the intersection of three Obligation Arcs, and the party will not realise that until they are standing in the middle of it. Derek is looking for a witness. Guy is looking for a ship. Zid is following a name. All three are on this rock, and only the GM knows that when the session begins.\n\nThe Four Ways In\n\nAny one of the following gets the party to Formos. The others activate on arrival, whether or not the party is looking for them.\n\nGM NOTE — THE BEACON IS PASSIVE\nZid does not choose to come to Formos. He does not have to. Whatever brings the party in-system, the beacon fires on arrival, and a signal he has been chasing his entire life turns out to be attached to the wrong ship and a pirate who has no idea what he is carrying.\n\nIf the party arrives for Derek's reasons or Guy's, this is the moment Zid's arc ambushes him. Let it.\n\nBackground: What Is Actually Happening Here\n\nFor the GM only. The party will assemble most of this across the adventure, in the wrong order, from four different directions.\n\nBandin Dobah, Scaled Up\n\nThe published Dobah is a mid-tier Aqualish pirate muscling in on contraband movement through one spaceport. That is where he started. He is now something considerably worse, because roughly two years ago he acquired a paymaster.\n\nDobah controls Formos. Not the spaceport — the planet. Everything that moves through the system moves with his knowledge and pays his margin. He still works through gangs and intermediaries and hired bounty hunters, because that is how he has always worked, but the network is wider and better funded and the people in it are professionals now rather than street toughs. They call themselves the Formos Few.\n\nTwo bounties remain on his head: Moruth Doole's Imperial reward of 10,000 credits, and a smaller one from the Hutt kingpin Thakba Besadii Diori. Both are common knowledge. Neither has been collected, because collecting it means finding him, and nobody can.\n\nGM NOTE — THE BOUNTY IS SET DRESSING\nThe published adventure runs on the bounty as motivation. This version does not. The party is not here for a payday, and the holoscreen bounty notice in the cantina exists to tell them who runs this planet, not to give them a job.\n\nIt does explain why two rival syndicates are on-planet at the same time as the party — see Act Two, The Hangar Standoff — and it is why Godon Netakka originally came here. Everyone else in the galaxy thinks this is a bounty story. It isn't.\n\nThe IFF Operation\n\nSomebody has been acquiring Duros family ship registries, stripping their IFF transponders, and selling the hulls and the identities separately. The hulls go to legitimate salvage through ZenCorp Industries. The transponders go onto the black market through a masked intermediary called Caroth Blaine.\n\nA stolen IFF transponder lets a ship be something other than itself. For a smuggling operation running the Kessel Run under constant Imperial patrol, that is not a luxury — it is the entire business model. Half of the Formos Few's traffic moves under identities that belong to dead Duros houses.\n\nThis is why Dobah defers to Caroth Blaine and to nobody else in the galaxy. Caroth is the supply. Dobah is a customer with no alternative supplier.\n\nGM NOTE — WHAT CAROTH BLAINE ACTUALLY IS\nBoliphar Zentron. Zid's father. Twenty years behind a human-seeming mask, running an Imperial-facing cover identity to fund the recovery of the Eye of the Stars, doing ZenCorp's dirtiest work on the orders of a son who does not recognise him.\n\nNothing in this adventure reveals that. Nothing in this adventure should come close. Caroth Blaine is a presence, a reputation and a name attached to Geonosis. The reveal belongs on Duro, and it is worth more the longer it waits.\n\nRinn Achara, Zukata and Godon Netakka\n\nRinn Achara and Zukata built a freight brokerage together. Legitimate, well-run, profitable — and, being legitimate on Formos, a target. Smugglers began skimming their shipments and there was no authority on the planet that would do anything about it.\n\nSo Rinn did what a negotiator does. She went to Bandin Dobah and made a deal: she would broker new beneficiaries into his transponder trade, using her contacts and her considerable skill at a table, and in exchange he would stop hitting her shipments. Zukata thought it was a catastrophic mistake and said so. Rinn did it anyway.\n\nIt worked, briefly. Rinn brokered the arrangement between Dobah and Caroth Blaine that made the Formos operation what it is now. And as the credits began arriving in volume, Dobah did the arithmetic and concluded he no longer needed a broker taking a cut of it. He pushed her out. She fought back — and she was very good at that too, which is exactly why he could not simply leave her in place.\n\nHe took her to the asteroid instead. She has been there ever since. Zukata does not know where she is, only that she is gone, and has been widening her search for months under cover of an atlas survey contract.\n\nGodon Netakka is Zukata's brother. When Rinn disappeared, Zukata intended to go after her herself. Godon — a young Rodian bounty hunter, badly in debt, in over his head — went instead, because he knew perfectly well that his sister would be killed doing it. He flew into the Kessel Run alone. An ion storm took his ship apart around him and left it derelict.\n\nBandin Dobah pulled him out. And Godon, who came here to take Dobah in, found himself alive because of the man, and — far more to the point — found Rinn on the same rock. So he stayed. He has been in Dobah's crew for months, playing the part of a young hunter who lost his nerve and took the easier road, because as long as he is on that asteroid, there is one person standing between Rinn Achara and Bandin Dobah.\n\nGM NOTE — GODON IS NOT COMPROMISED\nThe published adventure has Godon inexplicably talked out of his duty by a man he came to arrest, and it never quite convinces. This version explains it exactly: Dobah saved his life, and Rinn is here.\n\nHe is not conflicted about which side he is on. He has been waiting years for enough leverage to move, and one bounty hunter against the Formos Few is not leverage — it is a funeral. He plays it cool because playing it cool is the only thing keeping Rinn safe. When the odds change, he moves immediately.\n\nGodon has also been smuggling Rinn flight manuals. He cannot navigate the Kessel Run — that is what wrecked him — and Rinn is a negotiator, not a pilot. Neither of them can leave alone. Their entire escape plan is Rinn learning to fly well enough to get a stolen ship through the nebula, and she is perhaps halfway there.\n\nWhich is where the party comes in.\n\nAct One — The Formos Spaceport\n\nThe party lands, the planet is unpleasant, and the plot finds them within the hour.\n\nLanding on Formos\n\nA Limited Services Port: a wide expanse of duracrete, a small control tower, sheds for docking and storage. Fees are trivial and a smuggler can talk them lower.\n\nAs soon as you set foot on the planet, you are instantly struck by the stale and parched atmosphere of Formos. The air is breathable, but desiccated despite the cool climate. Most species begin to feel thirsty shortly after landing, and those used to life on humid worlds soon feel dehydrated and uncomfortable. You notice that species with an aquatic heritage — such as Aqualish, Mon Calamari, and Herglic — are notably absent from those who make a home here.\n\nThankfully, water sellers are a common sight patrolling the streets and docks, though the prices they advertise would be considered extortionate on most habitable worlds.\n\nGM NOTE — SKIP THE OPTIONAL ENCOUNTERS\nThe published adventure offers five colour encounters — the water seller, the Tritonite missionary, Mama Nobah and her pickpocket son, Vreebo Gango, Lei Muoroy. This version uses none of them as scenes.\n\nWater sellers and the general texture of the place stay as background description. Everything else is cut. The party has four live threads on this planet and does not need a red herring extortion racket competing for session time.\n\nThe Imperial Presence\n\nEighteen Imperial Army Troopers in a fortified barracks, two of them squad sergeants. They are a gesture, not a garrison. The unspoken arrangement is that the troopers do not lean on the smuggling operations and the locals do not attack the troopers, and both sides find this preferable to the alternative.\n\nThey will not trouble the party unless the party troubles them first. The barracks holds a pair of E-Web repeating blasters and an antiquated Atgar 1.4 FD P-Tower on the roof, which theoretically can shoot down illicit transports and never has.\n\nGM NOTE — WHY THE EMPIRE TOLERATES DOBAH\nA question a clever party will ask. The answer is that the Formos Few move under stolen Duros IFF transponders, which means that on paper, most of the traffic through this system is legitimate registered shipping belonging to real houses.\n\nThe Empire is not being bribed. It is being lied to, systematically, with paperwork good enough to survive a cursory glance — and there is nobody on Formos with the authority or interest to look harder. This is the operation the party is about to start unravelling.\n\nThe Sad Fate of J9-B8\n\nRuns as published, and it remains the on-ramp regardless of which thread brought the party here.\n\nThe disorderly jumble of hastily constructed dwellings around the cantina makes for a maze of tight alleyways filled with all manner of obstruction. Portable trash compactors, piles of crates, and personal moisture condensers line the gangways that thread between houses and shops.\n\nAs you pass a particularly dark and narrow alleyway nestled between a pair of towering warehouses, you hear a commotion. There is a loud rattle and a buzzing noise coming from within the alley. The rattling stops, and you hear a low and monotonous voice calling out. The voice is buzzing and faint, but you can still hear: \"Hello! Bzzzt! Help pleazzze! I need help!\"\n\nJ9-B8 is a manumitted 3PO-variant protocol droid, beyond repair, with minutes of function left. His companion R4-W9 — an astromech carrying a comprehensive navigational analysis of the Kessel Run — was taken by hooded thugs about twenty hours ago. He does not know who they were. He suspects Bandin Dobah, whose people have been muscling in on Kessel Run operations for months.\n\nMechanics cannot save him. Characters who try can make him comfortable, and nothing else.\n\nGM NOTE — R4-W9 MATTERS MORE HERE THAN IN THE BOOK\nIn the published adventure R4-W9 is a plot device that points at an asteroid. In this version he is also the only comprehensive Kessel Run navigational analysis in the sector, and the Kessel Run is now a genuine hazard with dice attached to it (see Act Three).\n\nFreeing R4-W9 is not optional flavour. It is the difference between a difficult approach and a very dangerous one.\n\nAct Two — Rii Jenks' Cantina\n\nThe information hub, and the point at which the party may begin to notice that more than one of them has business on this rock.\n\nAs you enter the lobby of the cantina, you are aware of a change in atmosphere. The air conditioning alone is almost as refreshing as the beverages served at the well-appointed bar promise to be. The cantina is clearly a popular spot for locals to mix, though it isn't so crowded as to make it impossible for you to get seats. All manner of humans and aliens rub shoulders at the bar, and they even seem happy to let droids in. To your right, a flickering holoscreen displays the rotating head of a tough-looking adult male Aqualish, with scrolling text advertising an Imperial bounty.\n\nRii Jenks is a canny old Bith who keeps Imperial agents and Hutt kingpins sweet with bribes and information, and stays on the right side of the smuggling community by making sure none of the information he sells conflicts with their interests. Fia Mund plays freeform jatz on the raised stage. The place is a genuine sanctuary and everyone in it knows better than to discuss business aloud.\n\nWhat Each Thread Finds\n\nSnoo, Information Broker\n\nA Devaronian who will take one non-droid character aside for 50 credits, bargainable to 20 on an Average Charm, Coercion or Deception check. He sells the shape of the operation, as published, with one addition: the gang the party will shortly meet has a name, and calling them a gang undersells them.\n\nFormos rewards those who know contraband and bounty work, but strangers get nothing until they earn standing\nThe Formos Few operate on a franchise model — cells of four to ten, each relying on the others, with Dobah's own cell at the top taking a cut of everything\nDroidnapping is entirely within Dobah's character, though Snoo has heard nothing specific\nThe Empire's 10,000 is not the only bounty; Thakba Besadii Diori has offered 5,000 for Dobah alive\nA Rodian bounty hunter came through some weeks back on Dobah's trail and has not been heard from since\n\nGM NOTE — THE RODIAN\nThat last line is Godon. Snoo assumes he is dead. He is not, and the party will meet him on the asteroid in Dobah's crew.\n\nIf the party has already met Zukata when Snoo mentions this, they may connect it. If they have not, the line should pass as ordinary background — one more person who went after Dobah and disappeared.\n\nZukata\n\nAn elegant Rodian woman enters the bar, orders food and drink, and draws appreciative glances. She wears green satin with brass accessories and carries a purse shaped to conceal a holdout blaster. Moments later three of Dobah's people saunter in — Daro Blunt, Spir Fraxis, and the Weequay Gut-Guro — and a hush falls over the room.\n\nSpir takes an immediate and unpleasant interest in her. She rejects him politely in Rodian, which he does not speak and would ignore if he did. She is uncomfortable, lacks the confidence to make a scene, and begins looking around the bar for a reason to excuse herself.\n\nThe confrontation resolves exactly as published — the party can stay out of it, talk Spir down, trade insults, or start a fight. Daro leaves before it gets serious either way, and the GM should ensure he escapes with minor injuries and that Zukata is unharmed.\n\nGM NOTE — THIS IS THE MOST IMPORTANT SCENE IN ACT TWO\nIn the published adventure, helping Zukata earns the party a grateful stranger with 2,000 credits to spend on droid data and a missing brother she is coy about.\n\nIn this version she is Rinn Achara's partner and the co-founder of the brokerage Dobah destroyed. She is the reason the party can survive the Kessel Run, and she is sitting on the other half of Derek's investigation.\n\nShe will not volunteer any of it. She has been looking for Rinn for months on a world owned by the man who took her, and the last person she trusted with a plan was Rinn herself, who made a deal with Dobah against her advice and vanished. Trust has to be earned here, and the party has to actually give her a reason.\n\nWhat Zukata Gives, and When\n\nGM NOTE — LETTING THE CONVERGENCE HIDE\nIt is entirely possible — and genuinely better — for the party not to realise that Derek's witness and Zukata's missing partner are the same woman until late.\n\nDerek is looking for a name. Zukata is grieving a person. Nobody uses both halves of the information in the same sentence unless the party puts them together. If they do not, Godon's intervention on the asteroid will look like providence, and Zukata's reunion with Rinn will land as a genuine surprise rather than a scheduled payoff. Do not help the players make this connection. Let them earn it or be blindsided by it.\n\nZukata Wants To Come\n\nOnce she knows the party is going into the Kessel Run, she will insist on coming, and she will not be casual about it. She has spent months on a hostile world trying to reach the one place she cannot reach, and a crew of armed strangers has just walked in with a ship and a reason to go.\n\nShe is also a negotiator and an atlas surveyor, not a combatant, and the asteroid is a fortress inside a nebula. Talking her into staying is a genuine social scene — Charm, Negotiation or Deception, opposed by a woman who has every reason to be there and knows it. Promising to bring Rinn back is what wins it, and the party should feel the weight of having promised it.\n\nZalg and Daro's Gang\n\nZalg the Toydarian eavesdrops on the party's conversation with Zukata and, if not stopped, sells everything he heard to Daro Blunt for twenty credits. The party can spot him on an Average Perception check and shadow him on Average Stealth, exactly as published — either to the smugglers' warehouse or to Daro directly.\n\nIf they take no action, Daro musters the Few and comes looking for them roughly half an hour after Zalg leaves the cantina.\n\nAct Two, Continued — The Formos Few\n\nThe published adventure calls this a safe house. It is considerably more than that now.\n\nThe Complex\n\nA warehouse compound on the edge of the spaceport, refurbished properly rather than briskly. Living quarters for a dozen. A secured cargo floor. Two droid guards on the interior, and more available if the alarm goes up.\n\nThe party can take the complex the hard way, or with significant advantage if they arrive before Daro has mustered — in which case the gang is unequipped and out of position, as published.\n\nWhat Is On The Cargo Floor\n\nShipping crates of glitterstim, rigged to destroy their contents if opened incorrectly — Easy Perception to notice the rigging, Average Mechanics to disarm\nA reinforced cabinet holding tools, 235 credits, and the gang's spare weapons\nSpent IFF transponder cartridges, discarded in a bin at the back of the floor — identifiable on a Piloting (Space) or Knowledge (Education) check as transponder modules, stripped and burned out\n\nGM NOTE — THE CARTRIDGES ARE ZID'S FIRST PHYSICAL PROOF\nZob Anoor gave Zid a name and a description. This is the first time Zid puts his hands on the actual product.\n\nA character who makes the check knows what these are: identity modules pulled out of real ships and run until they burned. There are dozens of them. Whatever this operation is, it is not small, and it is not new.\n\nR4-W9\n\nThe astromech stands inactive in a corner, a heavy iron restraining bolt fitted to his chassis, panels removed, wired to a portable computer whose screen reads \"Configuration complete — coordinates compatible.\"\n\nThe bolt can be removed with the tool from Daro's backpack, or on an Average Mechanics check, or forced off with a lever at the cost of three wounds to the droid. Freed, he communicates in bleeping machine language with a holographic projector for illustration, and his first concern is J9-B8.\n\nHe has been uploaded with coordinates to a large asteroid inside the Kessel Run, and he will offer to come along.\n\nThe Terminal\n\nThe portable computer R4-W9 is wired into is the single most valuable object in Act Two. An Average Computers check opens it. Three Advantage or better opens the additional file named \"Pass\" — a short-wave broadcast pattern, and the sentry droid passcode.\n\nWhat else is on it:\n\nGM NOTE — THE RINN DATAFILE\nThis is where Derek's investigation and Zid's collide, in writing, in one document, and neither player will have expected it.\n\nThe file is Dobah's own record of the arrangement: Rinn Achara, freight broker, approached the organisation after sustained losses to skimming. Terms agreed — she brokers new beneficiaries into the transponder trade using her contacts, the Few stop hitting her shipments. Her brokerage is credited with introducing the Caroth Blaine account.\n\nSubsequent entries are terse and revealing. Her margin is queried. Her margin is reduced. Her margin is discontinued. There is a note about her becoming difficult, and then a note about relocation to the asteroid facility, and then nothing further except her ongoing assignment to the operation's accounts.\n\nDerek came here looking for a witness to a party on Alderaan. He has found a woman who built the thing Zid is trying to destroy, and who is being held for having objected to how she was treated for it. Let both players read it.\n\nThe Hangar Standoff\n\nGuy's thread, and it can fire at any point once the party has been asking about the Dauntless Capitalism.\n\nLeyo Prim arrives at the hangar with Crimson Dawn muscle — one rung beneath Qi'ra, hunting Dobah's bounty, and delighted to find Guy Rando standing in the same place he is.\n\nWell colour me a gundark and call me Jabba — if it ain't Guy Rando himself. Right here, searchin' what I'm searchin'. Anyone else think that's a great little coinky-dink?\n\nA second door opens. Cul Gorrak enters with Desilijic kajidic muscle, hunting the same bounty, equally delighted.\n\nLeyo Prim, as I live and breathe. Oh, and Guy Rando! Well whaddaya know — it must be my birthday or somethin'.\n\nNeither of them is here for Guy. Both of them will take him if he is convenient. They are here because Bandin Dobah is worth 15,000 credits between two bounties and neither syndicate intends to let the other collect.\n\nPrim and Gorrak both run the moment it turns serious, leaving their enforcers to die for a bounty neither man was willing to bleed for. Play it as comic and slightly pathetic — two men who talk like they own the underworld, sprinting for the door.\n\nGM NOTE — THE STANDOFF IS ALSO INTELLIGENCE\nThe syndicates already know Dobah's Formos presence is a front. They are here because they cannot find him either.\n\nA party paying attention learns something useful from watching two professional outfits fail at the same problem: whatever is on Formos is not where Dobah lives.\n\nAct Three — Caroth Blaine Comes to Formos\n\nZid's thread. This scene can be triggered at the GM's discretion at any point in Act Two, and it works from any angle the party happens to be approaching from.\n\nThe Man Who Doesn't Need Dobah\n\nCaroth Blaine does not work for Bandin Dobah and does not need him. Dobah runs Formos; everyone doing business here pays his cut and answers to him. Except Caroth, who is the supply, and who could at any point decide Formos is not worth the trip.\n\nDobah knows it. That is the entire relationship.\n\nSo when Caroth's ship sets down — not for tribute, just to deliver — Dobah receives him personally, and it is the only version of Bandin Dobah the party will ever see that is not performing menace. It is the opposite. It is a man being careful.\n\nGM NOTE — WHY THIS MATTERS\nDobah is the most feared man on this planet. The most valuable thing the party can walk away with from this scene is not a lead. It is having watched Dobah be afraid of somebody else.\n\nThey do not need to know why yet. They just need to have seen it happen.\n\nHowever The Party Comes In\n\nLoud: Caroth's people are already moving cargo up the ramp with the calm of men who have done this under worse conditions. Dobah is nowhere near the fighting — he is at the foot of that ramp trying to finish a conversation before his supplier leaves annoyed.\n\nPosing as buyers or negotiators: Dobah, wanting to look consequential, mentions he has a supplier to deal with today and asks the party to wait. They are seated close enough to watch him get smaller in real time.\n\nQuiet infiltration: Moving through the complex — looking for a terminal, a manifest, anything that says where people are being held — the party can end up with eyes on something not meant for them. A mid-level smuggler has been re-forging registries on Caroth's transponders and skimming the difference. Dobah caught him, and wants Caroth to watch him handle it personally. There is no trial.\n\nThere. Satisfied?\n\nCaroth says nothing. He looks at Dobah the way a man looks at something he stepped in. Then he turns toward his ship.\n\nThe Ramp\n\nHowever the party gets eyes on this, it ends the same way: Dobah at the foot of the boarding ramp, trying to renegotiate a delivery timeline he has no leverage to change.\n\nSo... we'll get the next shipment from Geonosis in a week?\n\nCaroth does not turn around, but stops his ascent.\n\nIn a month.\n\nA month? That would leave a giant gap in our product, how are we supposed to balance the books without that income, I—\n\nCaroth turns his head to look back at the grovelling man.\n\nThat is not my concern.\n\nBut you're altering our deal!\n\nPray I do not alter it further.\n\nHe points a finger at Dobah, then turns and boards as the ramp begins to close. Geonosis is named plainly, from his own mouth. The party does not need to piece the operation's source together from fragments — that ambiguity is not the point of this scene. The point is watching him and not being able to touch him.\n\nIf Rinn Has Come Up\n\nIf the party has already found the Rinn datafile, or otherwise raised her name where Dobah can hear it, add the following exchange before Caroth boards. It costs nothing and it recontextualises everything the party thinks they know about the woman they are going to rescue.\n\nWhen we negotiated this deal, your diplomat had a higher pedigree. Now I'm forced to deal with you. It begs the question: why am I forced to contend with your lack of professionalism, when the professional you had was the one I truly wanted to work with?\n\nGM NOTE — WHAT THAT LINE DOES\nFour things, in one breath.\n\nIt confirms Rinn's competence from the mouth of the most feared figure in the arc — she was not a victim who got in over her head, she was the professional Caroth actually wanted at the table. It diminishes Dobah again, in front of witnesses. It plants leverage the party can use later, on the asteroid or long after. And it is cold in precisely the right register: he is not defending her, he is complaining about the inconvenience of her absence.\n\nHe is capable of noticing someone's worth. He is incapable of doing anything about it without breaking cover. That is Boliphar Zentron, and nobody in the scene knows it.\n\nTHE ONE RULE\nThe party does not get a conversation with Caroth Blaine on this visit. If they try to force one — approach him directly, call out, put themselves between him and the door — he is already gone, or surrounded by enough of Dobah's people and his own quiet competence that closing the distance costs them something real.\n\nHe came to check on an arrangement, not to be found. He does not linger to be reached.\n\nBoliphar has spent twenty years building distance between himself and anyone who might recognise him. He does not know Zid is on Formos. If he did, and the mask stayed on anyway, that changes who he is. The party must leave this planet having felt Caroth Blaine as a presence, a reputation and a name attached to a location — never as a person they spoke to.\n\nAct Four — The Kessel Run\n\nThe published adventure describes the journey to the asteroid as a short hyperspace trip, routine and uneventful. It is not, and the difference is the whole reason Dobah's fortress works.\n\nWhy The Asteroid Is Safe\n\nThe asteroid is not near the Kessel Run. It is inside it — deep in the asteroid-filled nebula the smugglers call the Pit, where the Run terminates before pilots break for Formos and the wider lanes. Gravitational shear, ion storms, black hole clusters, and no reliable charts.\n\nDobah keeps the security light because the security is the nebula. Nobody is insane enough to come in here uninvited, and the handful who have tried are still in there somewhere. He is genuinely, comfortably secure in his little fortress, and that complacency is the only real weakness the party has to work with.\n\nGetting There\n\nThe approach is a sequence of checks, not a cutscene. Scale to the party's assets.\n\nRequired checks, in order: a Hard Astrogation check to plot the jump, then a Hard Piloting (Space) check to hold the approach through the gravitational field.\n\nGM NOTE — THE DESPAIR RESULT\nA Despair on either check drops the party out of hyperspace inside an active ion storm.\n\nThis is not a failed check with a consequence attached. It is a scene. The ship is coming apart around them — system strain accumulating each round, hull trauma on failures, instruments useless, and a pilot flying on nothing but nerve while somebody else fights the power couplings. Run it as a full sequence with the ship as the thing at risk rather than the crew.\n\nThey get out. The ship remembers it. If they are flying the Belligerent, it is armed and built for this and will survive better than anything they brought themselves. If they are flying their own ship, they will feel every point of it.\n\nThis is also, incidentally, exactly what happened to Godon Netakka. The party is experiencing the thing that put him in Dobah's debt.\n\nThe Asteroid, Seen From Outside\n\nAn Easy Computers check on the sensor array reveals the shape of the place:\n\nLife forms in two of the caverns\nLarge metallic objects giving energy readouts in two caverns — likely spacecraft\nA sentry droid in orbit around the rock\nA heat signature on the surface: a pressure-shed, and starfighters on standby\n\nThe tunnels themselves were gnawed out by long-departed space slugs, and the walls are still slick with stringy ichor and lumps of black excreta. A pilot threading the tunnels makes a Hard Piloting (Space) check to avoid daubing the gunk over the hull — it is mildly corrosive and causes two points of hull trauma if not cleaned within a few days.\n\nGM NOTE — SIX Z-TIEs, NOT ONE\nThe published adventure gives Dobah a single scavenged Z-TIE with one bored smuggler in it. This version gives him six, and the party can see them on the scan before committing to anything.\n\nThis is a deliberate risk-read. A party that scans and then chooses to go in loud has made an informed decision. A party that does not scan finds out the hard way. Either is fine — but the information is available, and the correct conclusion is that going in loud without the Belligerent's guns is a very bad idea.\n\nAlger Sodoth still commands the flight and is still overconfident. He now has five friends.\n\nAct Five — Dobah's Asteroid\n\nHow the party handles the sentry droid determines how they meet Bandin Dobah. The published options survive intact; what changes is that each one now opens a different scene rather than the same fight with different lighting.\n\nThe Sentry Droid\n\nThe Four Ways To Meet Dobah\n\nWith the Pass — The Negotiation\n\nThe party docks unhindered as Daro Blunt's people, expected and unchallenged. Three of Dobah's human crew walk to the cargo bay to meet a delivery that is not coming.\n\nSelling it requires a Deception check, and the fiction writes itself: Daro sent them, there is a deal to discuss, the Few have an opportunity. Dobah is a businessman above all. He will listen to a deal.\n\nThis is the approach that gets the party furthest into the asteroid before anyone reaches for a weapon, and it is the one with the most room for the party to find Rinn quietly while somebody keeps Dobah talking.\n\nSneaking — The Infiltration\n\nThe party comes in through the tunnels unannounced. There is no cellblock to find, because Dobah does not use one. What there is instead is a crew manifest — on a terminal, in an office, on the Vagrant itself — and the manifest has Rinn Achara's name and quarters assignment on it.\n\nFind the manifest, find the quarters, find her. Godon Netakka's name is on that manifest too.\n\nLoud — Caroth Is Here\n\nIf the party comes in shooting, they arrive to find a second ship already docked and a masked figure in gold-metal armour finishing a transaction and visibly wanting to be elsewhere. Caroth Blaine does not want to be in a firefight on Bandin Dobah's asteroid. He wants his delivery signed off and his ship in the black.\n\nGM NOTE — THE SECOND NEAR-MISS\nThis is the closest Zid will get to his father before Duro, and the rule from Act Three still holds: no conversation, no unmasking, no recognition.\n\nCaroth's priority is departure. He will not engage the party unless they make leaving impossible, and if they do, they are fighting a competent armoured professional who is trying to get to a ramp — not a man who wants to kill them. He leaves. He does not look back. He never learns who was in the room.\n\nIf the party tries to follow his ship, the nebula makes that decision for them.\n\nWith Hondo — The Broker\n\nIf Hondo Ohnaka is aboard, he will offer to handle Dobah personally, and he means it. He has dealt with worse than an Aqualish pirate and he genuinely enjoys this part.\n\nHondo negotiating on the party's behalf gets them in the door, buys them time inside, and costs them exactly what Hondo always costs: a favour, a cut, or a future consideration to be named later. It is the smoothest available route and the party pays for it in obligations rather than blood.\n\nGM NOTE — HONDO'S RECRUITMENT PAYS OFF HERE\nIf the party traded for the Belligerent and brought Hondo along, they now have: a ship built to survive the nebula, a pilot who has run this corridor before, and a negotiator Dobah has no history with.\n\nThat is a substantial mechanical reward for a scene that looked like a comic detour, and it should feel like one.\n\nBandin Dobah\n\nReckless, crude and aggressive, and now backed by real money. His belligerence earned him respect on Ando and a natural gang followed; his force of will compensated for a complete absence of charm. Age has mellowed him slightly and he no longer plies the lanes himself, but he has turned his resources into effective management of a network spanning the Kessel Run, conducted almost entirely through intermediaries like Daro Blunt.\n\nHe rules by intimidation rather than loyalty. His crew obey him out of fear, and while the glitterstim and transponder profits keep flowing, that is sufficient. Once he is killed or disabled, they negotiate for their own lives immediately.\n\nHis ship, the YV-666 Vagrant, is also his residence. Its main hyperdrive is broken and he has been lax about repairing it, because his agents come to him. Power cables run from the cargo bay to the cavern's pressure curtain generator and arc-light array, which means he cannot secure the ship and lift off without severing them.\n\nGM NOTE — THE COMPLACENCY IS THE POINT\nA broken hyperdrive, a light patrol, a sentry droid, and a ship he cannot take off in without cutting his own power. On any other world this would be negligence.\n\nHere it is a man who has correctly assessed that the nebula does his security for him, and has stopped thinking about it. The party is the first crew crazy enough to arrive uninvited, and he has no contingency for that whatsoever.\n\nRinn Achara\n\nThe party will be expecting a cell. There isn't one.\n\nRinn has quarters. She has food. She has a workstation and a set of accounts that need keeping, and Dobah's books have never been in better order. She is not shackled, not guarded, and not going anywhere, because she is a negotiator rather than a pilot and the asteroid sits inside a nebula that eats ships flown by people who know what they are doing.\n\nDobah does not need a cell. The Kessel Run is the cell.\n\nShe is at a desk when you find her, working. There is a cup beside her that has been cold for some time. The room is small and clean and has clearly been hers for a long while — there is nothing in it that suggests anyone expects her to leave.\n\nShe looks up. She does not look frightened. She takes in the weapons, the state of you, the fact that you are not anyone she has seen before on this rock, and something crosses her face that is not relief.\n\nHer hand moves, without hurry, and slides a datapad face-down under a stack of flimsi.\n\nGM NOTE — THE DATAPAD\nIt reads Space Flight 101.\n\nGodon has been smuggling her flight manuals for months. Neither of them can leave alone — he cannot navigate the Run, and she cannot fly at all — so their entire plan is her learning enough to get a stolen ship out through the nebula. She is perhaps halfway there. Not close. Progressing.\n\nDobah has no idea. Nobody on this asteroid does. The party is the only other party who has ever seen that datapad, and whether they mention it, tease her about it, or quietly let her keep the secret is a real character moment for whoever is in the room.\n\nThe party's arrival is a chance to skip the rest of the manual entirely. She will understand that faster than they will.\n\nShe is furious. Not broken, not grateful, not in need of convincing — she has had months to build this up and it has nowhere to go. Give her five minutes to compose herself and she will tell Derek everything she knows about the night on Alderaan, the drive changing hands, the name Ardyth Canvi, and a COMPNOR man in the corner with a note he stepped on.\n\nWhat Rinn Knows About Caroth Blaine\n\nIf the party asks — and they may well not think to — Rinn negotiated directly with Caroth Blaine. More than once. She brokered the arrangement that made the Formos operation what it is.\n\nShe liked him.\n\nCourteous, precise, straight-dealing. He kept his word, said what he meant, and never once tried to intimidate her or shave her margin. In a business full of men like Bandin Dobah, he was the only party to the whole arrangement who conducted himself like a professional. Her assessment is entirely genuine and entirely accurate.\n\nGM NOTE — THE THING NOBODY CAN RECONCILE\nWhen the party tells her what Caroth Blaine is involved in — the ship-stripping, the Duros houses, the bodies — she will not be a
