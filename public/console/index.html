<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap"><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<title>Legacy of Rebellion Console</title>
<style>
:root{
  --ground:#0E1013; --panel:#14171C; --panel2:#191D23; --line:#262B33; --line2:#333944;
  --ink:#E6E4DF; --ink2:#B9BAB8; --muted:#868C96; --faint:#5A616C;
  --accent:#C1272D; --accent-soft:#8B1A1A; --gold:#C9A84C;
  --g-thriller:#C4553A; --g-tragedy:#8B6BB1; --g-spirit:#4E9C86; --g-heist:#C79A3A; --g-war:#6E8CA8; --g-comedy:#D0863F;
  --ok:#4E9C86; --warn:#C79A3A; --crit:#C4553A;
  --f-display:'Cinzel',Georgia,serif; --f-body:'Spectral',Georgia,serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
  --rail:236px; --pad:clamp(20px,4vw,52px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-weight:300;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}

.rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:26px 22px 20px;border-bottom:1px solid var(--line)}
.brand .eyebrow{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;margin:8px 0 0;line-height:1.25;text-wrap:balance}
.brand .sub{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;color:var(--accent);margin-top:9px;text-transform:uppercase}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;padding:9px 12px;text-align:left;color:var(--ink2);cursor:pointer;border-radius:3px;font-size:14px;transition:background .15s,color .15s}
.nav button:hover,.nav button[aria-current="true"]{background:var(--panel2);color:var(--ink)}
.nav button[aria-current="true"] .dot{background:var(--accent)}
.nav .dot{width:5px;height:5px;border-radius:50%;background:var(--line2);flex:none}
.nav .ct{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.railfoot{padding:14px 22px;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
#sync.live{color:var(--ok)} #sync.ro{color:var(--warn)} #sync.busy{color:var(--gold)}

.main{padding:var(--pad) var(--pad) 100px;max-width:1180px}
.view{display:none}.view.on{display:block}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:30px}
.vhead h2{font-family:var(--f-display);font-weight:600;font-size:clamp(21px,2.4vw,27px);letter-spacing:.05em;margin:0;text-wrap:balance}
.vhead .eyebrow{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:9px}
.vhead p{margin:7px 0 0;color:var(--muted);font-size:14.5px;max-width:62ch}
.position{border-left:2px solid var(--accent);padding:4px 0 4px 24px;margin-bottom:34px}
.position .lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
.position .body{font-size:clamp(19px,2.3vw,25px);line-height:1.45;margin-top:12px;font-weight:300;text-wrap:balance;max-width:44ch}
.position .meta{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:14px;letter-spacing:.08em}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:17px 19px}
.stat .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.stat .v{font-family:var(--f-display);font-size:29px;font-weight:600;margin-top:9px;font-variant-numeric:tabular-nums}
.stat .n{font-size:13px;color:var(--muted);margin-top:5px}
h3.sec{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin:38px 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}

.arcs{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(268px,1fr))}
.arc{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:19px;cursor:pointer;text-align:left;width:100%;transition:.18s;overflow:hidden}
.arc:hover{border-color:var(--line2);transform:translateY(-2px);background:var(--panel2)}
.arc .stripe{position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gc)}
.arc .genre{font-family:var(--f-mono);font-size:9px;letter-spacing:.18em;color:var(--gc);text-transform:uppercase}
.arc h4{font-family:var(--f-display);font-size:17px;font-weight:600;margin:9px 0 0;letter-spacing:.03em}
.arc .q{font-size:13.5px;color:var(--muted);margin-top:9px;font-style:italic;line-height:1.5;min-height:44px}
.arc .foot{display:flex;justify-content:space-between;align-items:center;margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}
.arc .ob,.arc .prog{font-family:var(--f-mono);font-size:10.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.arc .prog{color:var(--faint)}
.bar{height:2px;background:var(--line);margin-top:11px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gc);transition:width .5s cubic-bezier(.2,.7,.3,1)}

.spine{position:relative;padding-left:30px;margin-top:6px}
.spine:before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--line)}
.beat{position:relative;padding:11px 0 11px 4px;display:flex;gap:14px;align-items:flex-start}
.beat .node{position:absolute;left:-30px;top:16px;width:13px;height:13px;border-radius:50%;border:1px solid var(--line2);background:var(--ground);cursor:pointer;padding:0;transition:.2s;flex:none}
.beat .node:hover{border-color:var(--gc)}
.beat.done .node{background:var(--gc);border-color:var(--gc)}
.beat.now .node{border-color:var(--gc);box-shadow:0 0 0 4px color-mix(in srgb,var(--gc) 18%,transparent)}
.beat .txt{flex:1;min-width:0}
.beat .t{font-size:15px;line-height:1.45}
.beat.done .t{color:var(--muted)}
.beat .n{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.beat .tag{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gc);margin-top:6px;display:inline-block}

.ledger{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--panel)}
.row{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:15px;align-items:start;padding:14px 17px;border-bottom:1px solid var(--line);transition:background .15s}
.row:last-child{border-bottom:0}.row:hover{background:var(--panel2)}
.row .pip{width:7px;height:7px;border-radius:50%;margin-top:7px;background:var(--k)}
.row .ti{font-size:15px;line-height:1.4}
.row .me{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.row .rt{display:flex;align-items:center;gap:9px;flex:none}
.chip{font-family:var(--f-mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line2);border-radius:2px;color:var(--muted);white-space:nowrap}
.chip.main{border-color:var(--accent-soft);color:var(--accent)}
/* tag chips */
.tg{font-family:var(--f-mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;padding:3px 8px;border-radius:2px;white-space:nowrap;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);display:inline-flex;align-items:center;gap:5px}
button.tg{cursor:pointer;transition:.15s}
button.tg:hover{background:color-mix(in srgb,var(--c) 26%,transparent)}
.tg.off{border-color:var(--line2);color:var(--faint);background:none}
.railbuild{font-family:var(--f-mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:0 18px 12px;opacity:.75}
.savebad{position:fixed;left:0;right:0;bottom:0;z-index:95;background:#2A0E0E;border-top:1px solid #7A2222;color:#F0A9A5;
 font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;padding:9px 18px;display:flex;gap:14px;align-items:baseline}
.savebad b{text-transform:uppercase;letter-spacing:.18em;color:#FF8A82}
.savebad span{font-family:var(--f-body);font-size:12.5px;letter-spacing:0;line-height:1.5}
.savest{font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;align-self:center;padding-right:4px}
.savest[data-s="saving"]{color:var(--gold)}
.savest[data-s="saved"]{color:#4E9C86}
.savest[data-s="bad"]{color:#E8A9A6}
.recbar{background:#1F1806;border:1px solid #6B5312;border-radius:3px;padding:13px 16px;margin-bottom:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.recbar .msg{font-size:13px;color:#E3C56A;line-height:1.5;flex:1;min-width:240px}
.tg .rm{display:none;margin-right:-3px;margin-left:1px;font-size:11px;line-height:1;opacity:.75}
button.tg.has:hover .rm{display:inline}
button.tg.has:hover{background:color-mix(in srgb,var(--c) 26%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}
.tgmenu .sub{font-size:10.5px;font-family:var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);padding:7px 4px 0;border-top:1px solid var(--line);margin-top:8px;line-height:1.5}
.tgmenu .rmb{margin-top:7px;width:100%;justify-content:center}
.tgrow{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tgmenu{position:absolute;z-index:40;background:var(--panel);border:1px solid var(--line2);border-radius:3px;padding:7px;display:none;box-shadow:0 12px 38px rgba(0,0,0,.65);min-width:190px}
.tgmenu.on{display:block}
.tgmenu .lab{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);padding:3px 4px 7px}
.tgmenu .opts{display:flex;flex-wrap:wrap;gap:5px}
.ask{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(6,7,9,.72);backdrop-filter:blur(2px)}
.ask.on{display:flex}
.ask .card{background:var(--panel);border:1px solid var(--line2);border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.7);max-width:420px;width:calc(100% - 48px);padding:26px 26px 20px}
.ask .lab{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.ask h4{font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--ink);margin:0 0 9px;line-height:1.3}
.ask p{font-size:13.5px;color:var(--ink2);margin:0 0 20px;line-height:1.6}
.ask .row2{display:flex;gap:9px;justify-content:flex-end}
.ask .btn.d{border-color:var(--accent-soft);color:#E8A9A6}
.ask .btn.d:hover{background:var(--accent-soft);color:#fff;border-color:var(--accent)}
/* tag manager */
.tagmgr{border:1px solid var(--line);border-radius:3px;background:var(--panel);margin-bottom:24px;overflow:hidden}
.tagmgr>summary{padding:12px 16px;cursor:pointer;list-style:none;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;align-items:center}
.tagmgr>summary::-webkit-details-marker{display:none}
.tagmgr>summary:hover{color:var(--ink2)}
.tagmgr .bd{padding:4px 16px 18px;border-top:1px solid var(--line)}
.tgedit{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tgedit:last-of-type{border-bottom:0}
.tgedit .sw{width:12px;height:12px;border-radius:2px;background:var(--c);cursor:pointer;border:0;padding:0}
.tgedit .nm{font-size:14px}
.tgedit .cat{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.swatches{display:flex;gap:4px;flex-wrap:wrap;padding:6px 0 2px}
.swatches button{width:17px;height:17px;border-radius:2px;border:1px solid transparent;cursor:pointer;padding:0}
.swatches button:hover{border-color:var(--ink)}
/* graph filter + link list */
.gfilter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.gfilter .fl{font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-right:4px}
.linkrow{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12.5px;color:var(--ink2);line-height:1.4}
.linkrow button{background:none;border:0;color:var(--faint);cursor:pointer;font-size:13px;padding:0 3px;flex:none}
.linkrow button:hover{color:var(--crit)}
.row.res .ti{text-decoration:line-through;color:var(--faint)}
.row.res .pip{opacity:.35}

.sess{border:1px solid var(--line);border-radius:3px;background:var(--panel);margin-bottom:11px;overflow:hidden}
.sess>summary{padding:15px 18px;cursor:pointer;display:flex;align-items:center;gap:15px;list-style:none}
.sess>summary::-webkit-details-marker{display:none}
.sess .no{font-family:var(--f-mono);font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
.sess .ti{font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.03em;flex:1;min-width:0}
.sess .dt{font-family:var(--f-mono);font-size:10px;color:var(--faint);flex:none}
.sess .bd{padding:2px 18px 20px;border-top:1px solid var(--line)}
.sess .bd p{margin:14px 0 0;line-height:1.72;max-width:68ch}
.sess .res{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:11.5px;color:var(--ink2);line-height:1.9}

/* codex + planets detail */
.entry{border:1px solid var(--line);border-radius:3px;background:var(--panel);overflow:hidden}
.entry>.hd{padding:15px 18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;cursor:pointer}
.entry .nm{font-family:var(--f-display);font-size:15.5px;font-weight:600;letter-spacing:.03em}
.entry .kd{font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.entry .bd{padding:0 18px 18px;border-top:1px solid var(--line);display:none}
.entry.open .bd{display:block}
.entry .no{font-size:13.5px;color:var(--ink2);margin-top:14px;line-height:1.65}
.caret{font-family:var(--f-mono);font-size:11px;color:var(--faint);flex:none;transition:transform .2s}
.entry.open .caret{transform:rotate(90deg)}
.sb{margin-top:16px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.sb .sbh{font-family:var(--f-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.chars{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}
.chars div{padding:9px 4px;text-align:center;border-right:1px solid var(--line)}
.chars div:last-child{border-right:0}
.chars .cl{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.1em;color:var(--faint)}
.chars .cv{font-family:var(--f-display);font-size:19px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.defs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.defs div{padding:8px 4px;text-align:center;border-right:1px solid var(--line)}
.defs div:last-child{border-right:0}
.defs .cl{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.1em;color:var(--faint)}
.defs .cv{font-family:var(--f-mono);font-size:14px;margin-top:3px;font-variant-numeric:tabular-nums}
.sbrow{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.sbrow:last-child{border-bottom:0}
.sbrow .l{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding-top:3px}
.pmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-top:14px}
.pmeta div{background:var(--panel);padding:10px 12px}
.pmeta .l{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.pmeta .v{font-size:13.5px;margin-top:4px}

/* documents — list */
.doclist{display:grid;gap:10px}
.doc{border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:15px 18px;display:flex;justify-content:space-between;gap:16px;align-items:center;cursor:pointer;transition:.15s}
.doc:hover{border-color:var(--line2);background:var(--panel2)}
.doc .dt2{font-family:var(--f-display);font-size:15.5px;font-weight:600;letter-spacing:.03em}
.doc .dm{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin-top:5px}

/* documents — reader shell */
.reader{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--panel);height:calc(100vh - 190px);min-height:520px}
.outline{border-right:1px solid var(--line);overflow-y:auto;padding:16px 0}
.outline .oh{font-family:var(--f-mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);padding:0 18px 12px}
.outline a{display:block;padding:6px 18px;font-size:13px;color:var(--ink2);text-decoration:none;border-left:2px solid transparent;cursor:pointer;line-height:1.35}
.outline a:hover{background:var(--panel2);color:var(--ink)}
.outline a.l1{font-family:var(--f-display);font-size:13px;font-weight:600;color:var(--ink);margin-top:8px}
.outline a.l3{padding-left:32px;font-size:12.5px;color:var(--muted)}
.outline a.cur{border-left-color:var(--accent);background:var(--panel2);color:var(--ink)}
.stage{overflow-y:auto;background:#0A0C0F;padding:26px 0 60px;position:relative}
.pagebar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:9px 16px;background:color-mix(in srgb,#0A0C0F 92%,transparent);border-bottom:1px solid var(--line);flex-wrap:wrap;backdrop-filter:blur(6px)}
.pagebar .sp{flex:1}
.pagebar .pgn{font-family:var(--f-mono);font-size:10px;color:var(--faint);letter-spacing:.1em}
.zoom{display:flex;border:1px solid var(--line2);border-radius:2px;overflow:hidden}
.zoom button{background:none;border:0;padding:6px 10px;font-family:var(--f-mono);font-size:10px;color:var(--ink2);cursor:pointer;border-right:1px solid var(--line2)}
.zoom button:last-child{border-right:0}
.zoom button:hover{background:var(--panel2);color:var(--gold)}
.zoom button[aria-pressed="true"]{background:var(--panel2);color:var(--gold)}

/* the page itself */
.pages{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px 20px 0}
.page{width:794px;min-height:1123px;background:#FBF8F1;color:#1A1A1A;box-shadow:0 3px 22px rgba(0,0,0,.55);position:relative;padding:86px 88px 96px;flex:none}

 {id:"d-story",title:"Legacy of Rebellion — The Main Story",folder:"Campaign",updated:new Date().toISOString(),
  body:"CAMPAIGN THESIS\n\nThe Alliance was never going to beat the Empire militarily. Victory comes through winning the moral and political allegiance of the galaxy. The Empire's brutality steadily costs it legitimacy even as it wins tactical engagements. Party actions contribute to that moral ledger, not to battlefield victory.\n\nAsymmetric warfare was Alliance doctrine throughout, not a post-Hoth adaptation. Missions are judged by what they cost the Empire in standing, not in tonnage.\n\nSTRUCTURAL DESIGN\n\nThe main story functions like the Hoth and Endor spine of a Star Wars film. The individual player Obligation arcs are the Han-in-carbonite threads: personal, distinct in genre, and deliberately not required to conjoin with the main plot.\n\nEach arc should feel like that player's own personal Star Wars story: emotionally distinct, self-contained, unforgettable. The experiencing player is playing Star Wars while the others are watching it.\n\nOnly one arc, Bylie's, intersects the main plot. That is a feature, not a gap.\n\nSTANDING GM PRINCIPLES\n\nPlayer contributions are binding canon. If a player generates a story detail at the table, it is true, and it is preserved across sessions.\n\nObligation seeds at low levels are unexplained texture, not recognition moments.\n\nVillain presence is built gradually through fragments before direct confrontation.\n\nPartial failure is a legitimate outcome with downstream consequences, not a dead end.\n\nRead-aloud text describes only what the players observe, never what it means.\n\nOPERATION: SENTINEL\n\nKogler's attempt to build a successor to the Death Star: more insidious, more targeted, and powered by the dark side rather than by kyber.\n\nThe weapon is a spherical orbital station roughly fifty metres across, ringed by a platform structure. It lands on a planet's surface and extracts dark side energy from the ground. Once charged it can create collapses of pure dark side energy within planetary cores, destroying worlds from the inside.\n\nWhy it is not another Death Star: the Death Star is a military deterrent, visible and enormous, a symbol that announces itself. The Sentinel is geological and insidious. It targets worlds with dark side significance and hollows them out using their own history against them. The threat map is therefore defined by Force lore, and the players' knowledge of that lore becomes a strategic asset.\n\nTHE NARDITHI CLUSTER\n\nThe weapon's power source, and the single point where the main story and a player arc are the same object.\n\nThe Cluster: the whole formation, buried deep in the ruins of the Oteroan Sky on Dathomir. Neither Cypher nor Jerserra knows it exists at campaign start.\n\nThe Shards: two fragments broken from the cluster in the crash. One held by Jerserra. One embedded in Tragic Hope, held by Yeel Dresk on Toydaria.\n\nThe Splinter: carved from Jerserra's shard by Taria Damsin on Dathomir, taken from her by Mother Mordane on Malachor, recovered by Cypher from Mordane's body.\n\nCypher's fundamental error: he understands the splinter as a dark side amplifier, which it partially is. He does not know it feeds on living Force. He thinks it consumes dark side energy because that is the only kind he can perceive. The Sentinel is therefore brilliant in design and broken in execution, burning through the splinter faster than he can replenish it. He needs more crystal, and that drives the entire back half of the campaign.\n\nTHE ROUTE FORK\n\nImperial Intelligence is Madine's department. The Imperial Security Bureau is Cypher's. Madine's Rishi operation was entirely off the ISB network, which is why the party can approach Onderon without alerting Cypher. Had they gone to Scarif first, an ISB facility, Cypher would have been warned.\n\nRishi, taken: Madine, the Rishii alliance, a liberated system, a clean undetected approach to Onderon. No advance intelligence on Operation: Sentinel.\n\nScarif, still open: far more advance intelligence, including the ISB and Inquisitorius routing arrangement, Whisper Base, the Dark Trooper lead for Bex and the crimson-lightsaber Dathomirian report for Bylie. The cost is that Cypher is warned.\n\nTHE ROAD AHEAD\n\nAfter Dxun the party return to the Hope to report. Cracken sets the next objective: extracting General Crix Madine from Corellia. Three things must be assembled first — an Imperial transport that the Empire does not know is stolen, uniforms with identities that survive scrutiny, and access codes obtained by placing Cracken's uplink device on an Imperial relay station's encode-decode computer without being detected.\n\nThere is no hard time limit, but Imperial Intelligence will eventually discover Madine's defection and terminate him.\n\nThe end of this arc should bring the party to 2 ABY."},

/* ---------------- utils ---------------- */
function el(h){var d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;}
var COLLS=["arcs","threads","sessions","codex","planets","links","docs","tags"];
function dl(name,data,mime){
 function fb(){
  var b=new Blob([data],{type:mime||"application/octet-stream"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u);},1500);
 }
 if(DL)return DL.save({filename:name,data:data}).catch(fb);
 fb();return Promise.resolve();
}
function stamp(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function snapshot(){
 var o={lor:1,build:BUILD,edition:EDITION,exported:new Date().toISOString(),session:(S.campaign&&S.campaign.session)||0,campaign:S.campaign};
 COLLS.forEach(function(k){o[k]=S[k];});
 return o;
}
function exportState(btn,note){
 var name="legacy-of-rebellion-"+stamp()+".lor.json";
 if(btn)btn.disabled=true;
 return dl(name,JSON.stringify(snapshot(),null,1),"application/json").then(function(){
  if(btn)btn.disabled=false;
  xnote("Saved "+name);
 });
}
function validSnap(o){
 if(!o||o.lor!==1||!o.campaign)return "That is not a Legacy of Rebellion state file.";
 for(var i=0;i<COLLS.length;i++)if(!Array.isArray(o[COLLS[i]]))return "The file is missing its "+COLLS[i]+" and would leave the console incomplete.";
 return null;
}
var XNOTE="",XOPEN=false,DANCHOR=null;
function xnote(m){XNOTE=m;var n=document.getElementById("lornote");if(n)n.textContent=m;}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
/* One write at a time, with backoff on the two codes that are worth retrying,
   and an honest tally. The old version fired ~60 writes and 8 whole-collection
   reads at once and funnelled every failure into a single catch; the docs read
   tripped resource_exhausted and no document was ever written. */
function runWrites(items,note,label){
 var i=0,failed=[],total=items.length;
 function attempt(it,n){
  var p=it.del?DB.doc(it.path).delete():DB.doc(it.path).set(it.body);
  return p.then(function(){return true;},function(e){
   var code=(e&&e.code)||"error";
   if(n<3&&(code==="resource_exhausted"||code==="unavailable"))
    return wait(350*Math.pow(2,n)+Math.floor(Math.random()*250)).then(function(){return attempt(it,n+1);});
   failed.push({label:it.label||it.path,code:code});
   return false;
  });
 }
 function step(){
  if(i>=total)return Promise.resolve(failed);
  var it=items[i++];
  return attempt(it,0).then(function(){
   if(i%4===0||i===total)xnote((label||"writing")+" "+i+" of "+total+"\u2026");
   return step();
  });
 }
 return step();
}
/* An exported document carries a plain-text "body" alongside its blocks, purely so the
   export is readable on its own. The database has a 256 KiB per-document ceiling, and for
   a large document that duplicated body is enough on its own to push the write over it, so
   the upload loses that one document while every other record goes in. saveDoc has stripped
   the derived body since the Ghost fix; the importer never did. It does now. */
function impBody(coll,d){
 if(coll!=="docs"||!d||!d.blocks||!d.blocks.length)return d;
 var c={},k;for(k in d)if(Object.prototype.hasOwnProperty.call(d,k)&&k!=="body")c[k]=d[k];
 return c;
}
function applySnap(o,note){
 xnote("preparing\u2026");
 /* deletions come from what is already in memory, kept current by the
    subscriptions \u2014 no whole-collection reads needed */
 var items=[{path:"campaign/state",body:o.campaign,label:"campaign position"}];
 COLLS.forEach(function(k){
  var keep={};o[k].forEach(function(d){keep[d.id]=1;});
  (S[k]||[]).forEach(function(d){if(!keep[d.id])items.push({path:k+"/"+d.id,del:true,label:"remove "+(d.title||d.name||d.id)});});
  o[k].forEach(function(d){items.push({path:k+"/"+d.id,body:impBody(k,d),label:(d.title||d.name||d.id)});});
 });
 S.campaign=o.campaign;COLLS.forEach(function(k){S[k]=o[k];});
 buildNav();render();
 if(!DB||RO){xnote("Replaced. Not saved \u2014 this copy has no database.");return Promise.resolve();}
 return runWrites(items,note,"writing").then(function(failed){
  try{localStorage.setItem("lor.imported",o.exported||new Date().toISOString());}catch(e){}
  if(window.__lorBanner)window.__lorBanner();
  if(!failed.length){
   xnote("Replaced \u2014 all "+items.length+" records written.");
   return failed;
  }
  xnote(failed.length+" of "+items.length+" failed \u2014 see below");
  askDelete("\u26a0 "+failed.length+" record"+(failed.length>1?"s":"")+" did not save",
   (items.length-failed.length)+" of "+items.length+" went in. These did not: "+
   failed.slice(0,6).map(function(f){return f.label+" ("+f.code+")";}).join("; ")+
   (failed.length>6?"; and "+(failed.length-6)+" more":"")+
   ". The console on screen shows the uploaded file, but the database does not match it. Retry the ones that failed?",
   function(){
    var again=failed.map(function(f){
     for(var i=0;i<items.length;i++)if((items[i].label||items[i].path)===f.label)return items[i];
     return null;}).filter(Boolean);
    runWrites(again,note,"retrying").then(function(f2){
     xnote(f2.length?f2.length+" still failing \u2014 reload and try the upload again":"Retry succeeded \u2014 everything is in.");
    });
   });
  return failed;
 });
}
function importState(file,note){
 var r=new FileReader();
 r.onload=function(){
  var o;try{o=JSON.parse(r.result);}catch(e){xnote("That file is not readable JSON.");return;}
  var bad=validSnap(o);
  if(bad){xnote(bad);return;}
  var n=COLLS.reduce(function(m,k){return m+o[k].length;},0);
  var when=(o.exported||"").slice(0,10);
  var drift="";
  if(o.build&&o.build!==BUILD)drift=" \u2014 heads up: this file was written by console build "+o.build+", and this one is "+BUILD+". The data will import fine; it means the two copies of the console are no longer the same code.";
  xnote("backing up current state…");
  dl("legacy-of-rebellion-BACKUP-"+stamp()+".lor.json",JSON.stringify(snapshot(),null,1),"application/json").then(function(){
   askDelete("Replace everything with this file?",
    "The file holds "+n+" records from session "+(o.session||"?")+(when?", saved "+when:"")+". Everything currently in the console is discarded and replaced by it. A backup of the current state has just been downloaded."+drift,
    function(){applySnap(o,note);});
   xnote("backup saved — confirm to replace");
  });
 };
 r.onerror=function(){xnote("Could not read that file.");};
 r.readAsText(file);
}
function transferPanel(){
 var d=el('<details class="tagmgr" style="margin-top:26px"><summary><span>Backup &amp; offline copy</span><span style="color:var(--faint)">'+COLLS.reduce(function(m,k){return m+S[k].length;},0)+' records</span></summary><div class="bd" style="padding:16px"></div></details>');
 var bd=d.querySelector(".bd");
 d.open=XOPEN;

function save(c,id,b){

  if(SAVEBAD&&SAVEBAD.path===c+"/"+id){SAVEBAD=null;banner();}

  ? "This document had not finished loading from the database, so the change was not saved. Nothing has been overwritten. Wait for the header to read live, then try again."
  : SAVEBAD.code==="invalid_argument"
  ? "The database refused the last write to "+SAVEBAD.path+". Your text is kept in this browser \u2014 open the document and use Recover."
  : SAVEBAD.code==="no_database"
  ? "This console has no database connection, so nothing you change here is being stored. Reload the page. Until it reconnects, treat anything you type as unsaved."

   from=at+lab.length;

 hits.sort(function(a,b){return a.at-b.at;});

 hits=hits.filter(function(h,k){return k===0||h.at>=hits[k-1].end;});

  if(hits[0].at>0){var lead=s.slice(0,hits[0].at).trim();if(lead)out.push({l:proseLabel||"Notes",v:lead});}

  b.r.forEach(function(row){
   (row||[]).forEach(function(c){

/* ---------------- the Main Story document ---------------- */
function mainStoryDoc(){
 var a=[],i=0;
 function b(t,x){a.push({id:"m"+(++i),t:t,x:x});}
 var H=function(x){b("h1",x);},S2=function(x){b("h2",x);},S3=function(x){b("h3",x);},
     P=function(x){b("p",x);},C=function(x){b("callout",x);},R=function(x){b("read",x);},
     Q=function(x){b("quote",x);},L=function(x){b("list",x);},PB=function(){b("pb","");},D=function(){b("div","");};

 H("The Shape Of The Story");
 P("The main story runs from the close of Dead in the Water to the party's arrival in 2 ABY. Underneath the episodes it is one continuous investigation: a Rebel intelligence cell is asked to find out what the Empire is building, and the answer turns out to be older, stranger and more personal than the question.");
 P("It is not a story about winning battles, because the Alliance cannot win battles. Every episode is a test of whether the Empire's brutality can be made to cost it more in legitimacy than the Rebellion loses in blood. Rishi is the clearest example: one garrison, one cruiser, one mine, and a whole system changes sides.");
 C("This document deliberately contains no Obligation arc material. Where the main story passes within reach of a personal arc, the junction is marked and named, and then the story keeps going. The arcs live in their own documents, and only Bylie's is ever required to touch this one.");
 Q("Victory comes through winning the moral and political allegiance of the galaxy. Party actions contribute to that ledger, not to battlefield victory.");

 PB();
 H("Episode One — Blue Milk Run");
 C("Still to be written into this document. The one thing I need is whether this preceded the crew forming or ran alongside it, since Dead in the Water is where the six actually met.");

 H("Episode Two — Dead in the Water");
 P("The tutorial, and the episode that quietly sets the entire campaign in motion. Six strangers met aboard a stricken ship, survived the Shadow Raptor, and walked away as a crew. They walked away with the ship, too. The Shadow Raptor is theirs now, saved rather than destroyed, and it remains an asset the Alliance can call on.");
 P("They also walked away with a warning they could not trace. Much later, on a mountainside on Rishi, an Imperial general finally explains where it came from.");
 R("I am General Crix Madine, Imperial Army. And before you reach for your weapons — I am the one who tried to warn you about the droids.");
 P("That warning is the first thread of everything. Before the party had done anything to deserve it, someone inside the Imperial machine chose to help them and could not say who he was. Rishi, Onderon and eventually a rescue on Corellia are all the slow repayment of that debt.");
 S2("What the droids actually were");
 P("TJ-11 and its kind: hyper-intelligent saboteur droids, built to infiltrate and take control of other droids. Not soldiers. A key, capable of turning any droid in a facility against the people standing next to it, and about to be distributed across the galaxy.");
 P("They were being built by Shyndi Oglerk, and they were never really a weapons programme. They were an audition.");
 S2("Shyndi Oglerk");
 P("Shyndi was Hyndis Kogler's daughter, under a name that was not his. The Director of the Imperial Security Bureau wanted his own eyes inside the Dark Trooper project, and the only way to place her was to make her impossible to refuse. Colonel Gideon and General Rom Mohc were not going to accept a Director's daughter as a favour. They would accept a designer who arrived carrying something they did not have.");
 P("So Shyndi built the saboteur droids as her entry fee. Her father's mole, buying her way in with her own work, one demonstration away from a seat inside the most secret weapons programme in the Empire.");
 S2("What the Misfires did");
 P("They shut the operation down and destroyed the droids before a single one shipped. By the campaign's own measure this is one of the cleanest wins the party will ever have: a galaxy-wide sabotage capability ended before it existed, and nobody outside that ship will ever know it was close.");
 P("Cornered, Shyndi killed herself rather than surrender. The Alliance lost a contact who would have been worth more alive than any intelligence they took off her.");
 D();
 P("And Hyndis Kogler lost a daughter.");

 H("What Shyndi's Death Set In Motion");
 P("This is the fact that reframes the campaign, and the party does not know it.");
 P("The Director of the ISB, the man personally driving Operation: Sentinel, the man concealing a superweapon from his own government, has a private reason to want these six people dead that has nothing to do with the Rebellion. His grievance is not ideological. It is the most ordinary and most human motive there is, and it is the one thing about him that is not corrupt.");
 C("The open question is what he knows. If Kogler has not yet connected his daughter's death to the crew now interfering with Operation: Sentinel, that connection is a loaded gun the GM can fire at any moment. The scene where he learns it is worth more than any battle, and it should not be spent cheaply. If he already knows, then everything he has done since has been personal, and the party has been hunted for longer than they realise.");
 C("Andrevas Kog now reads very differently. His profile says he has worked under the Koglers for too long — plural. He served the father and the daughter. And when a situation turned, he abandoned Shyndi and saved himself. Whether Hyndis knows that is a second loaded gun, and it is pointed at the man Cypher intends to make his first Inquisitor.");
 C("There is also a junction into Bex's arc here, and it is the GM's call whether to open it. Shyndi's droids were an audition for a project run by Colonel Gideon and General Mohc — Bex's project. Her arc and the main story now share a room they did not share before. The campaign's design says the arcs stay separate; this one has grown a door.");

 H("Episode Three — The Pirate and the Empire");
 P("The party's first contact with the shape of the enemy, and the episode that puts First Mate Andrevas Kog in front of them: ambitious, resentful of the institution he serves, and gifted at surviving other people's disasters.");
 P("It matters later. On Dxun, Kog stands his ground beside Cypher when every instinct he has shown says he should run. That is not courage. He is more frightened of Cypher than of dying, and Cypher has promised him something the ISB never would.");
 C("Two things still needed: who the pirate was and how the episode resolved, and specifically when Kog abandoned Shyndi. If that happened during Dead in the Water it belongs in the section above; if it happened here, this episode is where the party watched him do it.");

 PB();
 H("The Briefing — Operation: Sentinel");
 P("General Airen Cracken, Head of Alliance Intelligence, gives the party the mission that defines the rest of the campaign. Imperial Intelligence chatter points to a programme running inside the Imperial Security Bureau, concealed not only from the Rebellion but from the rest of the Empire. COMPNOR does not know. Imperial Intelligence does not know. Director Hyndis Kogler is building something and keeping it from his own government.");
 P("Cracken cannot send a fleet. The Battle of Mako-Ta scattered the Rebel navy and killed much of its senior command, including his own protege, General Draven. What he can send is six people and a ship. This is Alliance doctrine, not improvisation: asymmetric from the start, and asymmetric long before Hoth ever forces the issue.");
 P("He offers three leads and lets them choose.");
 L("Scarif — an abandoned Imperial facility, ISB, recently booby-trapped\nRishi — a fragmented signal routed through an Outer Rim world\nOnderon — a busy Inner Rim port where something is being funded off the books");
 P("The party chose Rishi.");

 H("The Fork, And Why It Matters");
 P("The three leads were never interchangeable, and the reason is a distinction the campaign treats as structural: Imperial Intelligence is Madine's department. The Imperial Security Bureau is Cypher's. They do not share a network.");
 P("Madine's Rishi operation ran entirely off the ISB's wires. That is precisely why the party could take an entire system away from the Empire and still arrive at Onderon as strangers. Had they gone to Scarif first and tripped an ISB facility, Cypher would have been warned, and every door on Onderon would have been closed before they reached it.");
 C("The cost of the choice is symmetrical. By taking Rishi they arrived at Dxun unknown and can catch Cypher in the act. By skipping Scarif they walked into the tomb knowing almost nothing about what they would find, and Bex and Bylie both lost a piece of their own story that was sitting on that relay.");

 PB();
 H("Rishi — Ghost in the Projector");
 S2("Why they went");
 P("A signal, fragmented and rerouted, coming from a world that should have had nothing worth transmitting. Rishi sits in the Abrion sector of the Outer Rim: tropical, mountainous, a 425-day year, and a native avian species, the Rishii, who do not value technology and live simply in mountain nests.");
 P("The Empire is there for exonium — a clean, long-lasting power source whose output feeds the Imperial war machine well beyond this sector. Control of the planet is economic rather than numerical. One Gozanti-class cruiser. One garrison. Guild domination of the settlements. That is all it takes, and it is exactly why liberating it is possible at all.");
 S2("What they found");
 P("TIE fighters on approach, and then an impossible hail on an old Republic comm code telling them to avoid the spaceports entirely. It came from Chieftain Qwar, leader of a mountain tribe, a descendant of the chieftain who fought beside the Republic during the Clone Wars, and a man who now believes the Republic's successor betrayed his people.");
 P("The Rishii have been guided for months by a voice they call He Who Speaks Through Time. Those who believed him fled before an Imperial sweep. Those who stayed were slaughtered. The voice speaks through a crashed Republic listening post that the tribe woke by accident during a ritual, and because the projector was used long ago by Qwar's grandfather, and because to the Rishii time is a kind of space, the name is literal rather than poetic.");
 S2("The voice in the projector");
 P("The voice is General Crix Madine. He has been feeding intelligence to the Rishii, and through them toward the Alliance, while remaining in Imperial uniform. He is clipped, precise and entirely unsentimental, and he wants the Empire off this planet before the sweeps find the village and the holocomm together — which would mean the death penalty for him and the loss of the Alliance's best-placed asset.");
 P("He asks for two things: an ambush to break the patrol closing on the village, and the destruction of the exonium mining facility that is the Empire's only reason to be here.");
 S2("The ambush and the mountain");
 P("Both were done. The patrol was broken in a mountain pass. The mining facility was infiltrated across three levels, the conscripted Rishii of the Talek nest were freed, and the reactor at its heart was destroyed. The mountain folded into a crater. The party lifted out on a captured Gozanti with the miners aboard, and Rishi was free.");
 C("Divergence — the Yard. The mine's outer holding yard is where five of the six arcs quietly began. Derek was found by two bounty hunters working a Moff's retainer. Bylie heard her own deed come back to her as a frightened rumour told by people who had no idea she was standing in front of them. Zid met a grounded Duros hauler driver who recognised the device he has worn his whole life. Bex saw a stencilled requisition mark she knew and could not place. Guy was recognised by a man who wanted twelve credits for a coupling. Grevi received nothing, and that gap is still open.");
 S2("What Madine gives them");
 P("With the mine gone, Madine names what he has been unable to say over an open channel: Director Hyndis Kogler, the ISB weapons programme, and the agent running it in the field, known only as Cypher. He points them to Onderon, to a hidden ISB installation called Whisper Base, to the moon Dxun, and to the Beast Riders who are the only way to reach it.");
 P("Then, entirely out of character, he tells them may the Force be with you. It is a crack in the armour, and it is deliberate. He did not help the Rishii because it was strategically optimal. He helped them because what was being done to them was unjust, and he is becoming a believer without having decided to.");
 C("At the time of writing the party has destroyed the mine and is flying back to the village. This briefing has not happened yet.");

 PB();
 H("Scarif — Spectres of the Past");
 P("Still available, and still unvisited. An abandoned Imperial outpost in swamp and sparse jungle, recently and carefully booby-trapped by someone who did not want it found — including an Acklay kept alive as a living trap, ageing Magnaguards in a sealed arena, and a re-programmed bounty hunting droid, IG-77, as the last obstacle.");
 P("The facility is an ISB relay whose entire purpose is deniability: routing Imperial traffic so that it does not appear to come from Imperial channels. It is hidden even from other ISB assets. Read deeply enough and it reveals that the ISB and the Inquisitorius have been using the same wire — each helping the other hunt, one for Rebel intelligence, one for Force sensitives.");
 P("It also holds a report on a crimson lightsaber-wielding Dathomirian wanted by both, and the coordinates of a second such site on Onderon, along with detailed shipping and troop movements to somewhere called Whisper Base.");
 C("Divergence — Scarif. Bex would find Project Dark Trooper here, and through it the Balmorran Run and a set of schematics that look exactly like her. Bylie would find the report on the Dathomirian, which is the wire she has already tripped without knowing it. Neither of them has that material because the party went to Rishi.");
 P("The cost is that the incursion is flagged. The traps have already alerted someone. Leaving the relay running preserves Imperial comms but keeps the Empire watching; destroying it wakes an ISB investigation aimed squarely at the party.");

 PB();
 H("Onderon");
 P("One vast walled city, Iziz, surrounded by jungle that grows back faster than it can be cut. The Royal Palace stands empty under Imperial governorship. Moff Dardano runs the system and has been quietly funnelling money and equipment into something in the jungle. Admiral Corlen, who has been a Rebel plant for a very long time, is locked in a power struggle with him and cannot move openly.");
 P("How the party arrives determines what Onderon is. Coming from Rishi they already have Whisper Base and the Beast Riders, and can go straight to the jungle. Coming from Scarif they have the base but not the riders. Coming here first, with neither, they must land at Iziz and talk their way in, and Corlen finds them.");
 C("Divergence — Iziz. If the party walks the city, three arcs open at once. The Pykes make contact with Derek and offer to clear his bounty for a job on Coruscant. Crimson Dawn agents recognise Guy and either try to take him or offer him one last score. A merchant selling treasure maps sizes up Grevi and sells him the location of a lost Separatist treasure ship. None of these require the main story's permission.");
 S2("Whisper Base");
 P("Cypher's installation, invisible to standard Imperial records, unknown to most of the ISB. Taking it hands the party a local base the Alliance can supply, uniforms that will matter later on Corellia, and the villagers of Darrastead whom the Empire took for labour. Giving it to the Beast Riders instead buys something worth more: the Clazca stop testing them and simply take them in.");
 S2("The Blood Trial");
 P("Once a year Dxun's orbit brings it close enough to Onderon that for fifteen days the two worlds share an atmosphere, and the Clazca's young ride rupings across the near-void to hunt on the Demon Moon. It is the only way onto Dxun that does not trip the orbital installations ringing it. Everything else — a single ship, a full assault — triggers silent alarms that bring the sector down on them.");
 P("The window does not wait. That is why Madine sent them now.");

 PB();
 H("Dxun — The Demon Moon");
 S2("The dead zone");
 P("The rupings land at the edge of a clearing and will go no further. The jungle thins, the animals fall silent, and the bodies of small creatures lie desiccated and paper-thin, not decayed but drained. Force-sensitives feel not dread but absence — not like death, which still echoes, but like the removal of death.");
 S2("The burial chamber");
 P("An ancient Sith mausoleum, the tomb of Freedon Nadd, built entirely from Mandalorian beskar and carved with Jedi wards. Imperial droids are stripping the walls with high-power lasers and will ignore anyone who does not interrupt them.");
 P("Below, past the excavation, sits a structure of dark onyx-like material that matches no known Imperial design and no known ancient architecture — not Sith, something older than Sith. At its centre is a dais with a socket built for a crystal far larger than the fragment currently feeding it.");
 P("Anyone who measures the energy stored in that structure discovers it is at or near the output of the Death Star's primary laser, drawn out of the ground through a shard small enough to close a hand around.");
 S2("Cypher");
 P("A shuttle lands. Cypher enters with Kog beside him, newly promoted and in ISB uniform, discussing manifests and the Iceheart's resupply schedule. He retrieves the crystal from the dais, and if the party is seen, he does not run.");
 R("I must commend you: your persistence is astonishing. Unfortunately, this is the end of the line. Everything is proceeding as planned, despite you and your Rebel meddling. It's almost ironic, really: all of this was to entrap someone else. It was never meant to be you.");
 P("Then he lifts the blade to take in the whole room, explains that the dark side energies of a dead Sith Lord linger far longer than is natural, and that this relic of someone else's heritage has let him take them for his own. The lights go out. He leaves.");
 C("Divergence — Bylie. The machine's harvest opens a bridge in the Force, and the Three Mothers reach her directly for the first time. What she does in that moment is hers alone, and it is the single point where the main story and a personal arc are the same event. Grevi may also find a fragment here about whether a seeing stone could exist in a place this saturated, but it should cost no session time.");
 S2("The Sentinel rises");
 P("The onyx structure lifts out through the collapsing roof, shedding beskar as it climbs, and four cargo shuttles take its lines and haul it into space. It is a sphere roughly fifty metres across, ringed by a platform, with no running lights and nothing to identify it. Describe only what is visible. Let the players name it themselves.");
 P("If the party arrives late, they never see the tomb at all — only the Iceheart, and the thing it is towing, jumping for the Corellian system.");

 PB();
 H("Return To The Fleet");
 C("Main-story beats only. Individual Obligation Arc beats that slot into this window — Bylie's Esseles lead, Bex's briefing with Saki Rau, Zid's check-in with Robbton, Guy's introduction to Kleya Marki — live in each character's own Obligation Arc document and are not repeated here.");
 S2("Arrival");
 P("The team drops out of hyperspace to a fleet noticeably larger than the one they left. More hulls, several recognisable. The Millennium Falcon sits among the newer arrivals, unremarked upon but unmistakable.");
 P("They are not greeted by Cracken. C-3PO meets them at the hangar instead, visibly pleased with the responsibility, explaining that General Cracken and Princess Leia asked him personally to escort them to the bridge for debriefing.");
 P("The walk to the bridge tells its own story — busier corridors, more crew, less of the improvised, patched-together feel from before. The Hope has finished its retrofit ahead of schedule and is now flying as the sector's flagship.");
 S2("The Bridge");
 P("Both Cracken and Leia are present — a step up in formality from previous visits, which the team should notice. Cracken runs the practical debrief: the mine's fate, casualties, what the outcome means strategically. If Duty thresholds were hit, this is the moment for any medals, rank, or resourcing rewards.");
 P("Cracken updates them on the wider galaxy without needing to re-explain Mako-Ta: cells are consolidating, more ships are arriving weekly. He deflects any deeper question about long-term Alliance strategy cleanly, with Leia's quiet support rather than elaboration.");
 Q("There's a larger picture coming together. When it's ready to share, you'll be among the first to know.");
 S2("Madine's Request");
 P("The team is, at this point, intrinsically connected to Crix Madine. In his last briefing to them, he laid out what he could — and couldn't — say.");
 R("I cannot tell you what Cypher is building. I cannot tell you what is on Dxun. I can tell you that in twenty years of Imperial service, I have never seen this level of resource expenditure hidden this carefully from this many people. That alone should tell you how important it is that you find out.\nThe convergence won't happen for another few weeks. In the meantime, I will need to find a new way to communicate with you and your Rebellion. I've already sent a request to your General Cracken — I wish political asylum within the Alliance, but first, I must speak with Mon Mothma. He said he would get back to me.\nIn the meantime, I just want to thank you again. Good work. And may the Force be with you on Onderon.");
 P("That request went through channels well above Cracken's authority — Madine's asylum request is a political matter, and Leia is Mon Mothma's representative for exactly this kind of decision. She is in the room because Cracken called her in specifically, wanting the team's own account heard directly rather than summarised secondhand.");
 Q("I've spoken with Mon Mothma. She remembers Crix Madine — called him a great man, once, and said the Alliance would be fortunate to have him. But if she remembers anything about Madine, it's his resourcefulness — and he wouldn't just leave the Empire empty-handed. It's likely he already has a plan for his defection — he just needed to make sure we were on board with it.");
 P("Cracken picks up where she leaves off, the practical half of a conversation the two of them have clearly already had.");
 Q("We have two weeks before the convergence on Onderon begins. The Misfires are free to pursue any other leads or contacts you may have in the meantime. I'll be in touch if Madine reaches out before that. My recommendation is to try to secure a more... comfortable ride to Onderon. The Black Bantha is suitable for OpIns, but if you're going to stay longer, you might need a mobile home. Unfortunately the Alliance doesn't have the resources to get you one — but we'll help wherever we can.");
 P("Cracken opens the floor to questions.");
 S2("Leia's Exit");
 P("A call rings out over the PA before the scene runs too long.");
 Q("General Organa, report to the bridge. General Organa, to the bridge.");
 P("Leia gives the team a smirk and shakes each of their hands in turn.");
 Q("Duty calls. And once again, well done on Rishi. We would give you all medals but — she looks back at Cracken, a wry half-smile — we're a bit stretched on that front at the moment.");
 P("She leaves.");
 S2("The Alliance Requests Board");
 P("Somewhere aboard the fleet — a physical noticeboard or terminal kiosk near the hangar or mess hall — the Alliance posts standing requests: supply runs, salvage jobs, reconnaissance, debt collection. These are not personal missions and are never assigned directly; the team checks the board because they choose to. Each entry represents something the Alliance is genuinely short on — supplies, medical stock, weapons, starships, skilled labour — and completion nudges Duty forward alongside a credit reward.");
 P("Board entries are deliberately written with no narrative fingerprint pointing toward any Obligation Arc. Where an entry happens to share a planet with an arc thread, the party discovers that connection by being there — never through the mission text itself.");
 C("Live entries for the Requests Board are tracked separately in the Alliance Requests Board tool. Update it between sessions as needed — it is not a static or permanent list.");
 S2("What Happens Next");
 P("From here, the team has roughly two weeks of downtime before the Onderon convergence begins. During this window: individual crew members may be pulled aside for personal matters (see each character's own Obligation Arc document), the Quartermaster is available for gear upgrades, and the Alliance Requests board offers side work if the party wants it. None of this is mandatory — the team is free to pursue any combination of these threads, or none, before Onderon calls them back.");

 PB();
 H("The Three Preparations");
 P("Madine's extraction plan is sound but requires three things that the Alliance does not have. Cracken names them and refuses to tell the party how to get them, which is the point: from here the galaxy is open, and the leads are theirs to follow.");
 S3("An Imperial transport");
 P("Stolen without the Empire noticing it is gone. A refit-and-reuse station is the obvious source, but the shuttle has to stay legitimate on Imperial books, or the whole plan collapses at the first checkpoint.");
 S3("Uniforms and identities");
 P("Uniforms are easy and Whisper Base can supply them. Identities that survive Imperial scrutiny are not, and require an information broker of the kind the Alliance does not keep on its books.");
 S3("Access codes");
 P("Imperial codes rotate constantly, so a stolen code is worthless by the time it reaches the fleet. Cracken supplies an uplink device that must be hidden on an Imperial relay station's encode-decode computer without being detected. If they are seen, the Empire changes its encryption and the device becomes useless.");
 C("Divergence — the road to Corellia. Cracken suggests Nar Shaddaa for brokers. If the story needs a push toward Bylie's thread instead, he suggests Toydaria, which has brokers and is also where the Iceheart went after Dxun. Toydaria additionally holds a shard of the Nardithi Cluster in the hands of Yeel Dresk, though nobody in the Alliance knows that.");

 PB();
 H("Corellia — The Defection");
 P("The hardest mission the party has faced, in the most heavily garrisoned space in the galaxy, to extract one man who has been feeding them intelligence since before they knew his name. There is no hard deadline, because Madine embedded is worth more to the Alliance than Madine rescued. But Imperial Intelligence will find him eventually, and when it does it will not arrest him.");
 P("This is the man who briefs the fleet on Endor. The players will not know that. They are, without being told, securing one of the Rebellion's most important moments three years before it happens.");
 P("The end of this arc brings the party to 2 ABY.");

 PB();
 H("Where The Story Diverges");
 P("Every junction at which the main story passes within reach of a personal arc. The main story never waits for these and never requires them.");
 L("Rishi, the Yard — Derek, Bylie, Zid, Bex, Guy\nScarif, the relay — Bex and Bylie, if it is ever visited\nIziz, the city — Derek, Guy, Grevi\nFormos, via any route — Derek and Zid in the same building, and Guy's own hunt\nMirial — Zid's Anvil and Grevi's road to Spintir\nDxun, the tomb — Bylie, and a fragment for Grevi\nToydaria — Bylie's shard and the Iceheart's trail\nThe search for brokers and codes — anyone's contacts, from any earlier job");
 D();
 P("The Alliance was never going to beat the Empire militarily. It wins because the Empire keeps proving, on worlds like Rishi, that it deserves to lose.");
 var body=a.map(function(x){return x.t==="pb"||x.t==="div"?"":x.x;}).filter(Boolean).join("\n\n");
 return {id:"d-main",v:2,title:"The Main Story",folder:"Campaign",updated:new Date().toISOString(),blocks:a,body:body};
}

function seedShyndi(){return{
 codex:[
  {id:"c-shyndi",name:"Shyndi Oglerk",kind:"npc",note:"Hyndis Kogler's daughter, operating under a name that was not his. Built the TJ-11 line of saboteur droids as her entry fee into the Dark Trooper project, so that Colonel Gideon and General Mohc would take her as a designer rather than as the Director's daughter. Her father's intended mole inside the Empire's most secret weapons programme.\n\nCornered by the Misfires during Dead in the Water, she killed herself rather than surrender. The Alliance lost a contact worth more alive than anything they took off her.\n\nAndrevas Kog served under her and abandoned her when the situation turned. Whether Hyndis knows that is an open question.",stat:{type:"Deceased — Dead in the Water"}},
  {id:"c-tj11",name:"TJ-11 and the saboteur line",kind:"npc",note:"Hyper-intelligent saboteur droids built to infiltrate and seize control of other droids. Not soldiers: a key, able to turn every droid in a facility against the people beside it. Shyndi Oglerk's design, and her audition piece for the Dark Trooper project.\n\nDestroyed by the party before a single unit shipped. TJ-11 itself knew something of Bex's past, which is the thread her arc eventually pulls on.",stat:{type:"Destroyed — Dead in the Water"}},
  {id:"c-raptor",name:"Shadow Raptor",kind:"asset",note:"Saved rather than destroyed during Dead in the Water, and now the party's to call on. The ship where six strangers became a crew.",stat:{type:"Party asset"}},
  {id:"c-kogler",name:"Director Hyndis Kogler",kind:"npc",note:"Head of the Imperial Security Bureau and the man personally driving Operation: Sentinel, concealing it from COMPNOR and Imperial Intelligence alike. Ambition wrapped in loyalty.\n\nAnd a father. His daughter Shyndi died cornered by this party, and his grievance against them is the one thing about him that is not corrupt. The scene in which he learns who killed her is worth more than any battle.",stat:{type:"Nemesis"}}],
 threads:[
  {id:"t-kogler",title:"Kogler does not yet know who killed his daughter",kind:"main",note:"The Director of the ISB has a private, entirely human reason to want the party dead, and has not connected Shyndi's death to the crew interfering with Operation: Sentinel. A loaded gun. Do not spend it cheaply.",status:"open",order:9},
  {id:"t-kog",title:"Kog abandoned Shyndi, and Hyndis may not know",kind:"main",note:"Andrevas Kog served under both Koglers and saved himself when the situation turned. Cypher intends to make him his first Inquisitor. A second loaded gun, pointed at him.",status:"open",order:10},
  {id:"t-raptor",title:"The Shadow Raptor is a standing party asset",kind:"side",note:"Saved during Dead in the Water. Available to the Alliance and largely unused since.",status:"open",order:11}]

function arcDocs(){return {"d-formos": {"id": "d-formos", "v": 2, "title": "Trouble Brewing — Formos", "folder": "Adventure Modules", "updated": "", "blocks": [{"id": "f1", "t": "h1", "x": "Trouble Brewing"}, {"id": "f2", "t": "quote", "x": "Pirates? Smugglers? We don't have any of them on Formos.\n— Lieutenant Pavan, Formos Garrison"}, {"id": "f3", "t": "p", "x": "Formos is a backwater world in the Outer Rim, unremarkable except for where it sits: the junction of the Pabol Sleheyron and the Triellus Trade Route, and the near end of the Kessel Run. That accident of geography has made it a haven for smugglers, spacers and scum, and it is the reason four separate threads in this campaign all terminate here without any of the people pulling them knowing about the others."}, {"id": "f4", "t": "p", "x": "This adventure adapts the introductory scenario from the Edge of the Empire Core Rulebook. The spine is intact — the dying droid, the cantina, the smuggling gang, the asteroid — but Bandin Dobah has been scaled up considerably, his operation has been given a paymaster, and the people the party finds at the far end of the Kessel Run are no longer strangers."}, {"id": "f5", "t": "callout", "x": "WHAT THIS DOCUMENT IS\nA side-mission beat of the main story, run at the party's discretion during the downtime before the Onderon convergence. It is not on the critical path. Nothing in the main story requires it.\n\nWhat it does contain is the intersection of three Obligation Arcs, and the party will not realise that until they are standing in the middle of it. Derek is looking for a witness. Guy is looking for a ship. Zid is following a name. All three are on this rock, and only the GM knows that when the session begins."}, {"id": "f6", "t": "h2", "x": "The Four Ways In"}, {"id": "f7", "t": "p", "x": "Any one of the following gets the party to Formos. The others activate on arrival, whether or not the party is looking for them."}, {"id": "f8", "t": "table", "x": "", "r": [["Thread", "The Lead", "Whose Arc"], ["Rinn Achara", "Jimmy plays Corin Bast's unfinished transmission. A name, a blaster shot, silence. Rinn was on Formos and the trail goes cold there.", "Derek"], ["The Dauntless Capitalism", "Kleya Marki's datapad of sightings. The ship has been seen on Formos more than once.", "Guy"], ["Caroth Blaine", "Zob Anoor on Mirial names the man selling Duros IFF transponders on the black market — a known associate of Bandin Dobah, a known frequenter of Formos.", "Zid"], ["The Mad Mynock", "Zid's beacon fires the moment the party is in-system. It is not the Mynock. It is the Obfuscating Belligerent, wearing the Mynock's stolen transponder.", "Zid (passive)"]]}, {"id": "f9", "t": "callout", "x": "GM NOTE — THE BEACON IS PASSIVE\nZid does not choose to come to Formos. He does not have to. Whatever brings the party in-system, the beacon fires on arrival, and a signal he has been chasing his entire life turns out to be attached to the wrong ship and a pirate who has no idea what he is carrying.\n\nIf the party arrives for Derek's reasons or Guy's, this is the moment Zid's arc ambushes him. Let it."}, {"id": "f10", "t": "pb", "x": ""}, {"id": "f11", "t": "h1", "x": "Background: What Is Actually Happening Here"}, {"id": "f12", "t": "p", "x": "For the GM only. The party will assemble most of this across the adventure, in the wrong order, from four different directions."}, {"id": "f13", "t": "h2", "x": "Bandin Dobah, Scaled Up"}, {"id": "f14", "t": "p", "x": "The published Dobah is a mid-tier Aqualish pirate muscling in on contraband movement through one spaceport. That is where he started. He is now something considerably worse, because roughly two years ago he acquired a paymaster."}, {"id": "f15", "t": "p", "x": "Dobah controls Formos. Not the spaceport — the planet. Everything that moves through the system moves with his knowledge and pays his margin. He still works through gangs and intermediaries and hired bounty hunters, because that is how he has always worked, but the network is wider and better funded and the people in it are professionals now rather than street toughs. They call themselves the Formos Few."}, {"id": "f16", "t": "p", "x": "Two bounties remain on his head: Moruth Doole's Imperial reward of 10,000 credits, and a smaller one from the Hutt kingpin Thakba Besadii Diori. Both are common knowledge. Neither has been collected, because collecting it means finding him, and nobody can."}, {"id": "f17", "t": "callout", "x": "GM NOTE — THE BOUNTY IS SET DRESSING\nThe published adventure runs on the bounty as motivation. This version does not. The party is not here for a payday, and the holoscreen bounty notice in the cantina exists to tell them who runs this planet, not to give them a job.\n\nIt does explain why two rival syndicates are on-planet at the same time as the party — see Act Two, The Hangar Standoff — and it is why Godon Netakka originally came here. Everyone else in the galaxy thinks this is a bounty story. It isn't."}, {"id": "f18", "t": "h2", "x": "The IFF Operation"}, {"id": "f19", "t": "p", "x": "Somebody has been acquiring Duros family ship registries, stripping their IFF transponders, and selling the hulls and the identities separately. The hulls go to legitimate salvage through ZenCorp Industries. The transponders go onto the black market through a masked intermediary called Caroth Blaine."}, {"id": "f20", "t": "p", "x": "A stolen IFF transponder lets a ship be something other than itself. For a smuggling operation running the Kessel Run under constant Imperial patrol, that is not a luxury — it is the entire business model. Half of the Formos Few's traffic moves under identities that belong to dead Duros houses."}, {"id": "f21", "t": "p", "x": "This is why Dobah defers to Caroth Blaine and to nobody else in the galaxy. Caroth is the supply. Dobah is a customer with no alternative supplier."}, {"id": "f22", "t": "callout", "x": "GM NOTE — WHAT CAROTH BLAINE ACTUALLY IS\nBoliphar Zentron. Zid's father. Twenty years behind a human-seeming mask, running an Imperial-facing cover identity to fund the recovery of the Eye of the Stars, doing ZenCorp's dirtiest work on the orders of a son who does not recognise him.\n\nNothing in this adventure reveals that. Nothing in this adventure should come close. Caroth Blaine is a presence, a reputation and a name attached to Geonosis. The reveal belongs on Duro, and it is worth more the longer it waits."}, {"id": "f23", "t": "h2", "x": "Rinn Achara, Zukata and Godon Netakka"}, {"id": "f24", "t": "p", "x": "Rinn Achara and Zukata built a freight brokerage together. Legitimate, well-run, profitable — and, being legitimate on Formos, a target. Smugglers began skimming their shipments and there was no authority on the planet that would do anything about it."}, {"id": "f25", "t": "p", "x": "So Rinn did what a negotiator does. She went to Bandin Dobah and made a deal: she would broker new beneficiaries into his transponder trade, using her contacts and her considerable skill at a table, and in exchange he would stop hitting her shipments. Zukata thought it was a catastrophic mistake and said so. Rinn did it anyway."}, {"id": "f26", "t": "p", "x": "It worked, briefly. Rinn brokered the arrangement between Dobah and Caroth Blaine that made the Formos operation what it is now. And as the credits began arriving in volume, Dobah did the arithmetic and concluded he no longer needed a broker taking a cut of it. He pushed her out. She fought back — and she was very good at that too, which is exactly why he could not simply leave her in place."}, {"id": "f27", "t": "p", "x": "He took her to the asteroid instead. She has been there ever since. Zukata does not know where she is, only that she is gone, and has been widening her search for months under cover of an atlas survey contract."}, {"id": "f28", "t": "p", "x": "Godon Netakka is Zukata's brother. When Rinn disappeared, Zukata intended to go after her herself. Godon — a young Rodian bounty hunter, badly in debt, in over his head — went instead, because he knew perfectly well that his sister would be killed doing it. He flew into the Kessel Run alone. An ion storm took his ship apart around him and left it derelict."}, {"id": "f29", "t": "p", "x": "Bandin Dobah pulled him out. And Godon, who came here to take Dobah in, found himself alive because of the man, and — far more to the point — found Rinn on the same rock. So he stayed. He has been in Dobah's crew for months, playing the part of a young hunter who lost his nerve and took the easier road, because as long as he is on that asteroid, there is one person standing between Rinn Achara and Bandin Dobah."}, {"id": "f30", "t": "callout", "x": "GM NOTE — GODON IS NOT COMPROMISED\nThe published adventure has Godon inexplicably talked out of his duty by a man he came to arrest, and it never quite convinces. This version explains it exactly: Dobah saved his life, and Rinn is here.\n\nHe is not conflicted about which side he is on. He has been waiting years for enough leverage to move, and one bounty hunter against the Formos Few is not leverage — it is a funeral. He plays it cool because playing it cool is the only thing keeping Rinn safe. When the odds change, he moves immediately."}, {"id": "f31", "t": "p", "x": "Godon has also been smuggling Rinn flight manuals. He cannot navigate the Kessel Run — that is what wrecked him — and Rinn is a negotiator, not a pilot. Neither of them can leave alone. Their entire escape plan is Rinn learning to fly well enough to get a stolen ship through the nebula, and she is perhaps halfway there."}, {"id": "f32", "t": "p", "x": "Which is where the party comes in."}, {"id": "f33", "t": "pb", "x": ""}, {"id": "f34", "t": "h1", "x": "Act One — The Formos Spaceport"}, {"id": "f35", "t": "p", "x": "The party lands, the planet is unpleasant, and the plot finds them within the hour."}, {"id": "f36", "t": "h2", "x": "Landing on Formos"}, {"id": "f37", "t": "p", "x": "A Limited Services Port: a wide expanse of duracrete, a small control tower, sheds for docking and storage. Fees are trivial and a smuggler can talk them lower."}, {"id": "f38", "t": "read", "x": "As soon as you set foot on the planet, you are instantly struck by the stale and parched atmosphere of Formos. The air is breathable, but desiccated despite the cool climate. Most species begin to feel thirsty shortly after landing, and those used to life on humid worlds soon feel dehydrated and uncomfortable. You notice that species with an aquatic heritage — such as Aqualish, Mon Calamari, and Herglic — are notably absent from those who make a home here.\n\nThankfully, water sellers are a common sight patrolling the streets and docks, though the prices they advertise would be considered extortionate on most habitable worlds."}, {"id": "f39", "t": "callout", "x": "GM NOTE — SKIP THE OPTIONAL ENCOUNTERS\nThe published adventure offers five colour encounters — the water seller, the Tritonite missionary, Mama Nobah and her pickpocket son, Vreebo Gango, Lei Muoroy. This version uses none of them as scenes.\n\nWater sellers and the general texture of the place stay as background description. Everything else is cut. The party has four live threads on this planet and does not need a red herring extortion racket competing for session time."}, {"id": "f40", "t": "h2", "x": "The Imperial Presence"}, {"id": "f41", "t": "p", "x": "Eighteen Imperial Army Troopers in a fortified barracks, two of them squad sergeants. They are a gesture, not a garrison. The unspoken arrangement is that the troopers do not lean on the smuggling operations and the locals do not attack the troopers, and both sides find this preferable to the alternative."}, {"id": "f42", "t": "p", "x": "They will not trouble the party unless the party troubles them first. The barracks holds a pair of E-Web repeating blasters and an antiquated Atgar 1.4 FD P-Tower on the roof, which theoretically can shoot down illicit transports and never has."}, {"id": "f43", "t": "callout", "x": "GM NOTE — WHY THE EMPIRE TOLERATES DOBAH\nA question a clever party will ask. The answer is that the Formos Few move under stolen Duros IFF transponders, which means that on paper, most of the traffic through this system is legitimate registered shipping belonging to real houses.\n\nThe Empire is not being bribed. It is being lied to, systematically, with paperwork good enough to survive a cursory glance — and there is nobody on Formos with the authority or interest to look harder. This is the operation the party is about to start unravelling."}, {"id": "f44", "t": "h2", "x": "The Sad Fate of J9-B8"}, {"id": "f45", "t": "p", "x": "Runs as published, and it remains the on-ramp regardless of which thread brought the party here."}, {"id": "f46", "t": "read", "x": "The disorderly jumble of hastily constructed dwellings around the cantina makes for a maze of tight alleyways filled with all manner of obstruction. Portable trash compactors, piles of crates, and personal moisture condensers line the gangways that thread between houses and shops.\n\nAs you pass a particularly dark and narrow alleyway nestled between a pair of towering warehouses, you hear a commotion. There is a loud rattle and a buzzing noise coming from within the alley. The rattling stops, and you hear a low and monotonous voice calling out. The voice is buzzing and faint, but you can still hear: \"Hello! Bzzzt! Help pleazzze! I need help!\""}, {"id": "f47", "t": "p", "x": "J9-B8 is a manumitted 3PO-variant protocol droid, beyond repair, with minutes of function left. His companion R4-W9 — an astromech carrying a comprehensive navigational analysis of the Kessel Run — was taken by hooded thugs about twenty hours ago. He does not know who they were. He suspects Bandin Dobah, whose people have been muscling in on Kessel Run operations for months."}, {"id": "f48", "t": "p", "x": "Mechanics cannot save him. Characters who try can make him comfortable, and nothing else."}, {"id": "f49", "t": "callout", "x": "GM NOTE — R4-W9 MATTERS MORE HERE THAN IN THE BOOK\nIn the published adventure R4-W9 is a plot device that points at an asteroid. In this version he is also the only comprehensive Kessel Run navigational analysis in the sector, and the Kessel Run is now a genuine hazard with dice attached to it (see Act Three).\n\nFreeing R4-W9 is not optional flavour. It is the difference between a difficult approach and a very dangerous one."}, {"id": "f50", "t": "pb", "x": ""}, {"id": "f51", "t": "h1", "x": "Act Two — Rii Jenks' Cantina"}, {"id": "f52", "t": "p", "x": "The information hub, and the point at which the party may begin to notice that more than one of them has business on this rock."}, {"id": "f53", "t": "read", "x": "As you enter the lobby of the cantina, you are aware of a change in atmosphere. The air conditioning alone is almost as refreshing as the beverages served at the well-appointed bar promise to be. The cantina is clearly a popular spot for locals to mix, though it isn't so crowded as to make it impossible for you to get seats. All manner of humans and aliens rub shoulders at the bar, and they even seem happy to let droids in. To your right, a flickering holoscreen displays the rotating head of a tough-looking adult male Aqualish, with scrolling text advertising an Imperial bounty."}, {"id": "f54", "t": "p", "x": "Rii Jenks is a canny old Bith who keeps Imperial agents and Hutt kingpins sweet with bribes and information, and stays on the right side of the smuggling community by making sure none of the information he sells conflicts with their interests. Fia Mund plays freeform jatz on the raised stage. The place is a genuine sanctuary and everyone in it knows better than to discuss business aloud."}, {"id": "f55", "t": "h2", "x": "What Each Thread Finds"}, {"id": "f56", "t": "table", "x": "", "r": [["Asking about", "What comes back"], ["Rinn Achara", "Ran a freight brokerage, well regarded,
