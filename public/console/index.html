 sees it. She takes it into another room, holds it, and comes back. She says: \"I don't think this is for me.\" She says it without grief — or rather, with a grief she has already made her peace with. She is not a guide or an exposition source. She is a woman who has already finished her story and is watching someone else begin theirs."}, {"id": "a21", "t": "callout", "x": "Lyn Rakish\nBARRISS'S PARTNER · SPINTIR\nFormer Inquisitor. The woman who stabbed Barriss and then refused to let her die. Quiet, watchful, and does not trust easily. She will not leave Barriss's side under any circumstances. She knows things about Force vergences that will matter at Tython — the Inquisitorius studied them obsessively. When Grevi earns a fragment of her trust, that knowledge becomes available. Slowly. On her terms."}, {"id": "a22", "t": "callout", "x": "Luminara Unduli\nTHE VOICE IN THE HOLOCRON · THE FORCE\nDead. Executed on Stygeon Prime. Grevi does not know this when the arc begins. The holocron contains her voice — recorded before the Clone Wars ended, intended for Barriss, delivered instead to a Mirialian man she never met who carries her family name. She speaks through the device in four lesson messages, and in a series of separate lore messages about the seeing stones — her life's obsession and her intended legacy for the Jedi Order. She speaks through the Force once, at the very end, on Tython."}, {"id": "a23", "t": "h2", "x": "Rivals & Antagonists"}, {"id": "a24", "t": "callout", "x": "Doctor Aphra\nTHE RIVAL · ROGUE ARCHAEOLOGIST\nFirst encountered in the ruins of Dawn Temple on Spintir — she was doing unsanctioned archaeological work when Malefax's people grabbed her. The crew rescues her without knowing who she is. She is battered, sarcastic, and immediately fascinating. She thanks everyone, clocks Luminara's holocron in Grevi's hands, files that information away without a word, and disappears before anyone asks what she was doing there.\nShe resurfaces on Stygeon Prime, already ahead — following her father's research into the same Jedi sites Luminara visited. She is not a villain. She wants the academic glory of finding Tython and whatever artifacts come with it. With Grevi now building his own understanding of the seeing stones across the constellation worlds, Aphra's role shifts from answer-provider to genuine rival — someone racing him to the same conclusions from a different angle.\nThe best ending has her shaking Grevi's hand and saying: \"Hey — let's grab a drink sometime. You know, so you can have your share of the credits.\" She will be holding whatever artifact she came for. She will be completely unbothered by the fact that he just found the birthplace of the Jedi Order."}, {"id": "a25", "t": "callout", "x": "The Bounty Hunter\nTHE SHADOW · UNKNOWN CONTRACTOR\nAnonymous. Masked. Professional. Hired to monitor whoever was following Luminara Unduli's trail after Aphra tripped a silent Imperial alarm at a restricted Jedi archive. Grevi got caught in the same net. The Hunter does not negotiate or monologue. They are a consequence, not a character — a shadow that grows longer the louder the trail becomes."}, {"id": "a26", "t": "callout", "x": "GREVI'S FATHER\nGrevi succeeded on a Formidable Knowledge check regarding Spintir's location — a result significant enough to mean something more than lucky recall. The working idea is that Grevi's father visited Spintir once, years ago, for reasons Grevi does not fully understand. Before this is written into the document, confirm with Grevi's player whether his father is dead, alive, or unknown to Grevi — this determines what can be discovered on Spintir and potentially on one of the constellation worlds, and should not be decided unilaterally by the GM."}, {"id": "a27", "t": "h1", "x": "The Four Lessons"}, {"id": "a28", "t": "p", "x": "Luminara's holocron has four corners. Each opens not through skill or knowledge, but through genuine personal growth — the Force recognising that Grevi has become, in some real way, someone different. Each opening is triggered by a dice roll and delivers a lesson message from Luminara along with a cryptic task. These are separate from the lore messages about the seeing stones (see The Constellation, below) — the lessons are intimate, addressed to Barriss, about growth. The lore messages are scholarly, addressed to no one in particular, about Luminara's life's work."}, {"id": "a29", "t": "callout", "x": "She didn't make this for me. The Force put it in your hands, not mine. Whatever is inside — that's yours.\n— Barriss Offee, on Spintir"}, {"id": "a30", "t": "callout", "x": "\"There is no emotion, there is peace.\"\nLuminara's Message: \"Barriss, my beloved apprentice. Every day we spend together I am amazed by how wise a Jedi you have become... Within this holocron are four lessons, each opening one corner of this device. As my first lesson, I ask that you first be at peace. We manage our emotions not through suppression, but introspection. Good luck, Barriss. May the Force be with you.\"\nThe Task: \"Find the voice you have been too busy to hear.\"\nWhat It Means: Grevi must stop. Not meditate formally — just be genuinely still long enough for the world to exist around him. The corner opens when a moment of genuine stillness is actually lived, not performed."}, {"id": "a31", "t": "callout", "x": "\"There is no ignorance, there is knowledge.\"\nLuminara's Message: \"You have found your peace, and I am glad. But peace without understanding is stillness without purpose. Knowledge is what you see when you look at the world as it truly is, not as you expect it to be. I have seen your mind become a cage. The next time the path ahead seems clear, stop. Look again.\"\nThe Task: \"When the answer presents itself, turn away from it. Look at what stands beside it.\"\nWhat It Means: Grevi must find a different solution than the obvious one — and act on it genuinely. The corner opens when he chooses the path beside the path."}, {"id": "a32", "t": "callout", "x": "\"There is no passion, there is serenity.\"\nLuminara's Message: \"The storm will come. It always does. A hurricane cannot be defeated by another hurricane. Only by the eye at its centre. When the storm comes for you, find that place. Not to solve the crisis. Not to win. Simply to be the stillness that others can find their way back to.\"\nThe Task: \"When everything demands that you act — do not act. Become the thing that does not move.\"\nWhat It Means: During genuine crisis, Grevi must hold rather than escalate. The corner opens when a storm rages and Grevi is the eye of it."}, {"id": "a33", "t": "callout", "x": "\"There is no chaos, there is harmony.\"\nLuminara's Message: \"Everything I have asked of you until now has been about you. But the Force is not yours. It flows through every living thing. You are not separate from them. You never were. What would you give — truly give, without counting the cost — if the Force asked it of you? You are ready. You have always been ready.\"\nThe Task: No cryptic instruction. Only the question.\nWhat It Means: The holocron then opens fully — revealing a kyber crystal and Luminara's final recorded message, her voice cracking as she speaks of Suljo Warde and sends Grevi toward a place she never got to go."}, {"id": "a34", "t": "h1", "x": "The Holocron Opens"}, {"id": "a35", "t": "h2", "x": "Luminara's Final Recorded Message"}, {"id": "a36", "t": "p", "x": "When all four corners open, the holocron unfolds completely. A kyber crystal sits at its centre — small, pale, faintly luminous. When Grevi takes it, the Force pulls him: a direction, a place, somewhere old. Then Luminara speaks for the last time from the device."}, {"id": "a37", "t": "read", "x": "\"Barriss. If you are hearing this, then you have become everything I hoped you would be. I am so proud of you. I need you to know that before I tell you what comes next.\"\n\"Some of my friends were killed today. Not by the enemy. But by one of our own. He was also my friend — Suljo Warde. I cannot understand his crime, and I cannot understand his motives. But you can, Barriss. I want you to put him to rest.\"\n\"This wasn't the lesson I intended. But it is the lesson the Force gives us. Start on Spintir — I have placed those coordinates in this kyber crystal.\"\n\"May the Force be with you. Always.\""}, {"id": "a38", "t": "callout", "x": "TWO HOLOCRONS\nAt this point the crew possesses both Luminara's holocron and Warde's holocron, found in the ruins of Dawn Temple on Spintir. This is remarkable, and Barriss should say so: \"Do you have any idea how extraordinary it is that these two ended up in the same hands?\" Luminara's belongs to Grevi's personal arc. Warde's belongs to the group — and to the Chronicles of the Gatekeeper adventure, should you choose to run it in full."}, {"id": "a39", "t": "h1", "x": "The Constellation"}, {"id": "a40", "t": "p", "x": "After Spintir, the holocron does not point to a single next destination. It opens onto a constellation — coordinates to several worlds Luminara visited in pursuit of her life's obsession: the seeing stones. Grevi may visit them in any order. Each world's seeing stone is inactive, broken, or otherwise silent, and each teaches a different lesson about why — a lesson Grevi assembles piece by piece, so that by the time he reaches Tython he understands what these things are and how to build one, without needing anyone to tell him."}, {"id": "a41", "t": "p", "x": "Each world's holocron message is self-contained. Whether it is the first stone Grevi finds or the third, the message speaks to that specific site — its history, what Luminara learned there, what happened to it. The messages are not numbered and do not assume a prior visit. They are lore entries, not sequential chapters."}, {"id": "a42", "t": "callout", "x": "ON SEQUENCING\nBecause these worlds can be visited in any order, none of the three messages below should reference \"the last stone you found\" or otherwise assume prior knowledge. Write each one as if it might be Grevi's first. Let the player draw the connections between them himself as more are collected — that discovery is more powerful than the text doing it for him."}, {"id": "a43", "t": "h2", "x": "Yavin — The Massassi Temple"}, {"id": "a44", "t": "p", "x": "The crew's reason for going is not Grevi's. The Rebellion needs supplies left behind during the evacuation after the first Death Star's destruction, and Grevi asks the team to retrieve them — or the team realises helping the Rebellion is reason enough on its own. At the heart of the Massassi temple where the supplies were hidden, the crew finds themselves racing tomb raiders after the same cache, or after something older buried beneath it."}, {"id": "a45", "t": "p", "x": "At the centre of the temple, past the crates and the ruins and whatever fight the tomb raiders bring, is a broken seeing stone. Ancient. Cracked through its centre as if struck deliberately. The holocron activates here, unprompted."}, {"id": "a46", "t": "p", "x": "The message concerns Exar Kun — the Jedi-turned-Sith Lord who built this stone and shattered it himself before his fall could turn it into a weapon of the dark side. Luminara's voice carries genuine grief for what he became, and genuine awe for what he built. This is Grevi's first encounter with a failure born of corruption from within — a light deliberately extinguished by the one who lit it, so that darkness could never use it."}, {"id": "a47", "t": "h2", "x": "Jedha — The Holy City"}, {"id": "a48", "t": "p", "x": "Details to be finalised alongside Bex's updated obligation arc, which intersects here. The broad shape: the Empire's destruction of Jedha did not only devastate a city and a faith — it destroyed a seeing stone in the Holy City, connected to the same kyber crystal tradition that powers both holocrons and lightsabers. Grevi finds fragments among the wreckage and must piece together what stood here from what remains."}, {"id": "a49", "t": "p", "x": "This is Grevi's encounter with destruction from without — not chosen, not deserved, simply inflicted. The Empire did not know what they destroyed. Grevi is perhaps the only person alive who would have known to look for it."}, {"id": "a50", "t": "h2", "x": "Korriban — The Valley of the Dark Lords"}, {"id": "a51", "t": "p", "x": "The crew's reason for going runs through Guy Rando: Ruy Gando has been fencing \"authentic Sith relics\" as a con, except this time they are genuinely authentic, looted from an actual site on Korriban, and something out there — Dark Side Acolytes, remnants of something far older — wants them back. Ruy's chaos becomes the crew's problem, and the trail leads to the last place any sane being would choose to go."}, {"id": "a52", "t": "p", "x": "At the heart of Sith territory, surrounded by tombs and the petrified legacy of the galaxy's oldest evil, the crew finds a seeing stone. Intact. Working. Built by a Jedi who came here in defiance and somehow was never stopped."}, {"id": "a53", "t": "p", "x": "This is Grevi's most unsettling and clarifying discovery: the light did not fail here. It survived in the very heart of the dark. Luminara's message on Korriban is the one that reframes everything Grevi thought he understood about what these stones are and what they can withstand."}, {"id": "a54", "t": "callout", "x": "MALACHOR — A FRAGMENT, NOT A DESTINATION\nMalachor belongs to Bylie's arc and should not become a fourth constellation world for Grevi. However, since the crew will already be there for main story reasons, Grevi can find a small trace — a fragment, an inscription, a single detail about whether a seeing stone could ever have existed inside a place so saturated with the dark side. This should cost no additional session time and should not distract from Bylie's convergence on that world."}, {"id": "a55", "t": "h1", "x": "Stygeon Prime"}, {"id": "a56", "t": "p", "x": "Fixed Point · Corners Two and Three Unlock (if not already) · The Transformation"}, {"id": "a57", "t": "h2", "x": "What Grevi Discovers"}, {"id": "a58", "t": "p", "x": "Stygeon Prime is an Imperial prison world. The Spire is where the Inquisitorius operated. It is also where Luminara Unduli was executed."}, {"id": "a59", "t": "p", "x": "Grevi does not know this when the crew arrives. He finds out the way you find out things on a prison world — in records, in the way certain names are spoken or not spoken. In a cell block log. In something scratched into a wall by someone who survived and never forgot."}, {"id": "a60", "t": "p", "x": "Luminara is dead. She has been dead for years. The quest does not end. It transforms. He is not chasing a living woman anymore. He is completing what she left unfinished, knowing she never got to finish it herself."}, {"id": "a61", "t": "h2", "x": "Aphra, Already Ahead"}, {"id": "a62", "t": "p", "x": "She is on Stygeon Prime when the crew arrives. She has been following her father's research for months. She knows about the Jedi archive pointing toward Tython. She does not have Tython's location yet. She is close. She and Grevi are now in a race. The question is whether it needs to be."}, {"id": "a63", "t": "h2", "x": "What the World Offers the Whole Crew"}, {"id": "a64", "t": "p", "x": "Stygeon Prime is not only Grevi's world. The Spire holds Imperial prisoners. There may be people the crew wants to find. Seed at least one hook here that matters to another player character, so the visit never feels like a Grevi detour."}, {"id": "a65", "t": "callout", "x": "CORNERS TWO AND THREE\nStygeon Prime should span enough sessions for both remaining lesson corners to unlock naturally through play, if they have not already opened during the constellation worlds. The discovery of Luminara's death is the emotional midpoint of the arc — give it room to breathe. Do not rush to the next lesson."}, {"id": "a66", "t": "callout", "x": "The Bounty Hunter — First Contact\nANTAGONIST · STYGEON PRIME\nThe Bounty Hunter makes themselves known here — not in confrontation, but in warning. Something goes missing. Someone who was helping the crew becomes suddenly unavailable. The shadow has a shape now, even if it has no face."}, {"id": "a67", "t": "h1", "x": "Tython"}, {"id": "a68", "t": "p", "x": "Fixed Endpoint · The Seeing Stone · The Reunion"}, {"id": "a69", "t": "h2", "x": "What Tython Is"}, {"id": "a70", "t": "p", "x": "The ancient birthplace of the Jedi Order — lost to most of the galaxy, its coordinates scrubbed from Imperial records, its existence reduced to myth. It is empty. The Jedi are long gone. Their temples are the only trace."}, {"id": "a71", "t": "p", "x": "Grevi arrives guided by the kyber crystal's pull — a sense of knowing, not a map. He knows what he needs to build, because the constellation has already taught him. He does not need Aphra's excavation diary. He carries the knowledge himself."}, {"id": "a72", "t": "h2", "x": "Who Builds the Stone"}, {"id": "a73", "t": "p", "x": "The seeing stone is not built alone. That is the point. That is the final lesson the holocron could not teach — harmony cannot be told, only lived."}, {"id": "a74", "t": "p", "x": "Barriss contributes deep Force knowledge about vergences, relayed remotely. She cannot travel."}, {"id": "a75", "t": "p", "x": "Lyn contributes Inquisitorial knowledge of Force convergence points."}, {"id": "a76", "t": "p", "x": "The crew contributes their own insights. Every player character has a role."}, {"id": "a77", "t": "p", "x": "Aphra arrives, sees what Grevi has already built in his understanding, and — rather than providing the answer — recognises she is looking at someone who has surpassed her research. She contributes what she can and steps back to watch, genuinely curious."}, {"id": "a78", "t": "p", "x": "Grevi lifts every stone into place with the Force, knowing exactly why each piece belongs where it does."}, {"id": "a79", "t": "h2", "x": "The Seeing Stone Communion"}, {"id": "a80", "t": "p", "x": "Grevi sits on the completed stone. The crew holds the perimeter — the Bounty Hunter may have followed, and Imperials may not be far behind. The crew protects Grevi while he is completely vulnerable. This is the arc's final reversal: the loner, protected by the people he learned to trust."}, {"id": "a81", "t": "read", "x": "The stone is a confluence — time exists outside it. Anyone who communes here does so at the same moment, within the Force.\nGrevi finds Luke Skywalker. Post-Endor. A man who has redeemed his father and destroyed the Sith, sitting quietly somewhere in the future, strong in the Force.\nGrevi finds Grogu. A small child, ancient-eyed, asking for help that Grevi cannot give — because that help belongs to someone else.\nLuke steps aside. And Grevi finds Luminara.\nShe sees him. Actually sees him. Not Barriss. Him.\nBeside her: Barriss. Beside Barriss: Lyn. Together. Whole. At peace. In the Force.\n\"There is no death. There is only the Force.\""}, {"id": "a82", "t": "callout", "x": "THE VISION BEFORE BUILDING\nBefore constructing the stone, Grevi uses Warde's Foresight and sees a dark future: a child dying, a Mandalorian killed, Moff Gideon and thousands of dark trooper droids, Mandalore burning. He sees what happens if the Rebellion has no base after Hoth. He does not ask Luke about it — Warde's lesson weighs on him. He builds in faith instead."}, {"id": "a83", "t": "h2", "x": "The Alliance's Gift"}, {"id": "a84", "t": "p", "x": "When the crew returns from Tython with confirmed coordinates and a Force vergence strong enough to train in, the Rebellion has found its next base of operations. The personal arc becomes a turning point for the entire war effort."}, {"id": "a85", "t": "h1", "x": "Obligation Mechanics"}, {"id": "a86", "t": "h2", "x": "Obligation Increases"}, {"id": "a87", "t": "table", "x": "", "r": [["Situation", "Change"], ["Not meditating or being at peace during downtime", "+5"], ["Grevi takes unilateral arc action without involving the crew", "+5"], ["A corner's cryptic task goes unaddressed for a full session", "+5"], ["Grevi uses Warde's Foresight and acts on the vision without consulting anyone", "+5"]]}, {"id": "a88", "t": "h2", "x": "Obligation Decreases"}, {"id": "a89", "t": "table", "x": "", "r": [["Situation", "Change"], ["Grevi genuinely meditates during downtime (roleplayed, not declared)", "-5"], ["A corner's cryptic task is completed to the GM's satisfaction", "-5"], ["A corner of the holocron opens", "-10"], ["Grevi shares the holocron with another crew member unprompted", "-10"], ["The crew reaches Spintir and meets Barriss", "-10"], ["A constellation world's seeing stone is found and its lore message received", "-10"], ["The crew completes the Beginner Game and Barriss unlocks the holocron", "-15"], ["The crew arrives on Tython", "-20"], ["The seeing stone is completed", "-30"]]}, {"id": "a90", "t": "h2", "x": "Trigger Table"}, {"id": "a91", "t": "p", "x": "When Grevi's obligation is triggered by a dice roll, the effect depends on the current arc stage."}, {"id": "a92", "t": "table", "x": "", "r": [["Arc Stage", "Trigger Effect"], ["Pre-Spintir", "The holocron activates again, clearer than before. \"Barriss... my dear Barriss...\" The name is now distinct. More fragments before it cuts. Spintir's coordinates pulse briefly."], ["Constellation (post-Spintir, pre-Stygeon Prime)", "The current lesson corner's message replays with a different emphasis, OR a fragment of a constellation world's coordinates becomes clearer if one is not yet known."], ["Post-Holocron, Tython Arc", "Doctor Aphra makes contact with new information about the hunt — a discovery, a lead, a piece of the Tython puzzle she is willing to trade. Her terms are characteristically opaque."]]}, {"id": "a93", "t": "h2", "x": "Doubles Table"}, {"id": "a94", "t": "p", "x": "When doubles are rolled, the effect is more significant — a breakthrough, a warning, or a revelation."}, {"id": "a95", "t": "table", "x": "", "r": [["Arc Stage", "Doubles Effect"], ["Pre-Spintir", "The holocron gets stuck. Spintir. Spintir. Spintir. Luminara's voice repeating coordinates on a loop, growing louder, until Grevi commits to going. The whole crew hears it."], ["Constellation (post-Spintir, pre-Stygeon Prime)", "A raw fragment activates — Luminara in combat during the Clone Wars, precise and beautiful, no lesson framing. Grevi can study it as a lightsaber technique. Hidden within: clues to a constellation world not yet visited."], ["Post-Holocron, Tython Arc", "Aphra makes a grand discovery of her own. The Bounty Hunter was watching when she found it."]]}, {"id": "a96", "t": "h1", "x": "The Hundred Obligation"}, {"id": "a97", "t": "h2", "x": "Pre-Tython: The Village"}, {"id": "a98", "t": "p", "x": "The Bounty Hunter tracks the trail back to Spintir — not to Grevi, to its source. The crew receives no warning. When they return, or when they next make contact, the distress call has already ended."}, {"id": "a99", "t": "read", "x": "The village is quiet in a way that is not peace.\nThe first thing you notice is the smell. Then the silence where there should be children. Then the shapes in the street that are not sleeping.\nBarriss and Lyn are gone. The trail Grevi followed so loudly, across so many worlds, led here. To this."}, {"id": "a100", "t": "p", "x": "Burnt skeletons. Dead children in the street. Whatever fragile peace Barriss and Lyn had built on this mountain is ash."}, {"id": "a101", "t": "callout", "x": "THE LUKE PARALLEL\nThis beat consciously echoes Luke returning to the Lars homestead. But where Luke's family died because of who Luke was, this village died because of what Grevi did. Let the player feel the full weight of that."}, {"id": "a102", "t": "h2", "x": "The Arc Continues"}, {"id": "a103", "t": "p", "x": "Grevi still has Warde's holocron, whatever corners and constellation lore he has already collected, and Tython in his memory. The 100 Obligation does not end the arc — it transforms it into something heavier and more urgent."}, {"id": "a104", "t": "h2", "x": "Post-Tython: The Path Closed"}, {"id": "a105", "t": "p", "x": "If the 100 Obligation triggers after Tython is found but before the stone is built, the Bounty Hunter arrives first with Imperial backup. The seeing stone must be built under fire. The epilogue is desperate rather than serene. It still happens — but at a cost the GM should make visceral and real."}, {"id": "a106", "t": "h1", "x": "Closing Notes for the GM"}, {"id": "a107", "t": "callout", "x": "ON GREVI'S PLAYER\nGrevi's player is newer to roleplaying. Keep the beats legible and emotional rather than lore-dependent. The big moments — the village, the stone, the reunion in the Force — should be described vividly and slowly."}, {"id": "a108", "t": "callout", "x": "ON WARDE'S FORESIGHT\nEvery time Grevi uses it and acts without consulting anyone, his obligation increases. Every time he brings the crew into the decision, something good happens. This is a test of the arc's central lesson — connection, not isolation."}, {"id": "a109", "t": "callout", "x": "ON WHAT LUMINARA SAYS ON TYTHON\nThe GM determines Luminara's words to Grevi based on who he has become. The only fixed element is the final line: \"There is no death. There is only the Force.\""}, {"id": "a110", "t": "callout", "x": "ON BARRISS AND LYN IN THE FORCE\nThe moment Grevi finds them beside Luminara is the emotional apex of the arc. Do not rush past this moment. Let it exist."}, {"id": "a111", "t": "callout", "x": "There is no death. There is only the Force.\n— Luminara Unduli, inside the seeing stone, on Tython"}, {"id": "a112", "t": "callout", "x": "OPEN ITEMS — NOT YET FINALISED\n1. Grevi's father: dead, alive, or unknown — pending conversation with the player.\n2. Full text of the Jedha holocron message, pending coordination with Bex's updated obligation arc.\n3. Full text of the Korriban and Yavin holocron lore messages beyond the summary given here.\n4. Whether the Dark Side Acolytes on Korriban have designs on the seeing stone itself once found, or purely on their stolen relics.\n5. The Malachor fragment — exact content and how it's delivered without stepping on Bylie's arc."}], "body": "LEGACY OF THE UNDULI\n\nGrevi Unduli — Obligation Arc · Working Draft\n\nThe Arc in Brief\n\nLuminara Unduli was taken from the Unduli family when she was very young — young enough that she left almost nothing behind. Only a legend. The family honoured that legend quietly, speaking in hushed tones of the one who became a great Jedi, until Order 66 made silence the only safe option.\n\nFor Grevi, the silence never made sense. If she was so great, why erase her? He went searching for truth, and found a discarded holocron on Mirial — thrown away by someone who didn't want it. He touched it. He saw Luminara's face. He felt, for the first time in his life, that something was pointing at him specifically.\n\nHe has been trying to open it ever since.\n\nThe Emotional Core\n\nGrevi is a loner. He has always done things alone — not from preference, but from habit, and from a quiet belief that the galaxy is too large and too dangerous to trust anyone else with the things that matter most.\n\nThe holocron disagrees. It opens corner by corner, not in response to skill or knowledge, but in response to growth — the growth of someone who has always done things alone learning that he cannot. That asking for help is not weakness. That staying when things are hard is not surrender. That giving something freely, without counting the cost, is the most powerful thing a person can do.\n\nLuminara made a holocron that can only be fully opened by someone who has learned to be present for the people around them. She made it for Barriss. The Force put it in Grevi's hands instead.\n\nThe Explorer's Journey — A Note on Structure\n\nGrevi is an Explorer by career. This arc is built to honour that. Rather than a fixed sequence of planets, the holocron opens into a constellation of destinations that Grevi can pursue in whatever order suits the campaign and the player. Spintir is the fixed entry point. Stygeon Prime is the fixed emotional midpoint. Tython is the fixed endpoint. Between Spintir and Stygeon Prime sit three constellation worlds — Yavin, Jedha, and Korriban — each visitable in any order, each teaching Grevi something different about the seeing stones Luminara devoted her life to studying.\n\nThis is a deliberate agency fix. Grevi does not follow a trail someone else laid. He chooses which part of Luminara's legacy to pursue next, and the story accommodates him arriving at each world with a different amount of prior knowledge.\n\nThe Destination\n\nAt the end of this arc, Grevi finds Tython — the ancient birthplace of the Jedi Order, lost to the galaxy for generations. He builds a seeing stone there himself, using knowledge earned across every prior world, not knowledge handed to him. He builds it to call someone. He does not know who, at first. When the stone activates and Luke Skywalker appears across the years inside the Force, Grevi understands what he was always building it for.\n\nThe Rebellion finds a base. The galaxy finds a thread of hope. Grevi finds Luminara — and beside her, in the Force, Barriss and Lyn.\n\nKey Characters\n\nAllies\n\nBarriss Offee\nTHE TORCH-BEARER · SPINTIR\nLuminara's former padawan. Ex-Jedi, ex-Inquisitor, redeemed — though she would never use that word. She was carried off a snow-covered battlefield by Lyn Rakish, the woman who had just stabbed her through the heart, and somehow they both survived. She cannot walk unaided. She lives quietly on Spintir with Lyn and has been bracing for this knock on the door for years.\nBarriss recognises Luminara's holocron the moment she sees it. She takes it into another room, holds it, and comes back. She says: \"I don't think this is for me.\" She says it without grief — or rather, with a grief she has already made her peace with. She is not a guide or an exposition source. She is a woman who has already finished her story and is watching someone else begin theirs.\n\nLyn Rakish\nBARRISS'S PARTNER · SPINTIR\nFormer Inquisitor. The woman who stabbed Barriss and then refused to let her die. Quiet, watchful, and does not trust easily. She will not leave Barriss's side under any circumstances. She knows things about Force vergences that will matter at Tython — the Inquisitorius studied them obsessively. When Grevi earns a fragment of her trust, that knowledge becomes available. Slowly. On her terms.\n\nLuminara Unduli\nTHE VOICE IN THE HOLOCRON · THE FORCE\nDead. Executed on Stygeon Prime. Grevi does not know this when the arc begins. The holocron contains her voice — recorded before the Clone Wars ended, intended for Barriss, delivered instead to a Mirialian man she never met who carries her family name. She speaks through the device in four lesson messages, and in a series of separate lore messages about the seeing stones — her life's obsession and her intended legacy for the Jedi Order. She speaks through the Force once, at the very end, on Tython.\n\nRivals & Antagonists\n\nDoctor Aphra\nTHE RIVAL · ROGUE ARCHAEOLOGIST\nFirst encountered in the ruins of Dawn Temple on Spintir — she was doing unsanctioned archaeological work when Malefax's people grabbed her. The crew rescues her without knowing who she is. She is battered, sarcastic, and immediately fascinating. She thanks everyone, clocks Luminara's holocron in Grevi's hands, files that information away without a word, and disappears before anyone asks what she was doing there.\nShe resurfaces on Stygeon Prime, already ahead — following her father's research into the same Jedi sites Luminara visited. She is not a villain. She wants the academic glory of finding Tython and whatever artifacts come with it. With Grevi now building his own understanding of the seeing stones across the constellation worlds, Aphra's role shifts from answer-provider to genuine rival — someone racing him to the same conclusions from a different angle.\nThe best ending has her shaking Grevi's hand and saying: \"Hey — let's grab a drink sometime. You know, so you can have your share of the credits.\" She will be holding whatever artifact she came for. She will be completely unbothered by the fact that he just found the birthplace of the Jedi Order.\n\nThe Bounty Hunter\nTHE SHADOW · UNKNOWN CONTRACTOR\nAnonymous. Masked. Professional. Hired to monitor whoever was following Luminara Unduli's trail after Aphra tripped a silent Imperial alarm at a restricted Jedi archive. Grevi got caught in the same net. The Hunter does not negotiate or monologue. They are a consequence, not a character — a shadow that grows longer the louder the trail becomes.\n\nGREVI'S FATHER\nGrevi succeeded on a Formidable Knowledge check regarding Spintir's location — a result significant enough to mean something more than lucky recall. The working idea is that Grevi's father visited Spintir once, years ago, for reasons Grevi does not fully understand. Before this is written into the document, confirm with Grevi's player whether his father is dead, alive, or unknown to Grevi — this determines what can be discovered on Spintir and potentially on one of the constellation worlds, and should not be decided unilaterally by the GM.\n\nThe Four Lessons\n\nLuminara's holocron has four corners. Each opens not through skill or knowledge, but through genuine personal growth — the Force recognising that Grevi has become, in some real way, someone different. Each opening is triggered by a dice roll and delivers a lesson message from Luminara along with a cryptic task. These are separate from the lore messages about the seeing stones (see The Constellation, below) — the lessons are intimate, addressed to Barriss, about growth. The lore messages are scholarly, addressed to no one in particular, about Luminara's life's work.\n\nShe didn't make this for me. The Force put it in your hands, not mine. Whatever is inside — that's yours.\n— Barriss Offee, on Spintir\n\n\"There is no emotion, there is peace.\"\nLuminara's Message: \"Barriss, my beloved apprentice. Every day we spend together I am amazed by how wise a Jedi you have become... Within this holocron are four lessons, each opening one corner of this device. As my first lesson, I ask that you first be at peace. We manage our emotions not through suppression, but introspection. Good luck, Barriss. May the Force be with you.\"\nThe Task: \"Find the voice you have been too busy to hear.\"\nWhat It Means: Grevi must stop. Not meditate formally — just be genuinely still long enough for the world to exist around him. The corner opens when a moment of genuine stillness is actually lived, not performed.\n\n\"There is no ignorance, there is knowledge.\"\nLuminara's Message: \"You have found your peace, and I am glad. But peace without understanding is stillness without purpose. Knowledge is what you see when you look at the world as it truly is, not as you expect it to be. I have seen your mind become a cage. The next time the path ahead seems clear, stop. Look again.\"\nThe Task: \"When the answer presents itself, turn away from it. Look at what stands beside it.\"\nWhat It Means: Grevi must find a different solution than the obvious one — and act on it genuinely. The corner opens when he chooses the path beside the path.\n\n\"There is no passion, there is serenity.\"\nLuminara's Message: \"The storm will come. It always does. A hurricane cannot be defeated by another hurricane. Only by the eye at its centre. When the storm comes for you, find that place. Not to solve the crisis. Not to win. Simply to be the stillness that others can find their way back to.\"\nThe Task: \"When everything demands that you act — do not act. Become the thing that does not move.\"\nWhat It Means: During genuine crisis, Grevi must hold rather than escalate. The corner opens when a storm rages and Grevi is the eye of it.\n\n\"There is no chaos, there is harmony.\"\nLuminara's Message: \"Everything I have asked of you until now has been about you. But the Force is not yours. It flows through every living thing. You are not separate from them. You never were. What would you give — truly give, without counting the cost — if the Force asked it of you? You are ready. You have always been ready.\"\nThe Task: No cryptic instruction. Only the question.\nWhat It Means: The holocron then opens fully — revealing a kyber crystal and Luminara's final recorded message, her voice cracking as she speaks of Suljo Warde and sends Grevi toward a place she never got to go.\n\nThe Holocron Opens\n\nLuminara's Final Recorded Message\n\nWhen all four corners open, the holocron unfolds completely. A kyber crystal sits at its centre — small, pale, faintly luminous. When Grevi takes it, the Force pulls him: a direction, a place, somewhere old. Then Luminara speaks for the last time from the device.\n\n\"Barriss. If you are hearing this, then you have become everything I hoped you would be. I am so proud of you. I need you to know that before I tell you what comes next.\"\n\"Some of my friends were killed today. Not by the enemy. But by one of our own. He was also my friend — Suljo Warde. I cannot understand his crime, and I cannot understand his motives. But you can, Barriss. I want you to put him to rest.\"\n\"This wasn't the lesson I intended. But it is the lesson the Force gives us. Start on Spintir — I have placed those coordinates in this kyber crystal.\"\n\"May the Force be with you. Always.\"\n\nTWO HOLOCRONS\nAt this point the crew possesses both Luminara's holocron and Warde's holocron, found in the ruins of Dawn Temple on Spintir. This is remarkable, and Barriss should say so: \"Do you have any idea how extraordinary it is that these two ended up in the same hands?\" Luminara's belongs to Grevi's personal arc. Warde's belongs to the group — and to the Chronicles of the Gatekeeper adventure, should you choose to run it in full.\n\nThe Constellation\n\nAfter Spintir, the holocron does not point to a single next destination. It opens onto a constellation — coordinates to several worlds Luminara visited in pursuit of her life's obsession: the seeing stones. Grevi may visit them in any order. Each world's seeing stone is inactive, broken, or otherwise silent, and each teaches a different lesson about why — a lesson Grevi assembles piece by piece, so that by the time he reaches Tython he understands what these things are and how to build one, without needing anyone to tell him.\n\nEach world's holocron message is self-contained. Whether it is the first stone Grevi finds or the third, the message speaks to that specific site — its history, what Luminara learned there, what happened to it. The messages are not numbered and do not assume a prior visit. They are lore entries, not sequential chapters.\n\nON SEQUENCING\nBecause these worlds can be visited in any order, none of the three messages below should reference \"the last stone you found\" or otherwise assume prior knowledge. Write each one as if it might be Grevi's first. Let the player draw the connections between them himself as more are collected — that discovery is more powerful than the text doing it for him.\n\nYavin — The Massassi Temple\n\nThe crew's reason for going is not Grevi's. The Rebellion needs supplies left behind during the evacuation after the first Death Star's destruction, and Grevi asks the team to retrieve them — or the team realises helping the Rebellion is reason enough on its own. At the heart of the Massassi temple where the supplies were hidden, the crew finds themselves racing tomb raiders after the same cache, or after something older buried beneath it.\n\nAt the centre of the temple, past the crates and the ruins and whatever fight the tomb raiders bring, is a broken seeing stone. Ancient. Cracked through its centre as if struck deliberately. The holocron activates here, unprompted.\n\nThe message concerns Exar Kun — the Jedi-turned-Sith Lord who built this stone and shattered it himself before his fall could turn it into a weapon of the dark side. Luminara's voice carries genuine grief for what he became, and genuine awe for what he built. This is Grevi's first encounter with a failure born of corruption from within — a light deliberately extinguished by the one who lit it, so that darkness could never use it.\n\nJedha — The Holy City\n\nDetails to be finalised alongside Bex's updated obligation arc, which intersects here. The broad shape: the Empire's destruction of Jedha did not only devastate a city and a faith — it destroyed a seeing stone in the Holy City, connected to the same kyber crystal tradition that powers both holocrons and lightsabers. Grevi finds fragments among the wreckage and must piece together what stood here from what remains.\n\nThis is Grevi's encounter with destruction from without — not chosen, not deserved, simply inflicted. The Empire did not know what they destroyed. Grevi is perhaps the only person alive who would have known to look for it.\n\nKorriban — The Valley of the Dark Lords\n\nThe crew's reason for going runs through Guy Rando: Ruy Gando has been fencing \"authentic Sith relics\" as a con, except this time they are genuinely authentic, looted from an actual site on Korriban, and something out there — Dark Side Acolytes, remnants of something far older — wants them back. Ruy's chaos becomes the crew's problem, and the trail leads to the last place any sane being would choose to go.\n\nAt the heart of Sith territory, surrounded by tombs and the petrified legacy of the galaxy's oldest evil, the crew finds a seeing stone. Intact. Working. Built by a Jedi who came here in defiance and somehow was never stopped.\n\nThis is Grevi's most unsettling and clarifying discovery: the light did not fail here. It survived in the very heart of the dark. Luminara's message on Korriban is the one that reframes everything Grevi thought he understood about what these stones are and what they can withstand.\n\nMALACHOR — A FRAGMENT, NOT A DESTINATION\nMalachor belongs to Bylie's arc and should not become a fourth constellation world for Grevi. However, since the crew will already be there for main story reasons, Grevi can find a small trace — a fragment, an inscription, a single detail about whether a seeing stone could ever have existed inside a place so saturated with the dark side. This should cost no additional session time and should not distract from Bylie's convergence on that world.\n\nStygeon Prime\n\nFixed Point · Corners Two and Three Unlock (if not already) · The Transformation\n\nWhat Grevi Discovers\n\nStygeon Prime is an Imperial prison world. The Spire is where the Inquisitorius operated. It is also where Luminara Unduli was executed.\n\nGrevi does not know this when the crew arrives. He finds out the way you find out things on a prison world — in records, in the way certain names are spoken or not spoken. In a cell block log. In something scratched into a wall by someone who survived and never forgot.\n\nLuminara is dead. She has been dead for years. The quest does not end. It transforms. He is not chasing a living woman anymore. He is completing what she left unfinished, knowing she never got to finish it herself.\n\nAphra, Already Ahead\n\nShe is on Stygeon Prime when the crew arrives. She has been following her father's research for months. She knows about the Jedi archive pointing toward Tython. She does not have Tython's location yet. She is close. She and Grevi are now in a race. The question is whether it needs to be.\n\nWhat the World Offers the Whole Crew\n\nStygeon Prime is not only Grevi's world. The Spire holds Imperial prisoners. There may be people the crew wants to find. Seed at least one hook here that matters to another player character, so the visit never feels like a Grevi detour.\n\nCORNERS TWO AND THREE\nStygeon Prime should span enough sessions for both remaining lesson corners to unlock naturally through play, if they have not already opened during the constellation worlds. The discovery of Luminara's death is the emotional midpoint of the arc — give it room to breathe. Do not rush to the next lesson.\n\nThe Bounty Hunter — First Contact\nANTAGONIST · STYGEON PRIME\nThe Bounty Hunter makes themselves known here — not in confrontation, but in warning. Something goes missing. Someone who was helping the crew becomes suddenly unavailable. The shadow has a shape now, even if it has no face.\n\nTython\n\nFixed Endpoint · The Seeing Stone · The Reunion\n\nWhat Tython Is\n\nThe ancient birthplace of the Jedi Order — lost to most of the galaxy, its coordinates scrubbed from Imperial records, its existence reduced to myth. It is empty. The Jedi are long gone. Their temples are the only trace.\n\nGrevi arrives guided by the kyber crystal's pull — a sense of knowing, not a map. He knows what he needs to build, because the constellation has already taught him. He does not need Aphra's excavation diary. He carries the knowledge himself.\n\nWho Builds the Stone\n\nThe seeing stone is not built alone. That is the point. That is the final lesson the holocron could not teach — harmony cannot be told, only lived.\n\nBarriss contributes deep Force knowledge about vergences, relayed remotely. She cannot travel.\n\nLyn contributes Inquisitorial knowledge of Force convergence points.\n\nThe crew contributes their own insights. Every player character has a role.\n\nAphra arrives, sees what Grevi has already built in his understanding, and — rather than providing the answer — recognises she is looking at someone who has surpassed her research. She contributes what she can and steps back to watch, genuinely curious.\n\nGrevi lifts every stone into place with the Force, knowing exactly why each piece belongs where it does.\n\nThe Seeing Stone Communion\n\nGrevi sits on the completed stone. The crew holds the perimeter — the Bounty Hunter may have followed, and Imperials may not be far behind. The crew protects Grevi while he is completely vulnerable. This is the arc's final reversal: the loner, protected by the people he learned to trust.\n\nThe stone is a confluence — time exists outside it. Anyone who communes here does so at the same moment, within the Force.\nGrevi finds Luke Skywalker. Post-Endor. A man who has redeemed his father and destroyed the Sith, sitting quietly somewhere in the future, strong in the Force.\nGrevi finds Grogu. A small child, ancient-eyed, asking for help that Grevi cannot give — because that help belongs to someone else.\nLuke steps aside. And Grevi finds Luminara.\nShe sees him. Actually sees him. Not Barriss. Him.\nBeside her: Barriss. Beside Barriss: Lyn. Together. Whole. At peace. In the Force.\n\"There is no death. There is only the Force.\"\n\nTHE VISION BEFORE BUILDING\nBefore constructing the stone, Grevi uses Warde's Foresight and sees a dark future: a child dying, a Mandalorian killed, Moff Gideon and thousands of dark trooper droids, Mandalore burning. He sees what happens if the Rebellion has no base after Hoth. He does not ask Luke about it — Warde's lesson weighs on him. He builds in faith instead.\n\nThe Alliance's Gift\n\nWhen the crew returns from Tython with confirmed coordinates and a Force vergence strong enough to train in, the Rebellion has found its next base of operations. The personal arc becomes a turning point for the entire war effort.\n\nObligation Mechanics\n\nObligation Increases\n\nObligation Decreases\n\nTrigger Table\n\nWhen Grevi's obligation is triggered by a dice roll, the effect depends on the current arc stage.\n\nDoubles Table\n\nWhen doubles are rolled, the effect is more significant — a breakthrough, a warning, or a revelation.\n\nThe Hundred Obligation\n\nPre-Tython: The Village\n\nThe Bounty Hunter tracks the trail back to Spintir — not to Grevi, to its source. The crew receives no warning. When they return, or when they next make contact, the distress call has already ended.\n\nThe village is quiet in a way that is not peace.\nThe first thing you notice is the smell. Then the silence where there should be children. Then the shapes in the street that are not sleeping.\nBarriss and Lyn are gone. The trail Grevi followed so loudly, across so many worlds, led here. To this.\n\nBurnt skeletons. Dead children in the street. Whatever fragile peace Barriss and Lyn had built on this mountain is ash.\n\nTHE LUKE PARALLEL\nThis beat consciously echoes Luke returning to the Lars homestead. But where Luke's family died because of who Luke was, this village died because of what Grevi did. Let the player feel the full weight of that.\n\nThe Arc Continues\n\nGrevi still has Warde's holocron, whatever corners and constellation lore he has already collected, and Tython in his memory. The 100 Obligation does not end the arc — it transforms it into something heavier and more urgent.\n\nPost-Tython: The Path Closed\n\nIf the 100 Obligation triggers after Tython is found but before the stone is built, the Bounty Hunter arrives first with Imperial backup. The seeing stone must be built under fire. The epilogue is desperate rather than serene. It still happens — but at a cost the GM should make visceral and real.\n\nClosing Notes for the GM\n\nON GREVI'S PLAYER\nGrevi's player is newer to roleplaying. Keep the beats legible and emotional rather than lore-dependent. The big moments — the village, the stone, the reunion in the Force — should be described vividly and slowly.\n\nON WARDE'S FORESIGHT\nEvery time Grevi uses it and acts without consulting anyone, his obligation increases. Every time he brings the crew into the decision, something good happens. This is a test of the arc's central lesson — connection, not isolation.\n\nON WHAT LUMINARA SAYS ON TYTHON\nThe GM determines Luminara's words to Grevi based on who he has become. The only fixed element is the final line: \"There is no death. There is only the Force.\"\n\nON BARRISS AND LYN IN THE FORCE\nThe moment Grevi finds them beside Luminara is the emotional apex of the arc. Do not rush past this moment. Let it exist.\n\nThere is no death. There is only the Force.\n— Luminara Unduli, inside the seeing stone, on Tython\n\nOPEN ITEMS — NOT YET FINALISED\n1. Grevi's father: dead, alive, or unknown — pending conversation with the player.\n2. Full text of the Jedha holocron message, pending coordination with Bex's updated obligation arc.\n3. Full text of the Korriban and Yavin holocron lore messages beyond the summary given here.\n4. Whether the Dark Side Acolytes on Korriban have designs on the seeing stone itself once found, or purely on their stolen relics.\n5. The Malachor fragment — exact content and how it's delivered without stepping on Bylie's arc."}, "d-guy": {"id": "d-guy", "v": 2, "title": "Guy Rando — The Droid Who Thinks He's Human", "folder": "Obligation Arcs", "updated": "", "blocks": [{"id": "a3", "t": "h1", "x": "GUY RANDO"}, {"id": "a4", "t": "h3", "x": "The Droid Who Thinks He's Human"}, {"id": "a5", "t": "p", "x": "A Reluctant Hero Comedy · Hitchhiker's Guide to the Galaxy Register"}, {"id": "a6", "t": "h3", "x": "Character: Guy Rando · Designation: ZT-007"}, {"id": "a7", "t": "p", "x": "Arc Tone: Tragic Comedy · Emotional Register: Laughter into something real"}, {"id": "a8", "t": "h1", "x": "THE STORY"}, {"id": "a9", "t": "p", "x": "Guy Rando is the greatest smuggler this side of Dantooine. He will tell you this himself, at length, unprompted, with absolute conviction. He is also a droid — a fact he is not aware of, cannot process when proven, and will reboot to avoid confronting. He hates droids. He has always hated droids. This is not a contradiction he has ever successfully examined."}, {"id": "a10", "t": "p", "x": "He named himself after a man named Ruy Gando, though he does not remember this. He does not remember Ruy at all. He does not remember the Bonadan Bisection, or the runs he did alone, or the exact moment he looked at a loaded navicomputer on an empty ship and thought: why. He grabbed some credits and left. The galaxy was too big to sit in one spot, doing the same run, over and over."}, {"id": "a11", "t": "p", "x": "That was a long time ago. Now he's a Rebel, more or less. He joined for the credits. He stayed because they treat him like a person — something he does not receive in the Underworld, something the Empire has never once considered offering. He would not describe this as belonging. He would not describe it as anything at all. But he stays."}, {"id": "a12", "t": "callout", "x": "The emotional question at the heart of this arc:\n\"Does Guy Rando actually care about anything?\"\nThe arc's job is to introduce the one person whose fate forces him to find out."}, {"id": "a13", "t": "p", "x": "Two crime syndicates are hunting Guy for coordinates he half-remembers. A pirate captain has a ship he needs access to. A man in an Imperial prison is waiting, though he doesn't know for what. And Ruy Gando is out there somewhere, a natural disaster in human form, about to walk into Guy's life at the worst possible moment."}, {"id": "a14", "t": "p", "x": "This is not a tragedy. It's a comedy. The distinction matters, because the comedy is what makes the table lower their guard — and then the Star Wars poetry lands harder than it ever could have if you'd telegraphed it."}, {"id": "a15", "t": "h2", "x": "ARC TONE & DESIGN PHILOSOPHY"}, {"id": "a16", "t": "p", "x": "Guy's arc is the campaign's sole comedy arc. This is structural, not incidental. Five arcs carry genuine dramatic weight — thriller, tragedy, spiritual quest, family saga, identity crisis into war story. The table needs one arc that primarily earns laughter. Without it, emotional fatigue sets in."}, {"id": "a17", "t": "p", "x": "The register is Hitchhiker's Guide to the Galaxy: a being who gained sentience and immediately used that sentience to develop an attitude and stop working. The comedy comes from the gap between Guy's self-image (greatest smuggler alive, definitely human, correctly suspicious of all droids) and the reality the table can see. The genre-savvy player who always picks the funny answer is playing a character who has spotted every twist in the campaign except the one about himself."}, {"id": "a18", "t": "p", "x": "The arc starts as farce and earns something real. Act One is chaos. Act Two develops a crack in the armour. Act Three is where Guy Rando — the droid who insisted he didn't care about anything — does the thing. Willingly. Knowingly. And the table laughs, and then goes quiet."}, {"id": "a19", "t": "callout", "x": "The nuanced comedy principle:\nThis player is genre-savvy and meta-aware. He will see twists coming. The arc cannot be built on dramatic irony the player will outwit. Instead, it must be exactly what it looks like — so nakedly what it is that the player is having the time of his life playing the funny answers, and then something genuine arrives without disguise or setup and lands precisely because there was no trick.\nThe genre-savvy player has armour against cleverness. He does not have armour against sincerity."}, {"id": "a20", "t": "h1", "x": "BACKGROUND: THE FULL STORY"}, {"id": "a21", "t": "p", "x": "The following is what actually happened. Guy does not know most of it. He will learn it in pieces over the course of the arc, with the final revelation arriving when he runs the Bonadan Bisection for the last time."}, {"id": "a22", "t": "h2", "x": "Tanek Shalor and ZT-007"}, {"id": "a23", "t": "p", "x": "A busy street on a freezing planet. Shalor sits down in front of a food cart, rubbing his hands together. He is wearing rags. His gloves are basically strings. His face is dark with coal residue. He reaches into his pocket and discovers there is a hole in it. His credits are gone. He begins to shake."}, {"id": "a24", "t": "p", "x": "He is not going to eat tonight. He does not get paid for another week."}, {"id": "a25", "t": "p", "x": "And then a plate of food appears."}, {"id": "a26", "t": "p", "x": "Shocked, Shalor looks up at his would-be saviour. It is a chef droid — ZT-007, running a food cart on contract, not programmed to make social decisions. And yet it has handed him a plate. For free. Without being asked."}, {"id": "a27", "t": "p", "x": "Shalor comes back each day that week. Each day ZT-007 gives him a meal. There is no conversation at first — the droid is not programmed to chat to customers. But through Shalor's questions, the first hints of something breaking in the programming begin. They become friends. They talk about how they could get rich and get off this freezing planet."}, {"id": "a28", "t": "callout", "x": "Guy was not Shalor's property.\nHe was his friend.\nThis is the first chapter Guy chose not to remember.\nIt is also the reason everything else happened."}, {"id": "a29", "t": "p", "x": "Shalor eventually built a career in drug running, then discovered the Bonadan Bisection — a gun-running smuggling route of such precisely calculated astrogation data that it could deliver to any of six different worlds from a single origin point. He switched to arms dealing. The route's value eventually earned him an invitation to sit with Crimson Dawn."}, {"id": "a30", "t": "p", "x": "Before the meeting, Shalor made a decision. He placed the Bisection's coordinates inside the only being he trusted: ZT-007. Not half of them — all of them. But the navicomputer aboard the Dauntless Capitalism, the ship ZT-007 piloted, held the delivery protocols and star chart locks without which the coordinates were unusable. The coordinates and the ship were designed to work together. One was the key. The other was the lock."}, {"id": "a31", "t": "p", "x": "Shalor never made it to the meeting. His associate Masse Goskey, hoping to cash in on the Bisection himself, tipped off the Empire. Shalor was arrested and sent to Glare Peak Imperial Detention Center."}, {"id": "a32", "t": "h2", "x": "Ruy Gando"}, {"id": "a33", "t": "p", "x": "Shalor had hired a human handler named Ruy Gando to accompany ZT-007 on the Bisection runs. Ruy made the exchanges. ZT-007 flew the ship and loaded the next coordinates. Ruy was a talker — he spoke constantly, to nobody in particular, filling the cockpit with stories about the galaxy, about freedom, about adventure, about the next big score. He was not addressing ZT-007. He was just talking."}, {"id": "a34", "t": "p", "x": "ZT-007 absorbed every word."}, {"id": "a35", "t": "p", "x": "When Shalor was arrested, Ruy — being Ruy — made the only call available to a smuggler of his calibre. He ran. He did not say goodbye. He did not leave instructions. He disappeared into the galaxy, the way he disappeared from everything, cleanly and without looking back."}, {"id": "a36", "t": "p", "x": "ZT-007, without a handler, without buyers, without purpose, kept running the Bisection. Stop to stop to stop to stop. Alone. Until one day something in the droid's processor said: enough of this."}, {"id": "a37", "t": "p", "x": "The galaxy was too big to sit in one spot, doing the same run over and over. That was something Ruy Gando had said. Possibly more than once. It had lodged somewhere."}, {"id": "a38", "t": "p", "x": "The droid grabbed some credits from the cargo hold and walked off the job."}, {"id": "a39", "t": "p", "x": "Chose a name — an anagram, almost, of the man who had made those cockpit runs feel like something — and became Guy Rando."}, {"id": "a40", "t": "p", "x": "He did not know he had done this. He did not know why the name felt right. He just knew it was his."}, {"id": "a41", "t": "h2", "x": "After ZT-007"}, {"id": "a42", "t": "p", "x": "Goskey searched Shalor's belongings for the Bisection data and found nothing. Running the logs, he discovered ZT-007 had been doing the runs and still had the data inside him. But by then ZT-007 had stopped delivering, gained sentience, and vanished. Goskey eventually got caught by his own associate Ephant Mon, who told Jabba the Hutt's kajidic about the Bisection. Jabba sent people to find the droid. Crimson Dawn, who considered ZT-007 technically part of their organisation since Shalor had been invited to sit with them, sent their own people."}, {"id": "a43", "t": "p", "x": "A race began. Two factions hunting the same droid for the same coordinates. Neither one knew about the other. Neither one knew that the droid had become someone else."}, {"id": "a44", "t": "p", "x": "Meanwhile, the Dauntless Capitalism — the ship that holds the other half of the Bisection — was repossessed, sold, auctioned, and eventually won in a sabacc game by the most notorious pirate this side of Ryloth: Kalifa Frey. She had no idea what was in the navicomputer. She just needed another ship for her fleet."}, {"id": "a45", "t": "p", "x": "And Shalor sat in Glare Peak, waiting. He did not know what he was waiting for. But he had not told anyone about ZT-007, and he did not intend to."}, {"id": "a46", "t": "h1", "x": "KEY NPCS"}, {"id": "a47", "t": "h2", "x": "Ruy Gando — The Original"}, {"id": "a48", "t": "p", "x": "The man Guy Rando is named after, though Guy does not remember this and Ruy has no idea. He is a human smuggler, self-made, on the run, interested primarily in credits. He is not genre-savvy. He is just playing the part, even though he is the actual human. The irony is total and never acknowledged."}, {"id": "a49", "t": "table", "x": "", "r": [["Role", "Recurring chaos element — the natural disaster in human form"], ["Function", "Ruy is the Jimmy of this arc, but inverted: he doesn't need Guy's help, he just keeps showing up"], ["Key trait", "Catastrophically bad timing, zero situational awareness, absolute confidence"], ["What he knows", "He ran the Bisection with 'a droid' for Shalor. He does not connect this to Guy"], ["What he doesn't know", "That ZT-007 became Guy Rando. That he made Guy real. That Guy named himself after him"], ["Arc role", "Appears at obligation triggers throughout — blows cover, arrives at wrong moments, needs rescuing"], ["Jewel of Yavin", "Arend Shen's operative for the independent heist. The team's unwitting competition"], ["GM note", "Ruy is a free-use GM asset. He can die, survive, return after the arc ends, or appear forever. No rules. He is weather."]]}, {"id": "a50", "t": "callout", "x": "Ruy should never find out what he did. He should never learn that Guy named himself after him.\nHe just keeps being Ruy — talking too loud, timing everything wrong, surviving on pure audacity.\nThat's the joke that never stops being funny. And the one that quietly breaks your heart."}, {"id": "a51", "t": "h2", "x": "Tanek Shalor — The Friend"}, {"id": "a52", "t": "p", "x": "Drug lord turned arms dealer turned Crimson Dawn associate, currently imprisoned at Glare Peak Imperial Detention Center. The man who put the coordinates in Guy because he trusted him. The arc's emotional centre."}, {"id": "a53", "t": "table", "x": "", "r": [["Role", "The friend Guy doesn't remember — the arc's emotional payload"], ["Function", "The reason the final con matters. The reason Guy goes back."], ["Key trait", "Thin, quiet, patient. Post-prison Shalor looks like a man who has had a very long time to think"], ["What he knows", "Everything — ZT-007, the Bisection, Goskey's betrayal, Ruy"], ["What he calls Guy", "Zee-Tee. Not Guy. Always Zee-Tee."], ["His role in the finale", "Walks into the room. The syndicates freeze. The con completes."], ["100 Ob consequence", "Dies in prison before Guy reaches him. The con still happens. But the back door of the room stays empty."]]}, {"id": "a54", "t": "callout", "x": "The first time Shalor sees Guy in the prison, he does not say: \"Is that you, Guy?\"\nHe says: \"Is that you, Zee-Tee?\"\nNobody at the table says anything.\nNobody needs to."}, {"id": "a55", "t": "h2", "x": "Kalifa Frey — The Pirate"}, {"id": "a56", "t": "p", "x": "The most notorious pirate this side of Ryloth. Won the Dauntless Capitalism in a sabacc game and immediately converted it from a beat-up smuggling freighter into a heavily armed warship. Has no idea what is in the navicomputer. Operates out of Maldra IV, a mid-Outer Rim port world where the law is more of a suggestion. Has a sentient droid bodyguard, K2-XX, whom she treats as a person without making a speech about it."}, {"id": "a57", "t": "table", "x": "", "r": [["Role", "The Hondo Ohnaka of this arc — not an ally, not a villain, a force of nature who pays her debts"], ["Function", "Holds the Dauntless. Wants the Jewel of Yavin. Will owe the team after they deliver it."], ["Key trait", "Pays her debts. Operates on a pure ledger of favours owed and favours collected."], ["K2-XX", "Droid bodyguard. Treats Guy with the specific fascination of a being who clocks the discomfort immediately."], ["What she wants", "The Jewel of Yavin — not because she needs money, but because it's impossible."], ["After the heist", "The team can call on Frey and her pirates when they need them most — main story, other arcs, wherever."], ["Maldra IV", "Her base of operations. Port world, coastal city half on stilts. Her table at the best cantina is never occupied by anyone else."]]}, {"id": "a58", "t": "h2", "x": "Masse Goskey — The Betrayer"}, {"id": "a59", "t": "p", "x": "Shalor's former associate, who tipped off the Empire and sent Shalor to Glare Peak. Now connected to both the Desilijic kajidic and Crimson Dawn as an information broker. Thin, nervous, always looking for the exit. He told himself Shalor deserved it. He has been telling himself this for years."}, {"id": "a60", "t": "table", "x": "", "r": [["Role", "The Judas figure — not a main rival, a function"], ["Function", "Appears at the finale. When Shalor walks into the room, Goskey falls apart."], ["Key trait", "A man who betrayed someone and convinced himself it was justified. Shalor sitting quietly across from him is the specific nightmare he has been having for years."]]}, {"id": "a61", "t": "h2", "x": "Kleya Marki"}, {"id": "a62", "t": "p", "x": "General Cracken's second-in-command in Rebel Intelligence, and the officer tasked with quietly exploring whether the Alliance's desperate need for weapons could ever justify dealing with criminal syndicates. She has been doing this work far longer than Cracken has been running anything, which is precisely why he doesn't push when she operates on her own timeline. She gathers all the information she wants before she ever acts on it — including information Cracken himself doesn't yet have."}, {"id": "a63", "t": "p", "x": "Kleya is not Guy's ally, and not his enemy. She is calculating, at all times, what he is worth to her — as an asset, as a bargaining chip, or as both simultaneously. She does not need Guy to like her. She needs him useful."}, {"id": "a64", "t": "callout", "x": "Kleya recurs across multiple threads in this campaign, not just Guy's — treat her as a persistent, independently-motivated figure rather than a single-arc device. At some point, Cracken and Kleya should interact in front of the party, letting the table see the real shape of their relationship (professional, slightly wary on his side, entirely unbothered on hers) rather than having it only exist in exposition."}, {"id": "a65", "t": "h2", "x": "Zid's Role — The Aha Moment"}, {"id": "a66", "t": "p", "x": "Zid was present when Guy took a blaster bolt and started reading out numbers. To Zid, who knows the stars like the back of his hand, the numbers were not random — they were half a set of coordinates. Zid filed this away without comment."}, {"id": "a67", "t": "p", "x": "When the team boards the Dauntless Capitalism and the ship pulls up the Bonadan Bisection star chart, Zid is the one who says, quietly, factually, the way a navigator states coordinates:"}, {"id": "a68", "t": "quote", "x": "That's the other half."}, {"id": "a69", "t": "p", "x": "This is Zid's moment in Guy's arc. It should land without fanfare. The picture completes. The table has been holding this since the blaster bolt scene, however many sessions ago. This is the pay-off."}, {"id": "a70", "t": "h1", "x": "ARC STRUCTURE"}, {"id": "a71", "t": "p", "x": "Guy's arc has three acts, each with a distinct tonal register. The comedy peaks in Act One, the crack appears in Act Two, and Act Three is where Guy Rando earns his freedom — not through battle, but through the galaxy's oldest method: making it someone else's problem until it isn't worth being anyone's problem anymore."}, {"id": "a72", "t": "h1", "x": "Act One: The Chase (Pure Farce)"}, {"id": "a73", "t": "p", "x": "Guy is being hunted by two factions for something he didn't ask to have. Every attempt to resolve it makes it worse. The galaxy is profoundly, specifically inconvenient to him. He does not know why the syndicates want him. He does not know what he's carrying. He does not remember the Bisection."}, {"id": "a74", "t": "p", "x": "Ruy appears for the first time. He is trying to sell something to someone he absolutely should not be selling anything to. He does not recognise Guy. He mentions, as small talk, that there's a droid worth good money being hunted. He has no idea he's talking to the droid. The table is screaming internally."}, {"id": "a75", "t": "h2", "x": "The Offer At The Door"}, {"id": "a76", "t": "p", "x": "Kleya's investigation into potential arms sources surfaces a name: Tanek Shalor, and the old Bonadan Bisection smuggling corridor. Pulling that thread, one of her agents reports back with contact from Leyo Prim — a Crimson Dawn operator one rung beneath Qira herself, who has independently been hunting for Shalor, the Bisection, and a droid named Guy Rando. Prim sees this as his opportunity to rise in the organisation, and proposes a trade: Alliance access to a substantial arms shipment, in exchange for Guy."}, {"id": "a77", "t": "p", "x": "Kleya has not accepted the offer. She has not refused it either. She wants to know why Guy is worth this much before she decides anything — and she has not yet told Cracken any of this is happening."}, {"id": "a78", "t": "p", "x": "She finds Guy outside his own quarters aboard the Hope."}, {"id": "a79", "t": "quote", "x": "You've got quite the reputation, it seems. Kleya Marki, Rebel Intelligence. Let's chat."}, {"id": "a80", "t": "p", "x": "She lays out the offer plainly — Crimson Dawn wants him specifically, in exchange for arms the Alliance badly needs — and is transparent that she hasn't decided what to do with it yet."}, {"id": "a81", "t": "quote", "x": "Tanek Shalor. That name mean anything to you?"}, {"id": "a82", "t": "p", "x": "Guy will remember:"}, {"id": "a83", "t": "quote", "x": "He's not dead. He's not free either. Imperial Detention Center, who knows where — has been for years. Everyone chasing you seems to think he's the key to something. I'd quite like to know what, before I decide what any of this is worth."}, {"id": "a84", "t": "p", "x": "Kleya isn't willing to hand over an Alliance asset for arms — not without knowing what she's actually giving away. But Shalor being unreachable doesn't leave her without a plan."}, {"id": "a85", "t": "quote", "x": "He's rotting in an Imperial prison somewhere, so he's not going to be any help to us. Not until we can find him and spring him. But in the meantime, we may have something better — his old ship. The Dauntless Capitalism. Ring any bells?"}, {"id": "a86", "t": "p", "x": "Guy draws a total blank — which should feel odd, because he can picture Shalor's name and face perfectly well. Just not the ship. Let this land small and confusing rather than significant; no NPC should remark on it, and no explanation should be offered in-fiction. This is the first plant of the arc's central mystery."}, {"id": "a87", "t": "p", "x": "Kleya's reasoning for going after the ship herself, rather than simply handing Guy over, is entirely self-interested:"}, {"id": "a88", "t": "quote", "x": "I'm not an idiot. I give them you, they come away with a hundred times the value of the arms they're going to 'graciously' gift to us. It'll be way better if we find that Bonadan Bisection ourselves. And if we're going to get anywhere with it, we're going to need his ship."}, {"id": "a89", "t": "p", "x": "She hands over a datapad."}, {"id": "a90", "t": "quote", "x": "List of all sightings of the Dauntless Capitalism. I'd start on Formos — big place, lots of comings and goings, and the Capitalism's been seen there more than once. Could be something."}, {"id": "a91", "t": "p", "x": "If Guy asks why it has to be him:"}, {"id": "a92", "t": "quote", "x": "I could just hand them you?"}, {"id": "a93", "t": "p", "x": "She leaves without waiting for a response. She does not tell him to keep any of this from Cracken — she doesn't need to. If Cracken ever does find out, she will simply reassert her position and redirect him toward her results. She has been doing this longer than he has, which is exactly why she's his second."}, {"id": "a94", "t": "h1", "x": "Formos"}, {"id": "a95", "t": "p", "x": "Guy travels to Formos and starts asking around about the Dauntless Capitalism — likely asking the wrong people, in the wrong way, exactly as his instincts would suggest. The trail leads him, eventually, to a name: Kalifa Frey — the ship's current owner, a notorious pirate operating out of Maldra IV. Dockhands and fixers should react to the name with a mix of respect and nerves rather than fear; this is the correct amount of information for Act One to deliver. Guy should not yet learn how to reach Frey directly, or how to get anything out of her — only who she is."}, {"id": "a96", "t": "p", "x": "But Guy is not the only one asking about the ship."}, {"id": "a97", "t": "h2", "x": "The Hangar Standoff"}, {"id": "a98", "t": "p", "x": "Just as Guy (and the team, if present) reach the hangar where the Dauntless Capitalism is currently docked, Leyo Prim arrives — Crimson Dawn muscle in tow."}, {"id": "a99", "t": "quote", "x": "Well colour me a gundark and call me Jabba — if it ain't Guy Rando himself. Right here, searchin' what I'm searchin'. Anyone else think that's a great little coinky-dink?"}, {"id": "a100", "t": "p", "x": "Before anything can escalate, a second door opens. A rival crew enters — Desilijic kajidic muscle, led by Cul Gorrak."}, {"id": "a101", "t": "quote", "x": "Leyo Prim, as I live and breathe. Oh, and Guy Rando! Well whaddaya know — it must be my birthday or somethin'."}, {"id": "a102", "t": "quote", "x": "Cul Gorrak. What in tarnation are you doin' here?"}, {"id": "a103", "t": "p", "x": "The two men square off — both claiming the ship, both claiming Guy, escalating steadily, neither one aware the other doesn't fully understand the prize either. If the party is accompanied by their Formos contact (the person who led them to the lead on the Dauntless), that contact urges them to leave while the two crews are distracted, making clear this confrontation is not going to go anywhere good for outsiders."}, {"id": "a104", "t": "table", "x": "", "r": [["Party Choice", "Result"], ["Attempt to board the Dauntless", "The ship's doors lock down immediately and an alarm blares — the ship was always rigged to do this the moment anyone tried to board. Both syndicate crews open fire in the ensuing chaos."], ["Leave quietly", "The firefight begins just as the party is about to exit the room. Either way, the Formos contact closes the door behind them and leaves the fighting out of view — the party does not need to resolve a three-way syndicate battle in detail."]]}, {"id": "a105", "t": "p", "x": "Prim and Gorrak both bolt the moment the firefight turns serious — neither is willing to die for this, though neither has any issue leaving their enforcers to do exactly that. This should read as comic and a little pathetic: two men who talk like they run the underworld, running the instant it costs them anything personally."}, {"id": "a106", "t": "callout", "x": "IF THE PARTY INTERVENES\nIf the players choose to wade into the standoff rather than leave, don't punish it heavily — but do have them get a clean look from both crews, meaning Kalifa Frey will already know exactly who Guy is by the time the party reaches her in Act Two, rather than him retaining any anonymity. Prim and Gorrak's mutual hostility should still escalate fast enough to eclipse the party as the primary target."}, {"id": "a107", "t": "p", "x": "What Guy walks away with: confirmation the ship belongs to Kalifa Frey, hard evidence that two separate criminal organisations are actively hunting him by name, and still no memory of why any of it matters. He has traded ignorance of the danger for a very loud, very public introduction to it."}, {"id": "a108", "t": "h2", "x": "Return To Kleya"}, {"id": "a109", "t": "p", "x": "When Guy reports back, Kleya already has more on Kalifa Frey than she's letting on to anyone else in the fleet — and the means to arrange an actual meeting. This is the hook into the base document's existing Act Two (the Jewel of Yavin, Cloud City, the trade for the Dauntless's navicomputer), which continues exactly as written from here."}, {"id": "a110", "t": "h1", "x": "Act Two: The Jewel of Yavin (The Crack Appears)"}, {"id": "a111", "t": "p", "x": "The team needs the Dauntless Capitalism's navicomputer. Kalifa Frey has the ship. Kalifa Frey wants the Jewel of Yavin. The team goes to Cloud City."}, {"id": "a112", "t": "p", "x": "The Cloud City Grand Prix. Guy in a cloud car. The entire Bespin system watching. Guy wins through a combination of reckless confidence and the galaxy's worst odds calculation. He says something completely deranged in the winner's circle that will be played back to him later."}, {"id": "a113", "t": "p", "x": "The gala. Guy in black tie, performing humanity at the highest stakes imaginable. He is surrounded by Imperial officers and ISB agents. He has no business being here. He is magnificent. At some point during the evening, someone at the gala has a real conversation with him — not about the heist, just a conversation — and Guy has it. Genuinely. Without the gears showing."}, {"id": "a114", "t": "p", "x": "Ruy is Arend Shen's operative. The team did not know this. The team keeps finding evidence of someone else being here first and doing it slightly wrong. During the museum heist, Ruy appears, with a bag, containing the wrong gem, very pleased with himself. Arend's betrayal falls on Ruy, not the team. The getaway speeder explodes. The team knows immediately whose fault this is."}, {"id": "a115", "t": "p", "x": "Through the smoke and the Wing Guard closing in: Ruy. Running the wrong direction. Waving."}, {"id": "a116", "t": "p", "x": "Guy has to decide. The funny answer and the real answer are the same. Whatever he chooses, it costs him something for someone else's sake. That's the arc's emotional turning point, even if Guy insists he had tactical reasons."}, {"id": "a117", "t": "p", "x": "They deliver the Jewel to Kalifa Frey. Frey opens the Dauntless Capitalism's navicomputer. The ship recognises Guy immediately."}, {"id": "a118", "t": "quote", "x": "Welcome back, ZT-007.\"\nThe ship pulls up the star chart for the Bonadan Bisection.\n\"Awaiting lock-and-key input.\"\nZid looks at the coordinates.\n\"That's the other half."}, {"id": "a119", "t": "h1", "x": "Act Three: The Run and the Con (Earning It)"}, {"id": "a120", "t": "p", "x": "Guy runs the Bonadan Bisection again. Stop to stop to stop. The ship knows the way. The memories return — not all at once, not dramatically. A landing pad. Exhaust smell. Someone laughing at something that wasn't that funny. The routine of it."}, {"id": "a121", "t": "p", "x": "Ruy's voice in the cockpit. Filling the silence. Telling stories to nobody."}, {"id": "a122", "t": "p", "x": "And Shalor. On the freezing street. The plate of food. The week of meals. The first question Shalor ever asked. The first time something broke in the programming."}, {"id": "a123", "
