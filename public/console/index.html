a111", "t": "h2", "x": "Geonosis — The Stripping Station Heist"}, {"id": "a112", "t": "p", "x": "The stripping operation runs through an Imperial processing station in the Geonosis ring system — officially a salvage and recycling facility, actually a place where Duros ship registries are stripped and reassigned. It is not heavily guarded; it is not supposed to exist officially."}, {"id": "a113", "t": "p", "x": "The team has three objectives inside the station:"}, {"id": "a114", "t": "p", "x": "The Registry Archive — documentation of every Duros family ship that has passed through, including current ownership status of the Mad Mynock and any other Hag family vessels"}, {"id": "a115", "t": "p", "x": "The Manifest Ledger — the record of who sold the ships to the operation and who bought the stripped registries"}, {"id": "a116", "t": "p", "x": "The Coordination Contact — a name at the top of the operation, referenced only by a Duro address"}, {"id": "a117", "t": "p", "x": "The heist should be structured as the team plans it — approach, entry, extraction. The GM should let the player's objective-driven instincts drive the planning session. Zid's player works best when every angle is on the table."}, {"id": "a118", "t": "callout", "x": "Midway through the heist, Grand Moff Verelin arrives with a Death Trooper escort.\nHe is here for a routine inspection — he takes an interest in the operation personally.\nThe team must complete their objectives while avoiding Verelin's attention.\nThis is also the moment Verelin notices Bex, if she is present.\nHe orders her taken alive for General Mohc — tying Bex's arc into this scene without derailing Zid's.\nThe team may have to split priorities: the heist objectives and keeping Bex free.\nNeither thread should be sacrificed for the other. That is the point."}, {"id": "a119", "t": "p", "x": "What the team finds in the Manifest Ledger: the Duro address belongs to a holding company called Zentron Recovery. The man at the top of the operation is named Reti Zentron."}, {"id": "a120", "t": "p", "x": "Zid has his villain. He is wrong about what Reti is — but he does not know that yet."}, {"id": "a121", "t": "h1", "x": "Act Two: The Family"}, {"id": "a122", "t": "p", "x": "Zid goes to Duro expecting to confront a criminal. He finds something much more complicated."}, {"id": "a123", "t": "h2", "x": "Cutaway — The Yacht (Plays Early in the Arc)"}, {"id": "a124", "t": "p", "x": "A pure cutaway. No player interaction — a screen wipe, exactly like the ones the campaign has used before. This should be shown early, ideally as the cold open to whichever session begins Zid's active pursuit of Reti, establishing the antagonist relationship before the team ever meets either man in person."}, {"id": "a125", "t": "p", "x": "Reti Zentron and Grand Moff Verelin, aboard Verelin's luxury yacht. Dancers, performers, excess. They are, unmistakably, friends. Business is discussed, but only after Reti presents a gift."}, {"id": "a126", "t": "quote", "x": "This was an old Zentron heirloom, passed down generation to generation. Last person to hold it was my father, before he went missing. I want you to have it — as a sign of our formal relationship. Long live ZenCorp and the Empire!"}, {"id": "a127", "t": "p", "x": "Verelin's grin as he takes the gold-plated blaster should read as delighted, and faintly predatory — a man collecting something he doesn't yet know the true value of."}, {"id": "a128", "t": "callout", "x": "This is the single most important object in the arc's back half. It re-appears in Verelin's hand during the bridge betrayal. Do not foreshadow its importance here — let it read as simple, warm irony (a gift to an ally) on first viewing. The horror is retroactive."}, {"id": "a129", "t": "h2", "x": "Duro — Reti's Mansion"}, {"id": "a130", "t": "p", "x": "The mansion on Duro is registered to Zentron Recovery but was originally Hag family property. It has been renovated extensively — Reti has money and has spent it trying to make the place feel like his. It does not. It still has the bones of something older."}, {"id": "a131", "t": "p", "x": "The team has four approaches to the mansion:"}, {"id": "a132", "t": "p", "x": "The Dirt — find compromising information about Reti's operation and use it as leverage to gain access"}, {"id": "a133", "t": "p", "x": "The Sabotage — take down the mansion's security systems from outside, then enter in the confusion"}, {"id": "a134", "t": "p", "x": "The Theft — steal Reti's schedule and impersonate invited guests at one of his regular business dinners"}, {"id": "a135", "t": "p", "x": "The Confrontation — go in directly, which is faster and louder and will almost certainly involve shooting"}, {"id": "a136", "t": "p", "x": "The team is looking for three prizes inside the mansion:"}, {"id": "a137", "t": "p", "x": "Boliphar's original blueprints for the Eye of the Stars — hidden behind a false panel in what was Hag family storage, not yet found by Reti"}, {"id": "a138", "t": "p", "x": "The full Zentron Recovery client list — including Verelin's name, his personal account numbers, and the record of exactly what Reti sold him"}, {"id": "a139", "t": "p", "x": "A communication log between Reti and an unknown party, discussing 'the second son' and 'the beacon' — the first confirmation that Reti knows about Zid specifically"}, {"id": "a140", "t": "h2", "x": "The Twin Reveals"}, {"id": "a141", "t": "p", "x": "The team infiltrates Reti's mansion (or ZenCorp holdings on Duro) mid-firefight. Caroth Blaine — Reti's masked enforcer, the team's recurring nemesis across Act Two — approaches. He does not fire back. He may absorb hits without responding. He walks, deliberately, straight toward Zid, unclasping his mask as he moves."}, {"id": "a142", "t": "quote", "x": "Nobody ever told you what happened to your father,\" Caroth says, voice modulated. \"They told me enough — they told me you killed him.\" (or similar, from Zid's player)"}, {"id": "a143", "t": "quote", "x": "No.\" The mask comes away. Beneath it: a scarred, old Duros face, echoes of both Reti and Zid in its features. \"I am your father."}, {"id": "a144", "t": "p", "x": "Reti is present for this — sees it, hears it, understands in the same instant that his most trusted enforcer was his own father in disguise, and that the stranger beside him is his half-brother. He has no time to process it. His operation is in ruins, his right hand has defected in front of him, and the Rebellion is at his door. He chooses the only response he has ever known."}, {"id": "a145", "t": "p", "x": "He triggers a sonic immobiliser, freezing the room. Boliphar — having removed his mask moments before — is caught in the blast, but manages to re-seat the mask (built to withstand the frequency) just in time to remain mobile."}, {"id": "a146", "t": "p", "x": "With seconds available, Boliphar makes his choice — trying to serve both sons in the only way the moment allows. He presses something into Zid's hand: the key data needed to complete the beacon triangulation."}, {"id": "a147", "t": "quote", "x": "Here, kid... you're almost home."}, {"id": "a148", "t": "p", "x": "Then he turns, already moving toward the door his other son fled through."}, {"id": "a149", "t": "quote", "x": "Reti — son, wait! Don't go running to him — he's dangerous—"}, {"id": "a150", "t": "p", "x": "He trails off as he exits. The team — and Zid — wake up alone in the wreckage of the confrontation. No bodies. No resolution. Only the key, and the silence after."}, {"id": "a151", "t": "callout", "x": "THE KEY\nThe key Boliphar gives Zid is the final data point needed to triangulate the Eye of the Stars' jump pattern, combining with the beacon signal and anything gathered from Robbton or Zob's threads. A Hard (◆◆◆) Astrogation or Computers check, once the beacon is later activated, allows Zid to calculate the Eye's position and jump cadence — this is what triggers the base document's Beat 6 (\"the beacon activated... the race begins\")."}, {"id": "a152", "t": "callout", "x": "THE TEAM INTERVENES\nIf the team acts fast enough to stop Reti from fleeing, or otherwise disrupts this sequence before the immobiliser fires, this scene is designed to bend. Boliphar's dialogue and motivations should stay the same regardless — but the outcome (Reti escaping to Verelin, the entire Bridge Betrayal sequence below) may be avoidable entirely. If the players rescue both Boliphar and Reti here, treat this as a legitimate divergence: Reti's redemption becomes immediate and witnessed rather than posthumous and secret, and the Bridge Betrayal and Brig Apology scenes do not occur. This is a deliberate, encouraged possibility — let the players break the structure if they can.\n\nIn either case, Verelin still learns of the Eye of the Stars, and the Act Three culmination remains intact."}, {"id": "a153", "t": "h1", "x": "Act Three: The Truth"}, {"id": "a154", "t": "p", "x": "Everything Zid has been chasing converges. The family. The ship. The thing Robbton has been carrying since before Zid was old enough to remember."}, {"id": "a155", "t": "h2", "x": "Robbton's Confession"}, {"id": "a156", "t": "p", "x": "Zid comes back to the Hope with Boliphar's name in his mouth and a question he cannot ask directly. He finds Robbton. He finds a way into the conversation. And eventually — because Robbton has been trying to find this moment for years — the old man tells him."}, {"id": "a157", "t": "p", "x": "He tells Zid about the night. The blaster. What he believed he was doing. What happened. He tells it haltingly, with gaps he cannot fill because the memory is genuinely gone or because he has buried it so deep that even now he cannot reach all of it. But the core of it — the irreducible fact — he speaks clearly."}, {"id": "a158", "t": "p", "x": "It was an accident. Boliphar was never to blame. Robbton has carried this alone because he did not know who else had the right to hear it."}, {"id": "a159", "t": "callout", "x": "Do not script this scene. Give Robbton's side of it — his words, his silences, his memory failures —\nand then step back. Let Zid's player decide what the scene becomes.\nRobbton is not asking for forgiveness. He is not sure he deserves to ask.\nHe is giving Zid the truth because it belongs to him.\nWhat Zid does with it is the player's story to write, not the GM's."}, {"id": "a160", "t": "h2", "x": "The Beacon — Activating the Key"}, {"id": "a161", "t": "p", "x": "The beacon Zid has worn his entire life is keyed to the Eye of the Stars. When he understands what it is — from Boliphar's blueprints, from what Robbton tells him, from the pieces assembled across three acts — he activates it."}, {"id": "a162", "t": "p", "x": "The Eye responds. Somewhere inside the Rishi Maze, a ship that has been running dark for twenty years receives a signal it has been waiting for. Systems begin to wake. The beacon's return signal gives the team a location: the outer edge of the black hole's gravity gradient, deep in the Maze."}, {"id": "a163", "t": "p", "x": "It also gives Verelin's probe droids a location. The race begins immediately."}, {"id": "a164", "t": "h2", "x": "Cutaway — The Brig (Bridging Acts Two and Three)"}, {"id": "a165", "t": "p", "x": "A pure cutaway, no player interaction — the same device as the yacht scene. This plays as the transition into Act Three, setting the emotional register for everything that follows."}, {"id": "a166", "t": "p", "x": "Boliphar, captured and interrogated by Verelin's people to the brink of his life, is thrown into a cell adjoining Reti's. He hears sobbing before he sees anything. He wills himself to the bars."}, {"id": "a167", "t": "quote", "x": "I'm so sorry, Reti. You never deserved any of this. I was trying to protect you from afar, without realising I was instead pushing you towards evil. I'm sorry. I failed you. I failed us all."}, {"id": "a168", "t": "callout", "x": "Play this with restraint. Reti should not be given a scripted response — let the sobbing simply stop, or let him not turn to look. The table should sit in that silence the same way the base document already asks for silence after Boliphar's line at the shrine. This scene is deliberately unwitnessed by any character who survives to tell it — the players alone carry it forward."}, {"id": "a169", "t": "h2", "x": "The Rishi Maze — The Finale"}, {"id": "a170", "t": "h3", "x": "Navigation"}, {"id": "a171", "t": "p", "x": "The Rebel fleet — assembled at the threshold Cracken has been building toward — jumps to the Rishi Maze. Verelin's fleet is already moving. Imperial navigators are working from incomplete charts. Every manoeuvre costs them time. The Rebel ships have guides: Chieftain Qwar's warriors, returning the favour the team earned on Rishi, flying the channels they have known since childhood."}, {"id": "a172", "t": "p", "x": "Hondo is there, if recruited. He transmits on an open channel without prompting."}, {"id": "a173", "t": "quote", "x": "I am here to help! Also, I am here to discuss compensation.\nThese things are not mutually exclusive."}, {"id": "a174", "t": "p", "x": "His contribution: the channel that runs closest to the black hole's point of no return. He has used it twice to lose pursuers. He offers it freely — for a future favour, which the Rebellion will record and quietly never collect."}, {"id": "a175", "t": "h3", "x": "The Eye of the Stars"}, {"id": "a176", "t": "p", "x": "The ship is enormous. Dark. Running silent for twenty years, and beautiful in the way that things built with love and purpose are beautiful — not Imperial utilitarian, not Rebel functional, but something designed by a man who intended it to be a home."}, {"id": "a177", "t": "p", "x": "The activation sequence is gradual. Systems come online from the outside in — running lights first, then engines warming from cold that has lasted two decades, then life support, then interior lighting spreading section by section through corridors that have not seen light since before Zid could walk."}, {"id": "a178", "t": "p", "x": "The shrine room is the last to come to life. The beacon connects to it directly. It is at the heart of the ship — not the bridge, not the engine room, the heart. Boliphar designed it that way first, before anything else."}, {"id": "a179", "t": "p", "x": "When Zid stands in that room and the lights come on, the first thing he sees is her face."}, {"id": "a180", "t": "callout", "x": "Do not describe Avia directly. Let Zid's player ask questions.\nAnswer them with what the room tells you: the care in the design, the materials chosen,\nthe way the light falls on the memorial. A man's love made physical, preserved for twenty years\nin a ship orbiting a black hole where no one would ever find it unless they already knew.\nGive Zid a moment here before the next scene arrives.\nHe has earned it."}, {"id": "a181", "t": "h1", "x": "The Two Directions"}, {"id": "a182", "t": "p", "x": "If Zid and team manage to get to the Eye first, or manage to trap Verelin’s forces at the black hole, then Beat 1 playes out. If they don’t, then Verelin gets to the Eye first, and we play Beat 2 instead."}, {"id": "a183", "t": "h2", "x": "Beat 1 — The Bridge Betrayal"}, {"id": "a184", "t": "p", "x": "Verelin, cornered — the Rebel fleet closing, engines targeted, a black hole pulling at his armada — grows desperate as Zid's pursuit of the Eye nears success. He summons Reti and Boliphar to the bridge."}, {"id": "a185", "t": "p", "x": "He draws the gold-plated blaster — Reti's own gift — and levels it at Reti."}, {"id": "a186", "t": "quote", "x": "Tell me how to find the Eye,\" he says, \"or say goodbye to your son."}, {"id": "a187", "t": "p", "x": "Boliphar puts himself between the weapon and Reti."}, {"id": "a188", "t": "quote", "x": "Leave him. I'm the one you want. If you give me a starmap and some time, I can find the Eye for you—"}, {"id": "a189", "t": "p", "x": "It is a bluff. Boliphar has no intention of ever giving up the Eye's location, and no reason to believe the bluff will work. At that exact moment, the Eye of the Stars jumps into the system — visible on the bridge viewscreen in full. Boliphar was, unknowingly, telling the truth."}, {"id": "a190", "t": "p", "x": "Verelin, out of time and out of patience, shoots Reti. Boliphar tries to shield him and is a fraction too slow. As the shot takes Reti, Boliphar speaks a phrase in ancient Duro — and the blaster detonates in a sonic immobiliser burst. The weapon, older than anyone on that bridge knew, was built generations ago to protect Duros families specifically: its frequency incapacitates everyone present except Boliphar and, crucially, does not need to be aimed to work."}, {"id": "a191", "t": "p", "x": "Verelin and his bridge crew are left frozen — stunned, immobile, aware — as Boliphar carries his dying son to an escape pod and launches. Before he goes, he transmits a Duros IFF signal toward the Rebel fleet: one he knows Zid will recognise."}, {"id": "a192", "t": "quote", "x": "I'm sorry, father,\" Reti says weakly. Boliphar smiles. \"Don't be. You are at peace now, my son."}, {"id": "a193", "t": "callout", "x": "Verelin’s Fate\nDo not resolve Verelin's fate directly. He and his crew, immobilised, are left aboard a Star Destroyer with a black hole's gravity well closing in and a Rebel fleet still engaging. Let this exist in the background, glimpsed through a viewport, unlingered on. A fate worse than death — aware, frozen, and falling — fits a man who has spent this entire arc patient and unhurried, assuming he always had time."}, {"id": "a194", "t": "h2", "x": "Beat 2 - Boliphar's Return of the Jedi Moment"}, {"id": "a195", "t": "p", "x": "Verelin boards the Eye with Boliphar and Reti as his insurance. The Moff stands on the ship's bridge — or in the shrine room itself — with stormtroopers at every exit, Boliphar and Reti beaten and kneeling next to him, a gold-plated blaster pistol of Duros origin pointed straight at them. The gravity gradient outside the viewports works in Verelin's favour for exactly as long as he believes it does."}, {"id": "a196", "t": "quote", "x": "You've come a long way, Hag. Farther than I expected.\nBut this is where it ends. Surrender, or your father doesn't see another hour.\"\nHe gestures at the stormtroopers. At the viewports. At the black hole hanging outside like a patient.\n\"You can't win this. Not here."}, {"id": "a197", "t": "p", "x": "Verelin is right about almost everything. He is wrong about one thing: the Duros pistol, and the sonic device planted within it. Boliphar waited for the right moment."}, {"id": "a198", "t": "p", "x": "The moment is now."}, {"id": "a199", "t": "p", "x": "Boliphar uses the device. The sonic pulse incapacitates all non-Duros, which unfortunately may mean the team. But this gives Zid a chance to work with his family on saving the team solo. As the device goes off, however, he shoots – Boliphar takes the hit."}, {"id": "a200", "t": "p", "x": "The battle outside resolves as it resolves — Qwar's guides, Hondo's channel, the gravity gradient doing what gravity gradients do to navigators who are guessing. Verelin's fleet does not survive the Maze intact."}, {"id": "a201", "t": "p", "x": "Verelin's fate is Zid's to decide. Whether the Moff sees the inside of a Rebel cell, the inside of the black hole, or something else — that is the player's call."}, {"id": "a202", "t": "h1", "x": "The Shrine"}, {"id": "a203", "t": "p", "x": "Father and son reach the shrine together. Boliphar is failing. He knows it. He does not spend the time he has on apologies or explanations — Zid has those already, or will find them in the records and the memories and the twenty years of work that built this ship. What Boliphar has left is simpler than any of that."}, {"id": "a204", "t": "p", "x": "Zid's beacon has activated its reactor and, at its heart, Avia's shrine. The team moves through the ship together, marvelling at its scale and age. As they approach the shrine room, an NPC — Hondo Ohnaka, if recruited — stops the rest of the group."}, {"id": "a205", "t": "quote", "x": "This is a moment for father and son — even Hondo Ohnaka knows that's private stuff."}, {"id": "a206", "t": "p", "x": "Zid goes in alone."}, {"id": "a207", "t": "p", "x": "Inside: Boliphar has laid Reti's body beside Avia's shrine. Through the viewport, Verelin's Star Destroyer can be seen falling, slowly, into the black hole — the bridge crew, presumably, still frozen within it. Zid finds his father dying at the foot of the shrine, beside the brother he never properly met."}, {"id": "a208", "t": "p", "x": "Boliphar has perhaps three or four breaths left — and three or four questions Zid may ask before he goes."}, {"id": "a209", "t": "h2", "x": "The Last Questions"}, {"id": "a210", "t": "table", "x": "", "r": [["Question", "Boliphar's Answer"], ["\"Why didn't you come for me? All those years — why did you just leave me out there?\"", "\"Because the moment I came for you, I would have led them straight to you. Every year I stayed away was a year you got to be safe, and not know why. I told myself that was enough. It was never enough. I just didn't have anything better to give you.\""], ["\"Was any of it real? Caroth — was that ever you, or was it just a mask?\"", "\"Caroth was armor. Nothing more. Every cruelty he did, I made myself do, because the moment I stopped, I would have been Boliphar again — and Boliphar was a dead man, wanted, hunted. I hated wearing him. I hated it every single day. But your brother... your brother loved him. Or thought he did. That part wasn't a mask. That part I have to answer for.\""], ["\"What about mother? What was she like?\"", "\"She laughed loud enough to embarrass me in front of people I was trying to impress. She never let anyone else finish a story if she thought she could tell it better. She would have loved you loud, Zid. Not quiet, like I did. Loud. The whole room would have known.\""], ["\"Did you know? About Reti — that Verelin would use him like that. Did you know it would end this way?\"", "\"No. I thought I had more time. I always thought I had more time. I was wrong about a great many things, Zid. That one, I will carry the furthest.\""], ["(Held in reserve — the closing question, if the player has one breath left to spend) \"What do I do now?\"", "(barely a whisper) \"Whatever they never let either of us do. Choose it yourself.\""]]}, {"id": "a211", "t": "p", "x": "Zid and Boliphar watch, together, as Verelin's Star Destroyer falls into the black hole beyond the viewport. Then, at last:"}, {"id": "a212", "t": "quote", "x": "I'm proud of what you've become, Zid. I love you, son."}, {"id": "a213", "t": "p", "x": "Boliphar does not mention Reti again. He said what needed saying to his other son already, in a cell no one else saw. His hand slackens. A datapad he had been holding — written before he ever went to face Reti, in case he never got the chance to say any of this in person — slides from his open fingers."}, {"id": "a214", "t": "p", "x": "He dies there: beside the son he placed his hopes in, beside the wife he failed to protect, beside the son he never got to say sorry to in time for it to change anything."}, {"id": "a215", "t": "callout", "x": "The Datapad\nZid does not receive this as a gift — he notices it, the way grief is noticed rather than given, as it falls from a hand that can no longer hold on. The datapad contains Boliphar's account of Reti — the truth about Verelin's manipulation, about Caroth, about a son who was failed rather than fallen. This is how Reti is redeemed in Zid's eyes: not through anything Zid witnesses directly, but through his father's own written words, discovered after the fact. Recommend Zid reads this after the shrine scene has fully landed — on the flight home, or later — so the emotional peak of Boliphar's death is not competing with the intellectual reckoning of understanding Reti. Let each moment have its own room."}, {"id": "a216", "t": "callout", "x": "What the players know\nThe yacht cutaway and the brig cutaway are, and must remain, screen-wipe sequences: no character in the story ever witnesses them except the NPCs present. The players see them. Zid does not — not directly. He only receives the datapad's account afterward. This is deliberate: the table is asked to carry grief and understanding that the character himself only partially receives. That gap is the arc's signature device, used throughout the campaign, and should not be closed."}, {"id": "a217", "t": "h3", "x": "Reti"}, {"id": "a218", "t": "p", "x": "If Reti is still alive — if he boarded the Eye separately, or was captured during the battle, or found his way to the shrine room — he arrives at the worst possible moment. Or the best possible one, depending on what Zid decides to do with him."}, {"id": "a219", "t": "p", "x": "Reti sees a capital ship. He sees what Boliphar built. He sees his half-brother standing at the shrine of a woman who was never his mother, in a ship that was never intended for him, and he has to decide — perhaps for the first time in his life — what he actually wants."}, {"id": "a220", "t": "p", "x": "Zid has to decide the same thing about him."}, {"id": "a221", "t": "callout", "x": "The document does not resolve this confrontation. That is the player's story to write.\nWhat the GM can do: let Reti be three-dimensional in this moment.\nHe is not a cardboard villain. He is a man who wanted his father's love and made terrible choices reaching for it.\nHe is looking at his brother and understanding, maybe for the first time, what the Eye actually is.\nWhether that understanding changes anything — whether Zid thinks it should — is the scene."}, {"id": "a222", "t": "h1", "x": "Arc Timeline Reference"}, {"id": "a223", "t": "table", "x": "", "r": [["Beat", "Event"], ["1", "Mirial. Zob Anoor. The five threads uncovered. The con begins to take shape."], ["2", "Formos (optional). The Obfuscating Belligerent. Hondo recruited. The Mad Mynock transponder recovered."], ["3", "Geonosis ring system. The stripping station heist. Verelin's inspection. The name Reti Zentron."], ["4", "Duro. Reti's mansion. The three prizes. Boliphar appears. The twin reveals. The sonic immobiliser. Waking up alone."], ["5", "Return to the Hope. Robbton's confession. The truth about Avia. The beacon understood at last."], ["6", "The beacon activated. The Eye of the Stars responds. Verelin's probe droids triangulate. The race begins."], ["7", "The Rishi Maze. Qwar's guides. Hondo's channel. Verelin's fleet and the gravity gradient."], ["8", "The Eye of the Stars. The activation sequence. The shrine. Boliphar's final act. Father and son together."], ["9", "Reti's confrontation. Verelin's fate. The Eye of the Stars given to the Rebellion. Zid Hag comes home."]]}, {"id": "a224", "t": "quote", "x": "I'm proud of what you've become, Zid."}, {"id": "a225", "t": "quote", "x": "I love you, son."}], "body": "ZID HAG\n\nThe Eye of the Stars\n\nTone\n\nA heist film with a family at its heart.\n\nA man who has been carrying his inheritance his whole life, and never knew it.\n\nBackground: The Hag Legacy\n\nThe Hag family were once one of the great Duros houses — not the wealthiest, not the most powerful, but among the most respected. They were builders. Over generations they accumulated ships, loyalty, and a reputation for keeping their word. By the time of the Clone Wars, that reputation was all that remained. The wealth had been spent, the holdings mortgaged, the influence traded away piece by piece to keep the house from collapsing entirely.\n\nInto this diminished glory came Boliphar Zentron — not a Hag by blood, but a man who loved the family's ideals more than most born into them. He married Avia Hag quietly, without ceremony, and set about trying to save what her family had spent a century losing.\n\nHis plan was bold, meticulous, and almost worked. He hid the family's most valuable remaining asset — a generational dreadnought called the Eye of the Stars, built to carry the Duros people to safety in any catastrophe — in a location so remote and unlikely that no creditor, rival house, or Imperial surveyor would ever think to look. Then he placed his infant son Zid with distant relatives on the outer rim, gave the boy's caretakers a beacon he told them was a family heirloom, and ran.\n\nHe was not running from guilt. He was running from grief, and from whoever might know the truth about the night Avia died.\n\nThe Night Everything Changed\n\nThe night Avia died, there was a blaster in a room that should not have had one. The man holding it was Robbton — a young servant loyal to the Hag family to the extreme. Robbton didn't see the hidden ways Boliphar was saving the family - that was the point - so he thought Boliphar was dismantling their generational wealth. He couldn't have been further from the truth.\n\nBoliphar tried to talk some sense to the hysterical Robbton. Robbton panicked. He hit the trigger. It hit Avia.\n\nIt was an accident. Robbton has carried it ever since.\n\nBoliphar took his infant son, placed the beacon around the boy's neck — a beacon keyed to the Eye of the Stars, which would one day guide Zid home — and told Robbton to take him to his relatives in the shuttle behind them - where Avia was already headed. Robbton left. Boliphar took Avia’s body to the nearest hospital but it was too late. He never mentioned Robbton. He took the blame himself.\n\nBoliphar spent the next decade in prison for the murder of Avia. His Zentron connection got him a lean sentence. But Boliphar had been broken ever since. But he survived through the knowledge that Zid - and the Hag legacy - were safe. When he got out, he continued to build the Eye, hiding his work through intermediaries and a mask. He just had to wait for the right moment to restore it.\n\nIt never came. Just as he completed work on the Eye, the Republic became the Empire, and Boliphar - along with the rest of Duro - placed their loyalty firmly behind it. Grand Moff Verelin had already started corrupting his family, and it was a matter of time before they discovered the truth about the Hag legacy. So he became exactly what they wanted him to be: The Zentron Oligarch, best mate to the Empire. Safe in the knowledge somewhere out there, Zid was living his life, and that the Eye was safe.\n\nRobbton has served the Rebellion faithfully for years since. He has never stopped trying to make it right. He has never told anyone what he did.\n\nThe Twenty-Year Vigil\n\nBoliphar did not disappear. He ran toward a purpose: to keep the Eye of the Stars safe from the Empire, and return it to his son when the time was right. To fund this operation covertly — without revealing his ultimate plan — he worked through an intermediary he trusted completely: his other son, Reti Zentron, from a previous relationship.\n\nBoliphar Zentron did not simply hide from the galaxy after Avia's death. He hid in plain sight — inside the Empire itself. To protect Zid and the Eye of the Stars, he became Caroth Blaine: masked, human-seeming, the militant right hand of ZenCorp. His own son, Reti Zentron, rose to become ZenCorp's CEO — and never once recognised his own father behind the mask. Reti saw Caroth as an asset who answered utterly and completely to him. He used that asset for the company's dirtiest work. Boliphar, unable to break cover without dooming Zid and the Eye, did it.\n\nReti does not see himself as a villain. He is a man who spent a century failing to become a fraction of the legacy he never knew he'd already lost — while the one person who could have told him differently stood beside him the entire time, silent, behind a mask.\n\nThis is the arc's true engine. Boliphar's disguise did not just protect Zid — it condemned Reti to a father-shaped absence filled by a father who was never truly absent. Every cruelty Reti has ever ordered, Boliphar has had to carry out personally. Let this sit heavily whenever Caroth Blaine appears on-page before the reveal — the horror is retroactive.\n\nKey NPCs\n\nBoliphar Zentron — Zid's Father\n\nBoliphar is a tall, weathered Duros who looks like a man who has spent two decades carrying something heavy. He is not a soldier. He is not a spy. He is an engineer and a planner who has been running a covert recovery operation on a shoestring, through intermediaries, without anyone knowing what he was actually doing or why. He wears a suit of exquisite armour and a human-looking mask - both to hide his permanent scowl at having to work for the Empire, and the fact that he is a Duros: To avoid the Empire's xenophobia.\n\nHe loved Avia completely. He has never stopped. The shrine at the heart of the Eye of the Stars was his first design decision when he built the ship — before the engines, before the weapons, before the life support. He designed the shrine room first.\n\nHe does not blame Robbton. He never did. He simply could not face the man in the aftermath, and by the time he could have gone back, the distance had become a wall he did not know how to cross.\n\nWhen he finally meets Zid — beaten, prisoner, kept alive by Verelin as a biological key — he does not waste time on apologies. He has one thing to say that matters, and he finds the right moment to say it.\n\nI'm proud of what you've become, Zid.\"\nA pause. A breath.\n\"I love you, son.\n\nBoliphar's Return of the Jedi moment comes aboard the Eye of the Stars, at Avia's shrine.\nHe uses the sonic device Reti planted on him — intending it as a tracker — against Verelin instead.\nHe sustains fatal wounds in the process.\nFather and son stand together before Avia's face.\nThe GM may adapt the final words at the table, but the shape should remain:\nnot an apology, not an explanation — just the truth, finally spoken.\nSimple. Direct. Twenty years overdue.\n\nRobbton — The Hag Family Servant\n\nRobbton is old. He has always seemed old, in the way that people who have carried grief for a long time seem old before their years. He has served the Rebellion quietly and faithfully for years, doing small useful things — maintaining equipment, keeping records, making himself easy to overlook.\n\nZid's player has already met him. To the player, he is a kindly elderly man aboard the Hope, unremarkable and warm. To the GM, he is the arc's most important supporting character — the Snape of this story. He knows what he did. He has never told anyone. And every time he sees Zid, he is deciding whether today is the day.\n\nHis memory is failing in small, specific ways. This is not an excuse — it is a mechanic. Some details of that night he has genuinely lost. Others he has buried so deep he can no longer reliably distinguish them from what he has imagined in the years since. When he finally speaks the truth, it will be incomplete, and it will cost him enormously to give even that.\n\nRobbton's memory failures at the table should be played gently, not evasively.\nHe is not hiding — he is struggling. The distinction matters for how Zid receives it.\nThe GM should decide in advance which details Robbton has lost and which he carries clearly.\nThe core fact — he fired the blaster, it was an accident, Boliphar was never to blame — must survive.\nEverything else can be fragmentary.\nIf the 100 Obligation consequence fires, Robbton is taken by Reti before this conversation happens.\nThe direct confession is lost. Zid has to find the truth another way.\n\nReti Zentron — Boliphar's Other Son\n\nReti is polished, successful, and precisely as uncomfortable as a man who has always wanted his father's approval and has never received it. He runs his operation — trading Duros family registries to Grand Moff Verelin — with genuine competence, which makes him more dangerous than a merely venal villain would be.\n\nHe is not cruel by preference. He is ambitious and frightened and has made decisions he cannot unmake. When he finally meets Zid, he is not sure whether to see a brother or a rival. He may not know the difference.\n\nHis betrayal of Boliphar — tipping Verelin to his father's location — is not calculated malice. It is panic. Verelin was pushing for more, the operation was unravelling, and Reti made the calculation that Boliphar was more valuable as a bargaining chip than as a father. He has not fully processed what that means yet.\n\nWhat Reti does with the Eye of the Stars — at the moment he boards it and finds his half-brother standing at their mother's shrine — is a choice the scene should make space for. He sees a capital ship. He sees credits, power, leverage. He sees his father's love materialised in steel and corridors and a room built around a woman's face.\n\nHe has never once stood in front of something and felt that it was his in the way that matters.\n\nReti's fate is in Zid's hands. The GM should not push in any direction.\nIf Zid kills him, that is a valid ending. If he lets him go, that too.\nThe interesting question is whether Reti, in that shrine room, finally sees what the Eye actually is.\nWhether he does or not depends on what Zid says — and whether Zid thinks his brother is worth the attempt.\nThe document does not answer this. That is the player's story to write.\n\nGrand Moff Serephus Verelin — The Arc's Antagonist\n\nVerelin is not invested in the Duros stripping operation because he believes in the Empire's agenda. He is invested because it is personally profitable and he has built his career on profitable arrangements. He is corrupt in the ordinary, unglamorous way — not a fanatic, not a monster with a philosophy, just a man who has always chosen his own comfort over anyone else's.\n\nHe keeps Boliphar alive because a man who designed a ship keyed to his own biology may be needed to open it. This is practical, not merciful.\n\nHis flagship is the Pious Interceptor. His navigation charts for the Rishi Maze are incomplete. His fleet is larger than the Rebel response. He believes this is sufficient. He has never had to fight someone whose allies were born in the Maze.\n\nHondo Ohnaka — Optional Ally\n\nHondo has been running stolen Duros IFF transponders aboard the Obfuscating Belligerent through the Formos lanes for years. He does not know what the transponders mean or where they came from — he bought them cheap and sells them cheaper. He is, as always, cheerfully opportunistic and entirely unashamed of it.\n\nHis role in the finale is unofficial, uninvited, and exactly what the situation requires. He arrives in the Rishi Maze because he heard a Grand Moff was moving a fleet toward something valuable, and Hondo Ohnaka does not miss an auction — even one conducted at gunpoint near a black hole.\n\nI am here to help! Also, I am here to discuss compensation.\nThese things are not mutually exclusive.\n\nHis specific contribution: he knows which channel in the Maze runs closest to the black hole's point of no return, because he has used it twice to lose pursuers. That is the channel they use to take Verelin.\n\nAvia Hag — In Memory\n\nAvia does not appear. She died before the arc begins. She is present in everything anyway — in the beacon Zid has worn his whole life without knowing what it was, in the shrine at the heart of a ship her husband designed for her, in the face that is the first thing Zid sees when the lights come on.\n\nThe GM should never describe Avia directly. Let the shrine do it. Let Boliphar's silences do it. Let the ship itself do it — because a man who builds a dreadnought and puts the shrine before the engines is telling you everything you need to know about who he was building it for.\n\nObligation Mechanics\n\nObligation Type: Family / Lost\n\nIncreases\n\nDecreases\n\nStandard Triggers\n\nWhen Zid's obligation number comes up in the session roll, one of the following triggers fires — one per act, in order:\n\nAct One Trigger — Robbton Surfaces\n\nRobbton appears somewhere unexpected aboard the Hope. A corridor, a mess hall, a quiet corner of the hangar. He is doing something small and good. He recognises Zid warmly — perhaps too warmly, with the particular warmth of a man who has been hoping for a chance to make something right and does not know how to begin.\n\nHe does not confess. He asks how Zid is. He mentions the Hag family in passing — just a name, just a reference, as if testing whether Zid knows it. Then he offers to help. With anything. Because this is a man that needs to atone – he just doesn’t let anyone else realise that.\n\nRobbton's Report\n\nBefore Rishi, Zid asked Robbton to look into a rumour: that Duros family ships were being quietly seized and funnelled into Imperial hands. Following Rishi — where Ollund revealed the beacon is a Return-to-Ship signal, tied to a Generational ship not seen in 150 years — Zid seeks Robbton out aboard the Hope to hear what he's found, and to share what he's learned.\n\nRobbton is eager, visibly pleased to have been trusted with something real.\n\nMaster Hag! Good, good — I was hoping you'd come find me. You were right to ask. It's real. Ships — Duros family ships — getting quietly folded into Imperial auctions. I don't have the whole shape of it yet, but I've got a name. Zob Anoor. Toydarian scrap dealer, has a shop out on Mirial... There's a name behind it too. Higher up. I haven't got it pinned down — every thread I pull just leads to another shell, another holding company. But it's someone with real reach. Real money.\n\nIf Zid shares the beacon revelation, Robbton has nothing concrete to offer — but throws himself at the question anyway.\n\nA beacon. On you. This whole time... I don't know anything about that, Zid, I promise you. But I can ask. I know people — old people, older than me. If there's a story about something out in that Maze, somebody's grandmother told it to somebody once. I'll find who. Let me do this, Zid. Let me actually do something.\n\nPLAYER CHOICE\nLeave all three options genuinely open rather than steering: (A) Zid pushes Robbton to dig further into the Zob/ship-stripping thread immediately — this accelerates toward Act One and quietly starts the clock toward Reti noticing him. (B) Zid sits with the beacon privately, unresolved, a character beat rather than a plot beat. (C) Zid chases the Rishi Maze question in parallel, not yet realising it and the Zob thread are the same story. Robbton's Rishi Maze search should never produce anything concrete — let it return only atmosphere and folklore, confirming the mystery is old and real without answering it.\n\nAct Two Trigger — The Mad Mynock Signal\n\nThe Mynock's IFF beacon activates. Somewhere nearby — in the same system, close enough to ping — a ship is broadcasting a signal that should not exist anymore. The Mad Mynock's transponder. Zid's family ship.\n\nThe signal source is the Obfuscating Belligerent. Hondo has the transponder. He does not know what it is.\n\nThis is the bridge to Formos — and to Hondo. If Zid follows it, he finds Hondo. If Hondo is recruited, he gives Zid the Geonosis lead as part of the deal.\n\nAct Three Trigger — Boliphar's Voice\n\nA short-range transmission, scrambled almost beyond recognition. A Duros voice, older than Zid remembers any voice being, saying a name. His name.\n\nBoliphar has found a way to reach out. He does not explain where he is or how he found the frequency. He says only that the time is almost right, that Zid should trust the beacon, and that he is sorry it took this long.\n\nThe transmission cuts. The source triangulates to somewhere inside the Rishi Maze.\n\nDoubles\n\nWhen doubles are rolled, the following escalating sequence fires:\n\nEach doubles encounter that Zid survives reduces obligation by 5 — he has demonstrated the beacon cannot be easily taken. Each encounter that ends with the team retreating or the beacon at risk increases obligation by 5.\n\n100 Obligation Consequence\n\nReti discovers that Robbton served the Hag family. He engineers a false lead — a rumour, carefully seeded through infochant networks, that Avia Hag may have survived, that someone matching her description was seen on a specific world. Robbton hears it. He does not tell anyone. He follows it alone.\n\nReti's people take him quietly. They interrogate him about the beacon, about Boliphar, about everything he knows. Robbton gives them nothing useful — he does not know what the beacon does either — but the interrogation is not gentle. When they are done, they leave him somewhere he will not be found quickly.\n\nZid finds out what happened. The direct confession is gone. The chance to hear Robbton say the words in a room where both of them can breathe is lost.\n\nThe truth is still findable. It is in records, in the accounts of people who were there that night, in what Boliphar knows and is willing to say. But Robbton's voice — the specific relief of hearing the man who carried it speak it freely — that is gone.\n\nThis cannot be undone. It can only be lived with.\n\nAct One: The Ghost Ship\n\nThe Italian Job opening. Zid has a lead, a target, and no idea how deep it goes. By the end of Act One he will have a clearer picture of what was taken from his family — and a new villain who is not quite what he seems.\n\nMirial — Zob and the Con\n\nZob Anoor is a Toydarian scrap merchant who deals in derelict ships and salvage. He is livid with the Rebellion — he has been trying to sell them ships for months and nobody has returned his calls. He is also, underneath the bluster, genuinely useful: he has recently been offloaded a significant number of derelict vessels that were auctioned by the Empire, and he has been piecing together what the auction actually was.\n\nThe auction was a Duros stripping operation. Someone has been acquiring Duros family ship registries and selling them to the Empire, which then auctions the ships through Zob and others like him. Many Duros family ships — including the Mad Mynock — were in that auction.\n\nZob doesn't know who is running the operation. But he can give Zid several threads to pull:\n\nThe proof of purchase for the hulls, which lists them being “Hull-only”, their IFFs removed. The seller is listed as “ZenCorp Industries”.\n\nSomeone else has been selling the IFFs themselves, in black market dealings. He doesn’t have a location, just a name: Caroth Blaine.\n\nCaroth Blaine has been a known frequenter of Formos, and a known associate of Bandin Dobah.\n\nA description of this Caroth Blaine: A masked human, tall, wears gold-metal armour. Zob can show the team a holoimage if they press him.\n\nThese are the threads that connect the whole operation to Caroth Blaine. It should naturally lead to Formos, but if the team decide to do their own research on Caroth Blaine, they will eventually get to the stripping work on Geonosis.\n\nThey will also discover the Geonosis thread by going to Formos, and they will get this from investigating Caroth Blaine from the man himself.\n\nFormos — The Obfuscating Belligerent\n\nThis beat is optional but richly rewarding. If Zid follows the IFF transponder thread, or if the Act Two Trigger fires and the Mynock's signal activates near Hondo's ship, the trail leads to Formos — and to Hondo Ohnaka.\n\nHondo has purchased the Mad Mynock's IFF transponder through three intermediaries and has no idea of its origin. He is using it to mask the Obfuscating Belligerent's identity during runs. He is, when confronted, entirely unbothered.\n\nI bought it legitimately! Mostly legitimately. The paperwork exists.\nI have seen it. It was very convincing paperwork.\n\nHondo can be recruited as an ally for the finale if Zid recovers the transponder and offers something in return. He asks for very little — a favour, a future favour, the prospect of being owed something by the Rebellion. He is also, genuinely, interested in whatever is at the centre of this story. A generational dreadnought hidden in the Rishi Maze is exactly the kind of thing Hondo Ohnaka has opinions about.\n\nThe Formos location intersects with Derek's arc — Rinn Achara is imprisoned here by Bandin Dobah.\nIf both players are present, the team may end up pursuing two objectives simultaneously.\nThis is not a problem. It is exactly the kind of table moment that makes shared arcs feel alive.\nLet the session breathe. Don't force either thread to wait.\n\nGeonosis — The Stripping Station Heist\n\nThe stripping operation runs through an Imperial processing station in the Geonosis ring system — officially a salvage and recycling facility, actually a place where Duros ship registries are stripped and reassigned. It is not heavily guarded; it is not supposed to exist officially.\n\nThe team has three objectives inside the station:\n\nThe Registry Archive — documentation of every Duros family ship that has passed through, including current ownership status of the Mad Mynock and any other Hag family vessels\n\nThe Manifest Ledger — the record of who sold the ships to the operation and who bought the stripped registries\n\nThe Coordination Contact — a name at the top of the operation, referenced only by a Duro address\n\nThe heist should be structured as the team plans it — approach, entry, extraction. The GM should let the player's objective-driven instincts drive the planning session. Zid's player works best when every angle is on the table.\n\nMidway through the heist, Grand Moff Verelin arrives with a Death Trooper escort.\nHe is here for a routine inspection — he takes an interest in the operation personally.\nThe team must complete their objectives while avoiding Verelin's attention.\nThis is also the moment Verelin notices Bex, if she is present.\nHe orders her taken alive for General Mohc — tying Bex's arc into this scene without derailing Zid's.\nThe team may have to split priorities: the heist objectives and keeping Bex free.\nNeither thread should be sacrificed for the other. That is the point.\n\nWhat the team finds in the Manifest Ledger: the Duro address belongs to a holding company called Zentron Recovery. The man at the top of the operation is named Reti Zentron.\n\nZid has his villain. He is wrong about what Reti is — but he does not know that yet.\n\nAct Two: The Family\n\nZid goes to Duro expecting to confront a criminal. He finds something much more complicated.\n\nCutaway — The Yacht (Plays Early in the Arc)\n\nA pure cutaway. No player interaction — a screen wipe, exactly like the ones the campaign has used before. This should be shown early, ideally as the cold open to whichever session begins Zid's active pursuit of Reti, establishing the antagonist relationship before the team ever meets either man in person.\n\nReti Zentron and Grand Moff Verelin, aboard Verelin's luxury yacht. Dancers, performers, excess. They are, unmistakably, friends. Business is discussed, but only after Reti presents a gift.\n\nThis was an old Zentron heirloom, passed down generation to generation. Last person to hold it was my father, before he went missing. I want you to have it — as a sign of our formal relationship. Long live ZenCorp and the Empire!\n\nVerelin's grin as he takes the gold-plated blaster should read as delighted, and faintly predatory — a man collecting something he doesn't yet know the true value of.\n\nThis is the single most important object in the arc's back half. It re-appears in Verelin's hand during the bridge betrayal. Do not foreshadow its importance here — let it read as simple, warm irony (a gift to an ally) on first viewing. The horror is retroactive.\n\nDuro — Reti's Mansion\n\nThe mansion on Duro is registered to Zentron Recovery but was originally Hag family property. It has been renovated extensively — Reti has money and has spent it trying to make the place feel like his. It does not. It still has the bones of something older.\n\nThe team has four approaches to the mansion:\n\nThe Dirt — find compromising information about Reti's operation and use it as leverage to gain access\n\nThe Sabotage — take down the mansion's security systems from outside, then enter in the confusion\n\nThe Theft — steal Reti's schedule and impersonate invited guests at one of his regular business dinners\n\nThe Confrontation — go in directly, which is faster and louder and will almost certainly involve shooting\n\nThe team is looking for three prizes inside the mansion:\n\nBoliphar's original blueprints for the Eye of the Stars — hidden behind a false panel in what was Hag family storage, not yet found by Reti\n\nThe full Zentron Recovery client list — including Verelin's name, his personal account numbers, and the record of exactly what Reti sold him\n\nA communication log between Reti and an unknown party, discussing 'the second son' and 'the beacon' — the first confirmation that Reti knows about Zid specifically\n\nThe Twin Reveals\n\nThe team infiltrates Reti's mansion (or ZenCorp holdings on Duro) mid-firefight. Caroth Blaine — Reti's masked enforcer, the team's recurring nemesis across Act Two — approaches. He does not fire back. He may absorb hits without responding. He walks, deliberately, straight toward Zid, unclasping his mask as he moves.\n\nNobody ever told you what happened to your father,\" Caroth says, voice modulated. \"They told me enough — they told me you killed him.\" (or similar, from Zid's player)\n\nNo.\" The mask comes away. Beneath it: a scarred, old Duros face, echoes of both Reti and Zid in its features. \"I am your father.\n\nReti is present for this — sees it, hears it, understands in the same instant that his most trusted enforcer was his own father in disguise, and that the stranger beside him is his half-brother. He has no time to process it. His operation is in ruins, his right hand has defected in front of him, and the Rebellion is at his door. He chooses the only response he has ever known.\n\nHe triggers a sonic immobiliser, freezing the room. Boliphar — having removed his mask moments before — is caught in the blast, but manages to re-seat the mask (built to withstand the frequency) just in time to remain mobile.\n\nWith seconds available, Boliphar makes his choice — trying to serve both sons in the only way the moment allows. He presses something into Zid's hand: the key data needed to complete the beacon triangulation.\n\nHere, kid... you're almost home.\n\nThen he turns, already moving toward the door his other son fled through.\n\nReti — son, wait! Don't go running to him — he's dangerous—\n\nHe trails off as he exits. The team — and Zid — wake up alone in the wreckage of the confrontation. No bodies. No resolution. Only the key, and the silence after.\n\nTHE KEY\nThe key Boliphar gives Zid is the final data point needed to triangulate the Eye of the Stars' jump pattern, combining with the beacon signal and anything gathered from Robbton or Zob's threads. A Hard (◆◆◆) Astrogation or Computers check, once the beacon is later activated, allows Zid to calculate the Eye's position and jump cadence — this is what triggers the base document's Beat 6 (\"the beacon activated... the race begins\").\n\nTHE TEAM INTERVENES\nIf the team acts fast enough to stop Reti from fleeing, or otherwise disrupts this sequence before the immobiliser fires, this scene is designed to bend. Boliphar's dialogue and motivations should stay the same regardless — but the outcome (Reti escaping to Verelin, the entire Bridge Betrayal sequence below) may be avoidable entirely. If the players rescue both Boliphar and Reti here, treat this as a legitimate divergence: Reti's redemption becomes immediate and witnessed rather than posthumous and secret, and the Bridge Betrayal and Brig Apology scenes do not occur. This is a deliberate, encouraged possibility — let the players break the structure if they can.\n\nIn either case, Verelin still learns of the Eye of the Stars, and the Act Three culmination remains intact.\n\nAct Three: The Truth\n\nEverything Zid has been chasing converges. The family. The ship. The thing Robbton has been carrying since before Zid was old enough to remember.\n\nRobbton's Confession\n\nZid comes back to the Hope with Boliphar's name in his mouth and a question he cannot ask directly. He finds Robbton. He finds a way into the conversation. And eventually — because Robbton has been trying to find this moment for years — the old man tells him.\n\nHe tells Zid about the night. The blaster. What he believed he was doing. What happened. He tells it haltingly, with gaps he cannot fill because the memory is genuinely gone or because he has buried it so deep that even now he cannot reach all of it. But the core of it — the irreducible fact — he speaks clearly.\n\nIt was an accident. Boliphar was never to blame. Robbton has carried this alone because he did not know who else had the right to hear it.\n\nDo not script this scene. Give Robbton's side of it — his words, his silences, his memory failures —\nand then step back. Let Zid's player decide what the scene becomes.\nRobbton is not asking for forgiveness. He is not sure he deserves to ask.\nHe is giving Zid the truth because it belongs to him.\nWhat Zid does with it is the player's story to write, not the GM's.\n\nThe Beacon — Activating the Key\n\nThe beacon Zid has worn his entire life is keyed to the Eye of the Stars. When he understands what it is — from Boliphar's blueprints, from what Robbton tells him, from the pieces assembled across three acts — he activates it.\n\nThe Eye responds. Somewhere inside the Rishi Maze, a ship that has been running dark for twenty years receives a signal it has been waiting for. Systems begin to wake. The beacon's return signal gives the team a location: the outer edge of the black hole's gravity gradient, deep in the Maze.\n\nIt also gives Verelin's probe droids a location. The race begins immediately.\n\nCutaway — The Brig (Bridging Acts Two and Three)\n\nA pure cutaway, no player interaction — the same device as the yacht scene. This plays as the transition into Act Three, setting the emotional register for everything that follows.\n\nBoliphar, captured and interrogated by Verelin's people to the brink of his life, is thrown into a cell adjoining Reti's. He hears sobbing before he sees anything. He wills himself to the bars.\n\nI'm so sorry, Reti. You never deserved any of this. I was trying to protect you from afar, without realising I was instead pushing you towards evil. I'm sorry. I failed you. I failed us all.\n\nPlay this with restraint. Reti should not be given a scripted response — let the sobbing simply stop, or let him not turn to look. The table should sit in that silence the same way the base document already asks for silence after Boliphar's line at the shrine. This scene is deliberately unwitnessed by any character who survives to tell it — the players alone carry it forward.\n\nThe Rishi Maze — The Finale\n\nNavigation\n\nThe Rebel fleet — assembled at the threshold Cracken has been building toward — jumps to the Rishi Maze. Verelin's fleet is already moving. Imperial navigators are working from incomplete charts. Every manoeuvre costs them time. The Rebel ships have guides: Chieftain Qwar's warriors, returning the favour the team earned on Rishi, flying the channels they have known since childhood.\n\nHondo is there, if recruited. He transmits on an open channel without prompting.\n\nI am here to help! Also, I am here to discuss compensation.\nThese things are not mutually exclusive.\n\nHis contribution: the channel that runs closest to the black hole's point of no return. He has used it twice to lose pursuers. He offers it freely — for a future favour, which the Rebellion will record and quietly never collect.\n\nThe Eye of the Stars\n\nThe ship is enormous. Dark. Running silent for twenty years, and beautiful in the way that things built with love and purpose are beautiful — not Imperial utilitarian, not Rebel functional, but something designed by a man who intended it to be a home.\n\nThe activation sequence is gradual. Systems come online from the outside in — running lights first, then engines warming from cold that has lasted two decades, then life support, then interior lighting spreading section by section through corridors that have not seen light since before Zid could walk.\n\nThe shrine room is the last to come to life. The beacon connects to it directly. It is at the heart of the ship — not the bridge, not the engine room, the heart. Boliphar designed it that way first, before anything else.\n\nWhen Zid stands in that room and the lights come on, the first thing he sees is her face.\n\nDo not describe Avia directly. Let Zid's player ask questions.\nAnswer them with what the room tells you: the care in the design, the materials chosen,\nthe way the light falls on the memorial. A man's love made physical, preserved for twenty years\nin a ship orbiting a black hole where no one would ever find it unless they already knew.\nGive Zid a moment here before the next scene arrives.\nHe has earned it.\n\nThe Two Directions\n\nIf Zid and team manage to get to the Eye first, or manage to trap Verelin’s forces at the black hole, then Beat 1 playes out. If they don’t, then Verelin gets to the Eye first, and we play Beat 2 instead.\n\nBeat 1 — The Bridge Betrayal\n\nVerelin, cornered — the Rebel fleet closing, engines targeted, a black hole pulling at his armada — grows desperate as Zid's pursuit of the Eye nears success. He summons Reti and Boliphar to the bridge.\n\nHe draws the gold-plated blaster — Reti's own gift — and levels it at Reti.\n\nTell me how to find the Eye,\" he says, \"or say goodbye to your son.\n\nBoliphar puts himself between the weapon and Reti.\n\nLeave him. I'm the one you want. If you give me a starmap and some time, I can find the Eye for you—\n\nIt is a bluff. Boliphar has no intention of ever giving up the Eye's location, and no reason to believe the bluff will work. At that exact moment, the Eye of the Stars jumps into the system — visible on the bridge viewscreen in full. Boliphar was, unknowingly, telling the truth.\n\nVerelin, out of time and out of patience, shoots Reti. Boliphar tries to shield him and is a fraction too slow. As the shot takes Reti, Boliphar speaks a phrase in ancient Duro — and the blaster detonates in a sonic immobiliser burst. The weapon, older than anyone on that bridge knew, was built generations ago to protect Duros families specifically: its frequency incapacitates everyone present except Boliphar and, crucially, does not need to be aimed to work.\n\nVerelin and his bridge crew are left frozen — stunned, immobile, aware — as Boliphar carries his dying son to an escape pod and launches. Before he goes, he transmits a Duros IFF signal toward the Rebel fleet: one he knows Zid will recognise.\n\nI'm sorry, father,\" Reti says weakly. Boliphar smiles. \"Don't be. You are at peace now, my son.\n\nVerelin’s Fate\nDo not resolve Verelin's fate directly. He and his crew, immobilised, are left aboard a Star Destroyer with a black hole's gravity well closing in and a Rebel fleet still engaging. Let this exist in the background, glimpsed through a viewport, unlingered on. A fate worse than death — aware, frozen, and falling — fits a man who has spent this entire arc patient and unhurried, assuming he always had time.\n\nBeat 2 - Boliphar's Return of the Jedi Moment\n\nVerelin boards the Eye with Boliphar and Reti as his insurance. The Moff stands on the ship's bridge — or in the shrine room itself — with stormtroopers at every exit, Boliphar and Reti beaten and kneeling next to him, a gold-plated blaster pistol of Duros origin pointed straight at them. The gravity gradient outside the viewports works in Verelin's favour for exactly as long as he believes it does.\n\nYou've come a long way, Hag. Farther than I expected.\nBut this is where it ends. Surrender, or your father doesn't see another hour.\"\nHe gestures at the stormtroopers. At the viewports. At the black hole hanging outside like a patient.\n\"You can't win this. Not here.\n\nVerelin is right about almost everything. He is wrong about one thing: the Duros pistol, and the sonic device planted within it. Boliphar waited for the right moment.\n\nThe moment is now.\n\nBoliphar uses the device. The sonic pulse incapacitates all non-Duros, which unfortunately may mean the team. But this gives Zid a chance to work with his family on saving the team solo. As the device goes off, however, he shoots – Boliphar takes the hit.\n\nThe battle outside resolves as it resolves — Qwar's guides, Hondo's channel, the gravity gradient doing what gravity gradients do to navigators who are guessing. Verelin's fleet does not survive the Maze intact.\n\nVerelin's fate is Zid's to decide. Whether the Moff sees the inside of a Rebel cell, the inside of the black hole, or something else — that is the player's call.\n\nThe Shrine\n\nFather and son reach the shrine together. Boliphar is failing. He knows it. He does not spend the time he has on apologies or explanations — Zid has those already, or will find them in the records and the memories and the twenty years of work that built this ship. What Boliphar has left is simpler than any of that.\n\nZid's beacon has activated its reactor and, at its heart, Avia's shrine. The team moves through the ship together, marvelling at its scale and age. As they approach the shrine room, an NPC — Hondo Ohnaka, if recruited — stops the rest of the group.\n\nThis is a moment for father and son — even Hondo Ohnaka knows that's private stuff.\n\nZid goes in alone.\n\nInside: Boliphar has laid Reti's body beside Avia's shrine. Through the viewport, Verelin's Star Destroyer can be seen falling, slowly, into the black hole — the bridge crew, presumably, still frozen within it. Zid finds his father dying at the foot of the shrine, beside the brother he never properly met.\n\nBoliphar has perhaps three or four breaths left — and three or four questions Zid may ask before he goes.\n\nThe Last Questions\n\nZid and Boliphar watch, together, as Verelin's Star Destroyer falls into the black hole beyond the viewport. Then, at last:\n\nI'm proud of what you've become, Zid. I love you, son.\n\nBoliphar does not mention Reti again. He said what needed saying to his other son already, in a cell no one else saw. His hand slackens. A datapad he had been holding — written before he ever went to face Reti, in case he never got the chance to say any of this in person — slides from his open fingers.\n\nHe dies there: beside the son he placed his hopes in, beside the wife he failed to protect, beside the son he never got to say sorry to in time for it to change anything.\n\nThe Datapad\nZid does not receive this as a gift — he notices it, the way grief is noticed rather than given, as it falls from a hand that can no longer hold on. The datapad contains Boliphar's account of Reti — the truth about Verelin's manipulation, about Caroth, about a son who was failed rather than fallen. This is how Reti is redeemed in Zid's eyes: not through anything Zid witnesses directly, but through his father's own written words, discovered after the fact. Recommend Zid reads this after the shrine scene has fully landed — on the flight home, or later — so the emotional peak of Boliphar's death is not competing with the intellectual reckoning of understanding Reti. Let each moment have its own room.\n\nWhat the players know\nThe yacht cutaway and the brig cutaway are, and must remain, screen-wipe sequences: no character in the story ever witnesses them except the NPCs present. The players see them. Zid does not — not directly. He only receives the datapad's account afterward. This is deliberate: the table is asked to carry grief and understanding that the character himself only partially receives. That gap is the arc's signature device, used throughout the campaign, and should not be closed.\n\nReti\n\nIf Reti is still alive — if he boarded the Eye separately, or was captured during the battle, or found his way to the shrine room — he arrives at the worst possible moment. Or the best possible one, depending on what Zid decides to do with him.\n\nReti sees a capital ship. He sees what Boliphar built. He sees his half-brother standing at the shrine of a woman who was never his mother, in a ship that was never intended for him, and he has to decide — perhaps for the first time in his life — what he actually wants.\n\nZid has to decide the same thing about him.\n\nThe document does not resolve this confrontation. That is the player's story to write.\nWhat the GM can do: let Reti be three-dimensional in this moment.\nHe is not a cardboard villain. He is a man who wanted his father's love and made terrible choices reaching for it.\nHe is looking at his brother and understanding, maybe for the first time, what the Eye actually is.\nWhether that understanding changes anything — whether Zid thinks it should — is the scene.\n\nArc Timeline Reference\n\nI'm proud of what you've become, Zid.\n\nI love you, son."}};}

S.campaign=core.campaign;S.arcs=core.arcs;S.threads=core.threads;S.sessions=core.sessions;S.codex=core.codex;
S.planets=seedPlanets();S.links=seedLinks();S.docs=seedDocs();
S.tags=seedTags();seedThemes(S.threads);
if(S.threads.filter(function(t){return t.id==="t3";})[0])S.threads.filter(function(t){return t.id==="t3";})[0].kind="complication";

/* ---------------- Archive bridge ----------------
   Inside The Archive this console runs in an iframe. The parent frame owns the
   Supabase client; this side owns nothing except the contract the console already
   speaks: doc().get/set/delete/onSnapshot and collection().limit().get()/onSnapshot().

   Nothing seeds from here. In the artifact the console populated an empty database
   on first run; in the Archive the import script owns first population, and a console
   that seeds on an empty campaign would write junk over a failed import. */
(function(){
 var PARENT=window.parent,ORIGIN=window.location.origin;
 if(PARENT===window){setSync("local only");return;}
 var seq=0,waiting={},docSubs={},collSubs={};
 function send(op,payload){
  var id=++seq;
  return new Promise(function(res,rej){
   waiting[id]={res:res,rej:rej};
   var msg={lor:1,id:id,op:op};
   for(var k in payload)if(Object.prototype.hasOwnProperty.call(payload,k))msg[k]=payload[k];
   PARENT.postMessage(msg,ORIGIN);
  });
 }
 function snapOf(d){return {exists:!!(d&&d.exists),data:function(){return d?d.data:null;}};}
 function qOf(rows){
  rows=rows||[];
  return {empty:rows.length===0,docs:rows.map(function(r){
   return {id:r.id,data:function(){return r.data;}};})};
 }
 window.addEventListener("message",function(e){
  if(e.source!==PARENT)return;
  var m=e.data;if(!m||m.lor!==1)return;
  if(m.id&&waiting[m.id]){
   var w=waiting[m.id];delete waiting[m.id];
   /* runWrites reads e.code to decide whether to retry, so failures must carry one */
   if(m.ok)w.res(m.result);
   else{var err=new Error(m.message||"console bridge error");err.code=m.code||"error";w.rej(err);}
   return;
  }
  if(m.evt==="ready"){
   DB=API;
   if(m.readOnly){RO=true;setSync("read only","ro");applyRO();}
   else setSync("loading");
   subscribe();
   return;
  }
  if(m.evt==="doc"&&docSubs[m.path])docSubs[m.path].forEach(function(fn){fn(snapOf(m));});
  if(m.evt==="coll"&&collSubs[m.coll])collSubs[m.coll].forEach(function(fn){fn(qOf(m.rows));});
 });
 var API={
  doc:function(path){
   return {
    get:function(){return send("get",{path:path}).then(snapOf);},
    set:function(body){return send("set",{path:path,body:body});},
    "delete":function(){return send("del",{path:path});},
    onSnapshot:function(cb,err){
     (docSubs[path]=docSubs[path]||[]).push(cb);
     send("watchDoc",{path:path}).catch(function(e){if(err)err(e);});
    }
   };
  },
  collection:function(coll){
   var lim=0;
   var q={
    limit:function(n){lim=n;return q;},
    get:function(){return send("list",{coll:coll,limit:lim}).then(qOf);},
    onSnapshot:function(cb,err){
     (collSubs[coll]=collSubs[coll]||[]).push(cb);
     send("watchColl",{coll:coll}).catch(function(e){if(err)err(e);});
    }
   };
   return q;
  }
 };
 PARENT.postMessage({lor:1,evt:"hello"},ORIGIN);
})();
function subscribe(){
 var need=["campaign","arcs","threads","sessions","codex","planets","links","docs","tags"];
 function mark(k){
  if(HYDRATED[k])return;
  HYDRATED[k]=true;
  for(var i=0;i<need.length;i++)if(!HYDRATED[need[i]])return;
  if(!RO)setSync("live","live");
 }
 DB.doc("campaign/state").onSnapshot(function(s){
  if(s.exists){S.campaign=dclone(s.data());if(cur==="situation")render();}
  mark("campaign");
 },function(){});
 ["arcs","threads","sessions","codex","planets","links","docs","tags"].forEach(function(k){
  DB.collection(k).onSnapshot(function(q){
   S[k]=q.docs.map(function(d){
    var o=dclone(d.data())||{};o.id=d.id;
    if(k==="docs"&&o.blocks&&o.blocks.length)o.body=docBody(o);
    return o;});
   mark(k);
   buildNav();
   if(!(k==="docs"&&openDoc))render();
  },function(){});
 });
}
})();
