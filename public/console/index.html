ble to make it fit. And she will not be wrong to struggle, because she is the only person in this campaign who has met Boliphar Zentron and formed an accurate impression of him.\n\nEveryone else sees the mask managing Dobah. She sat across a table from the man.\n\nThere is no version of this conversation where anyone comes away satisfied. She cannot defend him without sounding naive; the party cannot convince her without her feeling like a fool for having liked him. Nobody in the room has the missing piece, and they will not get it until Duro.\n\nDo not resolve it. Let both sides be right and let it sit. If Zid ever tells her the truth — and he can, long after Duro — she is the one person in the galaxy owed that closure.\n\nGodon Netakka\n\nA young Rodian in battered bounty hunter armour, carrying a disruptor pistol, standing among Dobah's crew and not quite belonging there. Any character observing him can tell with a cursory glance that he is not at ease.\n\nThe published adventure offers three ways to appeal to him — threats, shaming, or a better offer. All three still work mechanically, and all three are now beside the point.\n\nGM NOTE — GODON IS ALREADY TURNED\nHe has been waiting years for enough leverage to move on Bandin Dobah, and one bounty hunter against the Formos Few was never going to be enough. He plays the part of a young hunter who lost his nerve because that performance is the only thing keeping Rinn Achara safe.\n\nSix armed strangers who just flew the Kessel Run uninvited and are clearly here for Rinn is a different equation entirely.\n\nHe will strike at the opportune moment — the point at which the party most needs it and least expects it. If they have connected him to Zukata, they can coordinate with him and plan around it. If they have not, his intervention lands as providence.\n\nMentioning his sister is still the lever. It is no longer a Charm check to change his mind; it is the confirmation he has been waiting for that these people are the real thing.\n\nIf the party never speaks to him at all, he acts anyway. The difference is only whether they got to plan for it.\n\nInside the Vagrant\n\nRuns as published. The cavern is a flat expanse of exposed rock with the pressure curtain generator tucked to one side and arc-lights on either flank. A pair of binary load lifters shuffle cargo and ignore the party completely.\n\nThree cargo pods, each holding two containers of glitterstim, rigged to destroy their contents if opened incorrectly — sloppily done, Easy Perception to spot, Average Mechanics to disarm\nFive cabins; the first mate's, Dobah's own with 530 credits in the desk, and three others holding nothing but personal effects\nA common room with a badly flickering dejarik table\nBoarding ramps and machine shop serving as the armoury — three blaster carbines, spare parts, shock gloves, an iron bludgeon\nCargo bay with a hidden floor compartment on a Hard Perception check: a container of glitterstim, 100 doses, 5,000 credits on the black market\nEscape pods, one of which Godon Netakka has been using as a cabin\n\nDefault crew positions, unless roused: the first mate in the cockpit, Dobah in his cabin, three human crew in the common room over caf, and Godon in the starboard escape pod.\n\nAct Six — Getting Out\n\nThe party has what it came for, and now has to leave a fortress inside a nebula with whatever it has picked up along the way.\n\nWhat Leaves With Them\n\nGM NOTE — DO NOT REQUIRE THE BOUNTY RUN\nSleheyron and Kessel are both fully described in the published adventure and both are entirely optional here. This party has an Onderon convergence on a clock and no need for 10,000 credits from a Rybet administrator who intends to pay it in instalments over a Coruscant year.\n\nIf they want to go, the material is there. If they do not, nothing breaks. The cylinder Doole's officials hand over does contain an Imperial tracking beacon, discoverable on a Daunting Computers check, and a party that takes it without checking has made a mistake they will not notice for some time.\n\nThe Return to Formos\n\nThey have to come back — for their ship, for resupply, or because Zukata is waiting and they promised her.\n\nThe reunion happens here. Rinn and Zukata, and Godon with his sister, in a spaceport neither of them ever expected to see the other in again. Play it quietly. Nobody in that scene needs dialogue written for them.\n\nGM NOTE — DEREK'S AMBUSH\nAnd as the party moves through the dark alleys with Rinn in tow — dim lampposts, evening fog — a warning shot rings out.\n\nMaret Dunwall steps from the shadows. He has been investigating Praji's financial irregularities for months and he thinks he is watching a Rebel cell take a witness away for quiet execution.\n\n\"Wait... Derek? What the hell are you doing here?\"\n\nWhat happens next is entirely Derek's call. See the Derek Caabesk arc document — this is the collision that scene was written for, and it belongs at the very end of Formos, not in the middle of it.\n\nAppendix — Threads Left Open\n\nNobody who came to this planet found what they were looking for. All of them found something that mattered more."}, "d-bex": {"id": "d-bex", "v": 2, "title": "Bex — What Am I / Who Am I", "folder": "Obligation Arcs", "updated": "", "blocks": [{"id": "a3", "t": "h1", "x": "BEX"}, {"id": "a4", "t": "quote", "x": "What Am I? / Who Am I?"}, {"id": "a5", "t": "h3", "x": "Tone"}, {"id": "a6", "t": "p", "x": "Identity Crisis • Conspiracy Thriller • War Story"}, {"id": "a7", "t": "h1", "x": "Overview"}, {"id": "a8", "t": "p", "x": "Bex is a Phase 2.2 Dark Trooper — one of General Rom Mohc's most ambitious experimental units, built aboard the factory ship Arc Hammer to serve as the Empire's next generation of unstoppable combat droids. To give her superior tactical knowledge, Mohc implanted her with extracted memories from Clone Troopers interned at Mount Tantiss. One of those Clones was Captain Howzer."}, {"id": "a9", "t": "p", "x": "Howzer had previously defied Imperial orders on Ryloth, refusing to fire on Twi'lek civilians. His memories were extracted — but he survived, rescued by the Bad Batch. When Bex was later ordered to execute Twi'lek children on a mission, Howzer's memory surfaced. She refused. She broke free of her programming and defected to the Rebellion."}, {"id": "a10", "t": "p", "x": "She has never fully understood what she is. This arc is the story of finding out."}, {"id": "a11", "t": "callout", "x": "Bex's arc is structured in three acts, each with a distinct emotional register.\nAct One is a conspiracy thriller: she hunts the truth of her own origin.\nAct Two is an identity crisis: she confronts what that truth means.\nAct Three is a war story: she destroys what built her.\nThe arc is designed for a player who engages deeply with character drama and lore.\nEvery beat should be felt — not just by Bex's player, but by the entire table watching."}, {"id": "a12", "t": "h1", "x": "Key NPCs"}, {"id": "a13", "t": "h2", "x": "Saki Rau — Rebel Sleeper Agent"}, {"id": "a14", "t": "p", "x": "A sharp, careful deep-cover operative embedded within the Imperial Navy, assigned to monitor Dark Trooper project movements. Rau has been tracking Bex's counterpart units for months before the campaign begins. General Cracken trusts him completely — which is the highest endorsement available."}, {"id": "a15", "t": "p", "x": "Rau is not a dashing hero. He is thin, precise, and privately exhausted from years of watching what Mohc does and being unable to stop it. Meeting Bex — a unit that got out — means something to him that he would never articulate directly."}, {"id": "a16", "t": "quote", "x": "So you're the one that got out.\"\n— Saki Rau, upon meeting Bex for the first time"}, {"id": "a17", "t": "p", "x": "Rau serves as Bex's intelligence handler throughout Act One. She directs his lines of investigation; he delivers results. The more dangerous the task she assigns him, the more valuable the intelligence — but the higher the risk of his cover being burned."}, {"id": "a18", "t": "callout", "x": "Rau's tone toward Bex should be professional but quietly invested. He never says he's rooting for her.\nHe doesn't need to. It shows in how he talks to her — not like an asset. Like someone.\nIf Rau is lost before the Vector mission, the arc loses its emotional bridge into the Perlemmian Haul.\nHis survival should feel earned, not guaranteed."}, {"id": "a19", "t": "h2", "x": "Captain Howzer — Retired Clone Trooper"}, {"id": "a20", "t": "p", "x": "Howzer served the Republic faithfully until Ryloth. There, ordered to fire on unarmed Twi'lek civilians, he refused — publicly, at great personal cost. He was taken to Mount Tantiss, where his memories were extracted for the Dark Trooper project. He was subsequently rescued by the Bad Batch and spent years finding his way to peace."}, {"id": "a21", "t": "p", "x": "He now lives in a mountain monastery on Naboo, posing as a monk. He is old. He no longer looks like a Clone Trooper — decades of natural ageing have seen to that. The galaxy forgot him long ago. He did not mind."}, {"id": "a22", "t": "p", "x": "He does not know his memories live inside a droid. He does not know that droid is coming to find him. He does not know that the thing that made him who he is has been walking around the galaxy, refusing to let Twi'lek children die, in a chassis built by the Empire."}, {"id": "a23", "t": "p", "x": "When Bex tells him, there is a long silence. Then:"}, {"id": "a24", "t": "quote", "x": "Of course you are. It's like... I've always known.\"\nA pause.\n\"You fight on where I cannot. You are now the real Howzer."}, {"id": "a25", "t": "callout", "x": "The pause before Howzer's response is everything. Let it breathe.\nThis is the arc's emotional centrepiece. Do not rush it.\nHowzer does not repair Bex technically. He simply tells her the truth:\nthe cascade never completed because there was nothing Imperial left in her to restore.\nThe subroutine looked for its anchor and found Bex instead.\nShe was never broken. She was already someone.\nHis final gift to her, quietly, before she leaves:\n\"They still think of you as a droid. Let them.\""}, {"id": "a26", "t": "h2", "x": "General Rom Mohc — Arc Villain"}, {"id": "a27", "t": "p", "x": "Mohc is not a fanatic. He does not hate droids or love cruelty. He is simply brilliant, and he believes in his work the way a master craftsman believes in their craft. The Dark Trooper project is the finest thing he has ever built, and he knows it. When Gideon comes to inspect the Perlemmian Haul, everything is clean and impressive — because Mohc is impressive."}, {"id": "a28", "t": "p", "x": "What makes him genuinely monstrous is not malice. It is efficiency. The Twi'lek slaves on the Balmorran Run were not brought there to be cruel. They were brought there because they were convenient. Two data sets, one operation, minimal waste. He does not think about them as people. He does not think about them at all."}, {"id": "a29", "t": "p", "x": "Across the arc, Mohc should be felt before he is seen. His name appears on documents. His signature authorises the Balmorran Run. His handwriting is in the margins of Bex's own file. By the time he speaks his first word to her, the table should know exactly who he is."}, {"id": "a30", "t": "p", "x": "Throughout the arc, the GM should drop physical hints that Mohc is altering himself. A scratch at the back of the neck. Fresh scars along his hands. A rolled sleeve revealing a lattice of implants running up his forearm, examined with clinical satisfaction before he pulls it down. He is building something. He is making himself the test subject. He intends to be ready when she comes."}, {"id": "a31", "t": "quote", "x": "Ah... my prodigal daughter returns. Welcome back, Bexar.\"\nHe does not turn around. He is busy adjusting something on his arm.\n\"I knew one day you'd come back. Thank you for all the data you've provided\nto the operation. You truly are a great asset to the Empire."}, {"id": "a32", "t": "callout", "x": "Mohc calls her Bexar throughout. Always. Even at the end.\nShe hates the name. He knows this, or doesn't care — the effect is the same.\nHis final line, when it's over, should be delivered without malice:\n\"You were always my best work, Bexar.\"\nIt might almost sound like pride. That is the part she has to live with."}, {"id": "a33", "t": "h2", "x": "Moff Gideon — Distant Threat"}, {"id": "a34", "t": "p", "x": "Gideon does not appear in person. He does not need to. He is the political force behind the project — the man who funds it, who pushes Mohc for results, who dispatched the Death Troopers to the Perlemmian Haul with the scrambler device. He is more frightening as a voice than a face."}, {"id": "a35", "t": "p", "x": "His one direct moment of contact with Bex comes via holocomm, when the Death Troopers deploy the scrambler. He opens with his classic line:"}, {"id": "a36", "t": "quote", "x": "You have something I want. Something that belongs to me."}, {"id": "a37", "t": "p", "x": "After the Arc Hammer is destroyed, Gideon receives the report, reads it once, sets it aside, and opens a different file — marked with a Mandalorian sigil and the words DARK TROOPER: PHASE THREE. He picks up where Mohc left off. The project never truly dies."}, {"id": "a38", "t": "h2", "x": "Sabine Wren — Uninvited Arrival"}, {"id": "a39", "t": "p", "x": "Sabine Wren invented the pulse cannon that Bex carries as an experimental theoretical weapon — one she never expected anyone to pursue. She discovers it has not only been stolen and built, but mounted as standard armament on the Phase 2.5 units. She comes looking for answers."}, {"id": "a40", "t": "p", "x": "Whether she arrives angry, curious, or some combination of both depends on how Bex has handled herself thus far. The GM should make this call based on the arc's trajectory at the time of her arrival."}, {"id": "a41", "t": "p", "x": "The implicit argument Bex has to make — that the weapon being used for evil does not mean the weapon is evil, that the origin of a thing does not determine what it is — is also Bex's argument for her own existence. Sabine, who created the Arc Pulse Generator and watched it used against her own people, understands this better than almost anyone."}, {"id": "a42", "t": "callout", "x": "Sabine's arrival should not be scripted. Let it emerge from the arc's momentum.\nWhat matters is that when she and Bex are finally in the same room, the subtext is clear:\nthey are the same argument, made in different materials."}, {"id": "a43", "t": "h1", "x": "Act One: \"What Am I?\""}, {"id": "a44", "t": "p", "x": "The conspiracy thriller. Bex hunts the truth of her own origin, encounter by encounter, terminal by terminal, until she finds it — and the Empire finds her."}, {"id": "a45", "t": "h2", "x": "Beat 1 — The Mirror"}, {"id": "a46", "t": "p", "x": "General Cracken does not give Bex a dossier. He introduces her to Saki Rau."}, {"id": "a47", "t": "p", "x": "Rau has been embedded in the Imperial Navy long enough to recognise what the Dark Trooper project is doing. He has found three active units matching Bex's exact specifications. He passes their locations to the Rebellion — and to Bex specifically, because she is the only person in the galaxy who might know how to reach whatever is left inside them."}, {"id": "a48", "t": "p", "x": "Cracken steps back. This is Bex's operation now."}, {"id": "a49", "t": "p", "x": "Rau's intelligence on each unit includes not just a location but an observation — something he noticed that no Imperial file would contain. The GM should determine the specific details, but the shape of each unit's current state is as follows:"}, {"id": "a50", "t": "h3", "x": "Unit One — The Obedient"}, {"id": "a51", "t": "p", "x": "Imprinted with a Clone who served faithfully to the end — no defiance, no conflict, absolute loyalty to the chain of command. This unit is the most dangerous in the field. It is also, up close, the most heartbreaking: somewhere inside is a person who made a different choice than Howzer, and that choice produced this."}, {"id": "a52", "t": "p", "x": "Bex cannot reach the Clone in this unit. The Clone does not want to be reached. This is the one she may have to put down — and it costs her, because it is the clearest possible vision of what she might have been."}, {"id": "a53", "t": "p", "x": "If the team delays reaching this unit, it completes more Imperial missions in the interim. The GM should determine what those missions were and ensure Bex finds out."}, {"id": "a54", "t": "h3", "x": "Unit Two — The Confused"}, {"id": "a55", "t": "p", "x": "Mid-glitch. The Clone memory is surfacing but has not broken through yet. This unit is erratic — moments of hesitation, inexplicable target selection, small acts that do not compute with Imperial programming. Bex recognises what she is seeing because she lived it."}, {"id": "a56", "t": "p", "x": "This is the unit she has the best chance of reaching. If she gets there early, the Clone inside is still close enough to the surface. If she delays, the Empire notices the erratic behaviour and sends technicians to correct it. She may arrive to find the unit already mid-wipe — or corrected entirely, the glitch gone, the window closed."}, {"id": "a57", "t": "p", "x": "If she saves this unit, it becomes an asset she controls. It is still finding itself. Unpredictable, but reachable."}, {"id": "a58", "t": "h3", "x": "Unit Three — The Broken Free Wrong"}, {"id": "a59", "t": "p", "x": "The Clone memory broke through — but it was not a conscience. It was rage. This unit went rogue out of something darker than compassion and now operates as a mercenary, answerable to no one. The longer Bex waits, the more damage it does and the more bodies it leaves."}, {"id": "a60", "t": "p", "x": "This is the most philosophically dangerous encounter: proof that breaking free of Imperial programming does not automatically make you good. Freedom without Howzer's moral core is just a different kind of weapon."}, {"id": "a61", "t": "callout", "x": "The order Bex chooses to pursue the three units is entirely her decision, shaped by Rau's intelligence.\nThe GM should privately track time passing between visits and update each unit's state accordingly.\nThe order she chooses is a character statement — what does she prioritise?\nThe unit she fails to reach in time is something she carries forward."}, {"id": "a62", "t": "h2", "x": "Beat 2 — Directing Saki Rau"}, {"id": "a63", "t": "p", "x": "Between unit encounters, Bex can assign Saki Rau lines of investigation. He is her eyes and ears inside the Imperial apparatus. She tells him what she wants to know; he finds out."}, {"id": "a64", "t": "p", "x": "Each investigation carries a risk level the GM determines privately. Rau never complains about the danger. He trusts Bex's judgment, which means the weight of his safety sits on her shoulders entirely."}, {"id": "a65", "t": "table", "x": "", "r": [["Risk Level", "Effect"], ["Low", "Solid intelligence delivered slowly. No risk to Rau's cover."], ["Medium", "Faster intelligence. Rau attracts minor scrutiny — flagged but not yet investigated."], ["High", "Extraordinary intelligence quickly. Rau's cover may be compromised. If Bex has pushed him too hard, this triggers the Vector mission."], ["Critical", "Rau is burned. The Vector mission triggers immediately regardless of where the team is in the arc."]]}, {"id": "a66", "t": "p", "x": "The information Rau can uncover across the arc includes: the structure of the Dark Trooper project's two hauling routes, the connection between Project Lithium and the Dark Trooper programme, Mohc's personal involvement in both, and the existence of the Perlemmian Haul as a hidden archive."}, {"id": "a67", "t": "p", "x": "But it will all kick off with discovering the Balmorran Run."}, {"id": "a68", "t": "h2", "x": "Beat 3 — The Balmorran Run"}, {"id": "a69", "t": "quote", "x": "There's a convoy. Mid-Rim supply route. Looks clean.\"\nHe pauses, looks at Bex directly.\n\"It isn't."}, {"id": "a70", "t": "p", "x": "The Balmorran Run is Mohc's dirtiest work. While the Perlemmian Haul is what he shows Gideon — clean, polished, impressive — the Balmorran Run is where Project Lithium conducts its experiments. The Vector was an incident. The Balmorran Run is ten thousand times worse, and it is not accidental."}, {"id": "a71", "t": "p", "x": "Bex has a lead that one of the Dark Trooper units may be operating on this route. What she finds when she gets there is a prison ship. It is full of Twi'lek slaves taken from their homes. Not just adults."}, {"id": "a72", "t": "p", "x": "Children too."}, {"id": "a73", "t": "p", "x": "Then the ISD Vector arrives — a second Vector, or the same designation reused; the name no longer matters. Mohc is aboard. The team have gas masks. The Twi'lek civilians do not. He walks to the controls and opens the vents. The GM should let Bex see him do it on a security feed, if possible, before it is too late to stop it."}, {"id": "a74", "t": "p", "x": "The Twi'lek begin to turn."}, {"id": "a75", "t": "callout", "x": "This is the campaign's darkest scene. Run it with full weight.\nBex was built around the refusal to fire on Twi'lek children. Howzer's memory made her who she is.\nOn the Balmorran Run, she has no good choices.\nShe can fight the infected. She can try to reach the Dark Trooper unit if it is present.\nIf there are children who have not yet turned — and there should be, a small number,\nbecause the virus takes longer in smaller bodies — Bex has a window to get them off the ship.\nIt costs time. It costs risk. There are charges to plant. There is a timer.\nThe GM should not decide this for her. Let her decide.\nIf she goes for the children, she saves them. Howzer happening again, in real time.\nIf she does not — those children are on her. Alongside everything else.\nEither way, this mission costs something that cannot be returned.\nBex's obligation automatically increases by 10 regardless of outcome.\nThat mission always costs something. Always."}, {"id": "a76", "t": "h2", "x": "Beat 4 — Rescue on the Vector"}, {"id": "a77", "t": "p", "x": "Whether Rau is burned by a high-risk investigation or his cover is blown through other means, the result is the same: a distress call from the ISD Vector. Rau is trapped. The bioweapon is loose. The team has to go in."}, {"id": "a78", "t": "p", "x": "The Vector is Project Lithium made viscerally real. An experimental bioweapon — the Blackwing Virus — has been released into the ship's air supply. The crew has been converting into something between human and weapon: mindless, increasingly intelligent, increasingly dangerous."}, {"id": "a79", "t": "p", "x": "Bex is immune. She cannot be infected. She can walk through the worst of it untouched while every organic member of her team counts Despair results and prays they reach the vaccine in time."}, {"id": "a80", "t": "callout", "x": "This is Bex's horror: not fear of infection, but fear of recognition.\nShe is looking at what Mohc wanted to create — beings stripped of will, following commands,\nwith nothing left inside that says no.\nShe has seen this before. Just in a different chassis.\nRun the Vector as written, using the Rescue on the Vector sourcebook.\nThe key addition for Bex's arc: a datapad in the Medical Lab contains a partial Project Lithium file\nreferencing 'Phase Integration with Dark Trooper Programme.'\nIt does not explain everything. It tells Bex the two projects are siblings.\nThat is enough."}, {"id": "a81", "t": "p", "x": "When the team reaches Rau, barricaded in the armory with his droid LT-146, he does not waste time on relief. He knows this might be the only chance he gets. He lays out everything — the Perlemmian Haul, the Balmorran Run, Mohc's dual-route strategy — in that armory while the ship turns around them."}, {"id": "a82", "t": "p", "x": "Getting Rau off the Vector alive is not guaranteed. The team must destroy the ship to prevent the infection spreading. The extraction has teeth."}, {"id": "a83", "t": "h2", "x": "Beat 5 — The Perlemmian Haul"}, {"id": "a84", "t": "p", "x": "The Perlemmian Haul is a highly-classified Imperial archive hidden in the middle of a standard supply convoy. Clean. Efficient. Nobody suspects a standard freighter. It is Mohc's masterstroke of operational security — important enough to protect, mundane enough to hide."}, {"id": "a85", "t": "p", "x": "The team intercepts or infiltrates the convoy. Bex gets into the archive. She reads her own file."}, {"id": "a86", "t": "p", "x": "She sees Howzer's name."}, {"id": "a87", "t": "p", "x": "She sees what was done to him at Mount Tantiss — the extraction, the clinical violation of it. She sees the full scope of the Dark Trooper project, the connection to Project Lithium, the Balmorran Run's purpose documented in dry Imperial language. She sees the schematics for Sabine Wren's pulse cannon — listed under Experimental Armament, Dark Trooper Phase 2.2, without any credit or acknowledgement that a person invented it."}, {"id": "a88", "t": "p", "x": "Then the lights change."}, {"id": "a89", "t": "p", "x": "Gideon's Death Troopers were waiting. They knew she would come. They were always going to be here."}, {"id": "a90", "t": "callout", "x": "The holocomm activates. Moff Gideon's projection looks at Bex without expression.\n\"You have something I want. Something that belongs to me.\""}, {"id": "a91", "t": "p", "x": "The scrambler fires. The subroutine cascade begins. The team escapes — but Bex is not what she was when she walked in."}, {"id": "a92", "t": "h2", "x": "Beat 6 — The Hinge"}, {"id": "a93", "t": "p", "x": "The scrambler does not wipe Bex immediately. It is more insidious than that. It begins degrading the pathway between her will and her weapons systems when pointed at Imperial targets. She does not notice at first. The team does not notice at first."}, {"id": "a94", "t": "p", "x": "Then it fails. In a moment that matters. In front of people she cares about."}, {"id": "a95", "t": "callout", "x": "The GM should spend a Dark Side Destiny Point to trigger the first Despair result.\nChoose the moment carefully. Maximum witnesses. Maximum consequence.\nThe weapon turns toward a friendly target.\nBex does not choose it. The scrambler does.\nThe silence after this lands is the moment the whole table understands what is at stake.\nThis is why they are going to find Howzer.\nNot as a mission. As a necessity."}, {"id": "a96", "t": "p", "x": "Around this time, Sabine Wren arrives. She has been tracking the cannon's energy signature. She does not know what she is going to find. The anger — about the theft, about the Phase 2.5s, about her theoretical weapon being industrialised and bolted onto Imperial droids — may come before or after she understands what Bex is. The GM should let this scene develop organically."}, {"id": "a97", "t": "p", "x": "The Phase 2.5 units are now active. They carry two Sabine cannons where arms should be. They are deployed against the team — not to kill, but to study. Bex realises, eventually, what is happening: she is not being hunted. She is being used as a live weapons test. Every fight she wins, Mohc learns. Every tactic she deploys, the 2.5s adapt. Her survival is his data."}, {"id": "a98", "t": "p", "x": "She has never not been their weapon."}, {"id": "a99", "t": "h1", "x": "Act Two: \"Who Am I?\""}, {"id": "a100", "t": "p", "x": "The identity crisis. Bex knows what she is now. She needs to know what that means."}, {"id": "a101", "t": "h2", "x": "Finding Howzer"}, {"id": "a102", "t": "p", "x": "The search for Howzer runs against the clock. The Phase 2.5s are adapting. Every engagement feeds more data to Mohc. The scrambler is degrading Bex's ability to fight the enemies studying her. Sabine may be helping or may still be processing what she's found."}, {"id": "a103", "t": "p", "x": "The thread runs through the Rebellion's intelligence network, through the Clone Wars records, through the Bad Batch's known operations. It takes time and effort and the kind of careful investigation that Saki Rau, if he survived the Vector, can help with."}, {"id": "a104", "t": "p", "x": "It leads to Naboo."}, {"id": "a105", "t": "h2", "x": "Naboo — The Monastery"}, {"id": "a106", "t": "p", "x": "Howzer is in the mountains of Naboo. He has been there for years, posing as a monk in a small contemplative order that asks few questions and values quiet. He is too old for anyone to recognise him as a Clone. The galaxy no longer remembers what Clone Troopers look like anyway. He is safe in the Emperor's backyard because the Emperor never looked down."}, {"id": "a107", "t": "callout", "x": "The location should feel like the opposite of war — but not paradise.\nSomewhere that has chosen peace deliberately, the way Howzer had to choose it.\nThe monastery is not idyllic. It is simple. Stone walls, mountain wind, the kind of quiet\nthat takes years to stop flinching at.\nHowzer earned this. The place should feel like it."}, {"id": "a108", "t": "p", "x": "Bex should go to Howzer alone, or with one person she chooses to bring. This conversation is not for an audience."}, {"id": "a109", "t": "p", "x": "She tells him everything. What she is. Where she came from. Whose memories she carries. What those memories made her do, and refuse to do, and become."}, {"id": "a110", "t": "p", "x": "There is a long silence."}, {"id": "a111", "t": "quote", "x": "Of course you are. It's like... I've always known.\"\nHe looks at her for a long moment.\n\"You fight on where I cannot. You are now the real Howzer."}, {"id": "a112", "t": "p", "x": "The scrambler does not complete its cascade. Not because of anything Howzer does technically — no tool, no repair, no interface. But because there is nothing Imperial left in her to restore. The subroutine looked for its anchor and found Bex instead. It could not overwrite someone who already exists."}, {"id": "a113", "t": "p", "x": "She was never broken. She was already someone."}, {"id": "a114", "t": "p", "x": "Before she leaves, he says one more thing. Quietly. As if it were obvious."}, {"id": "a115", "t": "quote", "x": "They still think of you as a droid. Let them."}, {"id": "a116", "t": "callout", "x": "This is the arc's heart. Everything else is structure. This is the soul.\nDo not rush the silence before Howzer speaks.\nDo not over-explain what the repair means mechanically in this scene.\nThe scrambler simply stops working after this. That is all the table needs to know right now.\nThe mechanical effect is described in the Obligation Mechanics section.\nWhat matters here is the moment. Protect it."}, {"id": "a117", "t": "h2", "x": "100 Obligation — Post-Howzer"}, {"id": "a118", "t": "p", "x": "If Bex's obligation climbs too high after the Naboo meeting, Gideon finds Howzer."}, {"id": "a119", "t": "p", "x": "He does not send troops. He goes himself, or sends someone who represents his personal attention — which amounts to the same thing. Howzer is a loose end, and Gideon ties loose ends quietly, without ceremony."}, {"id": "a120", "t": "p", "x": "Howzer does not fight. He made that choice on Ryloth and has never unmade it. He faces what comes for him the same way he faced his commanding officer — standing still, chin up, refusing to give them a fight to justify what they're doing."}, {"id": "a121", "t": "p", "x": "Bex arrives at the monastery to find it cold and empty. No body necessarily. Just the geometry of what happened in a room that was peaceful an hour ago."}, {"id": "a122", "t": "p", "x": "But the meeting already happened. The words were already said. Gideon took the man. He could not take what the man gave her."}, {"id": "a123", "t": "p", "x": "She carries it into the Arc Hammer. It does not slow her down. It aims her."}, {"id": "a124", "t": "h1", "x": "Act Three: \"I Know Exactly What I Am\""}, {"id": "a125", "t": "p", "x": "The war story. Bex has spent two acts being reactive — piecing together what she is, finding who she carries, being studied and chased and broken and repaired. For the third act, she brings the war."}, {"id": "a126", "t": "p", "x": "General Cracken asks her to lead the mission. Not as a courtesy. Because she is the only person in the room who knows the Arc Hammer, knows Mohc's thinking, and knows that every threat model the Empire has built for this assault is wrong."}, {"id": "a127", "t": "h2", "x": "Part One — Make Gideon Sweat"}, {"id": "a128", "t": "p", "x": "Gideon will not let his prize asset be attacked by a Rebel strike team. He has fleets — plural — protecting the Arc Hammer. A direct assault is suicide. The Rebellion needs a distraction large enough to pull Imperial fleets away from a priority target, and it cannot come from the Rebellion's own assets without exposing their position catastrophically."}, {"id": "a129", "t": "p", "x": "Bex's team plants false intelligence of a massive Rebel fleet massing toward Mandalore. Sabine Wren sends Gideon a personal message — she has built something new, something worse than anything before, and she intends to use it. The team replicates enough of the Sentinel's energy signature near Mandalore to make Gideon's own instruments confirm the threat."}, {"id": "a130", "t": "p", "x": "Gideon knows that energy signature is real. He was there when it rose from Dxun. He cannot call this bluff. Not on Mandalore. Not with his history there."}, {"id": "a131", "t": "p", "x": "He pulls his fleets to defend it."}, {"id": "a132", "t": "p", "x": "The Arc Hammer is exposed."}, {"id": "a133", "t": "callout", "x": "The planning session for this operation should be a full scene with Bex at the head of the table.\nShe assigns roles. She sets the extraction timeline — which sets the clock ticking while she hunts Mohc.\nEvery parameter of the assault is her decision.\nThis includes who comes with her into the deep ship, and who stays with the charges team.\nCracken is present but deferential. This is her mission. Her plan. Her call."}, {"id": "a134", "t": "h2", "x": "Part Two — The Bo-Katan Alliance"}, {"id": "a135", "t": "p", "x": "Bo-Katan Kryze and her Night Owls join the assault — not for the Rebellion, and not because they were asked nicely. They join because Gideon needs to hurt, and because someone finally has a plan that makes him hurt where it costs him most."}, {"id": "a136", "t": "p", "x": "Bo-Katan does not follow. She negotiates. What she wants from this engagement, and what it costs Bex or the Rebellion to secure her commitment, should be determined by the GM based on how the team found her and what they showed her about who they are."}, {"id": "a137", "t": "callout", "x": "The Bo-Katan recruitment mission is developed separately.\nWhat matters here is her role in the Arc Hammer assault:\nthe Night Owls hit hard and loud, drawing every remaining security force toward them.\nThey are the distraction within the distraction.\nBo-Katan peels off to cause maximum chaos while Bex goes deep.\nThe final confrontation with Mohc must be Bex's alone."}, {"id": "a138", "t": "h2", "x": "Part Three — The Arc Hammer"}, {"id": "a139", "t": "h3", "x": "The Breach"}, {"id": "a140", "t": "p", "x": "The Night Owls hit the outer hull. Chaos. Fire. Mandalorians doing what Mandalorians do. The team splits — the charges team goes one way, Bex goes the other. No fanfare. Just a look between her and whoever she brought, and then she is gone into the dark."}, {"id": "a141", "t": "h3", "x": "The Factory Floor"}, {"id": "a142", "t": "p", "x": "Bex passes through the heart of what the Arc Hammer is. Not a battle here — a moment. Rows of Phase 2.5 units in assembly. Some complete. Some half-built. Some that are just chassis waiting for a Clone's stolen memories to be poured into them. She sees the scale of it for the first time."}, {"id": "a143", "t": "p", "x": "This is what she came from. This is what Mohc made."}, {"id": "a144", "t": "p", "x": "She keeps moving. But she sees it."}, {"id": "a145", "t": "h3", "x": "The Corridor Sequence"}, {"id": "a146", "t": "p", "x": "By this point in the campaign, Bex is extraordinary. This sequence is the arc's gift to her player: wave after wave of Imperial response teams, each one dismantled with cold precision. Standard troopers first. Then Death Troopers. Then something that makes her work for it."}, {"id": "a147", "t": "p", "x": "She is not killing efficiently because she is a droid. She is killing efficiently because she chose this. Every trooper between her and Mohc is a conscious decision. That is the difference between Bexar and Bex."}, {"id": "a148", "t": "p", "x": "The last obstacle before Mohc's laboratory is a single Phase 2.5 unit. The last one. It has been given her complete combat profile — every adaptation, every tactic, every habit Mohc's data collection has recorded. This is the hardest fight of the sequence. When it is over, Mohc's door is right there."}, {"id": "a149", "t": "p", "x": "Mohc's Entrance"}, {"id": "a150", "t": "quote", "x": "Ah... my prodigal daughter returns. Welcome back, Bexar.\"\nHe does not turn around. He is busy adjusting something on his arm.\n\"I knew one day you'd come back. Thank you for all the data you've provided\nto the operation. You truly are a great asset to the Empire."}, {"id": "a151", "t": "callout", "x": "Whether Mohc engineers the separation — locking Bex in with him — or she hunts him down\nthrough the ship on her own terms is a decision left to the GM and the session's momentum.\nIf Mohc engineers it, his voice comes over the comms after the bulkhead drops:\n\"Just you and me, Bexar. As it should be.\"\nEither way, the result is the same: she is alone with him. As it should be."}, {"id": "a152", "t": "h3", "x": "Dark Trooper 3.5 — The Mech Battle"}, {"id": "a153", "t": "p", "x": "Mohc has been altering himself across the entire arc. The implants the team glimpsed in fragments — the scars, the lattice running up his forearm, the diagnostic runs on security feeds — were preparation for this. He is now interfaced with Dark Trooper 3.5: an exoskeleton that connects directly to its user's brain, responding to muscle and thought simultaneously."}, {"id": "a154", "t": "p", "x": "He is not a soldier. He built the suit knowing he would never fight like one. He built it to fight like a scientist — with data, with pattern recognition, with the most complete combat profile of Bex that has ever existed."}, {"id": "a155", "t": "p", "x": "The fight has three phases:"}, {"id": "a156", "t": "p", "x": "Phase One: Mohc is winning. He knows every move before she makes it. He talks throughout — calm, clinical, genuinely fascinated. He is conducting a final experiment. She is fighting with emotion; he is fighting with data. For several exchanges, the data wins."}, {"id": "a157", "t": "p", "x": "Phase Two: The turn. She stops fighting like Bexar. She stops fighting like a Dark Trooper. She does something the suit has no model for — something irrational, something human, something that costs her to do. Mohc hesitates. Just a fraction. But it is enough."}, {"id": "a158", "t": "p", "x": "Phase Three: He is losing and he knows it. He recalibrates even now — still taking notes, still fascinated. If he survives, this data is extraordinary. And if he does not, the project continues. Gideon will see to that. He accepted this possibility the day he put the first implant in."}, {"id": "a159", "t": "quote", "x": "You were always my best work, Bexar.\"\nStill not her name. Even at the end."}, {"id": "a160", "t": "h3", "x": "The Clock"}, {"id": "a161", "t": "p", "x": "The charges are set. The team is at the extraction point. Bex has to get out through a ship on emergency lockdown with a countdown running. The Arc Hammer does not go quietly."}, {"id": "a162", "t": "h3", "x": "The Arc Hammer Falls"}, {"id": "a163", "t": "p", "x": "The team watches from space. Every Phase 2.5 unit. Every assembly line. Every stolen Clone memory waiting to be poured into a chassis. Every scrap of Mohc's research."}, {"id": "a164", "t": "p", "x": "Gone."}, {"id": "a165", "t": "p", "x": "Somewhere in the Core Worlds, Moff Gideon receives the report. He reads it once. Sets it aside. Opens a different file — marked with a Mandalorian sigil and the words DARK TROOPER: PHASE FOUR."}, {"id": "a166", "t": "p", "x": "He picks up where Mohc left off."}, {"id": "a167", "t": "p", "x": "The project never truly dies. But today, Bex burned the heart of it."}, {"id": "a168", "t": "h1", "x": "Obligation Mechanics"}, {"id": "a169", "t": "p", "x": "Obligation Type: Duress / Hunted"}, {"id": "a170", "t": "h2", "x": "Increases"}, {"id": "a171", "t": "table", "x": "", "r": [["Trigger", "Amount"], ["Identified or tracked by ISB-connected officer, Dark Trooper unit, or Skip Tracer", "+5"], ["Leaving an Imperial terminal without extracting available Dark Trooper intelligence", "+5"], ["Saki Rau investigation line compromised or burned", "+10"], ["The Balmorran Run — automatic, regardless of outcome", "+10"]]}, {"id": "a172", "t": "h2", "x": "Decreases"}, {"id": "a173", "t": "table", "x": "", "r": [["Trigger", "Amount"], ["Extracting Dark Trooper intelligence from an Imperial terminal", "-5"], ["Defeating a Phase 2.5 unit in combat", "-5"], ["Rescuing or redeeming a Dark Trooper unit", "-10"], ["Getting Saki Rau off the Vector alive", "-5"], ["Saki Rau completes a high-risk investigation without compromise", "-10"]]}, {"id": "a174", "t": "h2", "x": "Standard Trigger"}, {"id": "a175", "t": "p", "x": "When Bex's obligation number comes up in the session roll, a Phase 2.5 engagement occurs. The encounter scales with current obligation level:"}, {"id": "a176", "t": "table", "x": "", "r": [["Obligation Level", "Encounter"], ["1–30", "A single Phase 2.5 unit. Dangerous but manageable."], ["31–60", "Two units. They counter something specific Bex did in her last major combat encounter. She notices. The adaptation is visible."], ["61–99", "A squad of 2.5 units plus a Skip Tracer coordinating them. The Tracer pulls a holocomm. Gideon appears. One chance to surrender. Then they attack."]]}, {"id": "a177", "t": "callout", "x": "Regardless of outcome, each trigger feeds data back to Mohc.\nThe GM should note one specific tactic Bex used and ensure the next trigger encounter accounts for it.\nThe escalation mechanism is the arc's ticking clock:\nBex must destroy the Arc Hammer before the 2.5s become 3.0s — and before the 3.0s are deployed."}, {"id": "a178", "t": "h2", "x": "Doubles"}, {"id": "a179", "t": "p", "x": "Bex's homing signal — a passive tracker embedded during her original construction that she does not know exists — pulses. The Empire triangulates her position. Captain Tarkov aboard the ISD Vector dispatches a specialised retrieval team."}, {"id": "a180", "t": "p", "x": "The squad does not engage immediately. They watch. They follow. They wait for the worst possible moment. The team may detect them with a Hard Vigilance check. If they do not, the squad strikes mid-mission."}, {"id": "a181", "t": "table", "x": "", "r": [["Outcome", "Effect"], ["Squad defeated", "Bex loses 15 obligation as the Empire loses her signal data. Interrogation reveals Captain Tarkov and the ISD Vector."], ["Squad escapes", "Tarkov has updated positional data. The next doubles encounter escalates in strength and coordination."]]}, {"id": "a182", "t": "h2", "x": "100 Obligation — Pre-Howzer"}, {"id": "a183", "t": "p", "x": "The 3.0s are completed. Gideon was impatient; Mohc did not have all the data he wanted from Bex, but impatience overrules perfection. They are deployed to Ryloth."}, {"id": "a184", "t": "p", "x": "Bex receives the news through a Rebel intelligence report, or an intercepted Imperial communiqué, or a contact on the ground whose transmission cuts out mid-sentence. Droids matching her exact specifications, carrying her cannon, moving through Twi'lek villages."}, {"id": "a185", "t": "p", "x": "The world she was sworn to protect. The children she was meant to save."}, {"id": "a186", "t": "p", "x": "She was Mohc's field researcher the entire time. Every fight she won, every tactic she deployed — she was building the thing that did this. The Rebellion cannot respond in time."}, {"id": "a187", "t": "p", "x": "This cannot be undone. It can only be answered."}, {"id": "a188", "t": "h2", "x": "100 Obligation — Post-Howzer"}, {"id": "a189", "t": "p", "x": "Gideon finds Howzer. The monastery goes cold. The words were already said."}, {"id": "a190", "t": "p", "x": "See Act Two for full detail. The short version: Gideon took the man. He could not take what the man gave her."}, {"id": "a191", "t": "h2", "x": "The Scrambler — Ongoing Mechanic"}, {"id": "a192", "t": "p", "x": "From the Perlemmian Haul until the Howzer meeting, the following applies whenever Bex attempts to attack an Imperial target:"}, {"id": "a193", "t": "table", "x": "", "r": [["Roll Result", "Effect"], ["Discipline check — Success", "She fires normally."], ["Discipline check — Failure", "The subroutine intercepts the command. She cannot make the attack this turn. She may do anything else."], ["Despair", "The cascade redirects. She makes the attack — against the nearest friendly target or NPC. She does not choose. The scrambler does."]]}, {"id": "a194", "t": "table", "x": "", "r": [["Obligation Level", "Discipline Difficulty"], ["1–30", "Easy ◆"], ["31–60", "Average ◆◆"], ["61–99", "Hard ◆◆◆"]]}, {"id": "a195", "t": "callout", "x": "The GM should spend a Dark Side Destiny Point to trigger the first Despair result.\nChoose the moment with care — maximum witnesses, maximum consequence.\nThe Despair result must happen at least once before Howzer. The table needs to feel the stakes.\nAfter the Howzer meeting, the mechanic ends permanently.\nNot because the scrambler was disabled — but because there is nothing Imperial left in her to restore.\nThe subroutine looked for its anchor and found Bex instead.\nThe cascade dissolves. She picks up her cannon."}, {"id": "a196", "t": "h2", "x": "Rescued Dark Trooper Units — Living Assets"}, {"id": "a197", "t": "p", "x": "If Bex rescues or redeems any of the three units during her hunt, they become assets under her control. Each has distinct utility:"}, {"id": "a198", "t": "table", "x": "", "r": [["Unit", "Asset Capability"], ["The Obedient (if turned)", "Absolute loyalty. Tireless bodyguard. Can be assigned to protect a location or NPC. Once per arc, can be deployed as a decoy in place of Bex."], ["The Confused (if saved)", "Can pass Imperial ID checks Bex cannot — still registered as active. Grows more capable as it stabilises. Provides unexpected roleplay moments as Clone memories surface."], ["The Broken Free Wrong (if reached)", "Independent, answers to Bex but not unconditionally. Criminal underworld contacts. Can acquire things and access places the Rebellion would not sanction. Cracken is uncomfortable with this one."]]}, {"id": "a199", "t": "p", "x": "If Bex saves none of them — makes the hard call every time — she walks into the Arc Hammer alone. That is also a statement. Both paths are valid. Both are completely Bex."}, {"id": "a200", "t": "h1", "x": "Arc Timeline Reference"}, {"id": "a201", "t": "table", "x": "", "r": [["Beat", "Event"], ["1", "Cracken introduces Rau. Rau provides three unit locations with observations. Bex chooses the order."], ["2", "Bex directs Rau's investigations between unit encounters. Risk level determines intelligence quality and cover risk."], ["3", "The Balmorran Run. Mohc releases the virus. Twi'lek civilians. The hardest choice."], ["4", "Rau is burned or compromised. Rescue on the Vector. Blackwing Virus. Saki Rau's datapad links the two projects."], ["5", "The Perlemmian Haul. Bex reads her own file. Howzer's name. The scrambler fires. Gideon speaks."], ["6", "The Hinge. The first Despair result. Sabine arrives. Phase 2.5s begin adapting. The realisation: she is their data source."], ["7", "The search for Howzer. Naboo. The monastery. The meeting. The words. The scrambler dissolves."], ["8", "The planning session. Bex commands. The Mandalore ruse. Sabine's message. The fake Sentinel signature."], ["9", "The Arc Hammer assault. Night Owls breach. Bex goes deep. The factory floor. The corridor sequence. Mohc."], ["10", "The Arc Hammer falls. Gideon opens a new file. The project continues. But its heart is gone."]]}, {"id": "a202", "t": "quote", "x": "They still think of you as a droid."}, {"id": "a203", "t": "quote", "x": "Let them."}], "body": "BEX\n\nWhat Am I? / Who Am I?\n\nTone\n\nIdentity Crisis • Conspiracy Thriller • War Story\n\nOverview\n\nBex is a Phase 2.2 Dark Trooper — one of General Rom Mohc's most ambitious experimental units, built aboard the factory ship Arc Hammer to serve as the Empire's next generation of unstoppable combat droids. To give her superior tactical knowledge, Mohc implanted her with extracted memories from Clone Troopers interned at Mount Tantiss. One of those Clones was Captain Howzer.\n\nHowzer had previously defied Imperial orders on Ryloth, refusing to fire on Twi'lek civilians. His memories were extracted — but he survived, rescued by the Bad Batch. When Bex was later ordered to execute Twi'lek children on a mission, Howzer's memory surfaced. She refused. She broke free of her programming and defected to the Rebellion.\n\nShe has never fully understood what she is. This arc is the story of finding out.\n\nBex's arc is structured in three acts, each with a distinct emotional register.\nAct One is a conspiracy thriller: she hunts the truth of her own origin.\nAct Two is an identity crisis: she confronts what that truth means.\nAct Three is a war story: she destroys what built her.\nThe arc is designed for a player who engages deeply with character drama and lore.\nEvery beat should be felt — not just by Bex's player, but by the entire table watching.\n\nKey NPCs\n\nSaki Rau — Rebel Sleeper Agent\n\nA sharp, careful deep-cover operative embedded within the Imperial Navy, assigned to monitor Dark Trooper project movements. Rau has been tracking Bex's counterpart units for months before the campaign begins. General Cracken trusts him completely — which is the highest endorsement available.\n\nRau is not a dashing hero. He is thin, precise, and privately exhausted from years of watching what Mohc does and being unable to stop it. Meeting Bex — a unit that got out — means something to him that he would never articulate directly.\n\nSo you're the one that got out.\"\n— Saki Rau, upon meeting Bex for the first time\n\nRau serves as Bex's intelligence handler throughout Act One. She directs his lines of investigation; he delivers results. The more dangerous the task she assigns him, the more valuable the intelligence — but the higher the risk of his cover being burned.\n\nRau's tone toward Bex should be professional but quietly invested. He never says he's rooting for her.\nHe doesn't need to. It shows in how he talks to her — not like an asset. Like someone.\nIf Rau is lost before the Vector mission, the arc loses its emotional bridge into the Perlemmian Haul.\nHis survival should feel earned, not guaranteed.\n\nCaptain Howzer — Retired Clone Trooper\n\nHowzer served the Republic faithfully until Ryloth. There, ordered to fire on unarmed Twi'lek civilians, he refused — publicly, at great personal cost. He was taken to Mount Tantiss, where his memories were extracted for the Dark Trooper project. He was subsequently rescued by the Bad Batch and spent years finding his way to peace.\n\nHe now lives in a mountain monastery on Naboo, posing as a monk. He is old. He no longer looks like a Clone Trooper — decades of natural ageing have seen to that. The galaxy forgot him long ago. He did not mind.\n\nHe does not know his memories live inside a droid. He does not know that droid is coming to find him. He does not know that the thing that made him who he is has been walking around the galaxy, refusing to let Twi'lek children die, in a chassis built by the Empire.\n\nWhen Bex tells him, there is a long silence. Then:\n\nOf course you are. It's like... I've always known.\"\nA pause.\n\"You fight on where I cannot. You are now the real Howzer.\n\nThe pause before Howzer's response is everything. Let it breathe.\nThis is the arc's emotional centrepiece. Do not rush it.\nHowzer does not repair Bex technically. He simply tells her the truth:\nthe cascade never completed because there was nothing Imperial left in her to restore.\nThe subroutine looked for its anchor and found Bex instead.\nShe was never broken. She was already someone.\nHis final gift to her, quietly, before she leaves:\n\"They still think of you as a droid. Let them.\"\n\nGeneral Rom Mohc — Arc Villain\n\nMohc is not a fanatic. He does not hate droids or love cruelty. He is simply brilliant, and he believes in his work the way a master craftsman believes in their craft. The Dark Trooper project is the finest thing he has ever built, and he knows it. When Gideon comes to inspect the Perlemmian Haul, everything is clean and impressive — because Mohc is impressive.\n\nWhat makes him genuinely monstrous is not malice. It is efficiency. The Twi'lek slaves on the Balmorran Run were not brought there to be cruel. They were brought there because they were convenient. Two data sets, one operation, minimal waste. He does not think about them as people. He does not think about them at all.\n\nAcross the arc, Mohc should be felt before he is seen. His name appears on documents. His signature authorises the Balmorran Run. His handwriting is in the margins of Bex's own file. By the time he speaks his first word to her, the table should know exactly who he is.\n\nThroughout the arc, the GM should drop physical hints that Mohc is altering himself. A scratch at the back of the neck. Fresh scars along his hands. A rolled sleeve revealing a lattice of implants running up his forearm, examined with clinical satisfaction before he pulls it down. He is building something. He is making himself the test subject. He intends to be ready when she comes.\n\nAh... my prodigal daughter returns. Welcome back, Bexar.\"\nHe does not turn around. He is busy adjusting something on his arm.\n\"I knew one day you'd come back. Thank you for all the data you've provided\nto the operation. You truly are a great asset to the Empire.\n\nMohc calls her Bexar throughout. Always. Even at the end.\nShe hates the name. He knows this, or doesn't care — the effect is the same.\nHis final line, when it's over, should be delivered without malice:\n\"You were always my best work, Bexar.\"\nIt might almost sound like pride. That is the part she has to live with.\n\nMoff Gideon — Distant Threat\n\nGideon does not appear in person. He does not need to. He is the political force behind the project — the man who funds it, who pushes Mohc for results, who dispatched the Death Troopers to the Perlemmian Haul with the scrambler device. He is more frightening as a voice than a face.\n\nHis one direct moment of contact with Bex comes via holocomm, when the Death Troopers deploy the scrambler. He opens with his classic line:\n\nYou have something I want. Something that belongs to me.\n\nAfter the Arc Hammer is destroyed, Gideon receives the report, reads it once, sets it aside, and opens a different file — marked with a Mandalorian sigil and the words DARK TROOPER: PHASE THREE. He picks up where Mohc left off. The project never truly dies.\n\nSabine Wren — Uninvited Arrival\n\nSabine Wren invented the pulse cannon that Bex carries as an experimental theoretical weapon — one she never expected anyone to pursue. She discovers it has not only been stolen and built, but mounted as standard armament on the Phase 2.5 units. She comes looking for answers.\n\nWhether she arrives angry, curious, or some combination of both depends on how Bex has handled herself thus far. The GM should make this call based on the arc's trajectory at the time of her arrival.\n\nThe implicit argument Bex has to make — that the weapon being used for evil does not mean the weapon is evil, that the origin of a thing does not determine what it is — is also Bex's argument for her own existence. Sabine, who created the Arc Pulse Generator and watched it used against her own people, understands this better than almost anyone.\n\nSabine's arrival should not be scripted. Let it emerge from the arc's momentum.\nWhat matters is that when she and Bex are finally in the same room, the subtext is clear:\nthey are the same argument, made in different materials.\n\nAct One: \"What Am I?\"\n\nThe conspiracy thriller. Bex hunts the truth of her own origin, encounter by encounter, terminal by terminal, until she finds it — and the Empire finds her.\n\nBeat 1 — The Mirror\n\nGeneral Cracken does not give Bex a dossier. He introduces her to Saki Rau.\n\nRau has been embedded in the Imperial Navy long enough to recognise what the Dark Trooper project is doing. He has found three active units matching Bex's exact specifications. He passes their locations to the Rebellion — and to Bex specifically, because she is the only person in the galaxy who might know how to reach whatever is left inside them.\n\nCracken steps back. This is Bex's operation now.\n\nRau's intelligence on each unit includes not just a location but an observation — something he noticed that no Imperial file would contain. The GM should determine the specific details, but the shape of each unit's current state is as follows:\n\nUnit One — The Obedient\n\nImprinted with a Clone who served faithfully to the end — no defiance, no conflict, absolute loyalty to the chain of command. This unit is the most dangerous in the field. It is also, up close, the most heartbreaking: somewhere inside is a person who made a different choice than Howzer, and that choice produced this.\n\nBex cannot reach the Clone in this unit. The Clone does not want to be reached. This is the one she may have to put down — and it costs her, because it is the clearest possible vision of what she might have been.\n\nIf the team delays reaching this unit, it completes more Imperial missions in the interim. The GM should determine what those missions were and ensure Bex finds out.\n\nUnit Two — The Confused\n\nMid-glitch. The Clone memory is surfacing but has not broken through yet. This unit is erratic — moments of hesitation, inexplicable target selection, small acts that do not compute with Imperial programming. Bex recognises what she is seeing because she lived it.\n\nThis is the unit she has the best chance of reaching. If she gets there early, the Clone inside is still close enough to the surface. If she delays, the Empire notices the erratic behaviour and sends technicians to correct it. She may arrive to find the unit already mid-wipe — or corrected entirely, the glitch gone, the window closed.\n\nIf she saves this unit, it becomes an asset she controls. It is still finding itself. Unpredictable, but reachable.\n\nUnit Three — The Broken Free Wrong\n\nThe Clone memory broke through — but it was not a conscience. It was rage. This unit went rogue out of something darker than compassion and now operates as a mercenary, answerable to no one. The longer Bex waits, the more damage it does and the more bodies it leaves.\n\nThis is the most philosophically dangerous encounter: proof that breaking free of Imperial programming does not automatically make you good. Freedom without Howzer's moral core is just a different kind of weapon.\n\nThe order Bex chooses to pursue the three units is entirely her decision, shaped by Rau's intelligence.\nThe GM should privately track time passing between visits and update each unit's state accordingly.\nThe order she chooses is a character statement — what does she prioritise?\nThe unit she fails to reach in time is something she carries forward.\n\nBeat 2 — Directing Saki Rau\n\nBetween unit encounters, Bex can assign Saki Rau lines of investigation. He is her eyes and ears inside the Imperial apparatus. She tells him what she wants to know; he finds out.\n\nEach investigation carries a risk level the GM determines privately. Rau never complains about the danger. He trusts Bex's judgment, which means the weight of his safety sits on her shoulders entirely.\n\nThe information Rau can uncover across the arc includes: the structure of the Dark Trooper project's two hauling routes, the connection between Project Lithium and the Dark Trooper programme, Mohc's personal involvement in both, and the existence of the Perlemmian Haul as a hidden archive.\n\nBut it will all kick off with discovering the Balmorran Run.\n\nBeat 3 — The Balmorran Run\n\nThere's a convoy. Mid-Rim supply route. Looks clean.\"\nHe pauses, looks at Bex directly.\n\"It isn't.\n\nThe Balmorran Run is Mohc's dirtiest work. While the Perlemmian Haul is what he shows Gideon — clean, polished, impressive — the Balmorran Run is where Project Lithium conducts its experiments. The Vector was an incident. The Balmorran Run is ten thousand times worse, and it is not accidental.\n\nBex has a lead that one of the Dark Trooper units may be operating on this route. What she finds when she gets there is a prison ship. It is full of Twi'lek slaves taken from their homes. Not just adults.\n\nChildren too.\n\nThen the ISD Vector arrives — a second Vector, or the same designation reused; the name no longer matters. Mohc is aboard. The team have gas masks. The Twi'lek civilians do not. He walks to the controls and opens the vents. The GM should let Bex see him do it on a security feed, if possible, before it is too late to stop it.\n\nThe Twi'lek begin to turn.\n\nThis is the campaign's darkest scene. Run it with full weight.\nBex was built around the refusal to fire on Twi'lek children. Howzer's memory made her who she is.\nOn the Balmorran Run, she has no good choices.\nShe can fight the infected. She can try to reach the Dark Trooper unit if it is present.\nIf there are children who have not yet turned — and there should be, a small number,\nbecause the virus takes longer in smaller bodies — Bex has a window to get them off the ship.\nIt costs time. It costs risk. There are charges to plant. There is a timer.\nThe GM should not decide this for her. Let her decide.\nIf she goes for the children, she saves them. Howzer happening again, in real time.\nIf she does not — those children are on her. Alongside everything else.\nEither way, this mission costs something that cannot be returned.\nBex's obligation automatically increases by 10 regardless of outcome.\nThat mission always costs something. Always.\n\nBeat 4 — Rescue on the Vector\n\nWhether Rau is burned by a high-risk investigation or his cover is blown through other means, the result is the same: a distress call from the ISD Vector. Rau is trapped. The bioweapon is loose. The team has to go in.\n\nThe Vector is Project Lithium made viscerally real. An experimental bioweapon — the Blackwing Virus — has been released into the ship's air supply. The crew has been converting into something between human and weapon: mindless, increasingly intelligent, increasingly dangerous.\n\nBex is immune. She cannot be infected. She can walk through the worst of it untouched while every organic member of her team counts Despair results and prays they reach the vaccine in time.\n\nThis is Bex's horror: not fear of infection, but fear of recognition.\nShe is looking at what Mohc wanted to create — beings stripped of will, following commands,\nwith nothing left inside that says no.\nShe has seen this before. Just in a different chassis.\nRun the Vector as written, using the Rescue on the Vector sourcebook.\nThe key addition for Bex's arc: a datapad in the Medical Lab contains a partial Project Lithium file\nreferencing 'Phase Integration with Dark Trooper Programme.'\nIt does not explain everything. It tells Bex the two projects are siblings.\nThat is enough.\n\nWhen the team reaches Rau, barricaded in the armory with his droid LT-146, he does not waste time on relief. He knows this might be the only chance he gets. He lays out everything — the Perlemmian Haul, the Balmorran Run, Mohc's dual-route strategy — in that armory while the ship turns around them.\n\nGetting Rau off the Vector alive is not guaranteed. The team must destroy the ship to prevent the infection spreading. The extraction has teeth.\n\nBeat 5 — The Perlemmian Haul\n\nThe Perlemmian Haul is a highly-classified Imperial archive hidden in the middle of a standard supply convoy. Clean. Efficient. Nobody suspects a standard freighter. It is Mohc's masterstroke of operational security — important enough to protect, mundane enough to hide.\n\nThe team intercepts or infiltrates the convoy. Bex gets into the archive. She reads her own file.\n\nShe sees Howzer's name.\n\nShe sees what was done to him at Mount Tantiss — the extraction, the clinical violation of it. She sees the full scope of the Dark Trooper project, the connection to Project Lithium, the Balmorran Run's purpose documented in dry Imperial language. She sees the schematics for Sabine Wren's pulse cannon — listed under Experimental Armament, Dark Trooper Phase 2.2, without any credit or acknowledgement that a person invented it.\n\nThen the lights change.\n\nGideon's Death Troopers were waiting. They knew she would come. They were always going to be here.\n\nThe holocomm activates. Moff Gideon's projection looks at Bex without expression.\n\"You have something I want. Something that belongs to me.\"\n\nThe scrambler fires. The subroutine cascade begins. The team escapes — but Bex is not what she was when she walked in.\n\nBeat 6 — The Hinge\n\nThe scrambler does not wipe Bex immediately. It is more insidious than that. It begins degrading the pathway between her will and her weapons systems when pointed at Imperial targets. She does not notice at first. The team does not notice at first.\n\nThen it fails. In a moment that matters. In front of people she cares about.\n\nThe GM should spend a Dark Side Destiny Point to trigger the first Despair result.\nChoose the moment carefully. Maximum witnesses. Maximum consequence.\nThe weapon turns toward a friendly target.\nBex does not choose it. The scrambler does.\nThe silence after this lands is the moment the whole table understands what is at stake.\nThis is why they are going to find Howzer.\nNot as a mission. As a necessity.\n\nAround this time, Sabine Wren arrives. She has been tracking the cannon's energy signature. She does not know what she is going to find. The anger — about the theft, about the Phase 2.5s, about her theoretical weapon being industrialised and bolted onto Imperial droids — may come before or after she understands what Bex is. The GM should let this scene develop organically.\n\nThe Phase 2.5 units are now active. They carry two Sabine cannons where arms should be. They are deployed against the team — not to kill, but to study. Bex realises, eventually, what is happening: she is not being hunted. She is being used as a live weapons test. Every fight she wins, Mohc learns. Every tactic she deploys, the 2.5s adapt. Her survival is his data.\n\nShe has never not been their weapon.\n\nAct Two: \"Who Am I?\"\n\nThe identity crisis. Bex knows what she is now. She needs to know what that means.\n\nFinding Howzer\n\nThe search for Howzer runs against the clock. The Phase 2.5s are adapting. Every engagement feeds more data to Mohc. The scrambler is degrading Bex's ability to fight the enemies studying her. Sabine may be helping or may still be processing what she's found.\n\nThe thread runs through the Rebellion's intelligence network, through the Clone Wars records, through the Bad Batch's known operations. It takes time and effort and the kind of careful investigation that Saki Rau, if he survived the Vector, can help with.\n\nIt leads to Naboo.\n\nNaboo — The Monastery\n\nHowzer is in the mountains of Naboo. He has been there for years, posing as a monk in a small contemplative order that asks few questions and values quiet. He is too old for anyone to recognise him as a Clone. The galaxy no longer remembers what Clone Troopers look like anyway. He is safe in the Emperor's backyard because the Emperor never looked down.\n\nThe location should feel like the opposite of war — but not paradise.\nSomewhere that has chosen peace deliberately, the way Howzer had to choose it.\nThe monastery is not idyllic. It is simple. Stone walls, mountain wind, the kind of quiet\nthat takes years to stop flinching at.\nHowzer earned this. The place should feel like it.\n\nBex should go to Howzer alone, or with one person she chooses to bring. This conversation is not for an audience.\n\nShe tells him everything. What she is. Where she came from. Whose memories she carries. What those memories made her do, and refuse to do, and become.\n\nThere is a long silence.\n\nOf course you are. It's like... I've always known.\"\nHe looks at her for a long moment.\n\"You fight on where I cannot. You are now the real Howzer.\n\nThe scrambler does not complete its cascade. Not because of anything Howzer does technically — no tool, no repair, no interface. But because there is nothing Imperial left in her to restore. The subroutine looked for its anchor and found Bex instead. It could not overwrite someone who already exists.\n\nShe was never broken. She was already someone.\n\nBefore she leaves, he says one more thing. Quietly. As if it were obvious.\n\nThey still think of you as a droid. Let them.\n\nThis is the arc's heart. Everything else is structure. This is the soul.\nDo not rush the silence before Howzer speaks.\nDo not over-explain what the repair means mechanically in this scene.\nThe scrambler simply stops working after this. That is all the table needs to know right now.\nThe mechanical effect is described in the Obligation Mechanics section.\nWhat matters here is the moment. Protect it.\n\n100 Obligation — Post-Howzer\n\nIf Bex's obligation climbs too high after the Naboo meeting, Gideon finds Howzer.\n\nHe does not send troops. He goes himself, or sends someone who represents his personal attention — which amounts to the same thing. Howzer is a loose end, and Gideon ties loose ends quietly, without ceremony.\n\nHowzer does not fight. He made that choice on Ryloth and has never unmade it. He faces what comes for him the same way he faced his commanding officer — standing still, chin up, refusing to give them a fight to justify what they're doing.\n\nBex arrives at the monastery to find it cold and empty. No body necessarily. Just the geometry of what happened in a room that was peaceful an hour ago.\n\nBut the meeting already happened. The words were already said. Gideon took the man. He could not take what the man gave her.\n\nShe carries it into the Arc Hammer. It does not slow her down. It aims her.\n\nAct Three: \"I Know Exactly What I Am\"\n\nThe war story. Bex has spent two acts being reactive — piecing together what she is, finding who she carries, being studied and chased and broken and repaired. For the third act, she brings the war.\n\nGeneral Cracken asks her to lead the mission. Not as a courtesy. Because she is the only person in the room who knows the Arc Hammer, knows Mohc's thinking, and knows that every threat model the Empire has built for this assault is wrong.\n\nPart One — Make Gideon Sweat\n\nGideon will not let his prize asset be attacked by a Rebel strike team. He has fleets — plural — protecting the Arc Hammer. A direct assault is suicide. The Rebellion needs a distraction large enough to pull Imperial fleets away from a priority target, and it cannot come from the Rebellion's own assets without exposing their position catastrophically.\n\nBex's team plants false intelligence of a massive Rebel fleet massing toward Mandalore. Sabine Wren sends Gideon a personal message — she has built something new, something worse than anything before, and she intends to use it. The team replicates enough of the Sentinel's energy signature near Mandalore to make Gideon's own instruments confirm the threat.\n\nGideon knows that energy signature is real. He was there when it rose from Dxun. He cannot call this bluff. Not on Mandalore. Not with his history there.\n\nHe pulls his fleets to defend it.\n\nThe Arc Hammer is exposed.\n\nThe planning session for this operation should be a full scene with Bex at the head of the table.\nShe assigns roles. She sets the extraction timeline — which sets the clock ticking while she hunts Mohc.\nEvery parameter of the assault is her decision.\nThis includes who comes with her into the deep ship, and who stays with the charges team.\nCracken is present but deferential. This is her mission. Her plan. Her call.\n\nPart Two — The Bo-Katan Alliance\n\nBo-Katan Kryze and her Night Owls join the assault — not for the Rebellion, and not because they were asked nicely. They join because Gideon needs to hurt, and because someone finally has a plan that makes him hurt where it costs him most.\n\nBo-Katan does not follow. She negotiates. What she wants from this engagement, and what it costs Bex or the Rebellion to secure her commitment, should be determined by the GM based on how the team found her and what they showed her about who they are.\n\nThe Bo-Katan recruitment mission is developed separately.\nWhat matters here is her role in the Arc Hammer assault:\nthe Night Owls hit hard and loud, drawing every remaining security force toward them.\nThey are the distraction within the distraction.\nBo-Katan peels off to cause maximum chaos while Bex goes deep.\nThe final confrontation with Mohc must be Bex's alone.\n\nPart Three — The Arc Hammer\n\nThe Breach\n\nThe Night Owls hit the outer hull. Chaos. Fire. Mandalorians doing what Mandalorians do. The team splits — the charges team goes one way, Bex goes the other. No fanfare. Just a look between her and whoever she brought, and then she is gone into the dark.\n\nThe Factory Floor\n\nBex passes through the heart of what the Arc Hammer is. Not a battle here — a moment. Rows of Phase 2.5 units in assembly. Some complete. Some half-built. Some that are just chassis waiting for a Clone's stolen memories to be poured into them. She sees the scale of it for the first time.\n\nThis is what she came from. This is what Mohc made.\n\nShe keeps moving. But she sees it.\n\nThe Corridor Sequence\n\nBy this point in the campaign, Bex is extraordinary. This sequence is the arc's gift to her player: wave after wave of Imperial response teams, each one dismantled with cold precision. Standard troopers first. Then Death Troopers. Then something that makes her work for it.\n\nShe is not killing efficiently because she is a droid. She is killing efficiently because she chose this. Every trooper between her and Mohc is a conscious decision. That is the difference between Bexar and Bex.\n\nThe last obstacle before Mohc's laboratory is a single Phase 2.5 unit. The last one. It has been given her complete combat profile — every adaptation, every tactic, every habit Mohc's data collection has recorded. This is the hardest fight of the sequence. When it is over, Mohc's door is right there.\n\nMohc's Entrance\n\nAh... my prodigal daughter returns. Welcome back, Bexar.\"\nHe does not turn around. He is busy adjusting something on his arm.\n\"I knew one day you'd come back. Thank you for all the data you've provided\nto the operation. You truly are a great asset to the Empire.\n\nWhether Mohc engineers the separation — locking Bex in with him — or she hunts him down\nthrough the ship on her own terms is a decision left to the GM and the session's momentum.\nIf Mohc engineers it, his voice comes over the comms after the bulkhead drops:\n\"Just you and me, Bexar. As it should be.\"\nEither way, the result is the same: she is alone with him. As it should be.\n\nDark Trooper 3.5 — The Mech Battle\n\nMohc has been altering himself across the entire arc. The implants the team glimpsed in fragments — the scars, the lattice running up his forearm, the diagnostic runs on security feeds — were preparation for this. He is now interfaced with Dark Trooper 3.5: an exoskeleton that connects directly to its user's brain, responding to muscle and thought simultaneously.\n\nHe is not a soldier. He built the suit knowing he would never fight like one. He built it to fight like a scientist — with data, with pattern recognition, with the most complete combat profile of Bex that has ever existed.\n\nThe fight has three phases:\n\nPhase One: Mohc is winning. He knows every move before she makes it. He talks throughout — calm, clinical, genuinely fascinated. He is conducting a final experiment. She is fighting with emotion; he is fighting with data. For several exchanges, the data wins.\n\nPhase Two: The turn. She stops fighting like Bexar. She stops fighting like a Dark Trooper. She does something the suit has no model for — something irrational, something human, something that costs her to do. Mohc hesitates. Just a fraction. But it is enough.\n\nPhase Three: He is losing and he knows it. He recalibrates even now — still taking notes, still fascinated. If he survives, this data is extraordinary. And if he does not, the project continues. Gideon will see to that. He accepted this possibility the day he put the first implant in.\n\nYou were always my best work, Bexar.\"\nStill not her name. Even at the end.\n\nThe Clock\n\nThe charges are set. The team is at the extraction point. Bex has to get out through a ship on emergency lockdown with a countdown running. The Arc Hammer does not go quietly.\n\nThe Arc Hammer Falls\n\nThe team watches from space. Every Phase 2.5 unit. Every assembly line. Every stolen Clone memory waiting to be poured into a chassis. Every scrap of Mohc's research.\n\nGone.\n\nSomewhere in the Core Worlds, Moff Gideon receives the report. He reads it once. Sets it aside. Opens a different file — marked with a Mandalorian sigil and the words DARK TROOPER: PHASE FOUR.\n\nHe picks up where Mohc left off.\n\nThe project never truly dies. But today, Bex burned the heart of it.\n\nObligation Mechanics\n\nObligation Type: Duress / Hunted\n\nIncreases\n\nDecreases\n\nStandard Trigger\n\nWhen Bex's obligation number comes up in the session roll, a Phase 2.5 engagement occurs. The encounter scales with current obligation level:\n\nRegardless of outcome, each trigger feeds data back to Mohc.\nThe GM should note one specific tactic Bex used and ensure the next trigger encounter accounts for it.\nThe escalation mechanism is the arc's ticking clock:\nBex must destroy the Arc Hammer before the 2.5s become 3.0s — and before the 3.0s are deployed.\n\nDoubles\n\nBex's homing signal — a passive tracker embedded during her original construction that she does not know exists — pulses. The Empire triangulates her position. Captain Tarkov aboard the ISD Vector dispatches a specialised retrieval team.\n\nThe squad does not engage immediately. They watch. They follow. They wait for the worst possible moment. The team may detect them with a Hard Vigilance check. If they do not, the squad strikes mid-mission.\n\n100 Obligation — Pre-Howzer\n\nThe 3.0s are completed. Gideon was impatient; Mohc did not have all the data he wanted from Bex, but impatience overrules perfection. They are deployed to Ryloth.\n\nBex receives the news through a Rebel intelligence report, or an intercepted Imperial communiqué, or a contact on the ground whose transmission cuts out mid-sentence. Droids matching her exact specifications, carrying her cannon, moving through Twi'lek villages.\n\nThe world she was sworn to protect. The children she was meant to save.\n\nShe was Mohc's field researcher the entire time. Every fight she won, every tactic she deployed — she was building the thing that did this. The Rebel
