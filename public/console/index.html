t": "p", "x": "Guy sits in the Dauntless Capitalism cockpit after the final stop and does not reboot."}, {"id": "a124", "t": "p", "x": "Then: Glare Peak. The prison break. Guy does not plan this like Bex would. He plans it like a con. He talks his way past at least two checkpoints using pure audacity. Something goes hilariously wrong — ideally involving Ruy, if Ruy is available."}, {"id": "a125", "t": "p", "x": "If Shalor is alive: they get him out. When Shalor sees Guy, he doesn't say Guy. He says Zee-Tee. Nobody at the table says anything."}, {"id": "a126", "t": "p", "x": "Then: the room. Both syndicates. Goskey. The Crimson Dawn representative. Guy as the middleman — reasonable, charming, slightly annoying in the way Guy Rando is always slightly annoying. He is just here to help everyone walk away happy."}, {"id": "a127", "t": "p", "x": "Then: the door opens. Shalor walks in. Post-prison Shalor. Thin. Quiet. Looking like a man who has had a very long time to think."}, {"id": "a128", "t": "p", "x": "And above: Kalifa Frey's pirates in orbit, announcing themselves in the only way Kalifa Frey announces anything."}, {"id": "a129", "t": "p", "x": "And outside the room: the team."}, {"id": "a130", "t": "p", "x": "Both syndicates agree. The Shalor rumour was a double-cross — by the other syndicate. The kajidic blames Dawn. Dawn blames the kajidic. The credits transfer to a Bonadan account. Call it a Survivor's Fee."}, {"id": "a131", "t": "p", "x": "Guy Rando belongs to nobody. Not through a fight, not through a legal ruling. Through the oldest method available: he made it someone else's problem until it wasn't worth being anyone's problem anymore."}, {"id": "a132", "t": "p", "x": "And then Shalor looks at Guy and asks him what he's going to do now."}, {"id": "a133", "t": "callout", "x": "That question belongs to the player.\nNo prompt. No suggested dialogue. No mechanical resolution.\nJust: what does Guy Rando do now?\nWhatever the answer — funny, sincere, deflecting, surprisingly honest —\nit will be the right answer.\nBecause by that point, the arc will have done its job."}, {"id": "a134", "t": "h1", "x": "PUBLISHED ADVENTURES"}, {"id": "a135", "t": "h2", "x": "The Jewel of Yavin (EotE)"}, {"id": "a136", "t": "p", "x": "The Jewel of Yavin runs essentially as written, with the following adaptations:"}, {"id": "a137", "t": "p", "x": "The team is not Arend Shen's hired crew. They are there independently, working for Kalifa Frey."}, {"id": "a138", "t": "p", "x": "Ruy Gando is Arend Shen's operative. The team discovers this gradually — they keep finding evidence of someone else running a parallel operation, slightly wrong."}, {"id": "a139", "t": "p", "x": "Arend's betrayal in Episode III falls on Ruy, not the team. The team is caught in the crossfire."}, {"id": "a140", "t": "p", "x": "Guy's specific role: The Cloud City Grand Prix is his moment. The gala infiltration is his showcase. The museum heist has a scene where Guy must deal with a security droid without his usual methods — the first time he treats a droid as something other than a threat."}, {"id": "a141", "t": "p", "x": "Ruy's role across the three episodes: ambient chaos (Ep. I), appears mid-heist with the wrong gem (Ep. II), runs the wrong direction through the crossfire (Ep. III)."}, {"id": "a142", "t": "callout", "x": "The Ruy-in-the-crossfire scene is Guy's most important character moment in the whole adventure.\nCreate space for it to be Guy's decision alone — not a group vote, not a tactical discussion.\nGuy decides. Whatever he decides, it costs him something for someone else's sake.\nHe will insist he had tactical reasons. Let him."}, {"id": "a143", "t": "h2", "x": "Rescue at Glare Peak (AoR)"}, {"id": "a144", "t": "p", "x": "Glare Peak runs mostly as written. The following adaptations apply:"}, {"id": "a145", "t": "p", "x": "Shalor is held in the high-security cellblock. He has been there long enough that the warden barely thinks about him. He is categorised as a long-term criminal with underworld connections — the Empire is still slowly extracting information about Crimson Dawn from him."}, {"id": "a146", "t": "p", "x": "Guy does not plan this like a military operation. He plans it like a con. Audacity over force. He talks past at least two checkpoints he has no business getting through."}, {"id": "a147", "t": "p", "x": "The tonal register of the prison break should feel different from Bex's arc — this is Ocean's Eleven, not the Arc Hammer assault."}, {"id": "a148", "t": "p", "x": "If Ruy is available: he is somewhere in this facility for completely unrelated reasons. He is not helpful. He is very glad to see them."}, {"id": "a149", "t": "h1", "x": "OBLIGATION MECHANICS"}, {"id": "a150", "t": "h2", "x": "Increases"}, {"id": "a151", "t": "h3", "x": "Visiting any Underworld-dominated location: +5"}, {"id": "a152", "t": "p", "x": "Guy avoids, deflects, or reboots when confronted with his past: +5"}, {"id": "a153", "t": "p", "x": "Leaving a syndicate encounter without extracting any useful information: +5"}, {"id": "a154", "t": "h2", "x": "Decreases"}, {"id": "a155", "t": "p", "x": "Successfully questioning a syndicate member or Ruy about the past: –5"}, {"id": "a156", "t": "p", "x": "Learning the name Dauntless Capitalism and its current location: –10"}, {"id": "a157", "t": "h3", "x": "Learning Shalor's name and his prison location: –10"}, {"id": "a158", "t": "p", "x": "Acquiring access to the Dauntless Capitalism and its navicomputer: –15"}, {"id": "a159", "t": "h3", "x": "Breaking Shalor out of Glare Peak: –20"}, {"id": "a160", "t": "p", "x": "Running the Bonadan Bisection and restoring memory: –20"}, {"id": "a161", "t": "h2", "x": "Triggers — When Guy's Number Comes Up"}, {"id": "a162", "t": "p", "x": "The trigger always involves Ruy. The specific flavour depends on the arc stage."}, {"id": "a163", "t": "table", "x": "", "r": [["ARC STAGE", "RUY APPEARANCE", "INFORMATION DROPPED"], ["Stage One(Before Guy knows what the syndicates want)", "Ruy appears mid-transaction with someone syndicate-adjacent. He doesn't know who they are. He's trying to sell them something dubious. The syndicate contact clocks Guy and Ruy together and gets very interested.", "In the chaos of extraction, Guy overhears: \"Shalor's crew\" / \"the droid with the route\" / \"the Dauntless.\" Just enough. Never enough."], ["Stage Two (After Guy knows about the Bisection but before the Dauntless)", "Ruy has heard about the Bonadan Bisection through the cantina grapevine. He has been telling people he knows someone who knows something. He doesn't realise the someone is Guy. He is actively making Guy's life dangerous with every word.", "Ruy mentions Shalor by name. Casually. As someone he used to work for. He doesn't elaborate unless pressed."], ["Stage Three(After the Dauntless, before the Bisection run)", "Ruy gets picked up by one of the syndicates asking questions about Shalor's old crew. He is not in mortal danger — they think he's useful. He is absolutely certain he can talk his way out. He cannot.", "If the team extracts Ruy: he mentions, fondly, almost wistfully, that he used to run with a droid. Best co-pilot he ever had. Terrible conversationalist. Real attitude problem."], ["Stage Four(After the Bisection run)", "Ruy shows up. Just shows up. At the worst possible moment during con preparation. Wanting to catch up. Having heard some very interesting rumours about Shalor being alive. Wondering if Guy knows anything about that.", "Ruy eyes the assembled crew with the expression of a man who smells money. GM decision: does Ruy get a seat at the table?"]]}, {"id": "a164", "t": "h2", "x": "Doubles — Direct Syndicate Action"}, {"id": "a165", "t": "p", "x": "Alternate between Desilijic kajidic and Crimson Dawn each time doubles are rolled. Each appearance escalates."}, {"id": "a166", "t": "p", "x": "First doubles (Desilijic): Three of Jabba's people. They try to fit a restraining bolt on Guy. Guy doesn't have a standard port. They are confused. Guy is offended. Mention of the Dauntless Capitalism if questioned."}, {"id": "a167", "t": "p", "x": "Second doubles (Crimson Dawn): A representative, not muscle. They know about Ruy. They mention him by name, watching Guy's face. They want to negotiate. Mention of Shalor: \"We understand he's no longer... available.\""}, {"id": "a168", "t": "p", "x": "Third doubles (Both): Both factions arrive simultaneously in the same location, neither knowing the other would be there. Pure farce. Guy runs both conversations. Ruy may or may not be making everything worse. Both factions now know the other is looking. The race accelerates."}, {"id": "a169", "t": "p", "x": "Fourth doubles (Direct threat): Serious muscle. This is acquisition, not negotiation. The team fights. Whoever they defeat drops something concrete: a prison transfer record, a ship registry, a name. Glare Peak."}, {"id": "a170", "t": "h2", "x": "Arc Beat Triggers"}, {"id": "a171", "t": "p", "x": "When the obligation number comes up AND the moment is dramatically right, deliver one of the following beats instead of a standard trigger:"}, {"id": "a172", "t": "p", "x": "Beat One: Zid pulls Guy aside. He's been sitting on something. Those numbers Guy was reading out when he got hit by that blaster bolt — Zid ran them. Half a set of coordinates. What does Guy want to do about that?"}, {"id": "a173", "t": "p", "x": "Beat Two: The Dauntless Capitalism surfaces. Not through investigation — through Ruy, who mentions offhandedly that he saw the most heavily armed freighter he had ever seen on a landing pad somewhere. The team recognises it immediately. Ruy has no idea why everyone is staring at him."}, {"id": "a174", "t": "p", "x": "Beat Three: Guy runs the first stop of the Bisection. Just the first one. A flash — a landing pad, exhaust smell, someone laughing at something. Gone before he can hold it. Real, though."}, {"id": "a175", "t": "p", "x": "Beat Four: The memory completes. Full Bisection run. Shalor on the freezing street. The plate of food. The week of meals. The questions. The friendship. Guy sits in the Dauntless Capitalism cockpit after the final stop and does not reboot."}, {"id": "a176", "t": "h2", "x": "100 Obligation Consequence"}, {"id": "a177", "t": "p", "x": "The team receives a prison transfer notice — Rebel intelligence intercepts it, or Cracken flags it, or it arrives through a contact. Routine Imperial processing."}, {"id": "a178", "t": "callout", "x": "Prisoner transfer from Glare Peak.\nTanek Shalor. Deceased.\nTransferred to Imperial records."}, {"id": "a179", "t": "p", "x": "No drama. No villain responsible. No scene to play out. Just a bureaucratic notification that a man the galaxy forgot has been quietly removed from it."}, {"id": "a180", "t": "p", "x": "The con still happens. Guy still earns his freedom. Kalifa Frey's pirates still blow up ships in orbit. The table still laughs."}, {"id": "a181", "t": "p", "x": "But the back door of the meeting room stays empty. And nobody asks Guy what he's going to do now."}, {"id": "a182", "t": "h1", "x": "WHAT THE TABLE GETS FROM GUY'S ARC"}, {"id": "a183", "t": "p", "x": "Every arc plants something in every other player. The player experiencing an arc is playing Star Wars. Every other player is watching it. Guy's arc gives the table something no other arc provides:"}, {"id": "a184", "t": "p", "x": "Laughter that means something. Every other arc gives the table something heavy to carry. Guy's arc gives them permission to breathe — and then, quietly, catches them off guard."}, {"id": "a185", "t": "p", "x": "For Derek: The Survivor's Fee transferred to Bonadan is the most Guy Rando version of a victory. A man running a serious thriller gets the tonal counterweight he needed."}, {"id": "a186", "t": "p", "x": "For Bylie: Watching Guy go back for Shalor resonates with everything she is fighting for — the right to care about something, to let something matter."}, {"id": "a187", "t": "p", "x": "For Grevi: Guy figuring out who he is without a holocron, without a master, without a lineage — just by deciding — is the lesson Grevi needed about self-determination."}, {"id": "a188", "t": "p", "x": "For Zid: The Bonadan Bisection as a family legacy in miniature. Coordinates instead of a dreadnought. A drug lord instead of a noble house. The same question underneath: what do you do with what someone left you?"}, {"id": "a189", "t": "p", "x": "For Bex: Guy's arc is the mirror of her own. Bex asked \"do I have a soul?\" and answered it through sacrifice and war. Guy asked \"do I actually care about anything?\" and answered it through a con and a plate of food on a freezing street. When Guy doesn't reboot — Bex stops being the only droid at the table who knows what she is."}, {"id": "a190", "t": "h1", "x": "GM NOTES"}, {"id": "a191", "t": "h2", "x": "On Running Ruy"}, {"id": "a192", "t": "p", "x": "Ruy Gando is a free-use GM asset. He appears whenever the GM needs him to, in whatever form is most inconvenient. He can die because the team left him somewhere they shouldn't have — that's a Ruy death, probably spectacular, definitely avoidable, entirely his own fault. He can show up after the arc ends to congratulate Guy at the worst possible moment. He can return forever. There are no rules."}, {"id": "a193", "t": "p", "x": "The only rule: Ruy never finds out what he did. He never learns Guy named himself after him. He never understands the weight of those cockpit stories. He just keeps being Ruy — talking too loud, timing everything wrong, surviving on pure audacity."}, {"id": "a194", "t": "p", "x": "That is the joke that never stops being funny. And the one that quietly breaks your heart."}, {"id": "a195", "t": "h2", "x": "On the Jewel of Yavin Scene That Matters"}, {"id": "a196", "t": "p", "x": "The Ruy-in-the-crossfire moment during Episode III of the Jewel of Yavin is the arc's most important character beat before the finale. The GM must create space for it to be Guy's decision, not a group vote. The team can position themselves. The threat can be clear. But the call belongs to Guy."}, {"id": "a197", "t": "p", "x": "Guy will insist he had tactical reasons. Let him."}, {"id": "a198", "t": "h2", "x": "On the ZT-007 Scene"}, {"id": "a199", "t": "p", "x": "When the team boards the Dauntless Capitalism and the ship says \"Welcome back, ZT-007\" — let the silence sit. Do not rush to the next beat. The table will know what it means. Give them a moment with it."}, {"id": "a200", "t": "p", "x": "Then the navicomputer pulls up the Bonadan Bisection. Then Zid says \"That's the other half.\" These three beats should land in sequence, simply, without dramatic amplification. The scene is already everything it needs to be."}, {"id": "a201", "t": "h2", "x": "On the Final Question"}, {"id": "a202", "t": "p", "x": "When Shalor asks Guy what he's going to do now — and if the 100 Ob hasn't been triggered and Shalor is in the room — don't fill the silence. Don't offer options. Don't suggest a mood."}, {"id": "a203", "t": "p", "x": "Just wait."}, {"id": "a204", "t": "p", "x": "Whatever the player says is the right answer."}, {"id": "a205", "t": "p", "x": "The arc's true villain is incompetence."}, {"id": "a206", "t": "p", "x": "The galaxy made a mistake."}, {"id": "a207", "t": "p", "x": "Guy corrected it."}, {"id": "a208", "t": "p", "x": "And sent an invoice to Bonadan."}], "body": "GUY RANDO\n\nThe Droid Who Thinks He's Human\n\nA Reluctant Hero Comedy · Hitchhiker's Guide to the Galaxy Register\n\nCharacter: Guy Rando · Designation: ZT-007\n\nArc Tone: Tragic Comedy · Emotional Register: Laughter into something real\n\nTHE STORY\n\nGuy Rando is the greatest smuggler this side of Dantooine. He will tell you this himself, at length, unprompted, with absolute conviction. He is also a droid — a fact he is not aware of, cannot process when proven, and will reboot to avoid confronting. He hates droids. He has always hated droids. This is not a contradiction he has ever successfully examined.\n\nHe named himself after a man named Ruy Gando, though he does not remember this. He does not remember Ruy at all. He does not remember the Bonadan Bisection, or the runs he did alone, or the exact moment he looked at a loaded navicomputer on an empty ship and thought: why. He grabbed some credits and left. The galaxy was too big to sit in one spot, doing the same run, over and over.\n\nThat was a long time ago. Now he's a Rebel, more or less. He joined for the credits. He stayed because they treat him like a person — something he does not receive in the Underworld, something the Empire has never once considered offering. He would not describe this as belonging. He would not describe it as anything at all. But he stays.\n\nThe emotional question at the heart of this arc:\n\"Does Guy Rando actually care about anything?\"\nThe arc's job is to introduce the one person whose fate forces him to find out.\n\nTwo crime syndicates are hunting Guy for coordinates he half-remembers. A pirate captain has a ship he needs access to. A man in an Imperial prison is waiting, though he doesn't know for what. And Ruy Gando is out there somewhere, a natural disaster in human form, about to walk into Guy's life at the worst possible moment.\n\nThis is not a tragedy. It's a comedy. The distinction matters, because the comedy is what makes the table lower their guard — and then the Star Wars poetry lands harder than it ever could have if you'd telegraphed it.\n\nARC TONE & DESIGN PHILOSOPHY\n\nGuy's arc is the campaign's sole comedy arc. This is structural, not incidental. Five arcs carry genuine dramatic weight — thriller, tragedy, spiritual quest, family saga, identity crisis into war story. The table needs one arc that primarily earns laughter. Without it, emotional fatigue sets in.\n\nThe register is Hitchhiker's Guide to the Galaxy: a being who gained sentience and immediately used that sentience to develop an attitude and stop working. The comedy comes from the gap between Guy's self-image (greatest smuggler alive, definitely human, correctly suspicious of all droids) and the reality the table can see. The genre-savvy player who always picks the funny answer is playing a character who has spotted every twist in the campaign except the one about himself.\n\nThe arc starts as farce and earns something real. Act One is chaos. Act Two develops a crack in the armour. Act Three is where Guy Rando — the droid who insisted he didn't care about anything — does the thing. Willingly. Knowingly. And the table laughs, and then goes quiet.\n\nThe nuanced comedy principle:\nThis player is genre-savvy and meta-aware. He will see twists coming. The arc cannot be built on dramatic irony the player will outwit. Instead, it must be exactly what it looks like — so nakedly what it is that the player is having the time of his life playing the funny answers, and then something genuine arrives without disguise or setup and lands precisely because there was no trick.\nThe genre-savvy player has armour against cleverness. He does not have armour against sincerity.\n\nBACKGROUND: THE FULL STORY\n\nThe following is what actually happened. Guy does not know most of it. He will learn it in pieces over the course of the arc, with the final revelation arriving when he runs the Bonadan Bisection for the last time.\n\nTanek Shalor and ZT-007\n\nA busy street on a freezing planet. Shalor sits down in front of a food cart, rubbing his hands together. He is wearing rags. His gloves are basically strings. His face is dark with coal residue. He reaches into his pocket and discovers there is a hole in it. His credits are gone. He begins to shake.\n\nHe is not going to eat tonight. He does not get paid for another week.\n\nAnd then a plate of food appears.\n\nShocked, Shalor looks up at his would-be saviour. It is a chef droid — ZT-007, running a food cart on contract, not programmed to make social decisions. And yet it has handed him a plate. For free. Without being asked.\n\nShalor comes back each day that week. Each day ZT-007 gives him a meal. There is no conversation at first — the droid is not programmed to chat to customers. But through Shalor's questions, the first hints of something breaking in the programming begin. They become friends. They talk about how they could get rich and get off this freezing planet.\n\nGuy was not Shalor's property.\nHe was his friend.\nThis is the first chapter Guy chose not to remember.\nIt is also the reason everything else happened.\n\nShalor eventually built a career in drug running, then discovered the Bonadan Bisection — a gun-running smuggling route of such precisely calculated astrogation data that it could deliver to any of six different worlds from a single origin point. He switched to arms dealing. The route's value eventually earned him an invitation to sit with Crimson Dawn.\n\nBefore the meeting, Shalor made a decision. He placed the Bisection's coordinates inside the only being he trusted: ZT-007. Not half of them — all of them. But the navicomputer aboard the Dauntless Capitalism, the ship ZT-007 piloted, held the delivery protocols and star chart locks without which the coordinates were unusable. The coordinates and the ship were designed to work together. One was the key. The other was the lock.\n\nShalor never made it to the meeting. His associate Masse Goskey, hoping to cash in on the Bisection himself, tipped off the Empire. Shalor was arrested and sent to Glare Peak Imperial Detention Center.\n\nRuy Gando\n\nShalor had hired a human handler named Ruy Gando to accompany ZT-007 on the Bisection runs. Ruy made the exchanges. ZT-007 flew the ship and loaded the next coordinates. Ruy was a talker — he spoke constantly, to nobody in particular, filling the cockpit with stories about the galaxy, about freedom, about adventure, about the next big score. He was not addressing ZT-007. He was just talking.\n\nZT-007 absorbed every word.\n\nWhen Shalor was arrested, Ruy — being Ruy — made the only call available to a smuggler of his calibre. He ran. He did not say goodbye. He did not leave instructions. He disappeared into the galaxy, the way he disappeared from everything, cleanly and without looking back.\n\nZT-007, without a handler, without buyers, without purpose, kept running the Bisection. Stop to stop to stop to stop. Alone. Until one day something in the droid's processor said: enough of this.\n\nThe galaxy was too big to sit in one spot, doing the same run over and over. That was something Ruy Gando had said. Possibly more than once. It had lodged somewhere.\n\nThe droid grabbed some credits from the cargo hold and walked off the job.\n\nChose a name — an anagram, almost, of the man who had made those cockpit runs feel like something — and became Guy Rando.\n\nHe did not know he had done this. He did not know why the name felt right. He just knew it was his.\n\nAfter ZT-007\n\nGoskey searched Shalor's belongings for the Bisection data and found nothing. Running the logs, he discovered ZT-007 had been doing the runs and still had the data inside him. But by then ZT-007 had stopped delivering, gained sentience, and vanished. Goskey eventually got caught by his own associate Ephant Mon, who told Jabba the Hutt's kajidic about the Bisection. Jabba sent people to find the droid. Crimson Dawn, who considered ZT-007 technically part of their organisation since Shalor had been invited to sit with them, sent their own people.\n\nA race began. Two factions hunting the same droid for the same coordinates. Neither one knew about the other. Neither one knew that the droid had become someone else.\n\nMeanwhile, the Dauntless Capitalism — the ship that holds the other half of the Bisection — was repossessed, sold, auctioned, and eventually won in a sabacc game by the most notorious pirate this side of Ryloth: Kalifa Frey. She had no idea what was in the navicomputer. She just needed another ship for her fleet.\n\nAnd Shalor sat in Glare Peak, waiting. He did not know what he was waiting for. But he had not told anyone about ZT-007, and he did not intend to.\n\nKEY NPCS\n\nRuy Gando — The Original\n\nThe man Guy Rando is named after, though Guy does not remember this and Ruy has no idea. He is a human smuggler, self-made, on the run, interested primarily in credits. He is not genre-savvy. He is just playing the part, even though he is the actual human. The irony is total and never acknowledged.\n\nRuy should never find out what he did. He should never learn that Guy named himself after him.\nHe just keeps being Ruy — talking too loud, timing everything wrong, surviving on pure audacity.\nThat's the joke that never stops being funny. And the one that quietly breaks your heart.\n\nTanek Shalor — The Friend\n\nDrug lord turned arms dealer turned Crimson Dawn associate, currently imprisoned at Glare Peak Imperial Detention Center. The man who put the coordinates in Guy because he trusted him. The arc's emotional centre.\n\nThe first time Shalor sees Guy in the prison, he does not say: \"Is that you, Guy?\"\nHe says: \"Is that you, Zee-Tee?\"\nNobody at the table says anything.\nNobody needs to.\n\nKalifa Frey — The Pirate\n\nThe most notorious pirate this side of Ryloth. Won the Dauntless Capitalism in a sabacc game and immediately converted it from a beat-up smuggling freighter into a heavily armed warship. Has no idea what is in the navicomputer. Operates out of Maldra IV, a mid-Outer Rim port world where the law is more of a suggestion. Has a sentient droid bodyguard, K2-XX, whom she treats as a person without making a speech about it.\n\nMasse Goskey — The Betrayer\n\nShalor's former associate, who tipped off the Empire and sent Shalor to Glare Peak. Now connected to both the Desilijic kajidic and Crimson Dawn as an information broker. Thin, nervous, always looking for the exit. He told himself Shalor deserved it. He has been telling himself this for years.\n\nKleya Marki\n\nGeneral Cracken's second-in-command in Rebel Intelligence, and the officer tasked with quietly exploring whether the Alliance's desperate need for weapons could ever justify dealing with criminal syndicates. She has been doing this work far longer than Cracken has been running anything, which is precisely why he doesn't push when she operates on her own timeline. She gathers all the information she wants before she ever acts on it — including information Cracken himself doesn't yet have.\n\nKleya is not Guy's ally, and not his enemy. She is calculating, at all times, what he is worth to her — as an asset, as a bargaining chip, or as both simultaneously. She does not need Guy to like her. She needs him useful.\n\nKleya recurs across multiple threads in this campaign, not just Guy's — treat her as a persistent, independently-motivated figure rather than a single-arc device. At some point, Cracken and Kleya should interact in front of the party, letting the table see the real shape of their relationship (professional, slightly wary on his side, entirely unbothered on hers) rather than having it only exist in exposition.\n\nZid's Role — The Aha Moment\n\nZid was present when Guy took a blaster bolt and started reading out numbers. To Zid, who knows the stars like the back of his hand, the numbers were not random — they were half a set of coordinates. Zid filed this away without comment.\n\nWhen the team boards the Dauntless Capitalism and the ship pulls up the Bonadan Bisection star chart, Zid is the one who says, quietly, factually, the way a navigator states coordinates:\n\nThat's the other half.\n\nThis is Zid's moment in Guy's arc. It should land without fanfare. The picture completes. The table has been holding this since the blaster bolt scene, however many sessions ago. This is the pay-off.\n\nARC STRUCTURE\n\nGuy's arc has three acts, each with a distinct tonal register. The comedy peaks in Act One, the crack appears in Act Two, and Act Three is where Guy Rando earns his freedom — not through battle, but through the galaxy's oldest method: making it someone else's problem until it isn't worth being anyone's problem anymore.\n\nAct One: The Chase (Pure Farce)\n\nGuy is being hunted by two factions for something he didn't ask to have. Every attempt to resolve it makes it worse. The galaxy is profoundly, specifically inconvenient to him. He does not know why the syndicates want him. He does not know what he's carrying. He does not remember the Bisection.\n\nRuy appears for the first time. He is trying to sell something to someone he absolutely should not be selling anything to. He does not recognise Guy. He mentions, as small talk, that there's a droid worth good money being hunted. He has no idea he's talking to the droid. The table is screaming internally.\n\nThe Offer At The Door\n\nKleya's investigation into potential arms sources surfaces a name: Tanek Shalor, and the old Bonadan Bisection smuggling corridor. Pulling that thread, one of her agents reports back with contact from Leyo Prim — a Crimson Dawn operator one rung beneath Qira herself, who has independently been hunting for Shalor, the Bisection, and a droid named Guy Rando. Prim sees this as his opportunity to rise in the organisation, and proposes a trade: Alliance access to a substantial arms shipment, in exchange for Guy.\n\nKleya has not accepted the offer. She has not refused it either. She wants to know why Guy is worth this much before she decides anything — and she has not yet told Cracken any of this is happening.\n\nShe finds Guy outside his own quarters aboard the Hope.\n\nYou've got quite the reputation, it seems. Kleya Marki, Rebel Intelligence. Let's chat.\n\nShe lays out the offer plainly — Crimson Dawn wants him specifically, in exchange for arms the Alliance badly needs — and is transparent that she hasn't decided what to do with it yet.\n\nTanek Shalor. That name mean anything to you?\n\nGuy will remember:\n\nHe's not dead. He's not free either. Imperial Detention Center, who knows where — has been for years. Everyone chasing you seems to think he's the key to something. I'd quite like to know what, before I decide what any of this is worth.\n\nKleya isn't willing to hand over an Alliance asset for arms — not without knowing what she's actually giving away. But Shalor being unreachable doesn't leave her without a plan.\n\nHe's rotting in an Imperial prison somewhere, so he's not going to be any help to us. Not until we can find him and spring him. But in the meantime, we may have something better — his old ship. The Dauntless Capitalism. Ring any bells?\n\nGuy draws a total blank — which should feel odd, because he can picture Shalor's name and face perfectly well. Just not the ship. Let this land small and confusing rather than significant; no NPC should remark on it, and no explanation should be offered in-fiction. This is the first plant of the arc's central mystery.\n\nKleya's reasoning for going after the ship herself, rather than simply handing Guy over, is entirely self-interested:\n\nI'm not an idiot. I give them you, they come away with a hundred times the value of the arms they're going to 'graciously' gift to us. It'll be way better if we find that Bonadan Bisection ourselves. And if we're going to get anywhere with it, we're going to need his ship.\n\nShe hands over a datapad.\n\nList of all sightings of the Dauntless Capitalism. I'd start on Formos — big place, lots of comings and goings, and the Capitalism's been seen there more than once. Could be something.\n\nIf Guy asks why it has to be him:\n\nI could just hand them you?\n\nShe leaves without waiting for a response. She does not tell him to keep any of this from Cracken — she doesn't need to. If Cracken ever does find out, she will simply reassert her position and redirect him toward her results. She has been doing this longer than he has, which is exactly why she's his second.\n\nFormos\n\nGuy travels to Formos and starts asking around about the Dauntless Capitalism — likely asking the wrong people, in the wrong way, exactly as his instincts would suggest. The trail leads him, eventually, to a name: Kalifa Frey — the ship's current owner, a notorious pirate operating out of Maldra IV. Dockhands and fixers should react to the name with a mix of respect and nerves rather than fear; this is the correct amount of information for Act One to deliver. Guy should not yet learn how to reach Frey directly, or how to get anything out of her — only who she is.\n\nBut Guy is not the only one asking about the ship.\n\nThe Hangar Standoff\n\nJust as Guy (and the team, if present) reach the hangar where the Dauntless Capitalism is currently docked, Leyo Prim arrives — Crimson Dawn muscle in tow.\n\nWell colour me a gundark and call me Jabba — if it ain't Guy Rando himself. Right here, searchin' what I'm searchin'. Anyone else think that's a great little coinky-dink?\n\nBefore anything can escalate, a second door opens. A rival crew enters — Desilijic kajidic muscle, led by Cul Gorrak.\n\nLeyo Prim, as I live and breathe. Oh, and Guy Rando! Well whaddaya know — it must be my birthday or somethin'.\n\nCul Gorrak. What in tarnation are you doin' here?\n\nThe two men square off — both claiming the ship, both claiming Guy, escalating steadily, neither one aware the other doesn't fully understand the prize either. If the party is accompanied by their Formos contact (the person who led them to the lead on the Dauntless), that contact urges them to leave while the two crews are distracted, making clear this confrontation is not going to go anywhere good for outsiders.\n\nPrim and Gorrak both bolt the moment the firefight turns serious — neither is willing to die for this, though neither has any issue leaving their enforcers to do exactly that. This should read as comic and a little pathetic: two men who talk like they run the underworld, running the instant it costs them anything personally.\n\nIF THE PARTY INTERVENES\nIf the players choose to wade into the standoff rather than leave, don't punish it heavily — but do have them get a clean look from both crews, meaning Kalifa Frey will already know exactly who Guy is by the time the party reaches her in Act Two, rather than him retaining any anonymity. Prim and Gorrak's mutual hostility should still escalate fast enough to eclipse the party as the primary target.\n\nWhat Guy walks away with: confirmation the ship belongs to Kalifa Frey, hard evidence that two separate criminal organisations are actively hunting him by name, and still no memory of why any of it matters. He has traded ignorance of the danger for a very loud, very public introduction to it.\n\nReturn To Kleya\n\nWhen Guy reports back, Kleya already has more on Kalifa Frey than she's letting on to anyone else in the fleet — and the means to arrange an actual meeting. This is the hook into the base document's existing Act Two (the Jewel of Yavin, Cloud City, the trade for the Dauntless's navicomputer), which continues exactly as written from here.\n\nAct Two: The Jewel of Yavin (The Crack Appears)\n\nThe team needs the Dauntless Capitalism's navicomputer. Kalifa Frey has the ship. Kalifa Frey wants the Jewel of Yavin. The team goes to Cloud City.\n\nThe Cloud City Grand Prix. Guy in a cloud car. The entire Bespin system watching. Guy wins through a combination of reckless confidence and the galaxy's worst odds calculation. He says something completely deranged in the winner's circle that will be played back to him later.\n\nThe gala. Guy in black tie, performing humanity at the highest stakes imaginable. He is surrounded by Imperial officers and ISB agents. He has no business being here. He is magnificent. At some point during the evening, someone at the gala has a real conversation with him — not about the heist, just a conversation — and Guy has it. Genuinely. Without the gears showing.\n\nRuy is Arend Shen's operative. The team did not know this. The team keeps finding evidence of someone else being here first and doing it slightly wrong. During the museum heist, Ruy appears, with a bag, containing the wrong gem, very pleased with himself. Arend's betrayal falls on Ruy, not the team. The getaway speeder explodes. The team knows immediately whose fault this is.\n\nThrough the smoke and the Wing Guard closing in: Ruy. Running the wrong direction. Waving.\n\nGuy has to decide. The funny answer and the real answer are the same. Whatever he chooses, it costs him something for someone else's sake. That's the arc's emotional turning point, even if Guy insists he had tactical reasons.\n\nThey deliver the Jewel to Kalifa Frey. Frey opens the Dauntless Capitalism's navicomputer. The ship recognises Guy immediately.\n\nWelcome back, ZT-007.\"\nThe ship pulls up the star chart for the Bonadan Bisection.\n\"Awaiting lock-and-key input.\"\nZid looks at the coordinates.\n\"That's the other half.\n\nAct Three: The Run and the Con (Earning It)\n\nGuy runs the Bonadan Bisection again. Stop to stop to stop. The ship knows the way. The memories return — not all at once, not dramatically. A landing pad. Exhaust smell. Someone laughing at something that wasn't that funny. The routine of it.\n\nRuy's voice in the cockpit. Filling the silence. Telling stories to nobody.\n\nAnd Shalor. On the freezing street. The plate of food. The week of meals. The first question Shalor ever asked. The first time something broke in the programming.\n\nGuy sits in the Dauntless Capitalism cockpit after the final stop and does not reboot.\n\nThen: Glare Peak. The prison break. Guy does not plan this like Bex would. He plans it like a con. He talks his way past at least two checkpoints using pure audacity. Something goes hilariously wrong — ideally involving Ruy, if Ruy is available.\n\nIf Shalor is alive: they get him out. When Shalor sees Guy, he doesn't say Guy. He says Zee-Tee. Nobody at the table says anything.\n\nThen: the room. Both syndicates. Goskey. The Crimson Dawn representative. Guy as the middleman — reasonable, charming, slightly annoying in the way Guy Rando is always slightly annoying. He is just here to help everyone walk away happy.\n\nThen: the door opens. Shalor walks in. Post-prison Shalor. Thin. Quiet. Looking like a man who has had a very long time to think.\n\nAnd above: Kalifa Frey's pirates in orbit, announcing themselves in the only way Kalifa Frey announces anything.\n\nAnd outside the room: the team.\n\nBoth syndicates agree. The Shalor rumour was a double-cross — by the other syndicate. The kajidic blames Dawn. Dawn blames the kajidic. The credits transfer to a Bonadan account. Call it a Survivor's Fee.\n\nGuy Rando belongs to nobody. Not through a fight, not through a legal ruling. Through the oldest method available: he made it someone else's problem until it wasn't worth being anyone's problem anymore.\n\nAnd then Shalor looks at Guy and asks him what he's going to do now.\n\nThat question belongs to the player.\nNo prompt. No suggested dialogue. No mechanical resolution.\nJust: what does Guy Rando do now?\nWhatever the answer — funny, sincere, deflecting, surprisingly honest —\nit will be the right answer.\nBecause by that point, the arc will have done its job.\n\nPUBLISHED ADVENTURES\n\nThe Jewel of Yavin (EotE)\n\nThe Jewel of Yavin runs essentially as written, with the following adaptations:\n\nThe team is not Arend Shen's hired crew. They are there independently, working for Kalifa Frey.\n\nRuy Gando is Arend Shen's operative. The team discovers this gradually — they keep finding evidence of someone else running a parallel operation, slightly wrong.\n\nArend's betrayal in Episode III falls on Ruy, not the team. The team is caught in the crossfire.\n\nGuy's specific role: The Cloud City Grand Prix is his moment. The gala infiltration is his showcase. The museum heist has a scene where Guy must deal with a security droid without his usual methods — the first time he treats a droid as something other than a threat.\n\nRuy's role across the three episodes: ambient chaos (Ep. I), appears mid-heist with the wrong gem (Ep. II), runs the wrong direction through the crossfire (Ep. III).\n\nThe Ruy-in-the-crossfire scene is Guy's most important character moment in the whole adventure.\nCreate space for it to be Guy's decision alone — not a group vote, not a tactical discussion.\nGuy decides. Whatever he decides, it costs him something for someone else's sake.\nHe will insist he had tactical reasons. Let him.\n\nRescue at Glare Peak (AoR)\n\nGlare Peak runs mostly as written. The following adaptations apply:\n\nShalor is held in the high-security cellblock. He has been there long enough that the warden barely thinks about him. He is categorised as a long-term criminal with underworld connections — the Empire is still slowly extracting information about Crimson Dawn from him.\n\nGuy does not plan this like a military operation. He plans it like a con. Audacity over force. He talks past at least two checkpoints he has no business getting through.\n\nThe tonal register of the prison break should feel different from Bex's arc — this is Ocean's Eleven, not the Arc Hammer assault.\n\nIf Ruy is available: he is somewhere in this facility for completely unrelated reasons. He is not helpful. He is very glad to see them.\n\nOBLIGATION MECHANICS\n\nIncreases\n\nVisiting any Underworld-dominated location: +5\n\nGuy avoids, deflects, or reboots when confronted with his past: +5\n\nLeaving a syndicate encounter without extracting any useful information: +5\n\nDecreases\n\nSuccessfully questioning a syndicate member or Ruy about the past: –5\n\nLearning the name Dauntless Capitalism and its current location: –10\n\nLearning Shalor's name and his prison location: –10\n\nAcquiring access to the Dauntless Capitalism and its navicomputer: –15\n\nBreaking Shalor out of Glare Peak: –20\n\nRunning the Bonadan Bisection and restoring memory: –20\n\nTriggers — When Guy's Number Comes Up\n\nThe trigger always involves Ruy. The specific flavour depends on the arc stage.\n\nDoubles — Direct Syndicate Action\n\nAlternate between Desilijic kajidic and Crimson Dawn each time doubles are rolled. Each appearance escalates.\n\nFirst doubles (Desilijic): Three of Jabba's people. They try to fit a restraining bolt on Guy. Guy doesn't have a standard port. They are confused. Guy is offended. Mention of the Dauntless Capitalism if questioned.\n\nSecond doubles (Crimson Dawn): A representative, not muscle. They know about Ruy. They mention him by name, watching Guy's face. They want to negotiate. Mention of Shalor: \"We understand he's no longer... available.\"\n\nThird doubles (Both): Both factions arrive simultaneously in the same location, neither knowing the other would be there. Pure farce. Guy runs both conversations. Ruy may or may not be making everything worse. Both factions now know the other is looking. The race accelerates.\n\nFourth doubles (Direct threat): Serious muscle. This is acquisition, not negotiation. The team fights. Whoever they defeat drops something concrete: a prison transfer record, a ship registry, a name. Glare Peak.\n\nArc Beat Triggers\n\nWhen the obligation number comes up AND the moment is dramatically right, deliver one of the following beats instead of a standard trigger:\n\nBeat One: Zid pulls Guy aside. He's been sitting on something. Those numbers Guy was reading out when he got hit by that blaster bolt — Zid ran them. Half a set of coordinates. What does Guy want to do about that?\n\nBeat Two: The Dauntless Capitalism surfaces. Not through investigation — through Ruy, who mentions offhandedly that he saw the most heavily armed freighter he had ever seen on a landing pad somewhere. The team recognises it immediately. Ruy has no idea why everyone is staring at him.\n\nBeat Three: Guy runs the first stop of the Bisection. Just the first one. A flash — a landing pad, exhaust smell, someone laughing at something. Gone before he can hold it. Real, though.\n\nBeat Four: The memory completes. Full Bisection run. Shalor on the freezing street. The plate of food. The week of meals. The questions. The friendship. Guy sits in the Dauntless Capitalism cockpit after the final stop and does not reboot.\n\n100 Obligation Consequence\n\nThe team receives a prison transfer notice — Rebel intelligence intercepts it, or Cracken flags it, or it arrives through a contact. Routine Imperial processing.\n\nPrisoner transfer from Glare Peak.\nTanek Shalor. Deceased.\nTransferred to Imperial records.\n\nNo drama. No villain responsible. No scene to play out. Just a bureaucratic notification that a man the galaxy forgot has been quietly removed from it.\n\nThe con still happens. Guy still earns his freedom. Kalifa Frey's pirates still blow up ships in orbit. The table still laughs.\n\nBut the back door of the meeting room stays empty. And nobody asks Guy what he's going to do now.\n\nWHAT THE TABLE GETS FROM GUY'S ARC\n\nEvery arc plants something in every other player. The player experiencing an arc is playing Star Wars. Every other player is watching it. Guy's arc gives the table something no other arc provides:\n\nLaughter that means something. Every other arc gives the table something heavy to carry. Guy's arc gives them permission to breathe — and then, quietly, catches them off guard.\n\nFor Derek: The Survivor's Fee transferred to Bonadan is the most Guy Rando version of a victory. A man running a serious thriller gets the tonal counterweight he needed.\n\nFor Bylie: Watching Guy go back for Shalor resonates with everything she is fighting for — the right to care about something, to let something matter.\n\nFor Grevi: Guy figuring out who he is without a holocron, without a master, without a lineage — just by deciding — is the lesson Grevi needed about self-determination.\n\nFor Zid: The Bonadan Bisection as a family legacy in miniature. Coordinates instead of a dreadnought. A drug lord instead of a noble house. The same question underneath: what do you do with what someone left you?\n\nFor Bex: Guy's arc is the mirror of her own. Bex asked \"do I have a soul?\" and answered it through sacrifice and war. Guy asked \"do I actually care about anything?\" and answered it through a con and a plate of food on a freezing street. When Guy doesn't reboot — Bex stops being the only droid at the table who knows what she is.\n\nGM NOTES\n\nOn Running Ruy\n\nRuy Gando is a free-use GM asset. He appears whenever the GM needs him to, in whatever form is most inconvenient. He can die because the team left him somewhere they shouldn't have — that's a Ruy death, probably spectacular, definitely avoidable, entirely his own fault. He can show up after the arc ends to congratulate Guy at the worst possible moment. He can return forever. There are no rules.\n\nThe only rule: Ruy never finds out what he did. He never learns Guy named himself after him. He never understands the weight of those cockpit stories. He just keeps being Ruy — talking too loud, timing everything wrong, surviving on pure audacity.\n\nThat is the joke that never stops being funny. And the one that quietly breaks your heart.\n\nOn the Jewel of Yavin Scene That Matters\n\nThe Ruy-in-the-crossfire moment during Episode III of the Jewel of Yavin is the arc's most important character beat before the finale. The GM must create space for it to be Guy's decision, not a group vote. The team can position themselves. The threat can be clear. But the call belongs to Guy.\n\nGuy will insist he had tactical reasons. Let him.\n\nOn the ZT-007 Scene\n\nWhen the team boards the Dauntless Capitalism and the ship says \"Welcome back, ZT-007\" — let the silence sit. Do not rush to the next beat. The table will know what it means. Give them a moment with it.\n\nThen the navicomputer pulls up the Bonadan Bisection. Then Zid says \"That's the other half.\" These three beats should land in sequence, simply, without dramatic amplification. The scene is already everything it needs to be.\n\nOn the Final Question\n\nWhen Shalor asks Guy what he's going to do now — and if the 100 Ob hasn't been triggered and Shalor is in the room — don't fill the silence. Don't offer options. Don't suggest a mood.\n\nJust wait.\n\nWhatever the player says is the right answer.\n\nThe arc's true villain is incompetence.\n\nThe galaxy made a mistake.\n\nGuy corrected it.\n\nAnd sent an invoice to Bonadan."}, "d-zid": {"id": "d-zid", "v": 2, "title": "Zid Hag — The Eye of the Stars", "folder": "Obligation Arcs", "updated": "", "blocks": [{"id": "a3", "t": "h1", "x": "ZID HAG"}, {"id": "a4", "t": "quote", "x": "The Eye of the Stars"}, {"id": "a5", "t": "h3", "x": "Tone"}, {"id": "a6", "t": "p", "x": "A heist film with a family at its heart."}, {"id": "a7", "t": "p", "x": "A man who has been carrying his inheritance his whole life, and never knew it."}, {"id": "a8", "t": "h1", "x": "Background: The Hag Legacy"}, {"id": "a9", "t": "p", "x": "The Hag family were once one of the great Duros houses — not the wealthiest, not the most powerful, but among the most respected. They were builders. Over generations they accumulated ships, loyalty, and a reputation for keeping their word. By the time of the Clone Wars, that reputation was all that remained. The wealth had been spent, the holdings mortgaged, the influence traded away piece by piece to keep the house from collapsing entirely."}, {"id": "a10", "t": "p", "x": "Into this diminished glory came Boliphar Zentron — not a Hag by blood, but a man who loved the family's ideals more than most born into them. He married Avia Hag quietly, without ceremony, and set about trying to save what her family had spent a century losing."}, {"id": "a11", "t": "p", "x": "His plan was bold, meticulous, and almost worked. He hid the family's most valuable remaining asset — a generational dreadnought called the Eye of the Stars, built to carry the Duros people to safety in any catastrophe — in a location so remote and unlikely that no creditor, rival house, or Imperial surveyor would ever think to look. Then he placed his infant son Zid with distant relatives on the outer rim, gave the boy's caretakers a beacon he told them was a family heirloom, and ran."}, {"id": "a12", "t": "p", "x": "He was not running from guilt. He was running from grief, and from whoever might know the truth about the night Avia died."}, {"id": "a13", "t": "h2", "x": "The Night Everything Changed"}, {"id": "a14", "t": "p", "x": "The night Avia died, there was a blaster in a room that should not have had one. The man holding it was Robbton — a young servant loyal to the Hag family to the extreme. Robbton didn't see the hidden ways Boliphar was saving the family - that was the point - so he thought Boliphar was dismantling their generational wealth. He couldn't have been further from the truth."}, {"id": "a15", "t": "p", "x": "Boliphar tried to talk some sense to the hysterical Robbton. Robbton panicked. He hit the trigger. It hit Avia."}, {"id": "a16", "t": "p", "x": "It was an accident. Robbton has carried it ever since."}, {"id": "a17", "t": "p", "x": "Boliphar took his infant son, placed the beacon around the boy's neck — a beacon keyed to the Eye of the Stars, which would one day guide Zid home — and told Robbton to take him to his relatives in the shuttle behind them - where Avia was already headed. Robbton left. Boliphar took Avia’s body to the nearest hospital but it was too late. He never mentioned Robbton. He took the blame himself."}, {"id": "a18", "t": "p", "x": "Boliphar spent the next decade in prison for the murder of Avia. His Zentron connection got him a lean sentence. But Boliphar had been broken ever since. But he survived through the knowledge that Zid - and the Hag legacy - were safe. When he got out, he continued to build the Eye, hiding his work through intermediaries and a mask. He just had to wait for the right moment to restore it."}, {"id": "a19", "t": "p", "x": "It never came. Just as he completed work on the Eye, the Republic became the Empire, and Boliphar - along with the rest of Duro - placed their loyalty firmly behind it. Grand Moff Verelin had already started corrupting his family, and it was a matter of time before they discovered the truth about the Hag legacy. So he became exactly what they wanted him to be: The Zentron Oligarch, best mate to the Empire. Safe in the knowledge somewhere out there, Zid was living his life, and that the Eye was safe."}, {"id": "a20", "t": "p", "x": "Robbton has served the Rebellion faithfully for years since. He has never stopped trying to make it right. He has never told anyone what he did."}, {"id": "a21", "t": "h2", "x": "The Twenty-Year Vigil"}, {"id": "a22", "t": "p", "x": "Boliphar did not disappear. He ran toward a purpose: to keep the Eye of the Stars safe from the Empire, and return it to his son when the time was right. To fund this operation covertly — without revealing his ultimate plan — he worked through an intermediary he trusted completely: his other son, Reti Zentron, from a previous relationship."}, {"id": "a23", "t": "p", "x": "Boliphar Zentron did not simply hide from the galaxy after Avia's death. He hid in plain sight — inside the Empire itself. To protect Zid and the Eye of the Stars, he became Caroth Blaine: masked, human-seeming, the militant right hand of ZenCorp. His own son, Reti Zentron, rose to become ZenCorp's CEO — and never once recognised his own father behind the mask. Reti saw Caroth as an asset who answered utterly and completely to him. He used that asset for the company's dirtiest work. Boliphar, unable to break cover without dooming Zid and the Eye, did it."}, {"id": "a24", "t": "p", "x": "Reti does not see himself as a villain. He is a man who spent a century failing to become a fraction of the legacy he never knew he'd already lost — while the one person who could have told him differently stood beside him the entire time, silent, behind a mask."}, {"id": "a25", "t": "callout", "x": "This is the arc's true engine. Boliphar's disguise did not just protect Zid — it condemned Reti to a father-shaped absence filled by a father who was never truly absent. Every cruelty Reti has ever ordered, Boliphar has had to carry out personally. Let this sit heavily whenever Caroth Blaine appears on-page before the reveal — the horror is retroactive."}, {"id": "a26", "t": "h1", "x": "Key NPCs"}, {"id": "a27", "t": "h2", "x": "Boliphar Zentron — Zid's Father"}, {"id": "a28", "t": "p", "x": "Boliphar is a tall, weathered Duros who looks like a man who has spent two decades carrying something heavy. He is not a soldier. He is not a spy. He is an engineer and a planner who has been running a covert recovery operation on a shoestring, through intermediaries, without anyone knowing what he was actually doing or why. He wears a suit of exquisite armour and a human-looking mask - both to hide his permanent scowl at having to work for the Empire, and the fact that he is a Duros: To avoid the Empire's xenophobia."}, {"id": "a29", "t": "p", "x": "He loved Avia completely. He has never stopped. The shrine at the heart of the Eye of the Stars was his first design decision when he built the ship — before the engines, before the weapons, before the life support. He designed the shrine room first."}, {"id": "a30", "t": "p", "x": "He does not blame Robbton. He never did. He simply could not face the man in the aftermath, and by the time he could have gone back, the distance had become a wall he did not know how to cross."}, {"id": "a31", "t": "p", "x": "When he finally meets Zid — beaten, prisoner, kept alive by Verelin as a biological key — he does not waste time on apologies. He has one thing to say that matters, and he finds the right moment to say it."}, {"id": "a32", "t": "quote", "x": "I'm proud of what you've become, Zid.\"\nA pause. A breath.\n\"I love you, son."}, {"id": "a33", "t": "callout", "x": "Boliphar's Return of the Jedi moment comes aboard the Eye of the Stars, at Avia's shrine.\nHe uses the sonic device Reti planted on him — intending it as a tracker — against Verelin instead.\nHe sustains fatal wounds in the process.\nFather and son stand together before Avia's face.\nThe GM may adapt the final words at the table, but the shape should remain:\nnot an apology, not an explanation — just the truth, finally spoken.\nSimple. Direct. Twenty years overdue."}, {"id": "a34", "t": "h2", "x": "Robbton — The Hag Family Servant"}, {"id": "a35", "t": "p", "x": "Robbton is old. He has always seemed old, in the way that people who have carried grief for a long time seem old before their years. He has served the Rebellion quietly and faithfully for years, doing small useful things — maintaining equipment, keeping records, making himself easy to overlook."}, {"id": "a36", "t": "p", "x": "Zid's player has already met him. To the player, he is a kindly elderly man aboard the Hope, unremarkable and warm. To the GM, he is the arc's most important supporting character — the Snape of this story. He knows what he did. He has never told anyone. And every time he sees Zid, he is deciding whether today is the day."}, {"id": "a37", "t": "p", "x": "His memory is failing in small, specific ways. This is not an excuse — it is a mechanic. Some details of that night he has genuinely lost. Others he has buried so deep he can no longer reliably distinguish them from what he has imagined in the years since. When he finally speaks the truth, it will be incomplete, and it will cost him enormously to give even that."}, {"id": "a38", "t": "callout", "x": "Robbton's memory failures at the table should be played gently, not evasively.\nHe is not hiding — he is struggling. The distinction matters for how Zid receives it.\nThe GM should decide in advance which details Robbton has lost and which he carries clearly.\nThe core fact — he fired the blaster, it was an accident, Boliphar was never to blame — must survive.\nEverything else can be fragmentary.\nIf the 100 Obligation consequence fires, Robbton is taken by Reti before this conversation happens.\nThe direct confession is lost. Zid has to find the truth another way."}, {"id": "a39", "t": "h2", "x": "Reti Zentron — Boliphar's Other Son"}, {"id": "a40", "t": "p", "x": "Reti is polished, successful, and precisely as uncomfortable as a man who has always wanted his father's approval and has never received it. He runs his operation — trading Duros family registries to Grand Moff Verelin — with genuine competence, which makes him more dangerous than a merely venal villain would be."}, {"id": "a41", "t": "p", "x": "He is not cruel by preference. He is ambitious and frightened and has made decisions he cannot unmake. When he finally meets Zid, he is not sure whether to see a brother or a rival. He may not know the difference."}, {"id": "a42", "t": "p", "x": "His betrayal of Boliphar — tipping Verelin to his father's location — is not calculated malice. It is panic. Verelin was pushing for more, the operation was unravelling, and Reti made the calculation that Boliphar was more valuable as a bargaining chip than as a father. He has not fully processed what that means yet."}, {"id": "a43", "t": "p", "x": "What Reti does with the Eye of the Stars — at the moment he boards it and finds his half-brother standing at their mother's shrine — is a choice the scene should make space for. He sees a capital ship. He sees credits, power, leverage. He sees his father's love materialised in steel and corridors and a room built around a woman's face."}, {"id": "a44", "t": "p", "x": "He has never once stood in front of something and felt that it was his in the way that matters."}, {"id": "a45", "t": "callout", "x": "Reti's fate is in Zid's hands. The GM should not push in any direction.\nIf Zid kills him, that is a valid ending. If he lets him go, that too.\nThe interesting question is whether Reti, in that shrine room, finally sees what the Eye actually is.\nWhether he does or not depends on what Zid says — and whether Zid thinks his brother is worth the attempt.\nThe document does not answer this. That is the player's story to write."}, {"id": "a46", "t": "h2", "x": "Grand Moff Serephus Verelin — The Arc's Antagonist"}, {"id": "a47", "t": "p", "x": "Verelin is not invested in the Duros stripping operation because he believes in the Empire's agenda. He is invested because it is personally profitable and he has built his career on profitable arrangements. He is corrupt in the ordinary, unglamorous way — not a fanatic, not a monster with a philosophy, just a man who has always chosen his own comfort over anyone else's."}, {"id": "a48", "t": "p", "x": "He keeps Boliphar alive because a man who designed a ship keyed to his own biology may be needed to open it. This is practical, not merciful."}, {"id": "a49", "t": "p", "x": "His flagship is the Pious Interceptor. His navigation charts for the Rishi Maze are incomplete. His fleet is larger than the Rebel response. He believes this is sufficient. He has never had to fight someone whose allies were born in the Maze."}, {"id": "a50", "t": "h2", "x": "Hondo Ohnaka — Optional Ally"}, {"id": "a51", "t": "p", "x": "Hondo has been running stolen Duros IFF transponders aboard the Obfuscating Belligerent through the Formos lanes for years. He does not know what the transponders mean or where they came from — he bought them cheap and sells them cheaper. He is, as always, cheerfully opportunistic and entirely unashamed of it."}, {"id": "a52", "t": "p", "x": "His role in the finale is unofficial, uninvited, and exactly what the situation requires. He arrives in the Rishi Maze because he heard a Grand Moff was moving a fleet toward something valuable, and Hondo Ohnaka does not miss an auction — even one conducted at gunpoint near a black hole."}, {"id": "a53", "t": "quote", "x": "I am here to help! Also, I am here to discuss compensation.\nThese things are not mutually exclusive."}, {"id": "a54", "t": "p", "x": "His specific contribution: he knows which channel in the Maze runs closest to the black hole's point of no return, because he has used it twice to lose pursuers. That is the channel they use to take Verelin."}, {"id": "a55", "t": "h2", "x": "Avia Hag — In Memory"}, {"id": "a56", "t": "p", "x": "Avia does not appear. She died before the arc begins. She is present in everything anyway — in the beacon Zid has worn his whole life without knowing what it was, in the shrine at the heart of a ship her husband designed for her, in the face that is the first thing Zid sees when the lights come on."}, {"id": "a57", "t": "p", "x": "The GM should never describe Avia directly. Let the shrine do it. Let Boliphar's silences do it. Let the ship itself do it — because a man who builds a dreadnought and puts the shrine before the engines is telling you everything you need to know about who he was building it for."}, {"id": "a58", "t": "h1", "x": "Obligation Mechanics"}, {"id": "a59", "t": "p", "x": "Obligation Type: Family / Lost"}, {"id": "a60", "t": "h2", "x": "Increases"}, {"id": "a61", "t": "table", "x": "", "r": [["Trigger", "Amount"], ["Travelling to any planet not on Zid's current lead", "+5"], ["Leaving a lead unresolved when he had the means to pursue it", "+5"], ["Reti's stripping operation running another cycle — another Duros family displaced (GM announces periodically)", "+5"], ["Drawing attention to himself or the beacon through careless use", "+5"]]}, {"id": "a62", "t": "h2", "x": "Decreases"}, {"id": "a63", "t": "table", "x": "", "r": [["Trigger", "Amount"], ["Uncovering the full five steps of the con from Zob on Mirial", "-5"], ["Tracking the Obfuscating Belligerent to Formos and recruiting Hondo", "-10"], ["Successfully infiltrating the Geonosis stripping station", "-10"], ["Each of the three prizes recovered from Reti's mansion", "-5 each (max -15)"], ["Successfully infiltrating Reti's mansion on Duro", "-10"], ["Hearing Boliphar's twin reveals", "-10"], ["Confronting Robbton and hearing his confession", "-15"], ["Activating the beacon", "-10"], ["Reaching the Eye of the Stars", "-20"], ["Boliphar's death at the shrine", "-10"]]}, {"id": "a64", "t": "h2", "x": "Standard Triggers"}, {"id": "a65", "t": "p", "x": "When Zid's obligation number comes up in the session roll, one of the following triggers fires — one per act, in order:"}, {"id": "a66", "t": "h1", "x": "Act One Trigger — Robbton Surfaces"}, {"id": "a67", "t": "p", "x": "Robbton appears somewhere unexpected aboard the Hope. A corridor, a mess hall, a quiet corner of the hangar. He is doing something small and good. He recognises Zid warmly — perhaps too warmly, with the particular warmth of a man who has been hoping for a chance to make something right and does not know how to begin."}, {"id": "a68", "t": "p", "x": "He does not confess. He asks how Zid is. He mentions the Hag family in passing — just a name, just a reference, as if testing whether Zid knows it. Then he offers to help. With anything. Because this is a man that needs to atone – he just doesn’t let anyone else realise that."}, {"id": "a69", "t": "h2", "x": "Robbton's Report"}, {"id": "a70", "t": "p", "x": "Before Rishi, Zid asked Robbton to look into a rumour: that Duros family ships were being quietly seized and funnelled into Imperial hands. Following Rishi — where Ollund revealed the beacon is a Return-to-Ship signal, tied to a Generational ship not seen in 150 years — Zid seeks Robbton out aboard the Hope to hear what he's found, and to share what he's learned."}, {"id": "a71", "t": "p", "x": "Robbton is eager, visibly pleased to have been trusted with something real."}, {"id": "a72", "t": "quote", "x": "Master Hag! Good, good — I was hoping you'd come find me. You were right to ask. It's real. Ships — Duros family ships — getting quietly folded into Imperial auctions. I don't have the whole shape of it yet, but I've got a name. Zob Anoor. Toydarian scrap dealer, has a shop out on Mirial... There's a name behind it too. Higher up. I haven't got it pinned down — every thread I pull just leads to another shell, another holding company. But it's someone with real reach. Real money."}, {"id": "a73", "t": "p", "x": "If Zid shares the beacon revelation, Robbton has nothing concrete to offer — but throws himself at the question anyway."}, {"id": "a74", "t": "quote", "x": "A beacon. On you. This whole time... I don't know anything about that, Zid, I promise you. But I can ask. I know people — old people, older than me. If there's a story about something out in that Maze, somebody's grandmother told it to somebody once. I'll find who. Let me do this, Zid. Let me actually do something."}, {"id": "a75", "t": "callout", "x": "PLAYER CHOICE\nLeave all three options genuinely open rather than steering: (A) Zid pushes Robbton to dig further into the Zob/ship-stripping thread immediately — this accelerates toward Act One and quietly starts the clock toward Reti noticing him. (B) Zid sits with the beacon privately, unresolved, a character beat rather than a plot beat. (C) Zid chases the Rishi Maze question in parallel, not yet realising it and the Zob thread are the same story. Robbton's Rishi Maze search should never produce anything concrete — let it return only atmosphere and folklore, confirming the mystery is old and real without answering it."}, {"id": "a76", "t": "h3", "x": "Act Two Trigger — The Mad Mynock Signal"}, {"id": "a77", "t": "p", "x": "The Mynock's IFF beacon activates. Somewhere nearby — in the same system, close enough to ping — a ship is broadcasting a signal that should not exist anymore. The Mad Mynock's transponder. Zid's family ship."}, {"id": "a78", "t": "p", "x": "The signal source is the Obfuscating Belligerent. Hondo has the transponder. He does not know what it is."}, {"id": "a79", "t": "p", "x": "This is the bridge to Formos — and to Hondo. If Zid follows it, he finds Hondo. If Hondo is recruited, he gives Zid the Geonosis lead as part of the deal."}, {"id": "a80", "t": "h3", "x": "Act Three Trigger — Boliphar's Voice"}, {"id": "a81", "t": "p", "x": "A short-range transmission, scrambled almost beyond recognition. A Duros voice, older than Zid remembers any voice being, saying a name. His name."}, {"id": "a82", "t": "p", "x": "Boliphar has found a way to reach out. He does not explain where he is or how he found the frequency. He says only that the time is almost right, that Zid should trust the beacon, and that he is sorry it took this long."}, {"id": "a83", "t": "p", "x": "The transmission cuts. The source triangulates to somewhere inside the Rishi Maze."}, {"id": "a84", "t": "h2", "x": "Doubles"}, {"id": "a85", "t": "p", "x": "When doubles are rolled, the following escalating sequence fires:"}, {"id": "a86", "t": "table", "x": "", "r": [["Roll", "Event"], ["First Doubles", "Zid encounters a Duros merchant or traveller who recognises the beacon. They do not know what it does — only that it is old Hag family design, and that people have been asking about it. Who? They do not know. Someone with money. This is the first sign that Reti knows the beacon exists."], ["Second Doubles", "An intermediary of Reti's approaches the team with a business proposition: deliver the beacon to a private address and receive substantial payment. No other details. The address is a dead drop. If the team investigates, it traces back to Duro — to a mansion registered to a holding company Reti uses."], ["Third Doubles", "Reti moves directly. He sends a retrieval team for the beacon — not soldiers, private security, professional and well-briefed. They know about Zid specifically. They know what the beacon looks like. They do not know what it does, but they know Reti wants it."]]}, {"id": "a87", "t": "p", "x": "Each doubles encounter that Zid survives reduces obligation by 5 — he has demonstrated the beacon cannot be easily taken. Each encounter that ends with the team retreating or the beacon at risk increases obligation by 5."}, {"id": "a88", "t": "h2", "x": "100 Obligation Consequence"}, {"id": "a89", "t": "p", "x": "Reti discovers that Robbton served the Hag family. He engineers a false lead — a rumour, carefully seeded through infochant networks, that Avia Hag may have survived, that someone matching her description was seen on a specific world. Robbton hears it. He does not tell anyone. He follows it alone."}, {"id": "a90", "t": "p", "x": "Reti's people take him quietly. They interrogate him about the beacon, about Boliphar, about everything he knows. Robbton gives them nothing useful — he does not know what the beacon does either — but the interrogation is not gentle. When they are done, they leave him somewhere he will not be found quickly."}, {"id": "a91", "t": "p", "x": "Zid finds out what happened. The direct confession is gone. The chance to hear Robbton say the words in a room where both of them can breathe is lost."}, {"id": "a92", "t": "p", "x": "The truth is still findable. It is in records, in the accounts of people who were there that night, in what Boliphar knows and is willing to say. But Robbton's voice — the specific relief of hearing the man who carried it speak it freely — that is gone."}, {"id": "a93", "t": "p", "x": "This cannot be undone. It can only be lived with."}, {"id": "a94", "t": "h1", "x": "Act One: The Ghost Ship"}, {"id": "a95", "t": "p", "x": "The Italian Job opening. Zid has a lead, a target, and no idea how deep it goes. By the end of Act One he will have a clearer picture of what was taken from his family — and a new villain who is not quite what he seems."}, {"id": "a96", "t": "h2", "x": "Mirial — Zob and the Con"}, {"id": "a97", "t": "p", "x": "Zob Anoor is a Toydarian scrap merchant who deals in derelict ships and salvage. He is livid with the Rebellion — he has been trying to sell them ships for months and nobody has returned his calls. He is also, underneath the bluster, genuinely useful: he has recently been offloaded a significant number of derelict vessels that were auctioned by the Empire, and he has been piecing together what the auction actually was."}, {"id": "a98", "t": "p", "x": "The auction was a Duros stripping operation. Someone has been acquiring Duros family ship registries and selling them to the Empire, which then auctions the ships through Zob and others like him. Many Duros family ships — including the Mad Mynock — were in that auction."}, {"id": "a99", "t": "p", "x": "Zob doesn't know who is running the operation. But he can give Zid several threads to pull:"}, {"id": "a100", "t": "p", "x": "The proof of purchase for the hulls, which lists them being “Hull-only”, their IFFs removed. The seller is listed as “ZenCorp Industries”."}, {"id": "a101", "t": "p", "x": "Someone else has been selling the IFFs themselves, in black market dealings. He doesn’t have a location, just a name: Caroth Blaine."}, {"id": "a102", "t": "p", "x": "Caroth Blaine has been a known frequenter of Formos, and a known associate of Bandin Dobah."}, {"id": "a103", "t": "p", "x": "A description of this Caroth Blaine: A masked human, tall, wears gold-metal armour. Zob can show the team a holoimage if they press him."}, {"id": "a104", "t": "callout", "x": "These are the threads that connect the whole operation to Caroth Blaine. It should naturally lead to Formos, but if the team decide to do their own research on Caroth Blaine, they will eventually get to the stripping work on Geonosis.\n\nThey will also discover the Geonosis thread by going to Formos, and they will get this from investigating Caroth Blaine from the man himself."}, {"id": "a104b1", "t": "h2", "x": "Formos — The Man Who Doesn't Need Dobah"}, {"id": "a104b2", "t": "p", "x": "Caroth Blaine doesn't work for Bandin Dobah, and he doesn't need him either. Dobah runs Formos — everyone doing business on the port pays his cut, plays by his terms, answers to him. Except Caroth. Caroth is the supply. The IFF trade that keeps half of Dobah's smuggling economy solvent runs through one masked man who could, at any point, decide Formos isn't worth the trip anymore and take his shipments somewhere else."}, {"id": "a104b3", "t": "p", "x": "Dobah knows it. That's the whole relationship."}, {"id": "a104b4", "t": "p", "x": "So when Caroth's ship sets down — not for tribute, just to deliver — Dobah receives him personally, and it is the only version of Bandin Dobah the team will ever see that isn't performing menace. It's the opposite. It's a man being careful."}, {"id": "a104b5", "t": "callout", "x": "WHY THIS MATTERS\nDobah is the most feared man on Formos. The single most useful thing the team can walk away with isn't a lead — it's having watched Dobah be afraid of somebody else. They don't need to know why yet. They just need to have seen it happen."}, {"id": "a104b6", "t": "h3", "x": "However The Team Comes In"}, {"id": "a104b7", "t": "p", "x": "Loud entry: In the chaos of a firefight, Caroth's people are already moving cargo up the ramp with the calm of men who've done this under worse conditions. Dobah is nowhere near the fighting — he's at the foot of that ramp, trying to finish a conversation before his supplier leaves annoyed."}, {"id": "a104b8", "t": "p", "x": "Posing as buyers or negotiators: Dobah, wanting to look consequential, mentions he has \"a supplier\" to deal with today and asks the team to wait. They're seated close enough to watch him get smaller in real time."}, {"id": "a104b9", "t": "p", "x": "Quiet infiltration: If the team moves quietly through the complex — searching for a crew manifest, a terminal, anything that tells them where people are being kept — they can end up with eyes on something not meant for them. A mid-level smuggler has been selling Caroth's transponders with the registries re-forged, skimming the difference. Dobah caught him, and rather than let it slide, he wants Caroth to see him handle it personally — a show of exactly how seriously he takes the arrangement. There's no trial. Dobah does it himself."}, {"id": "a104b10", "t": "quote", "x": "There. Satisfied?"}, {"id": "a104b11", "t": "p", "x": "Caroth says nothing. He looks at Dobah the way a man looks at something he stepped in. Then he turns toward his ship."}, {"id": "a104b12", "t": "h3", "x": "The Ramp"}, {"id": "a104b13", "t": "p", "x": "Whatever route brings the team into view, the encounter should end on the same beat: Dobah at the foot of the boarding ramp, trying to renegotiate a delivery timeline he has no leverage to change."}, {"id": "a104b14", "t": "quote", "x": "So... we'll get the next shipment from Geonosis in a week?"}, {"id": "a104b15", "t": "p", "x": "Caroth does not turn around, but stops his ascent."}, {"id": "a104b16", "t": "quote", "x": "In a month."}, {"id": "a104b17", "t": "quote", "x": "A month? That would leave a giant gap in our product, how are we supposed to balance the books without that income, I—"}, {"id": "a104b18", "t": "p", "x": "Caroth turns his head to look back at the grovelling man."}, {"id": "a104b19", "t": "quote", "x": "That is not my concern."}, {"id": "a104b20", "t": "quote", "x": "But you're altering our deal!"}, {"id": "a104b21", "t": "quote", "x": "Pray I do not alter it further."}, {"id": "a104b22", "t": "p", "x": "He points a finger at Dobah, then turns and enters his ship as the ramp starts to close. Geonosis is named plainly, from his own mouth — the team does not need to piece the operation's source together from fragments. That ambiguity isn't the point of this scene. The point is watching him and not being able to touch him."}, {"id": "a104b23", "t": "callout", "x": "THE ONE RULE\nThe team does not get a conversation with Caroth Blaine on this visit. If they try to force one — approach him directly, call out, get between him and the door — he is already gone, or surrounded by enough of Dobah's people and his own quiet competence that closing the distance costs them something real. He does not linger to be reached. He came to check on an arrangement, not to be found.\n\nBoliphar has spent twenty years building distance between himself and anyone who might recognise him. He doesn't know Zid is on Formos. If he did, and the mask stayed on anyway, that changes who he is. The team must leave this planet having felt Caroth Blaine as a presence, a reputation, and a name attached to a location — never as a person they spoke to."}, {"id": "a105", "t": "h2", "x": "Formos — The Obfuscating Belligerent"}, {"id": "a106", "t": "p", "x": "This beat is optional but richly rewarding. If Zid follows the IFF transponder thread, or if the Act Two Trigger fires and the Mynock's signal activates near Hondo's ship, the trail leads to Formos — and to Hondo Ohnaka."}, {"id": "a107", "t": "p", "x": "Hondo has purchased the Mad Mynock's IFF transponder through three intermediaries and has no idea of its origin. He is using it to mask the Obfuscating Belligerent's identity during runs. He is, when confronted, entirely unbothered."}, {"id": "a108", "t": "quote", "x": "I bought it legitimately! Mostly legitimately. The paperwork exists.\nI have seen it. It was very convincing paperwork."}, {"id": "a109", "t": "p", "x": "Hondo can be recruited as an ally for the finale if Zid recovers the transponder and offers something in return. He asks for very little — a favour, a future favour, the prospect of being owed something by the Rebellion. He is also, genuinely, interested in whatever is at the centre of this story. A generational dreadnought hidden in the Rishi Maze is exactly the kind of thing Hondo Ohnaka has opinions about."}, {"id": "a110", "t": "callout", "x": "The Formos location intersects with Derek's arc — Rinn Achara is imprisoned here by Bandin Dobah.\nIf both players are present, the team may end up pursuing two objectives simultaneously.\nThis is not a problem. It is exactly the kind of table moment that makes shared arcs feel alive.\nLet the session breathe. Don't force either thread to wait."}, {"id": "
