lion cannot respond in time.\n\nThis cannot be undone. It can only be answered.\n\n100 Obligation — Post-Howzer\n\nGideon finds Howzer. The monastery goes cold. The words were already said.\n\nSee Act Two for full detail. The short version: Gideon took the man. He could not take what the man gave her.\n\nThe Scrambler — Ongoing Mechanic\n\nFrom the Perlemmian Haul until the Howzer meeting, the following applies whenever Bex attempts to attack an Imperial target:\n\nThe GM should spend a Dark Side Destiny Point to trigger the first Despair result.\nChoose the moment with care — maximum witnesses, maximum consequence.\nThe Despair result must happen at least once before Howzer. The table needs to feel the stakes.\nAfter the Howzer meeting, the mechanic ends permanently.\nNot because the scrambler was disabled — but because there is nothing Imperial left in her to restore.\nThe subroutine looked for its anchor and found Bex instead.\nThe cascade dissolves. She picks up her cannon.\n\nRescued Dark Trooper Units — Living Assets\n\nIf Bex rescues or redeems any of the three units during her hunt, they become assets under her control. Each has distinct utility:\n\nIf Bex saves none of them — makes the hard call every time — she walks into the Arc Hammer alone. That is also a statement. Both paths are valid. Both are completely Bex.\n\nArc Timeline Reference\n\nThey still think of you as a droid.\n\nLet them."}, "d-bylie": {"id": "d-bylie", "v": 2, "title": "Bylethia Ford — Wrath", "folder": "Obligation Arcs", "updated": "", "blocks": [{"id": "a3", "t": "h1", "x": "BYLETHIA FORD"}, {"id": "a4", "t": "quote", "x": "Wrath"}, {"id": "a5", "t": "p", "x": "Strength • Sacrifice • Renewal • Wrath"}, {"id": "a6", "t": "h1", "x": "WHO SHE IS"}, {"id": "a7", "t": "p", "x": "Bylethia Ford goes by Bylie. She is twenty-one years old, Dathomirian by birth, raised on Esseles by an adoptive mother she believed was a Republic bureaucrat. When Taria Damsin disappeared without explanation, Bylie was left with nothing — no money, no goodbye, no understanding of why. Thrown from a privileged life into the streets of a Core World city, she learned to survive, connected with the Force on her own terms, and eventually found her way to the Rebellion."}, {"id": "a8", "t": "p", "x": "She knows she is Force-sensitive. She knows she is from Dathomir. She does not know what she truly is, who her birth family were, or why her mother really left. She can feel, distantly, that Taria is alive somewhere — but whenever she pushes on that sense too hard, something interferes. She has blamed her own lack of training. She is wrong."}, {"id": "a9", "t": "p", "x": "She carries a name her mother never used — Wrath — that she found written in Taria’s handwriting once, on a scrap of paper Taria quickly took away. She has never forgotten it. She does not yet know it is the name the Nardithi Cluster gave her bloodline centuries before she was born."}, {"id": "a10", "t": "quote", "x": "She told me my name was Bylethia. She told me Dathomir was gone. She told me we were safe. She told me a lot of things."}, {"id": "a11", "t": "p", "x": "— Bylie"}, {"id": "a12", "t": "h1", "x": "THE HIDDEN HISTORY"}, {"id": "a13", "t": "h2", "x": "The Nardithi Cluster"}, {"id": "a14", "t": "p", "x": "Hundreds of years ago, a splinter clan of Nightsisters on Dathomir discovered a massive stone formation buried deep underground — a cluster of hexagonal grey spikes, irregularly shaped, roughly six metres across and three metres high at the centre, glowing with a soft eerie light. The Nightsisters who found it became the Nardithi: a death cult built around the power the formation promised."}, {"id": "a15", "t": "p", "x": "They learned that the cluster amplifies Force power in those strong enough to channel through it — but it drains the living Force from everything nearby, damaging or killing the surrounding life. When beings die near it, the cluster absorbs their Force essence. The most powerful sacrifice of all is a healer: someone born with the gift of healing fed into the cluster creates a Force convergence — death for one, renewal for all. The sick healed. The dying saved. Perhaps even the dead returned."}, {"id": "a16", "t": "h2", "x": "The Four Pillars"}, {"id": "a17", "t": "p", "x": "The Nardithi cult was built on three pillars: Strength, Sacrifice, and Renewal. The fourth was added later, after the crash of the Oteroan Sky — the ritual death of tens of thousands that the Nardithi orchestrated to supercharge the cluster. The ship’s violent impact killed the cult almost entirely, shattered two shards from the main formation, and filled the cluster with centuries of rage and grief. The cluster named its new fourth pillar after what it became in that moment."}, {"id": "a18", "t": "p", "x": "Wrath."}, {"id": "a19", "t": "p", "x": "Bylie is a direct descendant of the single Nardithi survivor of the crash — a woman who saved one shard, faked her own death, and integrated into another Dathomir clan under a false identity. The shard became a family heirloom. Its meaning was forgotten. Its taboo was not. Bylie’s clan has protected it for generations without knowing why — and named one child in every generation “Wrath” without knowing that either."}, {"id": "a20", "t": "h2", "x": "The Three Mothers"}, {"id": "a21", "t": "p", "x": "The Three Mothers are not living beings. They are the combined consciousness of the Nardithi cult members who died in the ritual, absorbed into the cluster. They speak as three voices representing the original pillars: Strength, Sacrifice, Renewal. They have no bodies, no physical reach into the world. What they have is patience, and a direct line into the bloodline of the one woman who carries their resonance."}, {"id": "a22", "t": "p", "x": "They want Bylie to come to the cluster so she can be sacrificed into it — a healer of her power fed into the formation would create a Force convergence strong enough to resurrect the cult and the Mothers themselves. They have been steering her toward this end with patience measured in centuries. They do not hate her. They need her."}, {"id": "a23", "t": "p", "x": "THE SUPPRESSION The Mothers actively suppress Bylie's healing power to prevent her from understanding what she is. Whenever she reaches for it and finds nothing, they are pressing her hand gently back down. As her obligation rises and their influence grows, her healing degrades. As she pulls free of them, it returns."}, {"id": "a24", "t": "h1", "x": "TARIA DAMSIN"}, {"id": "a25", "t": "p", "x": "Taria Damsin was a Jedi Master and Shadow — the Jedi Order’s specialists in finding and neutralising dark side artefacts. A contemporary and former lover of Obi-Wan Kenobi, she contracted Borotavi Syndrome on a mission to Pamina Prime and spent years refusing to let it slow her down. After the Battle of Lanteeb left her syndrome out of remission, the Jedi Council grounded her. Kenobi estimated she had weeks to live. She refused to die in a medbay."}, {"id": "a26", "t": "p", "x": "She left the Order. She spent her remaining time helping people on her own terms, moving through the Outer Rim, following her conscience rather than the Council’s direction. Eventually, a shard of the Nardithi Cluster — in the possession of the Dresk family on Toydaria — gave her a Force vision. She believed it was the Force guiding her. It was the Three Mothers, who wanted Bylie found and kept within reach."}, {"id": "a27", "t": "h2", "x": "Dathomir"}, {"id": "a28", "t": "p", "x": "She arrived on Dathomir. As a Jedi Shadow, she immediately sensed the clan crystal — the Nardithi heirloom passed down through Bylie’s bloodline — and went for it first, attempting to destroy it. She could not. The most she could do was splinter a small fragment from it. The attempt awakened the two-year-old Jerserra, nearby and already Force-sensitive, who went to confront the stranger. Taria — her judgment clouded by the shard’s influence bleeding through the splinter in her hands — defended herself against a toddler. Easily. Brutally. She left Jerserra gasping on the ground and fled."}, {"id": "a29", "t": "p", "x": "She then encountered Bylie, also two years old. Contact with Bylie healed her Borotavi Syndrome completely and instantaneously. In that moment, the cluster’s visions flooded through Taria: she saw what Bylie truly was, what the Three Mothers intended for her, and how close the clan already was to offering her up. She took Bylie and left Dathomir without asking, carrying a toddler she had no idea how to raise and a splinter she had no idea how to destroy."}, {"id": "a30", "t": "p", "x": "THE WOUND SHE LEFT Taria’s attack on young Jerserra was not who she was. She knew it, even then. The shard’s influence bled through into her judgment in that moment and she acted against every instinct she had. She never forgave herself for it. She will apologise for it, one day, to a woman who will not accept it."}, {"id": "a31", "t": "h2", "x": "Esseles"}, {"id": "a32", "t": "p", "x": "She settled on Esseles. She raised Bylie, called her by a Republic name, never spoke of Dathomir. She studied the splinter, failed to destroy it, wrote everything down — all of Bylie’s heritage, all of the Nardithi history, the truth about the cluster and the cult and the Four Pillars — in a hidden stash beneath the floorboards of their apartment, waiting for the right moment to tell Bylie everything. That moment never came."}, {"id": "a33", "t": "p", "x": "When she eventually left Esseles, she did two things: she Force-implanted a directive into Bylie’s childhood friend Fenatha Osei, instructing her never to reveal the hidden stash to anyone — keeping it safe until Taria returned. And she went to Tatooine to find Obi-Wan Kenobi."}, {"id": "a34", "t": "h2", "x": "Tatooine & Malachor"}, {"id": "a35", "t": "p", "x": "On Tatooine, Taria gave Kenobi a holodisc — her full message to Bylie, explaining everything. She asked him to get it to her if she never came back. She then left for Malachor, chasing a Force trace of Ahsoka Tano. She found the ruins of an ancient Sith temple and a vergence she couldn’t explain — the wound left by the World Between Worlds. As she stood at the centre of it, Mother Mordane arrived."}, {"id": "a36", "t": "p", "x": "Mordane tried first to turn her. When Taria began asking too many personal questions about Jerserra, Mordane decided she was too dangerous to leave alive. They fought. Taria won, wounding Mordane severely — but Mordane, retreating to her ship, destroyed Taria’s vessel before leaving the planet. Taria has been stranded on Malachor ever since."}, {"id": "a37", "t": "p", "x": "She is still there. Alive — sustained far longer than the Borotavi Syndrome should allow by the healing gift Bylie’s touch imparted to her years ago, a gift that has been slowly keeping the disease at bay. She doesn’t know this. Neither does Bylie."}, {"id": "a38", "t": "p", "x": "KENOBI'S PROMISE Obi-Wan Kenobi kept the holodisc safe for nineteen years, fully intending to deliver it. He never found the right moment. He died on the Death Star. The disc is in his abandoned hovel on Tatooine — waiting for someone who doesn't know it exists."}, {"id": "a39", "t": "h3", "x": "Malachor"}, {"id": "a40", "t": "p", "x": "Bylie arrives expecting a rescue. What she finds is something stranger and more devastating than she prepared for."}, {"id": "a41", "t": "p", "x": "Taria Damsin is alive. Still herself — lucid, present, green-haired and beautiful — just with fungi growing out of her skin. After years stranded on a lifeless planet, sustained by Bylie's residual healing gift but with no food, no shelter, no company, she descended into Malachor's crust looking for anything that could keep her alive. She found a fungal colony growing at the very depths of the rock — the only living thing on the planet — and began to eat it. As she did, she realised it was sentient. She built a Force connection with it. In time, she became part of the colony. It kept her alive. It keeps her alive still."}, {"id": "a42", "t": "p", "x": "She cannot leave. The symbiosis is too deep, too fundamental. Separating from the colony would kill her as surely as the Borotavi Syndrome would have, twenty years ago on Lanteeb. Taria has had years to make peace with this. She is not suffering. She is somewhere, finally, after a lifetime of moving. That peace may be the hardest thing Bylie has ever had to accept."}, {"id": "a43", "t": "p", "x": "But it is not the end, and it is not a false reunion."}, {"id": "a44", "t": "p", "x": "The fungi have heard Taria's plight. They understand what her daughter's arrival means. And they choose — at enormous cost, an act of genuine sacrifice from a sentient being most of the galaxy doesn't know exists — to fracture a small piece of themselves. Taria has grown this piece inside a shard of Malachor's Force temple, carved from the ruins where the World Between Worlds once brushed against reality. She holds it out to Bylie: a small, living thing, warm to the touch, faintly luminous."}, {"id": "a45", "t": "p", "x": "Bylie can take the colony with her. Whenever she wishes to speak to her mother, she need only commune with the fungi — and Taria will be there. Not a message. Not a recording. A presence. The fungi don't relay words so much as feeling — Taria as she actually is, the way you feel someone sitting beside you in the dark."}, {"id": "a46", "t": "p", "x": "Her mother is alive. She can never leave. But she is not gone."}, {"id": "a47", "t": "h3", "x": "The Shadow Over Malachor"}, {"id": "a48", "t": "p", "x": "If the team has not stopped Operation Sentinel before Cypher discovers Malachor, a new and personal threat emerges."}, {"id": "a49", "t": "p", "x": "Cypher doesn't know about Taria. He doesn't know about the fungi. He knows — because he is methodical and brilliant and has spent years studying the splinter — that Force vergences produce exactly the kind of energy his weapon requires. And Malachor is sitting on an extraordinary reservoir. The wound left by the World Between Worlds has been slowly filling with Force energy for years. To Cypher it is a power source. To Bylie it is her mother's life support."}, {"id": "a50", "t": "p", "x": "If the Sentinel drains Malachor, the fungal colony loses the vergence that sustains them. They begin to die. The small piece Bylie carries will begin to go quiet. The connection will fade. And Taria — sustained all these years by the colony's bond with the planet — will not survive its loss."}, {"id": "a51", "t": "p", "x": "Bylie will feel it happening in real time. Not a report. Not a warning. Just her mother going slowly silent in her pocket while she is standing somewhere else entirely."}, {"id": "a52", "t": "p", "x": "This is the Sentinel's threat made personal. It is not an abstract weapon destroying a planet she has never visited. It is Cypher killing her mother without even knowing she exists — with the same calm efficiency he applies to everything. It gives Bylie a reason to stop him that has nothing to do with the Rebellion and everything to do with the small warm thing she is carrying, and the woman on the other end of it."}, {"id": "a53", "t": "h1", "x": "JERSERRA"}, {"id": "a54", "t": "p", "x": "Jerserra grew up a Nightsister on Dathomir, Force-sensitive from birth, hungry for power before she had words for what power meant. At two years old she witnessed a dying stranger try to destroy her clan’s sacred crystal and steal a child. She went to confront that stranger. The stranger — a Jedi Master — left her gasping on the ground without breaking stride."}, {"id": "a55", "t": "p", "x": "The crystal spoke to her for the first time in that moment. It found her at her most vulnerable and whispered: you are not weak. You are untrained. Every terrible thing Jerserra has done since is downstream of that whisper, and the choice she made to believe it."}, {"id": "a56", "t": "h2", "x": "Mother Mordane"}, {"id": "a57", "t": "p", "x": "A female Inquisitor — who demanded her pupils call her Mother — arrived on Dathomir some years later, drawn by Jerserra’s Force signature. She took Jerserra as a secret apprentice, keeping her hidden from the Inquisitorius. She had other apprentices. One of them, elevated to full Inquisitor before Jerserra’s training even began, was Cypher. Jerserra did not know about Cypher. Cypher did not know about Jerserra. Both of them called the same woman Mother."}, {"id": "a58", "t": "p", "x": "Before leaving Dathomir, Jerserra stole her clan’s shard of the Nardithi Cluster — Bylie’s inheritance, the heirloom of her bloodline — and took it with her. The Three Mothers were furious. The shard tolerates Jerserra. It does not recognise her. She can feel the difference and cannot understand it, and that gap is what drives her obsession with finding the cluster itself."}, {"id": "a59", "t": "h2", "x": "The Killing"}, {"id": "a60", "t": "p", "x": "When Mother Mordane returned from Malachor — wounded by Taria, barely alive — Jerserra saw clearly for the first time: even her Master was too weak. She Force-pulled Mordane’s lightsaber from her wounded hand, ignited it, and looked at her Master’s horrified face in the crimson light."}, {"id": "a61", "t": "quote", "x": "Even you are too weak. All this training, all this fear: it was for nothing. I will harness my own fear, my own power — and I will defeat her."}, {"id": "a62", "t": "p", "x": "— Jerserra"}, {"id": "a63", "t": "p", "x": "She took the crystal and the lightsaber and ran. She has been building her own empire of power ever since — a criminal network, a trail of bodies, years of dark side use warping her further with every passing month."}, {"id": "a64", "t": "p", "x": "JERSERRA & BYLIE Jerserra does not know Bylie exists. She will discover her at the worst possible moment — when she sees the party rescuing Walisi. Something about Bylie will stop her cold. The cluster’s resonance in someone else’s blood. That is when it dawns on her. And Jerserra, who has never shared anything, will not share this."}, {"id": "a65", "t": "h1", "x": "CYPHER'S THREAD"}, {"id": "a66", "t": "h2", "x": "The Crystal Hierarchy"}, {"id": "a67", "t": "p", "x": "Three levels of the Nardithi formation exist in the galaxy at campaign start:"}, {"id": "a68", "t": "p", "x": "The Cluster: the whole formation, buried deep in the ruins of the Oteroan Sky on Dathomir. Neither Cypher nor Jerserra knows it exists yet."}, {"id": "a69", "t": "p", "x": "The Shards: two fragments broken from the cluster during the crash. One is with Jerserra. One is embedded in Tragic Hope, in the possession of Yeel Dresk."}, {"id": "a70", "t": "p", "x": "The Splinter: a tiny fragment carved from Jerserra’s shard by Taria when she tried to destroy the crystal on Dathomir. Taken from Taria by Mother Mordane on Malachor. Found by Cypher when he investigated Mordane’s death."}, {"id": "a71", "t": "h2", "x": "What Cypher Knows"}, {"id": "a72", "t": "p", "x": "Cypher found the splinter on Mordane’s body and began to study it. He understands it as a dark side amplifier — which it is, partially — but he does not know it feeds on living Force. He thinks it consumes dark side energy because that is the only kind he can perceive. His weapon, the Sentinel, is built around this misunderstanding: brilliant in design, fundamentally broken in execution, burning through the splinter’s power faster than he can replenish it. He needs more crystal."}, {"id": "a73", "t": "p", "x": "He also knows Jerserra exists. She killed his Mother. He has been hunting her ever since — and the ISB relay on Scarif is partly his: built to monitor all traffic mentioning a Dathomirian woman with a lightsaber. Bylie trips that wire. He mistakes her for Jerserra and begins pursuing her into the main campaign."}, {"id": "a74", "t": "h2", "x": "What Cypher Discovers"}, {"id": "a75", "t": "p", "x": "On Dxun, Cypher sees Bylie in person and realises immediately that she is not Jerserra. But something else pulls at him: the bloodline resonance in her Force presence, the sense that something older than her is using her as a conduit. He follows the thread. In time, he discovers the Nardithi Cluster itself — the whole formation, buried on Dathomir. And he realises what it could mean for the Sentinel."}, {"id": "a76", "t": "p", "x": "THE RACE Once Cypher discovers the cluster, both he and Jerserra are hunting it — and so is the party. Whoever reaches the ruins of the Oteroan Sky first determines what happens next. Cypher wants it as a weapon. Jerserra wants it as a birthright. The Three Mothers want Bylie to bring it to them. The party will have to decide what they want."}, {"id": "a77", "t": "h1", "x": "THE ENDGAME"}, {"id": "a78", "t": "p", "x": "The arc culminates in a three-way collision between Cypher, Jerserra, and the party — at or near the Nardithi Cluster on Dathomir. The team will face a choice no briefing prepared them for:"}, {"id": "a79", "t": "p", "x": "Help Cypher: rational, constrained by institutional loyalty, potentially bargainable. Has a weapon capable of destroying planets. Has a plan."}, {"id": "a80", "t": "p", "x": "Help Jerserra: pure hunger, no constraints, no reasoning with her. Has the shard and decades of dark side corruption. Is completely beyond negotiation."}, {"id": "a81", "t": "p", "x": "Help neither: watch two catastrophic forces collide and manage the wreckage. One of them will win."}, {"id": "a82", "t": "p", "x": "Bylie has a fourth option that nobody else can access. She is the bloodline. The cluster recognises her. What she does with that recognition is the question her entire arc has been building toward."}, {"id": "a83", "t": "h2", "x": "Light Side Ending"}, {"id": "a84", "t": "p", "x": "Bylie sacrifices her connection to the cluster’s power — denying it to everyone, including herself. The convergence collapses. The Three Mothers are silenced. It costs her something she can never recover. It saves everyone else."}, {"id": "a85", "t": "h2", "x": "Dark Side Ending"}, {"id": "a86", "t": "p", "x": "Bylie accepts the sacrifice the Mothers always wanted. Not death — merger. She becomes the cluster’s vessel. The resurrection of the Nardithi through her body. Unimaginable power. The end of Bylethia Ford. The return of Wrath."}, {"id": "a87", "t": "h2", "x": "The Weight of What She Carries"}, {"id": "a88", "t": "p", "x": "What Bylie knows when she faces the final confrontation depends entirely on the choices she has made across the arc."}, {"id": "a89", "t": "p", "x": "If she does not have the fungal colony — if she never reached Malachor, or if the colony was lost — she enters the endgame without her mother's counsel. She will have to read the situation as it unfolds, make judgement calls about a power she doesn't fully understand, and choose without knowing what her choices truly cost. Grevi may sense something of what is happening through the Force, but the depth of what the cluster is and what Bylie can do to it may remain opaque. The light side path exists — but she will have to find it blind."}, {"id": "a90", "t": "p", "x": "If she has the fungal colony, her mother is in the room with her."}, {"id": "a91", "t": "p", "x": "Taria has had years on Malachor to think about the cluster, the cult, the Four Pillars, and the truth she spent too long keeping from her daughter. She tells Bylie everything — not the history, Bylie already knows the history — but what it means. What the sacrifice truly costs. What each choice opens and closes. And then she tells her the thing the Nardithi Cult built their entire sacrificial tradition to prevent anyone from knowing."}, {"id": "a92", "t": "p", "x": "The cult was afraid of healers. They didn't just want them because of their power. They wanted them neutralised. Because they knew — they always knew — that nothing in the galaxy can actually destroy the Nardithi Cluster. Nothing except a healer of Bylie's bloodline."}, {"id": "a93", "t": "p", "x": "The sacrificial ritual was never purely about power. It was a cage. Feed the healers into the cluster and they believe their gift is meant to sustain it — they never learn it was always capable of destroying it. The Three Mothers have been running the same strategy on Bylie her whole life, steering her toward the cluster, keeping her focused on what she could give rather than what she could take. The moment Taria speaks this truth aloud, the Mothers' strategy collapses. They will know it the instant it happens. Whatever patience they have maintained will end."}, {"id": "a94", "t": "p", "x": "This gives Bylie a third option she did not know she had. Not merger. Not sacrifice in the Nardithi sense. Destruction — clean, final, at real personal cost, but survivable. The light side path is no longer about giving herself to the cluster. It is about ending it."}, {"id": "a95", "t": "p", "x": "The dark side path remains. The Mothers will offer it the moment they feel their plan unravelling — more urgently than before, more desperately. Merger, power, resurrection. Everything they promised, delivered now, before she can choose otherwise."}, {"id": "a96", "t": "p", "x": "And Bylie, standing in the ruins of the Oteroan Sky with her mother's voice in her hands and two catastrophic forces waiting for her decision, will choose who she is."}, {"id": "a97", "t": "h1", "x": "OBLIGATION MECHANICS"}, {"id": "a98", "t": "h2", "x": "Obligation Increases"}, {"id": "a99", "t": "p", "x": "The following situations increase Bylie’s obligation. They represent the timer running — Taria weakening, antagonists advancing, the window closing."}, {"id": "a100", "t": "table", "x": "", "r": [["Full session passes with no action on an active arc lead", "+5"], ["Bylie acts on the Three Mothers’ whispers or accepts their comfort", "+5"], ["Bylie is publicly identified as Dathomirian by an Imperial asset or enemy", "+5"], ["Bylie witnesses a preventable death and does not attempt to use her healing", "+5"], ["Jerserra’s network gains new intelligence on Bylie’s whereabouts (GM discretion)", "+5"]]}, {"id": "a101", "t": "h2", "x": "Obligation Decreases"}, {"id": "a102", "t": "p", "x": "These represent Bylie pulling free of the Mothers’ influence and actively moving toward the truth."}, {"id": "a103", "t": "table", "x": "", "r": [["Bylie actively pursues an arc lead during a session", "−5"], ["Bylie successfully heals someone at meaningful personal risk", "−5"], ["Bylie resists the Three Mothers at a genuine moment of temptation", "−10"], ["Bylie retrieves the holodisc from Tatooine", "−15"], ["Bylie retrieves the stash from Esseles", "−20"], ["Bylie reaches Taria on Malachor", "−30"]]}, {"id": "a104", "t": "h2", "x": "Healing Degradation"}, {"id": "a105", "t": "p", "x": "As obligation rises, Bylie’s healing power degrades. The Mothers are tightening their grip. This is applied silently by the GM — Bylie has no explanation for what is happening to her."}, {"id": "a106", "t": "table", "x": "", "r": [["Obligation 1–49", "Healing functions normally. No penalties."], ["Obligation 50–74", "Add one Setback die to all healing checks. Bylie cannot account for it."], ["Obligation 75–99", "Healing fails entirely. No rolls. The Three Mothers are very loud now."], ["Obligation 100", "Taria dies. See: The Hundred."]]}, {"id": "a107", "t": "h2", "x": "Story Beats"}, {"id": "a108", "t": "p", "x": "When Bylie’s obligation comes up on the session-start roll, the GM injects a narrative beat. The appropriate beat is determined by her current obligation level."}, {"id": "a109", "t": "h3", "x": "BEAT 1 — THE FIRST CONTACT (OB 1–25)"}, {"id": "a110", "t": "p", "x": "General Cracken pulls Bylie aside — quietly, personally. Someone on Esseles has been casting a wide net through infochant networks looking for a “Bylie Ford.” Not a bounty. Not a threat. He ran checks. It’s clean. He doesn’t know who it is or what they want, but he thought she should know. The friend has started looking."}, {"id": "a111", "t": "h3", "x": "BEAT 2 — THE MESSAGE (OB 26–49)"}, {"id": "a112", "t": "p", "x": "The friend’s search has finally reached Bylie directly — routed through old contacts until it found her. The message is warm but nervous. She found something in the old apartment. Something hidden. She doesn’t understand it but she found a word written in Taria’s hand — Nardithi — and it frightened her. She wants Bylie to come to Esseles. Something is waiting."}, {"id": "a113", "t": "h3", "x": "BEAT 3 — THE WARNING (OB 50–74)"}, {"id": "a114", "t": "p", "x": "Fenny contacts Bylie again, more urgently. The new owners of the apartment have noticed her interest in the floorboards. Questions are being asked — not Imperial yet, but the kind that find their way to Imperial ears. Fenny is scared. She needs Bylie to come soon. Meanwhile Bylie’s healing has begun to fail in ways she cannot explain. The window is closing."}, {"id": "a115", "t": "h3", "x": "BEAT 4 — SILENCE (OB 75–99)"}, {"id": "a116", "t": "p", "x": "Fenny goes quiet. No messages. No responses. Three weeks of nothing. Bylie doesn’t know if she’s been taken, if she’s run, or if she’s simply given up. Her healing is gone entirely. The Three Mothers are easier to hear than they have ever been. She may be running out of time."}, {"id": "a117", "t": "h2", "x": "Doubles — Critical Escalation"}, {"id": "a118", "t": "p", "x": "When doubles are rolled on the obligation dice, one of the following fires based on how many times doubles have previously occurred."}, {"id": "a119", "t": "h3", "x": "FIRST DOUBLES — THE UNWILLING MIRACLE"}, {"id": "a120", "t": "p", "x": "Bylie’s healing activates without her consent — publicly, visibly, in front of people she cannot control. She saves someone or something she didn’t intend to. Witnesses. Questions. Something goes into an Imperial database somewhere with her description attached to it. The Mothers did not mean for this to happen. Or perhaps they did."}, {"id": "a121", "t": "h3", "x": "SECOND DOUBLES — JERSERRA’S EYE"}, {"id": "a122", "t": "p", "x": "Jerserra’s network — broad, patient, always watching for unusual women from Dathomir — flags Bylie. An agent spots her, doesn’t approach, reports back. Jerserra now knows Bylie exists. She doesn’t yet know why she matters. But she is curious. And Jerserra’s curiosity is dangerous."}, {"id": "a123", "t": "h3", "x": "THIRD DOUBLES — THE DESPERATE MESSAGE"}, {"id": "a124", "t": "p", "x": "Fenny surfaces. One message, scrambled, clearly sent in a hurry. An address on Esseles. A time. “Come now. Come alone. I can’t hold this much longer.” Whether the team can respond in time is entirely up to them."}, {"id": "a125", "t": "h1", "x": "THE HUNDRED"}, {"id": "a126", "t": "p", "x": "If Bylie reaches 100 Obligation, Taria Damsin dies on Malachor. The Borotavi Syndrome, held at bay for years by the residual gift of Bylie’s healing touch, finally wins. Taria dies alone on a dead planet, having never been found."}, {"id": "a127", "t": "p", "x": "Bylie feels it through the Force. Not a vision. Not a voice. Just a part of herself going quiet — the part that always knew, somewhere, that her mother was out there. She will feel like something in her is dying too. Because something is."}, {"id": "a128", "t": "p", "x": "The Three Mothers do not celebrate. They simply become clearer. They have been waiting for this for a very long time, and they are patient. Bylie, grieving and unmoored, will find them easier to hear than she ever has before. They will not push. They will simply be there, warm and constant, offering the only comfort available."}, {"id": "a129", "t": "p", "x": "Mechanically, Bylie’s talent Will of the Three Mothers evolves permanently into Chant of the Three Mothers, granting her new and significant bonuses — but she can no longer use her healing power at all. Not until she resolves the Nardithi Cluster arc. The gift Taria carried out of Dathomir has returned to where it came from."}, {"id": "a130", "t": "p", "x": "IF THIS HAPPENS The stash on Esseles still exists. The holodisc on Tatooine still exists. Bylie can still learn the truth about who she is and who her mother was. But the reunion she was moving toward is gone. What she does with that grief — and with the Mothers waiting patiently at the edge of her awareness — is now entirely her choice."}, {"id": "a131", "t": "h1", "x": "ARC ROAD MAP"}, {"id": "a132", "t": "p", "x": "The following is a loose sequence of the major arc beats. Timing is at GM discretion and should be woven against the main campaign."}, {"id": "a133", "t": "h3", "x": "THE VISIONS BEGIN"}, {"id": "a134", "t": "p", "x": "Early in the campaign, Bylie starts feeling the Three Mothers as instinct — emotional surges, moments of inexplicable power, hunches she can’t account for. She doesn’t know what they are. Her healing works. For now."}, {"id": "a135", "t": "h3", "x": "CRACKEN’S MESSAGE"}, {"id": "a136", "t": "p", "x": "General Cracken contacts Bylie. Someone on Esseles has been trying to find her. It might lead to her mother. Story Beat 1 fires."}, {"id": "a137", "t": "h3", "x": "SCARIF & CYPHER"}, {"id": "a138", "t": "p", "x": "The ISB relay on Scarif flags Bylie as a person of interest. Cypher begins watching her, believing she is Jerserra. She starts to feel observed in the Force without knowing why."}, {"id": "a139", "t": "h3", "x": "DXUN"}, {"id": "a140", "t": "p", "x": "Cypher sees Bylie in person and realises his mistake. The Force bridge created by his machine lets the Three Mothers reach Bylie more directly than ever before — their first clear contact. Cypher, for his part, begins following a new thread entirely."}, {"id": "a141", "t": "h3", "x": "THE QUI-GON MOMENT"}, {"id": "a142", "t": "p", "x": "At Bylie’s lowest point — on the verge of death, everything falling apart around her — the world goes briefly quiet. Qui-Gon Jinn appears: luminous, calm, brief. He delivers one instruction."}, {"id": "a143", "t": "quote", "x": "Go to Tatooine. Find the hovel that belonged to Ben Kenobi, the old Jedi Master who trained Luke Skywalker. There, you will find a way to your mother."}, {"id": "a144", "t": "p", "x": "Then he is gone and the noise comes back. Bylie has a reason to stand up."}, {"id": "a145", "t": "h3", "x": "ESSELES"}, {"id": "a146", "t": "p", "x": "Bylie returns to a home that no longer belongs to her. She has to get inside, past the people who live there now, to reach what is hidden beneath the floorboards. When she finds it — Taria’s handwriting, her real name, the full history of the Nardithi — everything she thought she knew restructures itself. This is the hardest version of the truth to receive because it was written with love, not urgency. Taria was waiting for the right moment. The right moment never came."}, {"id": "a147", "t": "h3", "x": "TATOOINE"}, {"id": "a148", "t": "p", "x": "A small, dangerous mission into Imperial-controlled territory. An abandoned hovel. A holodisc with a name on it that has been sitting there for years, kept safe by a dead man’s promise. Bylie plays it. Taria’s face. Taria’s voice. Not the history — just: I had to go. I’m sorry. I love you. Here is where I am. After everything Bylie learned on Esseles, this lands differently. The player decides how."}, {"id": "a149", "t": "h3", "x": "FENNY"}, {"id": "a150", "t": "p", "x": "Whether through Story Beats or the Third Doubles, Fenny Osei becomes a real presence in the arc — a civilian caught in the gravity of something much bigger than her, pulling on Bylie’s attention with increasing desperation. She is not a hero. She is loyal, and quietly brave, and she has been carrying something she was never supposed to carry alone."}, {"id": "a151", "t": "h3", "x": "MALACHOR"}, {"id": "a152", "t": "p", "x": "Finding a way to Malachor. Getting there. What Taria’s condition is after years on a dead planet sustained by a gift she doesn’t know she has. The reunion. And what Bylie says when she finally sees her mother’s face."}, {"id": "a153", "t": "h3", "x": "JERSERRA"}, {"id": "a154", "t": "p", "x": "The confrontation. Mordane’s two apprentices, in the same room, with the cluster between them. Taria’s apology. Jerserra’s refusal. Cypher arriving to complicate everything. The team choosing a side — or not."}, {"id": "a155", "t": "h3", "x": "THE CHOICE"}, {"id": "a156", "t": "p", "x": "Bylethia Ford or Wrath. Sacrifice or merger. The end of the arc is the beginning of whoever she decides to be."}, {"id": "a157", "t": "h1", "x": "KEY FIGURES"}, {"id": "a158", "t": "h2", "x": "Taria Damsin"}, {"id": "a159", "t": "p", "x": "Jedi Master and Shadow. Former lover of Obi-Wan Kenobi. Dying of Borotavi Syndrome when she found Bylie on Dathomir. Healed by Bylie’s touch. Currently stranded on Malachor, alive longer than she should be, sustained by a gift she doesn’t know she carries. Bylie’s mother in every sense that matters."}, {"id": "a160", "t": "h2", "x": "Fenatha “Fenny” Osei"}, {"id": "a161", "t": "p", "x": "Bylie’s childhood friend on Esseles. Warm, ordinary, loyal. Taria Force-implanted a directive into her — never reveal the stash to anyone — that held for years until Taria’s grip on the Force began to weaken on Malachor. Now Fenny can’t stop thinking about what’s under those floorboards, and she has been widening her search for Bylie across infochant networks for months. She is the Jimmy of this arc: the civilian whose persistence drives the plot forward."}, {"id": "a162", "t": "h2", "x": "Jerserra"}, {"id": "a163", "t": "p", "x": "Nightsister. Daughter of Dathomir. Holder of one shard of the Nardithi Cluster, stolen from Bylie’s bloodline. Trained in secret by Mother Mordane, whom she killed. Has been hunting power — and Taria — ever since. Does not yet know Bylie exists. Will not share what she discovers when she finds out."}, {"id": "a164", "t": "h2", "x": "Mother Mordane"}, {"id": "a165", "t": "p", "x": "The Inquisitor who demanded her pupils call her Mother. Trained both Cypher and Jerserra in secret, keeping each hidden from the other. Survived Jerserra’s killing blow but was finished by the syndrome her wounds accelerated. Left the splinter in Cypher’s hands without meaning to. A twisted mirror of Taria: both women who shaped Bylie’s life without ever meeting her."}, {"id": "a166", "t": "h2", "x": "Cypher"}, {"id": "a167", "t": "p", "x": "Mother Mordane’s other apprentice. Full Inquisitor, now ISB agent, architect of Operation Sentinel. Built his superweapon around a misunderstanding of the Nardithi Cluster’s true nature. Hunting Jerserra for killing his Mother. Hunting the cluster once he discovers it exists. The most dangerous man in this arc precisely because he is rational."}, {"id": "a168", "t": "h2", "x": "The Three Mothers"}, {"id": "a169", "t": "p", "x": "The absorbed consciousness of the Nardithi cult. Three voices: Strength, Sacrifice, Renewal. Patient beyond human comprehension. They do not want Bylie dead. They want her to come to the cluster willingly. They have been whispering to her since before she knew what whispering was."}, {"id": "a170", "t": "p", "x": "Ghost in the Projector • Bylethia Ford • GM Reference Only"}], "body": "BYLETHIA FORD\n\nWrath\n\nStrength • Sacrifice • Renewal • Wrath\n\nWHO SHE IS\n\nBylethia Ford goes by Bylie. She is twenty-one years old, Dathomirian by birth, raised on Esseles by an adoptive mother she believed was a Republic bureaucrat. When Taria Damsin disappeared without explanation, Bylie was left with nothing — no money, no goodbye, no understanding of why. Thrown from a privileged life into the streets of a Core World city, she learned to survive, connected with the Force on her own terms, and eventually found her way to the Rebellion.\n\nShe knows she is Force-sensitive. She knows she is from Dathomir. She does not know what she truly is, who her birth family were, or why her mother really left. She can feel, distantly, that Taria is alive somewhere — but whenever she pushes on that sense too hard, something interferes. She has blamed her own lack of training. She is wrong.\n\nShe carries a name her mother never used — Wrath — that she found written in Taria’s handwriting once, on a scrap of paper Taria quickly took away. She has never forgotten it. She does not yet know it is the name the Nardithi Cluster gave her bloodline centuries before she was born.\n\nShe told me my name was Bylethia. She told me Dathomir was gone. She told me we were safe. She told me a lot of things.\n\n— Bylie\n\nTHE HIDDEN HISTORY\n\nThe Nardithi Cluster\n\nHundreds of years ago, a splinter clan of Nightsisters on Dathomir discovered a massive stone formation buried deep underground — a cluster of hexagonal grey spikes, irregularly shaped, roughly six metres across and three metres high at the centre, glowing with a soft eerie light. The Nightsisters who found it became the Nardithi: a death cult built around the power the formation promised.\n\nThey learned that the cluster amplifies Force power in those strong enough to channel through it — but it drains the living Force from everything nearby, damaging or killing the surrounding life. When beings die near it, the cluster absorbs their Force essence. The most powerful sacrifice of all is a healer: someone born with the gift of healing fed into the cluster creates a Force convergence — death for one, renewal for all. The sick healed. The dying saved. Perhaps even the dead returned.\n\nThe Four Pillars\n\nThe Nardithi cult was built on three pillars: Strength, Sacrifice, and Renewal. The fourth was added later, after the crash of the Oteroan Sky — the ritual death of tens of thousands that the Nardithi orchestrated to supercharge the cluster. The ship’s violent impact killed the cult almost entirely, shattered two shards from the main formation, and filled the cluster with centuries of rage and grief. The cluster named its new fourth pillar after what it became in that moment.\n\nWrath.\n\nBylie is a direct descendant of the single Nardithi survivor of the crash — a woman who saved one shard, faked her own death, and integrated into another Dathomir clan under a false identity. The shard became a family heirloom. Its meaning was forgotten. Its taboo was not. Bylie’s clan has protected it for generations without knowing why — and named one child in every generation “Wrath” without knowing that either.\n\nThe Three Mothers\n\nThe Three Mothers are not living beings. They are the combined consciousness of the Nardithi cult members who died in the ritual, absorbed into the cluster. They speak as three voices representing the original pillars: Strength, Sacrifice, Renewal. They have no bodies, no physical reach into the world. What they have is patience, and a direct line into the bloodline of the one woman who carries their resonance.\n\nThey want Bylie to come to the cluster so she can be sacrificed into it — a healer of her power fed into the formation would create a Force convergence strong enough to resurrect the cult and the Mothers themselves. They have been steering her toward this end with patience measured in centuries. They do not hate her. They need her.\n\nTHE SUPPRESSION The Mothers actively suppress Bylie's healing power to prevent her from understanding what she is. Whenever she reaches for it and finds nothing, they are pressing her hand gently back down. As her obligation rises and their influence grows, her healing degrades. As she pulls free of them, it returns.\n\nTARIA DAMSIN\n\nTaria Damsin was a Jedi Master and Shadow — the Jedi Order’s specialists in finding and neutralising dark side artefacts. A contemporary and former lover of Obi-Wan Kenobi, she contracted Borotavi Syndrome on a mission to Pamina Prime and spent years refusing to let it slow her down. After the Battle of Lanteeb left her syndrome out of remission, the Jedi Council grounded her. Kenobi estimated she had weeks to live. She refused to die in a medbay.\n\nShe left the Order. She spent her remaining time helping people on her own terms, moving through the Outer Rim, following her conscience rather than the Council’s direction. Eventually, a shard of the Nardithi Cluster — in the possession of the Dresk family on Toydaria — gave her a Force vision. She believed it was the Force guiding her. It was the Three Mothers, who wanted Bylie found and kept within reach.\n\nDathomir\n\nShe arrived on Dathomir. As a Jedi Shadow, she immediately sensed the clan crystal — the Nardithi heirloom passed down through Bylie’s bloodline — and went for it first, attempting to destroy it. She could not. The most she could do was splinter a small fragment from it. The attempt awakened the two-year-old Jerserra, nearby and already Force-sensitive, who went to confront the stranger. Taria — her judgment clouded by the shard’s influence bleeding through the splinter in her hands — defended herself against a toddler. Easily. Brutally. She left Jerserra gasping on the ground and fled.\n\nShe then encountered Bylie, also two years old. Contact with Bylie healed her Borotavi Syndrome completely and instantaneously. In that moment, the cluster’s visions flooded through Taria: she saw what Bylie truly was, what the Three Mothers intended for her, and how close the clan already was to offering her up. She took Bylie and left Dathomir without asking, carrying a toddler she had no idea how to raise and a splinter she had no idea how to destroy.\n\nTHE WOUND SHE LEFT Taria’s attack on young Jerserra was not who she was. She knew it, even then. The shard’s influence bled through into her judgment in that moment and she acted against every instinct she had. She never forgave herself for it. She will apologise for it, one day, to a woman who will not accept it.\n\nEsseles\n\nShe settled on Esseles. She raised Bylie, called her by a Republic name, never spoke of Dathomir. She studied the splinter, failed to destroy it, wrote everything down — all of Bylie’s heritage, all of the Nardithi history, the truth about the cluster and the cult and the Four Pillars — in a hidden stash beneath the floorboards of their apartment, waiting for the right moment to tell Bylie everything. That moment never came.\n\nWhen she eventually left Esseles, she did two things: she Force-implanted a directive into Bylie’s childhood friend Fenatha Osei, instructing her never to reveal the hidden stash to anyone — keeping it safe until Taria returned. And she went to Tatooine to find Obi-Wan Kenobi.\n\nTatooine & Malachor\n\nOn Tatooine, Taria gave Kenobi a holodisc — her full message to Bylie, explaining everything. She asked him to get it to her if she never came back. She then left for Malachor, chasing a Force trace of Ahsoka Tano. She found the ruins of an ancient Sith temple and a vergence she couldn’t explain — the wound left by the World Between Worlds. As she stood at the centre of it, Mother Mordane arrived.\n\nMordane tried first to turn her. When Taria began asking too many personal questions about Jerserra, Mordane decided she was too dangerous to leave alive. They fought. Taria won, wounding Mordane severely — but Mordane, retreating to her ship, destroyed Taria’s vessel before leaving the planet. Taria has been stranded on Malachor ever since.\n\nShe is still there. Alive — sustained far longer than the Borotavi Syndrome should allow by the healing gift Bylie’s touch imparted to her years ago, a gift that has been slowly keeping the disease at bay. She doesn’t know this. Neither does Bylie.\n\nKENOBI'S PROMISE Obi-Wan Kenobi kept the holodisc safe for nineteen years, fully intending to deliver it. He never found the right moment. He died on the Death Star. The disc is in his abandoned hovel on Tatooine — waiting for someone who doesn't know it exists.\n\nMalachor\n\nBylie arrives expecting a rescue. What she finds is something stranger and more devastating than she prepared for.\n\nTaria Damsin is alive. Still herself — lucid, present, green-haired and beautiful — just with fungi growing out of her skin. After years stranded on a lifeless planet, sustained by Bylie's residual healing gift but with no food, no shelter, no company, she descended into Malachor's crust looking for anything that could keep her alive. She found a fungal colony growing at the very depths of the rock — the only living thing on the planet — and began to eat it. As she did, she realised it was sentient. She built a Force connection with it. In time, she became part of the colony. It kept her alive. It keeps her alive still.\n\nShe cannot leave. The symbiosis is too deep, too fundamental. Separating from the colony would kill her as surely as the Borotavi Syndrome would have, twenty years ago on Lanteeb. Taria has had years to make peace with this. She is not suffering. She is somewhere, finally, after a lifetime of moving. That peace may be the hardest thing Bylie has ever had to accept.\n\nBut it is not the end, and it is not a false reunion.\n\nThe fungi have heard Taria's plight. They understand what her daughter's arrival means. And they choose — at enormous cost, an act of genuine sacrifice from a sentient being most of the galaxy doesn't know exists — to fracture a small piece of themselves. Taria has grown this piece inside a shard of Malachor's Force temple, carved from the ruins where the World Between Worlds once brushed against reality. She holds it out to Bylie: a small, living thing, warm to the touch, faintly luminous.\n\nBylie can take the colony with her. Whenever she wishes to speak to her mother, she need only commune with the fungi — and Taria will be there. Not a message. Not a recording. A presence. The fungi don't relay words so much as feeling — Taria as she actually is, the way you feel someone sitting beside you in the dark.\n\nHer mother is alive. She can never leave. But she is not gone.\n\nThe Shadow Over Malachor\n\nIf the team has not stopped Operation Sentinel before Cypher discovers Malachor, a new and personal threat emerges.\n\nCypher doesn't know about Taria. He doesn't know about the fungi. He knows — because he is methodical and brilliant and has spent years studying the splinter — that Force vergences produce exactly the kind of energy his weapon requires. And Malachor is sitting on an extraordinary reservoir. The wound left by the World Between Worlds has been slowly filling with Force energy for years. To Cypher it is a power source. To Bylie it is her mother's life support.\n\nIf the Sentinel drains Malachor, the fungal colony loses the vergence that sustains them. They begin to die. The small piece Bylie carries will begin to go quiet. The connection will fade. And Taria — sustained all these years by the colony's bond with the planet — will not survive its loss.\n\nBylie will feel it happening in real time. Not a report. Not a warning. Just her mother going slowly silent in her pocket while she is standing somewhere else entirely.\n\nThis is the Sentinel's threat made personal. It is not an abstract weapon destroying a planet she has never visited. It is Cypher killing her mother without even knowing she exists — with the same calm efficiency he applies to everything. It gives Bylie a reason to stop him that has nothing to do with the Rebellion and everything to do with the small warm thing she is carrying, and the woman on the other end of it.\n\nJERSERRA\n\nJerserra grew up a Nightsister on Dathomir, Force-sensitive from birth, hungry for power before she had words for what power meant. At two years old she witnessed a dying stranger try to destroy her clan’s sacred crystal and steal a child. She went to confront that stranger. The stranger — a Jedi Master — left her gasping on the ground without breaking stride.\n\nThe crystal spoke to her for the first time in that moment. It found her at her most vulnerable and whispered: you are not weak. You are untrained. Every terrible thing Jerserra has done since is downstream of that whisper, and the choice she made to believe it.\n\nMother Mordane\n\nA female Inquisitor — who demanded her pupils call her Mother — arrived on Dathomir some years later, drawn by Jerserra’s Force signature. She took Jerserra as a secret apprentice, keeping her hidden from the Inquisitorius. She had other apprentices. One of them, elevated to full Inquisitor before Jerserra’s training even began, was Cypher. Jerserra did not know about Cypher. Cypher did not know about Jerserra. Both of them called the same woman Mother.\n\nBefore leaving Dathomir, Jerserra stole her clan’s shard of the Nardithi Cluster — Bylie’s inheritance, the heirloom of her bloodline — and took it with her. The Three Mothers were furious. The shard tolerates Jerserra. It does not recognise her. She can feel the difference and cannot understand it, and that gap is what drives her obsession with finding the cluster itself.\n\nThe Killing\n\nWhen Mother Mordane returned from Malachor — wounded by Taria, barely alive — Jerserra saw clearly for the first time: even her Master was too weak. She Force-pulled Mordane’s lightsaber from her wounded hand, ignited it, and looked at her Master’s horrified face in the crimson light.\n\nEven you are too weak. All this training, all this fear: it was for nothing. I will harness my own fear, my own power — and I will defeat her.\n\n— Jerserra\n\nShe took the crystal and the lightsaber and ran. She has been building her own empire of power ever since — a criminal network, a trail of bodies, years of dark side use warping her further with every passing month.\n\nJERSERRA & BYLIE Jerserra does not know Bylie exists. She will discover her at the worst possible moment — when she sees the party rescuing Walisi. Something about Bylie will stop her cold. The cluster’s resonance in someone else’s blood. That is when it dawns on her. And Jerserra, who has never shared anything, will not share this.\n\nCYPHER'S THREAD\n\nThe Crystal Hierarchy\n\nThree levels of the Nardithi formation exist in the galaxy at campaign start:\n\nThe Cluster: the whole formation, buried deep in the ruins of the Oteroan Sky on Dathomir. Neither Cypher nor Jerserra knows it exists yet.\n\nThe Shards: two fragments broken from the cluster during the crash. One is with Jerserra. One is embedded in Tragic Hope, in the possession of Yeel Dresk.\n\nThe Splinter: a tiny fragment carved from Jerserra’s shard by Taria when she tried to destroy the crystal on Dathomir. Taken from Taria by Mother Mordane on Malachor. Found by Cypher when he investigated Mordane’s death.\n\nWhat Cypher Knows\n\nCypher found the splinter on Mordane’s body and began to study it. He understands it as a dark side amplifier — which it is, partially — but he does not know it feeds on living Force. He thinks it consumes dark side energy because that is the only kind he can perceive. His weapon, the Sentinel, is built around this misunderstanding: brilliant in design, fundamentally broken in execution, burning through the splinter’s power faster than he can replenish it. He needs more crystal.\n\nHe also knows Jerserra exists. She killed his Mother. He has been hunting her ever since — and the ISB relay on Scarif is partly his: built to monitor all traffic mentioning a Dathomirian woman with a lightsaber. Bylie trips that wire. He mistakes her for Jerserra and begins pursuing her into the main campaign.\n\nWhat Cypher Discovers\n\nOn Dxun, Cypher sees Bylie in person and realises immediately that she is not Jerserra. But something else pulls at him: the bloodline resonance in her Force presence, the sense that something older than her is using her as a conduit. He follows the thread. In time, he discovers the Nardithi Cluster itself — the whole formation, buried on Dathomir. And he realises what it could mean for the Sentinel.\n\nTHE RACE Once Cypher discovers the cluster, both he and Jerserra are hunting it — and so is the party. Whoever reaches the ruins of the Oteroan Sky first determines what happens next. Cypher wants it as a weapon. Jerserra wants it as a birthright. The Three Mothers want Bylie to bring it to them. The party will have to decide what they want.\n\nTHE ENDGAME\n\nThe arc culminates in a three-way collision between Cypher, Jerserra, and the party — at or near the Nardithi Cluster on Dathomir. The team will face a choice no briefing prepared them for:\n\nHelp Cypher: rational, constrained by institutional loyalty, potentially bargainable. Has a weapon capable of destroying planets. Has a plan.\n\nHelp Jerserra: pure hunger, no constraints, no reasoning with her. Has the shard and decades of dark side corruption. Is completely beyond negotiation.\n\nHelp neither: watch two catastrophic forces collide and manage the wreckage. One of them will win.\n\nBylie has a fourth option that nobody else can access. She is the bloodline. The cluster recognises her. What she does with that recognition is the question her entire arc has been building toward.\n\nLight Side Ending\n\nBylie sacrifices her connection to the cluster’s power — denying it to everyone, including herself. The convergence collapses. The Three Mothers are silenced. It costs her something she can never recover. It saves everyone else.\n\nDark Side Ending\n\nBylie accepts the sacrifice the Mothers always wanted. Not death — merger. She becomes the cluster’s vessel. The resurrection of the Nardithi through her body. Unimaginable power. The end of Bylethia Ford. The return of Wrath.\n\nThe Weight of What She Carries\n\nWhat Bylie knows when she faces the final confrontation depends entirely on the choices she has made across the arc.\n\nIf she does not have the fungal colony — if she never reached Malachor, or if the colony was lost — she enters the endgame without her mother's counsel. She will have to read the situation as it unfolds, make judgement calls about a power she doesn't fully understand, and choose without knowing what her choices truly cost. Grevi may sense something of what is happening through the Force, but the depth of what the cluster is and what Bylie can do to it may remain opaque. The light side path exists — but she will have to find it blind.\n\nIf she has the fungal colony, her mother is in the room with her.\n\nTaria has had years on Malachor to think about the cluster, the cult, the Four Pillars, and the truth she spent too long keeping from her daughter. She tells Bylie everything — not the history, Bylie already knows the history — but what it means. What the sacrifice truly costs. What each choice opens and closes. And then she tells her the thing the Nardithi Cult built their entire sacrificial tradition to prevent anyone from knowing.\n\nThe cult was afraid of healers. They didn't just want them because of their power. They wanted them neutralised. Because they knew — they always knew — that nothing in the galaxy can actually destroy the Nardithi Cluster. Nothing except a healer of Bylie's bloodline.\n\nThe sacrificial ritual was never purely about power. It was a cage. Feed the healers into the cluster and they believe their gift is meant to sustain it — they never learn it was always capable of destroying it. The Three Mothers have been running the same strategy on Bylie her whole life, steering her toward the cluster, keeping her focused on what she could give rather than what she could take. The moment Taria speaks this truth aloud, the Mothers' strategy collapses. They will know it the instant it happens. Whatever patience they have maintained will end.\n\nThis gives Bylie a third option she did not know she had. Not merger. Not sacrifice in the Nardithi sense. Destruction — clean, final, at real personal cost, but survivable. The light side path is no longer about giving herself to the cluster. It is about ending it.\n\nThe dark side path remains. The Mothers will offer it the moment they feel their plan unravelling — more urgently than before, more desperately. Merger, power, resurrection. Everything they promised, delivered now, before she can choose otherwise.\n\nAnd Bylie, standing in the ruins of the Oteroan Sky with her mother's voice in her hands and two catastrophic forces waiting for her decision, will choose who she is.\n\nOBLIGATION MECHANICS\n\nObligation Increases\n\nThe following situations increase Bylie’s obligation. They represent the timer running — Taria weakening, antagonists advancing, the window closing.\n\nObligation Decreases\n\nThese represent Bylie pulling free of the Mothers’ influence and actively moving toward the truth.\n\nHealing Degradation\n\nAs obligation rises, Bylie’s healing power degrades. The Mothers are tightening their grip. This is applied silently by the GM — Bylie has no explanation for what is happening to her.\n\nStory Beats\n\nWhen Bylie’s obligation comes up on the session-start roll, the GM injects a narrative beat. The appropriate beat is determined by her current obligation level.\n\nBEAT 1 — THE FIRST CONTACT (OB 1–25)\n\nGeneral Cracken pulls Bylie aside — quietly, personally. Someone on Esseles has been casting a wide net through infochant networks looking for a “Bylie Ford.” Not a bounty. Not a threat. He ran checks. It’s clean. He doesn’t know who it is or what they want, but he thought she should know. The friend has started looking.\n\nBEAT 2 — THE MESSAGE (OB 26–49)\n\nThe friend’s search has finally reached Bylie directly — routed through old contacts until it found her. The message is warm but nervous. She found something in the old apartment. Something hidden. She doesn’t understand it but she found a word written in Taria’s hand — Nardithi — and it frightened her. She wants Bylie to come to Esseles. Something is waiting.\n\nBEAT 3 — THE WARNING (OB 50–74)\n\nFenny contacts Bylie again, more urgently. The new owners of the apartment have noticed her interest in the floorboards. Questions are being asked — not Imperial yet, but the kind that find their way to Imperial ears. Fenny is scared. She needs Bylie to come soon. Meanwhile Bylie’s healing has begun to fail in ways she cannot explain. The window is closing.\n\nBEAT 4 — SILENCE (OB 75–99)\n\nFenny goes quiet. No messages. No responses. Three weeks of nothing. Bylie doesn’t know if she’s been taken, if she’s run, or if she’s simply given up. Her healing is gone entirely. The Three Mothers are easier to hear than they have ever been. She may be running out of time.\n\nDoubles — Critical Escalation\n\nWhen doubles are rolled on the obligation dice, one of the following fires based on how many times doubles have previously occurred.\n\nFIRST DOUBLES — THE UNWILLING MIRACLE\n\nBylie’s healing activates without her consent — publicly, visibly, in front of people she cannot control. She saves someone or something she didn’t intend to. Witnesses. Questions. Something goes into an Imperial database somewhere with her description attached to it. The Mothers did not mean for this to happen. Or perhaps they did.\n\nSECOND DOUBLES — JERSERRA’S EYE\n\nJerserra’s network — broad, patient, always watching for unusual women from Dathomir — flags Bylie. An agent spots her, doesn’t approach, reports back. Jerserra now knows Bylie exists. She doesn’t yet know why she matters. But she is curious. And Jerserra’s curiosity is dangerous.\n\nTHIRD DOUBLES — THE DESPERATE MESSAGE\n\nFenny surfaces. One message, scrambled, clearly sent in a hurry. An address on Esseles. A time. “Come now. Come alone. I can’t hold this much longer.” Whether the team can respond in time is entirely up to them.\n\nTHE HUNDRED\n\nIf Bylie reaches 100 Obligation, Taria Damsin dies on Malachor. The Borotavi Syndrome, held at bay for years by the residual gift of Bylie’s healing touch, finally wins. Taria dies alone on a dead planet, having never been found.\n\nBylie feels it through the Force. Not a vision. Not a voice. Just a part of herself going quiet — the part that always knew, somewhere, that her mother was out there. She will feel like something in her is dying too. Because something is.\n\nThe Three Mothers do not celebrate. They simply become clearer. They have been waiting for this for a very long time, and they are patient. Bylie, grieving and unmoored, will find them easier to hear than she ever has before. They will not push. They will simply be there, warm and constant, offering the only comfort available.\n\nMechanically, Bylie’s talent Will of the Three Mothers evolves permanently into Chant of the Three Mothers, granting her new and significant bonuses — but she can no longer use her healing power at all. Not until she resolves the Nardithi Cluster arc. The gift Taria carried out of Dathomir has returned to where it came from.\n\nIF THIS HAPPENS The stash on Esseles still exists. The holodisc on Tatooine still exists. Bylie can still learn the truth about who she is and who her mother was. But the reunion she was moving toward is gone. What she does with that grief — and with the Mothers waiting patiently at the edge of her awareness — is now entirely her choice.\n\nARC ROAD MAP\n\nThe following is a loose sequence of the major arc beats. Timing is at GM discretion and should be woven against the main campaign.\n\nTHE VISIONS BEGIN\n\nEarly in the campaign, Bylie starts feeling the Three Mothers as instinct — emotional surges, moments of inexplicable power, hunches she can’t account for. She doesn’t know what they are. Her healing works. For now.\n\nCRACKEN’S MESSAGE\n\nGeneral Cracken contacts Bylie. Someone on Esseles has been trying to find her. It might lead to her mother. Story Beat 1 fires.\n\nSCARIF & CYPHER\n\nThe ISB relay on Scarif flags Bylie as a person of interest. Cypher begins watching her, believing she is Jerserra. She starts to feel observed in the Force without knowing why.\n\nDXUN\n\nCypher sees Bylie in person and realises his mistake. The Force bridge created by his machine lets the Three Mothers reach Bylie more directly than ever before — their first clear contact. Cypher, for his part, begins following a new thread entirely.\n\nTHE QUI-GON MOMENT\n\nAt Bylie’s lowest point — on the verge of death, everything falling apart around her — the world goes briefly quiet. Qui-Gon Jinn appears: luminous, calm, brief. He delivers one instruction.\n\nGo to Tatooine. Find the hovel that belonged to Ben Kenobi, the old Jedi Master who trained Luke Skywalker. There, you will find a way to your mother.\n\nThen he is gone and the noise comes back. Bylie has a reason to stand up.\n\nESSELES\n\nBylie returns to a home that no longer belongs to her. She has to get inside, past the people who live there now, to reach what is hidden beneath the floorboards. When she finds it — Taria’s handwriting, her real name, the full history of the Nardithi — everything she thought she knew restructures itself. This is the hardest version of the truth to receive because it was written with love, not urgency. Taria was waiting for the right moment. The right moment never came.\n\nTATOOINE\n\nA small, dangerous mission into Imperial-controlled territory. An abandoned hovel. A holodisc with a name on it that has been sitting there for years, kept safe by a dead man’s promise. Bylie plays it. Taria’s face. Taria’s voice. Not the history — just: I had to go. I’m sorry. I love you. Here is where I am. After everything Bylie learned on Esseles, this lands differently. The player decides how.\n\nFENNY\n\nWhether through Story Beats or the Third Doubles, Fenny Osei becomes a real presence in the arc — a civilian caught in the gravity of something much bigger than her, pulling on Bylie’s attention with increasing desperation. She is not a hero. She is loyal, and quietly brave, and she has been carrying something she was never supposed to carry alone.\n\nMALACHOR\n\nFinding a way to Malachor. Getting there. What Taria’s condition is after years on a dead planet sustained by a gift she doesn’t know she has. The reunion. And what Bylie says when she finally sees her mother’s face.\n\nJERSERRA\n\nThe confrontation. Mordane’s two apprentices, in the same room, with the cluster between them. Taria’s apology. Jerserra’s refusal. Cypher arriving to complicate everything. The team choosing a side — or not.\n\nTHE CHOICE\n\nBylethia Ford or Wrath. Sacrifice or merger. The end of the arc is the beginning of whoever she decides to be.\n\nKEY FIGURES\n\nTaria Damsin\n\nJedi Master and Shadow. Former lover of Obi-Wan Kenobi. Dying of Borotavi Syndrome when she found Bylie on Dathomir. Healed by Bylie’s touch. Currently stranded on Malachor, alive longer than she should be, sustained by a gift she doesn’t know she carries. Bylie’s mother in every sense that matters.\n\nFenatha “Fenny” Osei\n\nBylie’s childhood friend on Esseles. Warm, ordinary, loyal. Taria Force-implanted a directive into her — never reveal the stash to anyone — that held for years until Taria’s grip on the Force began to weaken on Malachor. Now Fenny can’t stop thinking about what’s under those floorboards, and she has been widening her search for Bylie across infochant networks for months. She is the Jimmy of this arc: the civilian whose persistence drives the plot forward.\n\nJerserra\n\nNightsister. Daughter of Dathomir. Holder of one shard of the Nardithi Cluster, stolen from Bylie’s bloodline. Trained in secret by Mother Mordane, whom she killed. Has been hunting power — and Taria — ever since. Does not yet know Bylie exists. Will not share what she discovers when she finds out.\n\nMother Mordane\n\nThe Inquisitor who demanded her pupils call her Mother. Trained both Cypher and Jerserra in secret, keeping each hidden from the other. Survived Jerserra’s killing blow but was finished by the syndrome her wounds accelerated. Left the splinter in Cypher’s hands without meaning to. A twisted mirror of Taria: both women who shaped Bylie’s life without ever meeting her.\n\nCypher\n\nMother Mordane’s other apprentice. Full Inquisitor, now ISB agent, architect of Operation Sentinel. Built his superweapon around a misunderstanding of the Nardithi Cluster’s true nature. Hunting Jerserra for killing his Mother. Hunting the cluster once he discovers it exists. The most dangerous man in this arc precisely because he is rational.\n\nThe Three Mothers\n\nThe absorbed consciousness of the Nardithi cult. Three voices: Strength, Sacrifice, Renewal. Patient beyond human comprehension. They do not want Bylie dead. They want her to come to the cluster willingly. They have been whispering to her since before she knew what whispering was.\n\nGhost in the Projector • Bylethia Ford • GM Reference Only"}, "d-derek": {"id": "d-derek", "v": 2, "title": "Derek Caabesk — The Alderaan 12", "folder": "Obligation Arcs", "updated": "", "blocks": [{"id": "a2", "t": "h3", "x": "Obligation Arc: Derek Caabesk"}, {"id": "a3", "t": "h1", "x": "THE ALDERAAN 12"}, {"id": "a4", "t": "p", "x": "A Reference Document for the Game Master"}, {"id": "a5", "t": "h1", "x": "BACKGROUND"}, {"id": "a6", "t": "p", "x": "For the Game Master's eyes only."}, {"id": "a7", "t": "p", "x": "In the final months of the Galactic Senate, Bail Organa was building a case against Moff Praji, overseer of the Alderaan sector — a man who had quietly advanced his career through an underhanded deal with a well-connected fixer known as Ardyth Canvi. The deal itself was almost trivially mundane: Praji paid Canvi to remove a political obstacle, Canvi delivered, and Praji got his sector. What Praji didn't know — or chose not to investigate — was that Ardyth Canvi was an alias of Luthen Rael, one of the founding architects of the Rebel Alliance."}, {"id": "a8", "t": "p", "x": "Bail documented everything. Not to destroy Praji outright, but to own him — to have a pressure point that could bring a powerful Imperial official quietly into line, or at worst, neutralise him politically. He entrusted the evidence — a single hard drive containing authenticated communications, annotated in Bail's own hand — to Senne Olarr, the senior diplomat on a delegation of twelve travelling to meet him on Alderaan. He told her only that it was insurance. That she would know when to use it."}, {"id": "a9", "t": "p", "x": "The following week, Alderaan was destroyed."}, {"id": "a10", "t": "p", "x": "Praji panicked. He assumed Bail had everything — a full dossier, damning evidence, material that would see him executed or imprisoned. He assumed the delegation knew everything. He began quietly, methodically eliminating them. Five were dead within months. A sixth — Krief Barrota — died in a staged shuttle explosion over Delaya just weeks before the campaign begins, attempting to protect the woman Praji has been hunting most carefully of all."}, {"id": "a11", "t": "p", "x": "What Praji doesn't know — what nobody knows yet — is that the evidence is almost nothing. A meeting log. A name. An annotation by a dead man. In the right political climate it could be made to look damning, but it wouldn't survive serious scrutiny. Praji has been killing people to bury a footnote."}, {"id": "a12", "t": "p", "x": "Derek Caabesk was the youngest, greenest member of that delegation. He was there that night — nervous, starstruck, nursing Alderaanian brandy in the corner, too overwhelmed to properly speak to anyone. He didn't know about the drive. He didn't know about Bail's plans for Praji. He was just happy to be in the room."}, {"id": "a13", "t": "p", "x": "A year later, he is a Rebel operative with a bounty on his head, a dead planet behind him, and an old friend falling apart on a ship called the Hope. The investigation is about to begin."}, {"id": "a14", "t": "h1", "x": "ORIGIN OF “THE ALDERAAN 12”"}, {"id": "a15", "t": "p", "x": "The name did not come from Praji, from the Empire, or from any official record. It came from Bail Organa himself, the night the delegation was formed — a toast, half in jest, half in earnest, to the twelve people he believed could “shake the foundations of the Empire so hard they'd hear it all the way to Coruscant.” He never got to see whether he was right."}, {"id": "a16", "t": "p", "x": "That same evening, before he left, Bail met privately with Senne Olarr and passed her the drive — something too dangerous to send through any other channel, so it had to be him, in person, one last act before walking out of his own party. No one else in the room knew it happened."}, {"id": "a17", "t": "p", "x": "Bail was recalled that night: the Senate had just been disbanded, and with it, his seat. He returned to Alderaan with nothing left to go back to politically. The delegation, reassigned in the same stroke, was sent to rejoin him there — which is the origin of the phrase Rinn and others use: they were “going to meet him.” Alderaan was destroyed while they were still in transit. They survived him by days, maybe hours."}, {"id": "a18", "t": "p", "x": "Bail Organa is not counted among the Alderaan 12 — he is the reason they have that name. His death is not part of Praji's hunt; it is the detonation that made the hunt necessary. Derek does not need to “discover” that Bail is dead — the galaxy knows Alderaan is gone. What Derek can discover is that the toast happened, that it was recorded or witnessed, and that Bail handed something to Senne just hours before he died. That discovery is the gut-punch: the danger wasn't rhetorical. Bail knew, that night, that it was already in motion."}, {"id": "a19", "t": "h1", "x": "THE TRUTH ABOUT THE EVIDENCE"}, {"id": "a20", "t": "p", "x": "The hard drive contains one thing: a meeting log. Timestamped, authenticated, utterly mundane. Praji sat down with a man he knew as Ardyth Canvi — an antiquities broker with impeccable Imperial connections — to discuss the reassignment of a political rival. Completely above board. Routed through the right channels. Nothing that couldn't be explained away."}, {"id": "a21", "t": "p", "x": "Bail Organa's annotation on the file reads simply: \"Ardyth Canvi — confirmed alias, Luthen Rael. See attached.\""}, {"id": "a22", "t": "p", "x": "The attachment is Luthen's Imperial intelligence file. That is the entirety of the evidence."}, {"id": "a23", "t": "p", "x": "Praji had one meeting with a man he didn't know was Luthen Rael. He didn't fund the Rebellion. He didn't smuggle weapons. He asked a well-connected fixer to help him remove a bureaucratic obstacle — the same thing a hundred other Imperial officials did without a second thought. The deal was utterly transactional and almost certainly forgotten by Luthen within a week."}, {"id": "a24", "t": "p", "x": "But Bail saw an opportunity. He flagged it, annotated it, filed it — not because it was devastating, but because it could be made to look devastating in the right political climate. It was insurance. A pressure point. Nothing more."}, {"id": "a25", "t": "p", "x": "Praji has been murdering people for a year to bury a document that would have inconvenienced him at worst. He built a career on a deal he barely remembers. He became a monster protecting himself from consequences that were never as catastrophic as he imagined."}, {"id": "a26", "t": "p", "x": "The revelation of the drive's contents is the emotional climax of the entire arc. When Praji finally reads it — in a Rebel cell, with nothing left — the silence that follows is the scene. Everything he has done, balanced against a meeting log and a dead man's annotation. The mathematics of it don't balance. They don't come close."}, {"id": "a27", "t": "h1", "x": "THE LUTHEN CONNECTION"}, {"id": "a28", "t": "p", "x": "Luthen Rael is dead, killed in 1 BBY. His network has dried up. By 0 ABY, even his best agents — including Cassian Andor — had moved on to work under General Draven. The operational security concern is moot."}, {"id": "a29", "t": "p", "x": "However, Luthen's true identity and his role in building the Rebellion is becoming increasingly known to Imperial Intelligence. Any document linking a sitting Moff to that man, authenticated by Bail Organa, is still enough to invite serious Imperial scrutiny — interrogation, disgrace, and likely execution or a maximum security gulag."}, {"id": "a30", "t": "p", "x": "Only one person alive knows the name behind the alias Ardyth Canvi: General Airen Cracken."}, {"id": "a31", "t": "p", "x": "Cracken was Draven's mentor. He dealt with Luthen's agents, inherited his networks, and made it his business to know every name the man ever used. If Derek says the name Ardyth Canvi in front of him — in a debrief, in a briefing room, anywhere — Cracken will go still. Then he will say two words: Luthen Rael."}, {"id": "a32", "t": "p", "x": "He will say it without drama. Without agenda. He will fill in what he knows, answer questions plainly, and then go back to running a war. Luthen is a chapter that's already closed. But Derek will walk away from a routine conversation with the key that unlocks everything."}, {"id": "a33", "t": "h1", "x": "THE CAST"}, {"id": "a34", "t": "h2", "x": "Jimmy \"2-Fingers\" \"the Shoe\""}, {"id": "a35", "t": "p", "x": "Derek's oldest friend. They grew up together on Alderaan — Derek from a prestigious family with education and opportunities, Jimmy from a poor family who made his way through other means. Jimmy became an infochant: a man with fingers in every pie, trading information for credits, making himself useful to anyone who needed to know things. He was good at it. For years, he was very good at it."}, {"id": "a36", "t": "p", "x": "Then Praji's purge began. Contacts went quiet. Pies dried up. The network that had protected Jimmy — the web of mutual interest that made him valuable and therefore safe — dissolved one thread at a time. By the time he found his way to the Hope, he had nothing left to sell, nowhere left to run, and no idea how to exist without the safety net that had defined his entire adult life."}, {"id": "a37", "t": "p", "x": "He is manic, paranoid, and jumpy — seeing Imperial agents in every shadow. Some of those shadows are real. That's the thin
